# =============================================================================
# NEOTH — cargo-deny policy
# https://embarkstudios.github.io/cargo-deny/
# =============================================================================

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

# ---------------------------------------------------------------------------
# Advisories (RUSTSEC vulnerability database)
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"

# Known exceptions (add with a RUSTSEC ID and justification):
# ignore = []

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
]
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
    "AGPL-3.0",
    "SSPL-1.0",
]
copyleft = "deny"
allow-osi-fsf-free = "neither"
default = "deny"
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# Banned crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"            # no wildcard version requirements
highlight = "all"

# Crates banned for security or maintenance reasons
deny = [
    # Superseded by sha2
    { name = "sha", reason = "Abandoned. Use sha2 from RustCrypto." },
    # Known historical RCE
    { name = "yaml-rust", reason = "Unmaintained. Use serde_yaml or yaml-rust2." },
    # Deprecated in favour of serde_json
    { name = "rustc-serialize", reason = "Abandoned. Use serde + serde_json." },
    # Unsound — replaced by safe alternatives
    { name = "owning_ref", reason = "Unsound (RUSTSEC-2022-0040). Use self-referential alternatives." },
    { name = "rental", reason = "Unsound (RUSTSEC-2020-0052). Use ouroboros or self-referential alternatives." },
    # Cookie injection risk in old versions
    { name = "cookie", version = "<0.16", reason = "Older versions had cookie injection (RUSTSEC-2020-0071)." },
]

# Allow multiple versions of these high-churn transitive deps with justification
skip = [
    # tokio ecosystem sometimes pulls two versions during transition
    { name = "syn", reason = "Proc-macro ecosystem commonly ships multiple syn versions." },
    { name = "bitflags", reason = "v1 and v2 coexist during ecosystem migration." },
    { name = "windows-sys", reason = "Different targets pull different minor versions." },
]

# ---------------------------------------------------------------------------
# Sources (supply-chain)
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# allow-git = []               # add specific git sources here if ever needed
