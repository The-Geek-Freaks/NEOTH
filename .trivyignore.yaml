  - id: RUSTSEC-2026-0206 # rustybuzz; no compatible safe Slint/usvg/lopdf upgrade.
  - id: RUSTSEC-2026-0194 # quick-xml; build-time vendored wayland scanner only.
  - id: RUSTSEC-2026-0195 # quick-xml; build-time vendored wayland scanner only.
