[package]
name    = "neoth-plugin-recall-summariser"
version = "0.1.0"
edition = "2021"
description = "NEOTH example plugin — queries recall hit counts via neoth.recall_top and emits a summary event via neoth.emit_event."
publish = false

[workspace]

# Plugin crates MUST target wasm32-unknown-unknown.
# Build with: cargo build --target wasm32-unknown-unknown --release
# The host (neothd) compiles the produced .wasm via wasmtime/cranelift.

[lib]
crate-type = ["cdylib"]

[dependencies]
neoth-plugin-sdk = { path = "../../../neoth-plugin-sdk", version = "=0.1.0-alpha.0" }
