# UX-08 — sample manifest for the post-provider hook example.
#
# This shows the advisory HOOK-STAGE manifest fields. The operator still wires
# a HookDef action for this plugin explicitly; manifest presence alone never
# grants interception of a pipeline stage.
#
# Parses against `wasm_plugin::manifest::PluginManifest`.

# Stable id: lowercase, starts with a letter, snake_case (validated by the host).
id = "hook_post_provider"
name = "Post-Provider Hook Demo"
version = "0.1.0"
description = "Observe the PostProvider pipeline stage; demonstrates log + the fuel-budget pattern."

# Least-privilege: this observer only logs and reads fuel, both level `none`.
# One of: "none" | "read_only" | "write" | "execute" | "dangerous".
requested_permissions = "none"

# The pipeline stages this plugin observes. Valid stages (snake_case):
#   pre_provider_call | post_provider_call | pre_channel_send | post_channel_receive
#   | on_recall_query | on_consolidation_pass
hook_stages = ["post_provider_call"]

# Optional caps (omit to use the host defaults):
# fuel_budget_override = 2000000
# memory_limit_bytes   = 33554432
