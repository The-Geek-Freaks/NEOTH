[package]
name        = "neoth-plugin-sdk"
version     = "0.1.0-alpha.0"
description = "NEOTH plugin SDK — versioned WASM guest ABI, safe hostcalls, typed permission markers, and native Hook traits."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

# Publish metadata — V10-03 GA blocker. Filled per the crates.io
# recommended-field checklist. The SDK remains pre-1.0 while external plugin
# authors validate the API; the Wasmtime host already ships in the NEOTH 1.0
# source tree.
readme        = "README.md"
homepage      = "https://github.com/The-Geek-Freaks/NEOTH"
documentation = "https://docs.rs/neoth-plugin-sdk"
keywords      = ["neoth", "plugin", "sdk", "skill", "permission"]
categories    = ["api-bindings", "development-tools"]
# Trim the cargo-package tarball to source + license + readme. Tests +
# benches stay local because consumers don't need them, and including
# them inflates the published artifact for every plugin author.
exclude = ["benches/*", "tests/*", ".gitignore"]

# Notes for plugin authors:
#   - This is the ONLY crate plugins should depend on.
#   - `_host` exposes integration constructors used by the NEOTH daemon. Cargo
#     features are consumer-selectable, so this is API-surface hygiene, NOT an
#     access-control or security boundary. Plugin crates should not enable it.

[features]
default = []
# Host-integration feature used by `neothd`. It exposes token/grant constructors
# and is intentionally absent from defaults, but consumers can enable it; the
# Wasmtime hostcall policy remains the runtime security boundary.
_host = []

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

[lints]
workspace = true
