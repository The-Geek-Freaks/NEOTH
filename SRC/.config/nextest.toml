# CI is deliberately deterministic: a failure is evidence, not a request for
# an automatic retry. Keep this profile aligned with .github/workflows/ci.yml.
nextest-version = "0.9.134"

[profile.ci]
retries = 0
fail-fast = { max-fail = 20 }
global-timeout = "45m"
slow-timeout = { period = "120s", terminate-after = 1, grace-period = "10s" }
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
# Retain the identities of passing tests with leaked output handles.
final-status-level = "leak"

[profile.ci.junit]
# Paths are relative to target/nextest/<profile>, yielding
# target/nextest/ci/junit.xml for the upload steps.
path = "junit.xml"
report-name = "neoth-nextest"
store-success-output = false
store-failure-output = true

# The serial Windows suite exceeded 65m with 1184 cases unrun (37932521328).
# Inherit retries, per-test limits and JUnit settings without extending Linux.
[profile.ci-windows]
inherits = "ci"
global-timeout = "85m"
