[package]
name        = "neoth-relay"
version     = "1.0.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "Standalone authenticated NEOTH peer-registry relay for external Hysteria sidecars."

# Architect verdict (Session 21, `neoth_open_decisions_verdicts`):
# the relay is a SEPARATE binary, not embedded in `neothd` and not
# forked from Hysteria. Single-responsibility, AIO-compliant install
# path, operators can deploy the relay on a cheap edge node without
# pulling in the daemon's full memory / channels / providers stack.
#
# Hysteria remains an external operator-managed sidecar: it owns the public
# QUIC/TLS/auth listener and forwards to neoth-relay's loopback TCP bind.
# neoth-relay deliberately contains no embedded Hysteria/QUIC implementation.
#
# Build/run:
#   cargo build -p neoth-relay --release
#   ./neoth-relay serve --bind 0.0.0.0:8443
#   ./neoth-relay --help

[[bin]]
name = "neoth-relay"
path = "src/main.rs"

[dependencies]
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
serde      = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokio      = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tracing    = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
