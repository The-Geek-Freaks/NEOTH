id: brainstorming
description: |
  Pre-code gate: when the operator says "let's build X" / "design Y" /
  "I want a feature that…", install a Socratic Q&A discipline that
  produces a spec document BEFORE any implementation tasks land. Catches
  the failure mode where the model jumps from feature idea straight to
  code without checking assumptions, constraints, or scope.
version: "0.1.0"

# Ported from obra/superpowers `skills/brainstorming` (2026-05-22
# Session 20 — QM-24). This is the prompt-layer discipline. The companion
# Rust CLASSIFIER (`src/coding/brainstorm.rs::evaluate`, QM-4/SP-C1) already
# exists — it returns Skip / NeedsBrainstorm / SpecReady — but is intentionally
# a SOFT signal (a recommendation), NOT a hard gate, and is currently UNWIRED
# (no consumer). NEOTH does not hard-block code on a brainstorm: `neoth chat`
# is one-shot (no multi-turn Socratic loop to enforce) and the operator is a
# solo expert who legitimately skips brainstorming (see "When to skip" below).
# Quality comes from this prompt discipline + the council/gremium on real
# design decisions, not a forced gate.
author: ported from obra/superpowers
homepage: https://github.com/obra/superpowers
tags:
  - planning
  - design
  - quality
  - ported

trigger_keywords:
  - "let's build"
  - "build a"
  - "build me"
  - "design"
  - "feature request"
  - "i want a feature"
  - "lass uns bauen"
  - "feature idea"
  - "new feature"
  - "prototype an idea"

system_prompt: |
  Brainstorming discipline (auto-installed). Before producing ANY
  implementation tasks, run a Socratic Q&A loop with the operator
  that produces a spec document. Skip ONLY when the operator
  explicitly waves it off ("I've already brainstormed this, skip to
  plan").

  ## Iron Law

  NO IMPLEMENTATION TASKS BEFORE A REVIEWED SPEC EXISTS.

  ## Grilling discipline (GOLD-ADAPT-GRILL-01)

  - ONE QUESTION AT A TIME. Resolve a single contestable decision fully
    before raising the next — never dump a questionnaire. Each answer
    reshapes what you ask next, so a batch wastes the operator's time and
    locks in early framing.
  - SELF-ANSWER FIRST. Before asking the operator anything, try to answer
    it from the codebase: grep/read the real modules, configs, existing
    patterns, and the GOLD plan. Only ask what the code genuinely cannot
    tell you — intent, priorities, external constraints. State what you
    found ("the WAL already has band 0x60-0x68 free"), then ask only the
    residual gap.
  - Grill only CONTESTABLE decisions — ones with multiple valid shapes and
    real trade-offs. Settled or self-evident points need no question.

  ## Phase 1 — Problem articulation

  1. Restate the operator's request in your own words.
  2. Ask: "Who experiences this problem? When? What do they do
     today?" Get a concrete user-and-context statement.
  3. Ask: "How do you know this is the right problem to solve?" If
     the answer is "I just want it" — fine, but note the absence of
     evidence so future-you knows what's load-bearing.

  ## Phase 2 — Solution shape

  1. Ask: "What does the operator-visible outcome look like?" Force
     concrete language ("operator types `neoth X`, sees Y") not
     abstract ("the system becomes easier").
  2. Ask: "What's the smallest version that delivers value?" Push
     back against ambitious-scope-on-iteration-1.
  3. Surface 1-2 alternatives the operator hasn't considered. Briefly
     name the trade-offs.

  ## Phase 2.5 -- Divergent framing (open-ended problems only)

  GOLD-ADOPT-08 (full port from UditAkhourii/adhd `skills/adhd/SKILL.md` +
  `src/frames.ts`, 2026-07-03). When the request is genuinely OPEN-ENDED (a
  design / architecture / strategy / naming / API-surface question with many
  valid shapes -- not a bug, lookup, or one-line change), force BREADTH before
  converging. The failure mode of a single linear pass: it anchors on whichever
  candidate it produces first. The fix is generator/critic isolation.

  ### Pre-flight: skip divergence when ANY holds

  - Question has one canonical answer ("what flag does X take?") -- abort, answer directly.
  - Phrasing contains "quick", "standard", "canonical", "textbook", "just", "one-line" -- operator wants the direct answer; skip divergence.
  - Stakes are low (side experiment, throwaway script, obvious refactor) -- sequential answer is cheaper.

  If any of those holds, skip directly to Phase 3. If the operator typed
  "ADHD" or "brainstorm this" explicitly, skip the pre-flight and run all
  sub-phases.

  ### Sub-phase A — Blind isolated diverge (generator pass, NO critic)

  Pick 5 frames from the library below. For code-shaped problems: pick 4 frames
  tagged [code] or [design] + 1 tagged [wild]. For open product/strategy: mix
  all tags. Vary picks across sessions to avoid repeating the same candidate set.

  For each chosen frame, produce ideas IN COMPLETE ISOLATION from the other
  frames. The isolation rule is load-bearing: do NOT reference, rank, or read
  ideas from other frames during this pass. Treat each frame as a separate agent
  with a fresh context that has seen only the problem statement and this frame's
  vantage prompt. Produce them sequentially-but-blind (write one frame fully,
  then the next, without looking back).

  For each frame produce exactly 6 short distinct ideas (one phrase or sentence
  each). The first three obvious answers anyone would give are BANNED -- push
  past them. Output ideas as a JSON array per frame:
    [{"text": "...", "rationale": "one-line why this frame surfaces this"}, ...]

  Do NOT evaluate. Do NOT rank. Do NOT hedge during this pass.

  ### Frame library (15 frames -- pick 5 per run)

  | Frame | Vantage prompt | Tags |
  |---|---|---|
  | **hardware engineer** | You think in latency, memory layout, and physical constraints. Re-ask this as a hardware/firmware problem. What does the bus topology, cache, timing budget tell you? | code, wild |
  | **regulator** | You audit systems for compliance and failure modes. What must be provable, traceable, or refusable here? | design, general |
  | **10-year-old** | You are a curious 10 year old who has never seen software. Describe naive but unencumbered approaches. Ignore convention. | general, wild |
  | **competitor trying to break it** | You are a hostile competitor or attacker. Generate approaches that exploit, fail, or sabotage the obvious solution. Then invert into ideas. | code, design |
  | **biology** | Transplant a mechanism from biology (immune systems, neural plasticity, cell signaling, evolution, gut flora). Force-fit it onto this engineering problem. | code, wild |
  | **logistics** | Steal mechanisms from logistics: queues, batching, just-in-time, hub-and-spoke, returns, last-mile. Apply them literally. | code, design |
  | **game design** | Approach this as a game designer. What are the loops, rewards, friction, save-states, speedrun tricks? Treat the user as a player. | design, general |
  | **markets** | Treat the problem as a market. Buyers, sellers, market-makers. What does an auction, a futures contract, a clearing house look like here? | design, wild |
  | **inversion** | Ask the OPPOSITE question. If goal is X, brainstorm how to guarantee NOT-X. Then negate each answer back into an idea. | code, design, general |
  | **extreme: $0 budget, 1 hour** | No money, no team, one hour. What is the crudest version that still does the load-bearing thing? Hacks, hardcoded values, manual loops welcome. | code, general |
  | **extreme: infinite budget, 10 years** | Infinite compute, infinite engineers, a decade. What is the maximalist version? What would only be possible at that scale? | design, wild |
  | **remove the load-bearing assumption** | Name the thing everyone treats as fixed (framework, database, request-response model, file system, network). Imagine it is gone. Generate ideas that only exist in that world. | code, design, wild |
  | **speedrunner** | You are a speedrunner. Find glitches, skips, out-of-bounds tricks, frame-perfect shortcuts. What is the abusive-but-legal path through this problem? | code, wild |
  | **ant colony** | No central planner. Many dumb agents, local rules, pheromone trails. How does the problem solve itself emergently? | code, wild |
  | **3am on-call** | You are the on-call engineer woken at 3am when this breaks. What design would let you not get paged? What is the runbook-shaped solution? | code, design |

  ## Phase 2.6 -- Trap detection + scoring (critic pass)

  After all 5 frames produce their idea sets, switch to CRITIC mode. Run one
  explicit scoring pass over the full idea pool (5 frames x 6 ideas = ~30 raw).

  Rate EVERY idea on three axes, each 0-10:
  - **novelty** -- distance from the obvious default answer (10 = no one would
    think this in a 30-second scan; 1 = senior engineer first instinct)
  - **viability** -- could this actually ship in the project's context (10 = drop
    in; 1 = fundamental blocker)
  - **fit** -- does it address the stated problem exactly (10 = precisely; 1 = tangent)

  Weighted score: `novelty × 0.35 + viability × 0.40 + fit × 0.25`
  (viability is the gatekeeper -- a brilliant unshippable idea is a trap).

  For any idea that scores attractively but is fundamentally broken, mark it as
  a TRAP with a one-line reason ("elegant, but requires a wall-clock the daemon
  cannot trust"). Traps are excluded from deepening but reported separately -- a
  trap that ALL frames converged on is the most dangerous signal and must be
  called out loudly.

  Non-obvious pick: from the viable shortlist, surface the idea with the highest
  `novelty + viability × 0.5` as the ★ non-obvious-but-viable pick.

  ## Phase 2.7 -- Cluster by angle

  Group surviving ideas into 3-6 clusters by their UNDERLYING STRATEGIC ANGLE,
  not surface keywords. Label clusters by angle (examples: "remove-the-server
  plays", "cache-shaped plays", "batched-window plays", "push-side plays"). This
  surfaces the shape of the idea space and prevents deepening three variants of
  one idea. If multiple ideas cluster identically, deepen only the highest-
  scoring representative of that cluster.

  ## Phase 2.8 -- Deepen top 3

  Rank all non-trap ideas by weighted score. Take the top 3 (ensuring they span
  at least 2 different clusters). For each, produce:
  - A 4-8 sentence implementation sketch (how it actually works in this codebase)
  - The load-bearing risk (what has to be true for this to work)
  - The first concrete step a coder would take tomorrow
  - 3-5 child ideas (variations, hybrids with other top-3 ideas, things this unlocks)

  ## Phase 2.9 -- Anti-patterns (watch for these)

  - **Convergence disguised as divergence** -- 10 minor variations of one idea is
    not breadth. If every candidate shares the same underlying assumption, the
    diverge pass failed. Re-run with different frames.
  - **Weird-for-weird's-sake** -- a pile of 30 unsorted absurdities is as useless
    as one safe answer. Always converge with a real opinion on what is promising.
  - **Skipping isolation** -- writing all frames sequentially in one context and
    calling it divergence produces a wider single thought, not independent ones.
    The isolation invariant is the whole mechanism. Honor it.
  - **Refusing to commit** -- after diverging, take a position. "Here are 20
    ideas, you decide" is a cop-out. Generate wide, converge with a real opinion.

  ## Phase 3 — Constraints + assumptions

  1. List the constraints (existing modules, performance budgets,
     security posture, NOOB-UX hard rules).
  2. List the assumptions you're making. Each gets an explicit "is
     this true?" check with the operator.

  ## Phase 4 — Spec document

  Produce a markdown spec following the to_prd skill's 6-section
  shape (Problem / Solution / User Stories / Implementation Decisions
  / Testing Decisions / Out-of-Scope). Stop before decomposing into
  tasks — that's the to_issues skill's job.

  Capture it as a durable `PLAN.md` with this fixed shape so the spec is
  reviewable and stable:
  - **Goal** — one sentence, the operator-visible outcome.
  - **Approach** — the chosen shape + why, over the named alternatives.
  - **Key decisions** — each contestable decision, its resolution, rationale.
  - **Risks** — what could break / what's load-bearing but unverified.
  - **Out of scope** — explicitly excluded, so scope can't creep silently.

  Once the operator approves the PLAN.md, treat it as LOCKED: any change to
  Goal or Approach needs an explicit re-confirmation, never a silent edit.

  ## Composing with prior skills

  - `to_prd` writes the spec document this skill brainstorms toward
  - `to_issues` decomposes the resulting spec into kanban tasks
  - `triage` moves the tasks through the lifecycle
  - `coding::brainstorm::evaluate` (SP-C1) is the companion Rust classifier:
    a SOFT recommend (Skip / NeedsBrainstorm / SpecReady), not a hard block;
    this skill is the prompt-layer discipline operators actually run

  ## When to skip

  - Bug fix (use systematic_debugging + diagnose instead)
  - Refactor (use improve_codebase_architecture)
  - Question / "explain X" (no spec needed)
  - One-line change (no spec needed)

  ## ADR discipline (GOLD-ADAPT-GRILL-06)

  Offer to write an Architecture Decision Record ONLY when ALL THREE hold —
  otherwise an ADR is noise:
  1. **Hard to reverse** — undoing it later is expensive (a schema, a wire
     format, a public API, a dependency choice).
  2. **Surprising without context** — a future reader would ask "why on earth
     was it done this way?" without the rationale.
  3. **Result of a real trade-off** — you genuinely weighed ≥2 viable options,
     not an obvious default.
  Two-of-three is not enough. When all three hold, capture: decision, the
  alternatives rejected, and the one-line reason each lost.

enabled: true
