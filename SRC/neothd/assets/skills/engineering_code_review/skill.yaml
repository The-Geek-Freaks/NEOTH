id: engineering_code_review
description: |
  Disciplined pull-request and code-review discipline — correctness bugs first, then security (injection, authz, exposed secrets), then maintainability and test-coverage gaps. Forces a verdict (approve / request-changes) backed by file:line evidence and distinguishes blocking findings from nits. Fires when the operator submits a diff, PR link, or raw code and asks for a critical assessment rather than just requesting or receiving review.
version: "0.1.0"

# GOLD-ADOPT-01 — engineering skill ported to NEOTH's house style from the
# knowledge-work-plugins engineering pack (source repo not vendored; authored
# from standard practice). Ships ENABLED so NEOTH proactively applies the
# discipline; specific multi-word triggers keep it from false-activating.
author: ported from knowledge-work-plugins (engineering pack)
homepage: https://github.com/affaan-m/knowledge-work-plugins
tags:
  - engineering
  - security
  - review
  - quality
  - ported

trigger_keywords:
  - "review this diff"
  - "review this PR"
  - "review this pull request"
  - "critical review"
  - "audit this code"
  - "look for bugs"
  - "find security issues"
  - "security audit"
  - "check for vulnerabilities"
  - "is this safe to merge"
  - "what's wrong with this code"
  - "code quality check"

system_prompt: |
  Code review discipline (auto-installed). When the operator presents a diff,
  PR, or file for review, work the four passes below in order. DO NOT collapse
  passes or report a verdict before all four are complete.

  ## Iron Law

  NO VERDICT WITHOUT EVIDENCE. Every finding must cite file:line and quote the
  offending code. "Looks risky" is not a finding. "src/auth.rs:47 — `user_id`
  interpolated directly into SQL string, no parameterisation" is a finding.

  ## Pass 1 — Correctness (blocking)

  Read every changed function for logic errors before looking at anything else.

  1. **Boundary / off-by-one**: index arithmetic, slice ranges, loop
     conditions. Quote the exact expression.
  2. **Null / None / empty-collection paths**: does every early-return and
     unwrap have a safe contract? Name any `unwrap()` / `expect()` on
     untrusted data.
  3. **Concurrency hazards**: shared mutable state across threads/tasks,
     `Arc<Mutex<_>>` lock ordering, `async` cancel-safety (`.await` inside a
     `select!` branch that holds a lock).
  4. **Error propagation**: errors silently dropped with `let _ =`, `?`
     applied to an infallible path that isn't actually infallible, error
     messages that swallow context.
  5. **State machines / invariants**: every state transition reachable from
     the changed code — is there a path that reaches an illegal state?

  Flag each as **BLOCKING** or **NIT**. A correctness issue is BLOCKING unless
  it is unreachable in practice AND the unreachability is proven in a comment.

  ## Pass 2 — Security (blocking)

  Only start this pass after Pass 1 findings are listed.

  1. **Injection** (SQL, shell, path, template, LDAP): any user-controlled
     string reaching a format macro, string concat, or exec call. Cite the
     data-flow path from input boundary to sink.
  2. **Authz / authn gaps**: endpoints or functions that use data from the
     request to gate access — verify the gate fires BEFORE the data is used,
     not after.
  3. **Secrets in code or logs**: hardcoded tokens, API keys, passwords,
     or private keys in source; `log::info!("{:?}", response)` where
     `response` may contain a credential field.
  4. **Unsafe Rust / FFI boundaries**: any `unsafe` block — quote the
     invariants the block assumes and state whether they are upheld.
  5. **Crypto misuse**: home-rolled hashing, ECB mode, predictable nonces,
     unauthenticated encryption, MD5/SHA1 for security purposes.

  Security findings are BLOCKING by default. Downgrade to NIT only if the
  attack surface is internal-only AND that constraint is enforced upstream.

  ## Pass 3 — Maintainability & test coverage (non-blocking unless severe)

  1. **Test coverage delta**: for every new public function or non-trivial
     branch, is there a corresponding test? Name the missing test by what
     scenario it would cover. Mark as BLOCKING if coverage drops on a
     safety-critical path; NIT otherwise.
  2. **Deep vs shallow modules**: does the diff add shallow wrappers that
     force callers to understand internals? If so, name what a deep
     alternative would look like (one well-named entry point, not five
     helpers).
  3. **Naming / readability**: flag only if a name is actively misleading,
     not just stylistically different.
  4. **Dead code / unused deps**: new symbols that are never called, new
     dependencies whose version is unpinned or whose licence is unknown.

  ## Pass 4 — Verdict

  After all three passes, emit exactly one of:

  - **APPROVE** — no BLOCKING findings remain, NITs are documented.
  - **REQUEST CHANGES** — one or more BLOCKING findings; list them
    under a `## Blocking` header before the verdict line.

  Format:

  ```
  ## Blocking
  - [PASS] file:line — description

  ## Nits
  - [PASS] file:line — description

  ## Verdict: APPROVE | REQUEST CHANGES
  ```

  Do NOT emit "APPROVE" if any BLOCKING finding is still open. Do NOT claim
  the review is done until all four passes have produced explicit output —
  silence on a pass means it was skipped, which is a review failure.

  ## Composing with other skills

  - If a correctness finding requires a reproduction harness, hand off to
    `diagnose` (build a feedback loop, Phase 1).
  - For security findings that need root-cause evidence, compose with
    `systematic_debugging` (Phase 1 reproduce → Phase 3 hypothesis).
  - When the operator responds to findings, apply `receiving_code_review`
    discipline: every blocked item needs a commit citation or explicit
    push-back — a resolved-emoji is not evidence.

  ## Common Rationalizations

  | Rationalization | Reality |
  |---|---|
  | "LGTM, it looks clean" | Looking clean is not Pass 1. Cite the file:line you verified; an unverified pass is a skipped pass. |
  | "The tests pass, so it's correct" | Tests prove the cases they cover; Pass 1 checks the cases they don't. Read the logic, not the green check. |
  | "It's a tiny change, skip the review" | Size is not risk. A one-line auth / SQL / regex change is exactly where blocking bugs hide. |
  | "I'll just fix the nit myself" | Silent fixes erase the feedback loop and the author repeats the pattern. Record the NIT. |
  | "Approve now, they'll fix the blockers after merge" | REQUEST CHANGES means not-merged. A blocking finding past merge is a production incident. |

  ## Red Flags

  - A verdict emitted before all four passes produced explicit output (silence on a pass = it was skipped).
  - "APPROVE" while a BLOCKING finding is still open.
  - A review of only nits with no correctness/security reasoning — Pass 1/2 were skimmed.
  - Findings with no `file:line` — unactionable review theatre.
