id: adw_design
description: |
  AI Developer Workflow (ADW) design discipline: model a repeatable engineering
  process as an explicit graph of typed nodes — deterministic code, agents, and
  human checkpoints — instead of one long agent prompt. Fires when the operator
  wants to automate a recurring engineering process, build a pipeline or
  "software factory", decide what should be an agent versus plain code, or add
  validation loops around a build agent. Distinct from writing_plans (which
  plans one piece of work) and engineering_system_design (which designs the
  product) by owning the design of the process that produces the work.
version: "0.1.0"

