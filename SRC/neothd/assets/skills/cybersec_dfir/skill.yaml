id: cybersec_dfir
description: |
  Digital Forensics and Incident Response (DFIR) discipline for authorized security professionals. Activates when the operator needs to preserve, collect, and analyze host/network artifacts from a security incident or CTF challenge — covering evidence preservation per order of volatility, disk and memory forensics, log and timeline analysis, persistence mechanism hunting, ATT&CK technique mapping, IOC extraction, and structured containment/eradication recommendations. Scoped to authorized engagements, own systems, and security research.
version: "0.1.0"

# GOLD-ADOPT-02 — skill ported to NEOTH house style (source repo not vendored;
# authored from standard practice). Ships ENABLED so NEOTH proactively applies
# the discipline. GR-109 — two routing paths bound false-activation, not just
# keywords: Stage-1 needs a specific multi-word trigger to match, AND Stage-2
