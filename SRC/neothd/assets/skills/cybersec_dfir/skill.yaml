trigger_keywords:
  - "investigate this incident"
  - "forensic analysis of"
  - "dfir playbook"
  - "order of volatility"
  - "memory forensics"
  - "disk timeline analysis"
  - "analyze memory dump"
  - "hunt persistence mechanisms"
  - "extract iocs from"
