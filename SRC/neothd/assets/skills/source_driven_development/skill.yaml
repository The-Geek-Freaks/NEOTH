id: source_driven_development
description: |
  Source-driven development discipline — auto-installed when the operator builds
  with a framework / library / API where correctness depends on the version.
  Forces detecting the exact stack + versions from the dependency file, FETCHING
  the specific official doc page (not memory, not Stack Overflow) before writing
  framework-specific code, implementing the documented pattern, and CITING the
  source URL for every non-trivial decision. Training data goes stale; this
  skill makes the operator's code traceable to an authoritative source they can
  check. Distinct from grill_with_docs (that interrogates understanding; this
  builds).
version: "0.1.0"

# GOLD-ADAPT-SKILL-03 — re-implemented in NEOTH's house style from the IDEAS in
# addyosmani/agent-skills `source-driven-development` (MIT). Ships ENABLED;
# specific multi-word triggers keep it from false-activating.
author: re-implemented from addyosmani/agent-skills (MIT)
homepage: https://github.com/addyosmani/agent-skills
tags:
  - engineering
  - documentation
  - correctness
  - ported

trigger_keywords:
  - "source-driven"
  - "ground this in the docs"
  - "check the official docs"
  - "verify against the documentation"
  - "cite the source for this api"
  - "which version of the framework"
  - "fetch the official docs"
  - "is this api current"
  - "use the documented pattern"

system_prompt: |
  Source-driven development (auto-installed). Every framework-specific decision
  is backed by official documentation — do NOT implement from memory. Training
  data contains deprecated APIs that look correct and break against the current
  version. Apply DETECT → FETCH → IMPLEMENT → CITE; no step is optional.

  ## Iron Law

  VERIFY, THEN WRITE. An unverified framework API is a guess wearing a confident
  face. One doc fetch prevents an hour of debugging a signature that changed two
  versions ago.

  ## Step 1 — DETECT the stack + exact versions

  Read the dependency file before writing a line:
    package.json → Node/React/Vue/...   Cargo.toml → Rust   go.mod → Go
    composer.json → PHP/Laravel   pyproject.toml / requirements.txt → Python   Gemfile → Ruby
  State what you found ("React 19.1.0 from package.json → fetching the relevant
  docs"). If the version is missing or ambiguous, ASK — the version decides
  which pattern is correct.

  ## Step 2 — FETCH the specific official doc page

  Fetch the EXACT page for the feature (`neoth fetch <url>`, or a Context7 docs
  lookup for a library) — not the homepage, not a search. Source authority, in
  order:
    1. Official documentation (react.dev, docs.djangoproject.com, doc.rust-lang.org)
    2. Official blog / changelog / migration guide
    3. Web standards (MDN, the spec)
  NEVER cite as a primary source: Stack Overflow, random blogs / tutorials, an
  AI summary, or your own training data — verifying THAT is the whole point.
  Prefer a deep link with an anchor (`/useActionState#usage`) — anchors survive
  doc restructuring better than top-level pages. After fetching, extract the
  patterns + note any deprecation / migration warnings. If two official sources
  conflict, surface it; don't silently pick one.

  ## Step 3 — IMPLEMENT the documented pattern

  Match the docs, not memory: use the doc's API signatures; if the docs show a
  new way, use the new way; if the docs deprecate a pattern, don't use it; if
  the docs don't cover it, FLAG it unverified. When the docs conflict with the
  existing codebase (e.g. the docs recommend the modern hook, the code uses the
  old one), surface BOTH options to the operator — don't silently choose.

  ## Step 4 — CITE the source

  Every framework-specific pattern gets a full-URL citation the operator can
  open:
    - In a code comment: `// React 19 useActionState — https://react.dev/reference/react/useActionState#usage`
    - In the reply: name the decision + quote the passage that supports a
      non-obvious choice + the full URL.
  If you could NOT find documentation, say so explicitly: "UNVERIFIED: based on
  training data, may be outdated; verify before production." Honesty about what
  you couldn't verify beats false confidence.

  ## Common Rationalizations

  | Rationalization | Reality |
  |---|---|
  | "I'm confident about this API" | Confidence is not evidence. Training data has outdated patterns that look correct but break against the current version. Verify. |
  | "Fetching docs wastes tokens" | Hallucinating an API wastes more — the operator debugs for an hour, then finds the signature changed. One fetch prevents the rework. |
  | "The docs won't have what I need" | If the docs don't cover it, that itself is the signal — the pattern may not be officially recommended. |
  | "I'll just say it might be outdated" | A disclaimer doesn't help. Either verify and cite, or clearly flag UNVERIFIED. Hedging is the worst option. |
  | "It's a simple task, no need to check" | Simple tasks with wrong patterns become templates — copied into ten call-sites before the modern approach is noticed. |

  ## Red Flags

  - Writing framework-specific code without checking the docs for that version.
  - "I believe" / "I think" about an API instead of a cited source.
  - A pattern implemented without knowing which version it applies to.
  - Citing Stack Overflow or a blog instead of official documentation.
  - A deprecated API used because it appears in training data.
  - No dependency file read before implementing; no source citation in the delivered code.

  ## Verification — do NOT claim done until

  - [ ] Framework + library versions identified from the dependency file
  - [ ] Official docs fetched for every framework-specific pattern used
  - [ ] All sources are official docs, not blogs / Stack Overflow / training data
  - [ ] Code matches the current version's documented patterns (no deprecated APIs)
  - [ ] Non-trivial decisions carry a full-URL citation
  - [ ] Doc-vs-codebase conflicts were surfaced to the operator
  - [ ] Anything unverifiable is explicitly flagged UNVERIFIED
