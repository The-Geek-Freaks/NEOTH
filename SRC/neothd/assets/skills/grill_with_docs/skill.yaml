id: grill_with_docs
description: |
  Pre-commit grilling against the operator's domain model + ADRs.
  Catches spec drift: a diff that looks locally correct but contradicts
  CONTEXT.md, NEOTH.md, or a recorded architecture decision. Composes
  with NEOTH's existing docs/adr/ convention + CONTEXT.md hierarchy.
version: "0.1.0"

# Ported from mattpocock/skills `engineering/grill-with-docs`
# (2026-05-22 Session 20 — QM-22). Sibling of grill_me (non-code
# stress-test) and improve_codebase_architecture (deep-module
# vocabulary). This one is the docs-anchored variant.
author: ported from mattpocock/skills
homepage: https://github.com/mattpocock/skills
tags:
