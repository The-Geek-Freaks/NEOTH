id: diagnose
description: |
  Disciplined diagnosis loop for hard bugs and performance regressions.
  Phase 1 (build a feedback loop) is the skill — everything else is
  mechanical bisection + hypothesis-testing on top of that signal.
  Composes with systematic_debugging by sharpening the "Iron Law Phase
  1" investigation step: NEOTH won't propose fixes without a fast,
  deterministic, agent-runnable pass/fail loop in hand.
