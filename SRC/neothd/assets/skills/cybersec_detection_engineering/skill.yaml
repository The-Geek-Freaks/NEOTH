id: cybersec_detection_engineering
description: |
  Detection engineering and threat hunting discipline that drives the full pipeline from a threat technique or hypothesis through telemetry selection, precise detection authoring (Sigma, YARA, or structured log queries), baseline tuning against benign traffic, true-positive validation, and documented FP/response analysis. Fires when the operator wants to build, review, or tune a concrete detection rule for a specific ATT&CK technique, hunt for an adversary behavior in logs, or evaluate an existing rule for false-positive risk.
version: "0.1.0"

# GOLD-ADOPT-02 — skill ported to NEOTH house style (source repo not vendored;
