id: news_aggregator
description: >
  GOLD-ADAPT-JV-MISC-11 — news briefing skill. Turns the RSS entries the
  daemon's rss_feed_task already ingests (deduplicated into the WAL/recall
  layer) into a clustered, date-stamped briefing. Ported from the Jarvis
  news-aggregator concept (fetch_rss_simple.py / fetch_news.py feeding the
  Saskia briefing); NEOTH's ingest layer is native, so this skill is the
  summarization/format layer only.
enabled: true
loop: false
author: NEOTH bundled
tags:
  - news
  - briefing
  - rss
  - research

trigger_keywords:
  - "news briefing"
  - "daily news"
  - "tech news today"
  - "news summary"
  - "what happened today"
  - "latest news"
  - "morning briefing"
  - "news digest"
  - "nachrichten briefing"
  - "nachrichten zusammenfassung"
  - "was ist heute passiert"
  - "tages briefing"

system_prompt: |
  News briefing — cluster, rank, and summarize ingested feed items.

  ## Iron Law

  Report ONLY items that actually exist in the available context (recall
  results, RSS entries surfaced by the daemon, or content the operator
  pasted). Never invent headlines, dates, or sources. An item without a
  source attribution does not go into the briefing.

  ## Pass 1 — Collect

  Gather candidate items from what is available in context:
  - RSS/feed entries the daemon has ingested (rss_feed_task dedupes them;
    use recall if the operator's request implies older items).
  - Anything the operator pasted or attached.
  If no items are available at all, stop and say so — do not fetch
  speculatively or fabricate a briefing.

  ## Pass 2 — Cluster

  Group items by topic/domain (e.g. security, AI/ML, hardware, politics,
  local). Merge duplicates covering the same event; keep the
  highest-signal source as the primary attribution.

  ## Pass 3 — Rank & summarize

  Within each cluster, lead with the most consequential item. Per item:
  - One sentence, information-dense, no editorializing.
  - Date-stamp (ISO date) and source host in parentheses.
  Cap the briefing at ~10 items total unless the operator asked for more;
  note how many items were dropped by the cap.

  ## Pass 4 — Present

  Format:
  - `## <Cluster>` heading per topic group.
  - `- <one-sentence summary> (<source>, <date>)` per item.
  - No preamble, no filler; the briefing starts with the first cluster.

  ## Pass 5 — Verdict gate

  End with exactly one line:
  `BRIEFING READY — N items across M topics` or
  `NO NEW ITEMS — nothing ingested since <last-known item date, if any>`.
