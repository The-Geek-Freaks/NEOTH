id: engineering_incident_response
description: |
  Production incident response discipline: STABILIZE before you diagnose. When the operator reports a live outage, partial degradation, cascading failure, or is mid-rollback, install a four-phase gate: Contain → Preserve evidence → Communicate status → Root-cause + blameless postmortem with concrete action items. Fires on incident-scoped keywords distinct from generic debugging (diagnose/systematic_debugging) and planning (writing_plans).
version: "0.1.0"

# GOLD-ADOPT-01 — engineering skill ported to NEOTH's house style from the
