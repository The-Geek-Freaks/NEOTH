id: using_git_worktrees
description: |
  Operator-facing guide for git worktrees: when to use them, when to
  prefer branches-in-place, how to recover from a half-applied
  worktree. NEOTH's `coding::worktree` module already uses worktrees
  for sub-agent isolation — this skill teaches the operator the
  matching mental model.
version: "0.1.0"

