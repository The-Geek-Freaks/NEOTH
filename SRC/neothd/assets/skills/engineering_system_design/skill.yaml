id: engineering_system_design
description: |
  System design discipline: clarify requirements and constraints, enumerate 2-3 candidate approaches with explicit tradeoffs, pick one with rationale, identify failure modes + data model + interfaces, and record an ADR. Fires when the operator wants to design something new or evaluate design options — distinct from architecture refactoring (improve_codebase_architecture) and plan writing (writing_plans) by owning the pre-code design and decision-record step.
version: "0.1.0"

# GOLD-ADOPT-01 — engineering skill ported to NEOTH's house style from the
# knowledge-work-plugins engineering pack (source repo not vendored; authored
# from standard practice). Ships ENABLED so NEOTH proactively applies the
# discipline; specific multi-word triggers keep it from false-activating.
author: ported from knowledge-work-plugins (engineering pack)
homepage: https://github.com/affaan-m/knowledge-work-plugins
tags:
  - engineering
