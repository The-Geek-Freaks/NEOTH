id: conductor
description: |
  Three-layer context discipline for multi-step engineering work. When
  the operator hands a task that spans more than a single edit ("ship
  feature X", "work through the backlog", "wire up Y"), orient against
  three standing context layers — PRODUCT (why this exists), SPEC (what
  the contract is), PLAN (what order to build in) — BEFORE executing.
  Catches the failure mode where the model re-derives goals, re-reads
  the same files, and re-litigates settled decisions on every turn,
  burning tokens and wall-clock. Conducting the three layers up front
  keeps each step on-contract and cuts redundant re-grounding.
version: "0.1.0"

# ARCH-03 / QU-06 (road-to-v1.0). Operator-facing skill layer. The
# injection mechanism is the existing skill router → EnrichmentInputs::
# skill_system_prompt path (pipeline/enriched_request.rs); this skill
