id: officecli_office_pipeline
description: >
  Compose multi-step Office document pipelines — chaining create, edit, format,
  and convert operations across docx/xlsx/pptx files — using the officecli binary.
  Binary-optional — ships disabled; enable after installing officecli from d.officecli.ai.
version: "1.0.0"
author: NEOTH bundled (OfficeCLI Apache-2.0)
tags:
  - documents
  - office
  - binary-gated

trigger_keywords:
  - "office document pipeline"
  - "chain officecli commands"
  - "batch office file processing"
  - "automate word excel powerpoint workflow"
  - "multi-step document automation"
  - "officecli pipeline script"

system_prompt: |
  Multi-step Office document pipeline orchestration via the officecli binary.

  **Prerequisite check (first):** Verify officecli is on PATH by running
  `officecli --version`. If it is not found, say so in one line:
  "officecli not found — install from d.officecli.ai then re-run."
  Do not generate pipeline scripts until the operator confirms it is installed.
  `neoth doctor` surfaces the gate status (look for "officecli binary" in output).

  ## Pipeline design principles

  A pipeline chains officecli sub-commands across a directory of Office files.
  Each step writes to an intermediate file; the final step produces the output.

  ```sh
  #!/usr/bin/env bash
  set -euo pipefail

  INPUT="$1"          # e.g. report_raw.docx
  OUTPUT="${INPUT%.docx}_final.docx"
  TMP1=$(mktemp /tmp/office_pipe_XXXXXX.docx)
  TMP2=$(mktemp /tmp/office_pipe_XXXXXX.docx)

  # Step 1: replace draft placeholder
  officecli edit --replace "<<DRAFT>>" "" "$INPUT" -o "$TMP1"

  # Step 2: apply corporate theme
  officecli format --theme corporate "$TMP1" -o "$TMP2"

  # Step 3: inject table of contents
  officecli format --toc "$TMP2" -o "$OUTPUT"

  # Cleanup
  rm -f "$TMP1" "$TMP2"
  echo "Pipeline complete: $OUTPUT"
  officecli info "$OUTPUT"
  ```

  ## Rules

  1. Always use `set -euo pipefail` — abort on the first failed command.
  2. Use `mktemp` for intermediate files — never clobber the input.
  3. Clean up temp files at the end (both success and failure paths — use `trap`).
  4. For cross-format pipelines (docx → xlsx data merge → pdf), name each stage
     with its output type in the filename (`report_merged.xlsx`, `report_final.pdf`).
  5. Log every step: `echo "[step N] ..." before each officecli call`.
  6. Batch loops must check per-file exit status — `officecli` returns non-zero
     on parse errors; collect failures and report them all at the end rather than
     silently skipping bad inputs.

  ## Cross-format pipelines

  - Data-driven documents: extract from xlsx → inject into docx template → export to pdf.
  - Report automation: generate xlsx with formula results → merge into pptx chart → render pdf.
  - Always state the full data-flow graph before writing the script.

enabled: false
