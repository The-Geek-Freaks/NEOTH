id: engineering_testing_strategy
description: |
  Test strategy discipline (auto-installed). Fires when the operator asks about how to test something, where to invest coverage, what makes a good test suite, or wants to eliminate flaky tests. Enforces the pyramid hierarchy (unit > integration > e2e), behavior-over-implementation testing, coverage as a floor not a goal, and TDD red-green-refactor where it adds signal — blocking "done" claims until test evidence is on the table.
version: "0.1.0"

