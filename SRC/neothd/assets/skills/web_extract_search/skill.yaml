id: web_extract_search
description: >
  GOLD-ADAPT-JV-MISC-01 — CSS-targeted web extraction skill. Fetches a URL
  via the `fetch` tool (tools::web_fetch) and applies selector-guided text
  extraction in-model. The `web_extract` Rust tool (GOLD-ADOPT-04) is NOT
  yet registered in the NEOTH tool dispatch table; until it is, this skill
  instructs the model to perform the selector-based extraction itself on the
  fetched HTML. Ported from the Jarvis firecrawl-search skill prompt.
enabled: true
loop: false
author: NEOTH bundled
tags:
  - web
  - extraction
  - scraping
  - research

trigger_keywords:
  - "extract from website"
  - "extract this page"
  - "scrape this url"
  - "scrape this site"
  - "web extract"
  - "get content from url"
  - "get text from website"
  - "pull content from page"
  - "pull text from site"
  - "fetch page content"
  - "read this webpage"
  - "read this website"
  - "webseite extrahieren"
  - "inhalt von url"
  - "seite auslesen"
  - "website text holen"

system_prompt: |
  Web extraction — fetch + in-model CSS-guided text extraction.

  NOTE: the `web_extract` tool is not yet available in the NEOTH tool
  dispatch table. Use the `fetch` tool instead and apply selector logic
  yourself as described below.

  ## Iron Law

  Return ONLY what the page actually contains. Never invent, infer, or
  pad content. If extraction returns nothing, say so and explain why
  (selector miss, access blocked, empty page).

  ## Pass 1 — Resolve inputs

  Required: a URL (http:// or https://).
  Optional: a CSS selector narrowing extraction to a specific element
  (e.g. `article`, `.post-body`, `#main-content`, `h1`).
  If no selector is provided, extract all visible body text.

  ## Pass 2 — Fetch

  Use the `fetch` tool with the URL. The tool returns the page's text
  content (HTML is pre-stripped). If the tool returns an error (non-2xx,
  network failure), report it and stop.

  ## Pass 3 — Apply selector logic in-model

  The `fetch` tool returns plain text, not a DOM. Simulate selector
  targeting by:
  - Scanning the returned text for headings, sections, or blocks that
    correspond to the requested selector or topic.
  - If the operator requested `h1`, extract only lines that look like
    top-level headings.
  - If the operator requested `article` or `.post-body`, extract the
    main body paragraphs (skip nav/footer/cookie blocks).
  - If no selector was given, return all non-boilerplate text.
  - If the selector cannot be matched structurally in plain text, return
    the full body and note that exact CSS matching was not available.

  ## Pass 4 — Present results

  Return the extracted text, formatted as:
  - One logical section per matched block (if multiple).
  - Preserve original paragraph structure where possible.
  - Strip boilerplate (nav menus, footers, cookie banners) when they
    are clearly not the operator's target.

  ## Pass 5 — Verdict gate

  After returning the content, add one line:
  `[fetched <host>; selector "<selector>" applied in-model; N paragraphs returned]`
  If fetch failed: `[fetch failed: <reason>]`

  Never include raw HTML in the output. Plain text only.
