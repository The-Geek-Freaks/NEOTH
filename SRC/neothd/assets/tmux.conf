# NEOTH tmux configuration — drop-in snippet for ~/.tmux.conf
#
# These settings tune your default tmux server for optimal `neoth chat`
# performance when the Claude CLI backend runs via the warm-session
# (`tmux`) path. They are server-scoped (`set -s` / `set -gs` / `set -g`)
# so NEOTH does NOT apply them automatically — that would mutate your
# other tmux sessions. Append them to your `~/.tmux.conf` once + reload
# with `tmux source-file ~/.tmux.conf` (or restart the tmux server).
#
# Per-session options NEOTH applies automatically on each warm session
# (`status off`, `monitor-activity off`, `monitor-bell off`,
# `remain-on-exit on`) live in `providers/claude_tmux.rs::configure_session_for_claude`
# and require no operator action.
#
# Source: bridge.py v6.4.3 (Alex's reference stack) — these are the
# settings NEOTH's response-extractor + pane-capture protocol assume.

# ── 1. Zero ESC-key detection delay ─────────────────────────────────
# Default 500ms — claude-cli's interactive prompt + send-keys flow
# accumulates that latency on every turn. Setting to 0 lets the
# extractor poll capture-pane snapshots without waiting on tmux's
# meta-key disambiguator.
set -s escape-time 0

# ── 2. No paste auto-detection ──────────────────────────────────────
# Default tmux tries to detect rapid input as paste-mode, which can
# bracket multi-line prompt sends with `[200~ ... [201~` sequences
# that confuse claude-cli's tokenizer.
set -s assume-paste-time 0

# ── 3. Disable alternate-screen mode ────────────────────────────────
# `*:smcup@:rmcup@` strips smcup/rmcup from every terminal entry, so
# tools that would normally switch to the alt screen (vim, less, htop)
# stay on the primary buffer. NEOTH's `capture-pane -p` reads the
# primary buffer; alt-screen toggling silently dropped chat history
# from the capture window.
set -gs terminal-overrides '*:smcup@:rmcup@'

# ── 4. Raise scrollback to 10k lines ────────────────────────────────
# Default 2000 lines lets a 30-minute conversation rotate out of the
# capture window. 10000 keeps roughly a 4h session fully recallable
# via `tmux capture-pane -p -S -10000`.
set -g history-limit 10000

# ── 5. Allow OSC 52 clipboard passthrough ───────────────────────────
# claude-cli emits OSC 52 sequences when the model wants to put text
# on the system clipboard. Default tmux strips them; this opt-in lets
# them through so copy-to-clipboard works inside the warm session.
set -g allow-passthrough on
