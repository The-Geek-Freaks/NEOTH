[package]
name = "neoth"
version = "1.0.0"
edition = "2024"
rust-version = "1.86"
default-run = "neoth"
autobins = false
license = "MIT OR Apache-2.0"
description = "Local-first personal AI daemon â€” five-tier memory, consent-gated tools, WASM plugin sandbox, multi-provider LLM routing, signed audit log, and Babel-Index collapse prediction on its own runtime."
repository.workspace = true
keywords = ["ai", "agent", "local-first", "assistant", "llm"]
categories = ["command-line-utilities"]
# `authors` deliberately omitted -- Neoth is multi-user.
# Per-deployment operator identity lives in ~/.neoth/freedom.yaml, not crate metadata.

# The public crate and executable are `neoth`. Keep the library target and a
# compatibility executable named `neothd` so existing integrations and source
# imports continue to work across the v1.0 naming correction.
[lib]
name = "neothd"
path = "src/lib.rs"

[[bin]]
name = "neoth"
path = "src/main.rs"

[[bin]]
name = "neothd"
path = "src/bin/neothd.rs"

# `cross` builds inside a container and intentionally drops arbitrary host env.
# Release builds must pass the compile-time updater verification key through or
# cross targets would ship without the key while native targets remained safe.
[package.metadata.cross.build.env]
passthrough = ["NEOTH_RELEASE_MINISIGN_PUBKEY"]

[features]
default = ["wizard", "cluster", "keychain"]
# Named distribution bundles are the single source of truth for shipped and
# source-installed capability sets. Keep target-specific workflow logic on
# these bundles instead of repeating individual feature lists.
release-server = [
    "matrix-channel",
    "irc-channel",
    "nostr-channel",
    "gchat-channel",
]
release-desktop = [
    "release-server",
    "os-clipboard",
    "wasm-plugin-host",
]
# Interactive TTY wizard for `neoth init`. Disable for slim daemon-only builds
# (containers, embedded targets). When off, `neoth init --non-interactive` still works.
wizard = ["dep:dialoguer", "dep:indicatif", "dep:console"]
# V10-04 GA blocker â€” WASM plugin host via wasmtime. Adds ~80 MiB of
# transitive deps + ~30s build time but unlocks operator-loadable
# `.wasm` plugins with fuel + memory caps.
#
# Build-time default OFF here so contributor `cargo build` stays fast.
# Shipped release binaries and full source installs enable the named
# `release-desktop` bundle (GOLD-HON-15); the headless musl artifact uses
# `release-server`. Per memory
# rule `neoth-features-default-on-runtime-toggle`,
# the actual runtime behaviour is gated by
# `freedom.yaml::plugins.wasm.enabled` (default `true` on builds that
# include the feature). Operator toggles via the wizard / GUI, never
# via cargo flags.
#
# The `wasm_plugin` Rust module's runtime code is
# `#[cfg(feature = "wasm-plugin-host")]` gated; the stub Phase enum +
# WAL band reservation stay compiled in both feature configurations.
wasm-plugin-host = ["dep:wasmtime"]

# EM-01b -- live Gmail/IMAP inbound fetch (imap.gmail.com:993, XOAUTH2 or
# app-password). Default OFF so contributor `cargo build` stays slim;
# source-build opt-in only â€” NOT flipped on in release.yml (cargo-dist was
# rejected, OPEN_DECISIONS.md D-001). Runtime still gated by the operator's
# email config. rustls-only via tokio-rustls (no native-tls).
imap_fetch = ["dep:async-imap", "dep:tokio-rustls", "dep:webpki-roots", "dep:mailparse", "dep:futures"]

# TERMIX-01/02 â€” SSH local-forward tunnel + jump-host chain via `russh` (pure-Rust,
# `ring` crypto backend â†’ builds on Windows MSVC with NO cmake/nasm; ring ships
# pre-assembled objects from crates.io). Default OFF (same precedent as
# `imap_fetch`); source-build opt-in only â€” NOT flipped on in release.yml
# (cargo-dist rejected, D-001). Config: `freedom.yaml::ssh_tunnels`
# (Vec<SshTunnelConfig>, parses on EVERY build via `transport::ssh_config`);
# `serve.rs` spawns the tunnels at step 5a-ssh when this feature is on.
# The TERMIX-03/04 primitives (`transport::ssh_socks5` / `ssh_tofu`)
# compile WITHOUT this feature.
ssh-tunnel = ["dep:russh"]

# D003-KEYCHAIN-01 â€” OS keychain integration for secrets at rest.
# Windows: CredWriteW / CredReadW / CredDeleteW via windows-sys (already in tree).
# macOS: Security.framework generic passwords. Linux: freedesktop Secret Service
# over the existing encrypted D-Bus client. Zero new dependencies.
# Default ON: feature compile-in is enabled; RUNTIME default stays `file`
# until the operator explicitly sets `secrets_backend: keychain` in
# freedom.yaml (or runs `neoth credential migrate --to keychain`).
keychain = []

# PC-01 (clipboard slice) â€” gated OS clipboard read/write via `arboard`. Default
# OFF for source builds (same precedent as `wasm-plugin-host` / `imap_fetch`):
# the clipboard backend is desktop-oriented + platform-specific, so keeping it
# out of a plain `cargo build` keeps contributor/headless-server/CI builds slim
# and free of any display-backend coupling. The `release-desktop` distribution
# bundle flips it on for shipped and full source installs. Per the
# `neoth-features-default-on-runtime-toggle` rule, the RUNTIME behaviour is gated
# by `freedom.yaml::tools.os.clipboard.{enabled,read_enabled,write_enabled}`
# (all default `false`) â€” the cargo feature only decides whether the backend is
# compiled in at all. All clipboard code is `#[cfg(feature = "os-clipboard")]`;
# the `Action`/`ClipboardConfig`/WAL-event surface stays compiled in both configs
# (pure data, no `arboard` dependency) so the autonomy mapping is always testable.
os-clipboard = ["dep:arboard"]

# GOLD-SEC-18 (B-06/B-13) â€” browser-credential-decrypt tree (Chrome + Firefox
# saved-password import: `credentials::{chrome*,firefox*}`). This reads + AES/
# DPAPI-decrypts the operator's locally-stored browser passwords â€” the single
# most sensitive capability in the binary. UNLIKE the other features it is kept
# OFF in shipped release binaries too (NOT flipped on in release.yml): a stock
# `neoth` download cannot touch browser password stores at all, shrinking the
# attack surface to zero for the common operator. Opt in by building with
# `--features browser-import` (the wizard's credential-import step then offers
# Chrome/Firefox alongside the always-available Bitwarden-export importer).
# No extra crate deps â€” the crypto primitives (aes, pbkdf2, hmac) are shared.
browser-import = []

# GOLD-SEC-16 (B-03) â€” the Borg-style cluster subsystem (`crate::cluster`:
# Hyperswarm-DHT peer discovery + anti-entropy WAL gossip + the distributed
# task executor, via the `peeroxide` transport crate). Default-ON in shipped
# release binaries (it is the multi-node feature), but gated so a solo-node
# operator can build a slimmer, smaller-attack-surface binary with
# `--no-default-features` (or `--no-default-features --features wizard`). When
# off, the `neoth cluster` command, the daemon's transport-activation +
# gossip-tick + cluster-audit-sidecar tasks, and the cluster doctor checks are
# all compiled out; `ClusterConfig` stays as inert serde data so an existing
# freedom.yaml with a `cluster:` block still parses. The `peeroxide` dep is
# pulled in only by this feature.
cluster = ["dep:peeroxide"]

# iroh QUIC cluster transport (dial-by-key NodeId, NAT-traversal, relay
# fallback) â€” an alternative to the peeroxide Hyperswarm transport. Default-OFF
# so the base build stays lean (iroh pulls QUIC + relay deps); opt in with
# `--features cluster-iroh`. Implies `cluster` (it is a cluster transport).
cluster-iroh = ["cluster", "dep:iroh"]

# D14b Phase 2c â€” GPU acceleration for local_qwen. Pin per-platform
# so contributors building on a non-GPU laptop don't fight CUDA
# toolkit setup. Default OFF; source-build opt-in only (NOT in release.yml;
# cargo-dist rejected, D-001) â€” build on a host with the matching toolchain.
#
# qwen-cuda  â†’ candle-core compiles its CUDA kernels; local_qwen's
#              accelerator gate flips from "warn + CPU fallback" to
#              "Device::new_cuda(0) + GPU forward pass". Needs CUDA
#              11.8+ toolkit at build time. Operator-runtime detection
#              in `hardware::probe` already reports cuda=true when the
#              .so/.dll is present.
# qwen-metal â†’ candle-core compiles its Metal kernels; macOS-only.
#              Same warn-vs-GPU pattern as qwen-cuda. Apple Silicon
#              + Intel-with-AMD-GPU Macs both benefit.
# TOOLCHAIN-GATED â€” these features pull host-only toolchains (CUDA
# nvcc / macOS Metal). CI MUST NOT include them in `--all-features`
# clippy / check runs; the per-feature compile jobs (`feature-flag
# compile / qwen-cuda` etc.) cover them on the matching OS. cudarc's
# build.rs panics hard if nvcc is missing, so adding `qwen-cuda` to a
# generic clippy run breaks every non-CUDA runner.
qwen-cuda  = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
qwen-metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

# B-6 Item 3f (Session 21) â€” PTY stealth for the claude_cli subprocess
# backend. When tmux is unavailable (Windows-without-tmux) and the
# operator wants interactive Claude (not `--print`), the PTY-subprocess
# backend keeps the CLI from entering CI-detection mode. Default OFF;
# source-build opt-in only (NOT in release.yml; cargo-dist rejected, D-001).
pty-subprocess = ["dep:portable-pty"]

# GOLD-FEAT-10 â€” Matrix client behind the `matrix-channel` feature (off by
# default, same precedent as `wasm-plugin-host` / `imap_fetch` / `os-clipboard`).
# Heavy E2EE tree (vodozemac crypto + ruma + the matrix-sdk-sqlite store). The
# store shares NEOTH's `links="sqlite3"` native lib via the workspace rusqlite
# 0.37 pin (matrix-sdk-sqlite needs rusqlite ^0.37) â€” two sqlite linkers cannot
# coexist, which is why the rusqlite bump is a hard prerequisite of this feature.
# Runtime is gated by the operator's `matrix:` credentials block; the cargo
# feature only decides whether the matrix-sdk backend is compiled in at all. All
# matrix adapter code is `#[cfg(feature = "matrix-channel")]`; the
# `ChannelKind::Matrix` variant + `MatrixFormatter` + probe row stay compiled in
# both configs (pure data, no matrix-sdk dependency).
matrix-channel = ["dep:matrix-sdk"]
# GOLD-FEAT-10 â€” IRC channel via the aatxe `irc` crate (raw TCP, tokio-native).
# Off by default (opt-in). The `ChannelKind::Irc` variant + `IrcFormatter` + the
# probe row + the pure `irc_api` mapping stay compiled in every build (they
# carry no `irc` dependency); only the connection adapter needs the feature.
irc-channel = ["dep:irc"]
# GOLD-FEAT-10 â€” Nostr channel via `nostr-sdk` (WSS relays, keypair identity,
# NIP-17 gift-wrapped encrypted DMs). Off by default â€” heavy crate tree
# (secp256k1 + tungstenite + the NIP modules). The `ChannelKind::Nostr` variant
# + `NostrFormatter` + the probe row + the pure `nostr_api` mapping stay compiled
# in every build (they carry no `nostr-sdk` dependency); only the relay adapter
# needs the feature.
nostr-channel = ["dep:nostr-sdk"]
# B9 â€” Google Chat via a GCP Pub/Sub PULL subscription (no public URL; NEOTH
# dials out). Off by default â€” needs `jsonwebtoken` (ring RS256) for the
# service-account JWT. The `ChannelKind::GoogleChat` variant + formatter +
# probe row + the pure `gchat_api` mapping stay compiled in every build; only
# the pull/send adapter needs the feature.
gchat-channel = ["dep:jsonwebtoken"]
# GOLD-ADAPT-RMAS-01/03 â€” optional local RecursiveMAS Python sidecar for
# council deliberation. Default OFF; NOT flipped on in release CI. No new
# crate deps â€” the sidecar is an OPERATOR-INSTALLED checkout that NEOTH only
# spawns (JSON-over-stdio); runtime-gated by freedom.yaml::recursive_mas +
# the VRAM/sidecar-presence gate in providers::recursive_mas (which itself
# compiles in every build â€” only the live adapter is feature-gated).
recursive-mas = []

# GOLD-ADAPT-HASH-01 â€” opt-in microbench for opthash (ElasticHashMap /
# FunnelHashMap) vs std::HashMap on a NEOTH sender-id key shape.
# Council verdict: NO production default; evaluation only. The dep and all
# bench code are completely absent from the default build.
#
# Requires rustc >= 1.88 (opthash 0.10.x MSRV) â€” users running the bench
# must have a recent toolchain; the package's own rust-version = "1.86" pin
# only constrains the production code paths.
#
# Run the bench:
#   cargo test --features hash-bench -- bench_hash_backends --ignored --nocapture
hash-bench = ["dep:opthash"]

[dependencies]
# GOLD-ADAPT-HASH-01 â€” ElasticHashMap + FunnelHashMap bench spike.
# Optional, default-OFF; never present in a release binary. Pulled only when
# the `hash-bench` feature is active. opthash 0.10.x MSRV = 1.88 â€” that
# constraint only applies to the bench-enabled build, not the default path.
# default-features keeps the `foldhash` DefaultHashBuilder active (realistic
# production hasher; disabling it would skew the bench toward a slower fallback).
opthash = { version = "0.10", optional = true }

# GOLD-FEAT-10 â€” IRC channel (optional, behind `irc-channel`). Tokio-native,
# owns the IRC wire protocol + PING/PONG + reconnect. rustls TLS (no system lib).
irc = { version = "1", default-features = false, features = ["tls-rust"], optional = true }
# GOLD-FEAT-10 â€” Nostr channel (optional, behind `nostr-channel`). The `nip59`
# feature pulls the gift-wrap + NIP-44 encryption that NIP-17 private DMs need;
# default features keep the tokio relay-pool + rustls WSS transport.
nostr-sdk = { version = "0.44", features = ["nip59"], optional = true }
# B9 â€” Google Chat channel (optional, behind `gchat-channel`). RS256 service-
# account JWT signing; rides the ring 0.17 already in the tree (russh).
jsonwebtoken = { version = "9", optional = true }
# Day-1 minimal
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "net", "process", "sync", "signal", "time"] }
semver             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
serde_yaml         = "0.9"
toml               = "0.8"
thiserror          = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
crc32c             = "0.6"
xxhash-rust        = { version = "0.8", features = ["xxh3", "xxh64"] }
# GOLD-ADAPT-KV-03 â€” LRU cold tier for Ouro prefix-KV offload.
# 0.16 clears RUSTSEC-2026-0002 (unsound IterMut in <0.16.3); NEOTH only uses
# new/get/put/pop, so the bump is API-compatible.
lru                = "0.16"
uuid               = { version = "1", features = ["v4", "v7", "serde"] }
# SX-01: SSRF guard for tools/web_fetch.rs â€” strict URL parsing + scheme
# filtering instead of string-prefix checks.
url                = "2"

# Day-3 (onboarding wizard) -- SPEC_onboarding.md section 9.1
clap        = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
