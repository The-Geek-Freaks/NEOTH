[package]
name = "neothd-gui"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Operator-facing GUI wizard for NEOTH (Slint frontend)."

[[bin]]
name = "neothd-gui"
path = "src/main.rs"

[features]
# GOLD-LOOP-03 — Loop panel display gate. Default-ON per the
# features-default-on release rule; `--no-default-features` hides the
# sidebar entry + skips the subprocess wiring.
default = ["gui-loop"]
gui-loop = []

[dependencies]
# Slint native — pure-Rust Femtovg backend on Windows + Linux, system
# backend on macOS. No Qt, no GTK system deps.
slint = { version = "1.8", default-features = false, features = [
    "compat-1-2",
    "renderer-femtovg",
    "backend-winit",
    "std",
    "unstable-winit-030",
] }

# GOLD-ADAPT-ODY-03 — native file picker for the chat attachment strip.
rfd = "0.15"

# Wave 5 — message hover-action Copy: cross-platform system clipboard.
arboard = { version = "3", default-features = false }

# H3 — system tray: NEOTH lives in the tray; left-click restores the
# window, the menu carries Show/Quit. Icon is a procedural neon orb.
tray-icon = "0.19"

# Shared deps from the workspace.
anyhow = "1"
toml = "0.8"
serde.workspace      = true
serde_json.workspace = true
serde_yaml = "0.9"
zeroize.workspace = true
tracing.workspace    = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.2"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
slint-build = "1.8"

[dev-dependencies]
neothd = { package = "neoth", path = "../neothd", default-features = false }
tempfile = "3"
