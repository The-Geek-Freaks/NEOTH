# cargo-deny — Phase 33c BS-10 (license compliance).
#
# Runs as `cargo deny check` in CI to fail builds on:
#   1. Copyleft-tainted transitive deps (GPL / AGPL).
#   2. Unmaintained / advisory-flagged crates.
#   3. Multiple versions of the same crate when avoidable.
#
# Local invocation:
#   cargo install --locked cargo-deny
#   cargo deny check
#
# NEOTH ships under MIT OR Apache-2.0. Anything that forces a stronger
# obligation on operators (GPL family) is rejected at the dependency
# boundary so the public OSS license posture stays clean.

[graph]
# Same target NEOTH actually ships against. cargo-deny defaults to all
# targets, which surfaces noise from optional-dep transitive trees.
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
# Schema v2: scalar severity fields ("deny"/"warn") dropped in favour of
# default-deny + explicit allow/deny lists below.
version = 2
# Confidence threshold for SPDX-license detection. 0.8 = strict enough to
# catch ambiguities, loose enough to accept the long tail of OSS readmes.
confidence-threshold = 0.8

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "OpenSSL",
    # SX-05b additions (2026-05-25):
    # CDLA-Permissive-2.0 — Community Data License Agreement, permissive,
    # used by webpki-roots (transitive via reqwest, tokio-tungstenite, hf-hub).
    # Compatible with MIT/Apache stance — no copyleft, no patent traps.
    "CDLA-Permissive-2.0",
    # BSL-1.0 — Boost Software License, OSI + FSF approved, permissive.
    # Used by xxhash-rust (transitive). No additional obligations.
    "BSL-1.0",
]

# v2 dropped the [licenses.deny] list (PR #611) — anything not in `allow`
# above is denied by default. GPL / AGPL / LGPL / SSPL therefore stay
# rejected without an explicit list, because none of them are allow-listed.

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Crates we never want pulled in transitively. Phase 33d Q-9 DO-NOT-ADOPT
# list — if any of these show up, fail the build loudly.
deny = [
    { name = "agentmemory" },        # 6 CVEs, no Cargo.toml (memo Q-9)
    { name = "tailslayer-rs" },      # Linux-x86_64-only (memo Q-9, target portability)
    { name = "openssl-sys" },        # we use rustls; openssl is build-toolchain pain
]

# Skip duplicate-version warnings for these — known cost of the ecosystem
# (different transitive deps pin different majors and the cost of forcing
# alignment isn't worth the security review of upstream patches).
skip = []

[advisories]
# Schema v2: cargo-deny ≥0.16 dropped the per-class severity scalars
# (yanked / unmaintained / notice / vulnerability = "deny"|"warn"|"allow").
# v2 reports all advisories by default; tune scope via [advisories.ignore]
# or the scope-enum fields below ("all" | "workspace" | "transitive" | "none").
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Walk every dep — workspace + transitive. Tightens the SX-05b fix:
# we want NEOTH advisories AND third-party advisories surfaced.
unmaintained = "all"
# Advisories acknowledged and ruled out as non-exploitable in NEOTH's
# threat model. Each ignore MUST carry a reason + plan-to-resolve so
# the audit pipeline stays honest. Re-evaluate every release.
#
# 2026-05-16: previously ignored RUSTSEC-2026-0098 / -0099 / -0104
# (rustls-webpki 0.101.7) dropped after the teloxide 0.13 → 0.17 bump
# pulled reqwest 0.13 + rustls-webpki 0.103.13 into the tree. Tree
# inspection confirms 0.101.7 no longer present.
#
# 2026-05-25 SX-05b: schema-fix unmasked 5 unmaintained advisories that
# were hidden behind the prior config-parse failure. All are unmaintained
# (not vulnerable) and have no safe upgrade; ignore with re-evaluation
# planned for v0.3.
ignore = [
    # bincode — team disbanded after doxxing incident. We use bincode 1.x
    # for WAL frame format; migration to bincode 2 or postcard requires
    # WAL format migration. Plan: evaluate postcard switch in v0.3.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x — WAL format-stable; v0.3 plans postcard migration." },
    # number_prefix — tiny formatting crate, transitive via indicatif.
    # No vulnerability; upstream indicatif owns the migration.
    { id = "RUSTSEC-2025-0119", reason = "number_prefix — transitive via indicatif; upstream migration tracked." },
    # paste — dtolnay archived; no vuln. Transitive via several macro
    # crates. Replacement (`pastey`) requires upstream migrations.
    { id = "RUSTSEC-2024-0436", reason = "paste — archived but no vuln; transitive only; pastey migration pending upstream." },
    # xsalsa20poly1305 — renamed to crypto_secretbox. Transitive via
    # peeroxide-dht v1.3.1. Needs upstream peeroxide bump.
    { id = "RUSTSEC-2023-0037", reason = "xsalsa20poly1305 — transitive via peeroxide-dht; upstream bump tracked." },
    # serial 0.4.0 — unmaintained since 2017 (RUSTSEC-2017-0008). Transitive
    # via portable-pty 0.8.1 (used by the claude-cli tmux adapter on
    # Linux/macOS). No safe upgrade exists; portable-pty pinned a
    # specific serial version. Migration: switch tmux adapter to a
    # different PTY crate OR await upstream portable-pty bump. Not a
    # vulnerability — unmaintained advisory only.
    { id = "RUSTSEC-2017-0008", reason = "serial 0.4.0 unmaintained — transitive via portable-pty; no vuln, only maintenance status. Upstream bump tracked." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
