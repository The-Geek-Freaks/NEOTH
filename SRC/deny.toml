# cargo-deny — Phase 33c BS-10 (license compliance).
#
# Runs as `cargo deny check` in CI to fail builds on:
#   1. Copyleft-tainted transitive deps (GPL / AGPL).
#   2. Unmaintained / advisory-flagged crates.
#   3. Multiple versions of the same crate when avoidable.
#
# Local invocation:
#   cargo install --locked cargo-deny
#   cargo deny check
#
# NEOTH ships under MIT OR Apache-2.0. Anything that forces a stronger
# obligation on operators (GPL family) is rejected at the dependency
# boundary so the public OSS license posture stays clean.

[graph]
# Same target NEOTH actually ships against. cargo-deny defaults to all
# targets, which surfaces noise from optional-dep transitive trees.
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
# Schema v2: scalar severity fields ("deny"/"warn") dropped in favour of
# default-deny + explicit allow/deny lists below.
version = 2
# Confidence threshold for SPDX-license detection. 0.8 = strict enough to
# catch ambiguities, loose enough to accept the long tail of OSS readmes.
confidence-threshold = 0.8

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    # SX-05b additions (2026-05-25):
    # CDLA-Permissive-2.0 — Community Data License Agreement, permissive,
    # used by webpki-roots (transitive via reqwest, tokio-tungstenite, hf-hub).
    # Compatible with MIT/Apache stance — no copyleft, no patent traps.
    "CDLA-Permissive-2.0",
    # BSL-1.0 — Boost Software License, OSI + FSF approved, permissive.
    # Used by xxhash-rust (transitive). No additional obligations.
    "BSL-1.0",
]

# Keep Unlicense scoped to the one audited dependency instead of allowing it
# across the workspace. ksni 0.3.6 publishes `license = "Unlicense"` and the
# canonical UNLICENSE text in its crates.io package (SHA-256:
# 7e12e5df4bae12cb21581ba157ced20e1986a0508dd10d0e8a4ab9a4cf94e85c).
#
# Slint 1.16.1 publishes a three-way expression: GPL-3.0-only, its royalty-free
# desktop/mobile/web license, or its commercial license. NEOTH selects only the
# non-copyleft royalty-free branch for its desktop GUI. Keep that choice bound
# to every currently resolved Slint crate and exact version: a Slint upgrade or
# newly enabled renderer must be reviewed instead of inheriting this exception.
# The published royalty-free text has SHA-256
# 5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe and
# requires the AboutSlint widget or public MadeWithSlint badge attribution.
exceptions = [
    { allow = ["Unlicense"], crate = "ksni@0.3.6" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-backend-selector@1.16.1" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-backend-winit@1.16.1" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-common@1.16.1" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-compiler@1.16.1" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-core@1.16.1" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-core-macros@1.16.1" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-renderer-femtovg@1.16.1" },
    # The existing desktop software renderer uses the same reviewed license.
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "i-slint-renderer-software@1.16.1" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "slint@1.16.1" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "slint-build@1.16.1" },
    { allow = ["LicenseRef-Slint-Royalty-free-2.0"], crate = "slint-macros@1.16.1" },
]

# v2 dropped the [licenses.deny] list (PR #611) — anything not in `allow`
# above is denied by default. GPL / AGPL / LGPL / SSPL therefore stay
# rejected without an explicit list, because none of them are allow-listed.

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Crates we never want pulled in transitively. Phase 33d Q-9 DO-NOT-ADOPT
# list — if any of these show up, fail the build loudly.
deny = [
    { name = "agentmemory" },        # 6 CVEs, no Cargo.toml (memo Q-9)
    { name = "tailslayer-rs" },      # Linux-x86_64-only (memo Q-9, target portability)
    { name = "openssl-sys" },        # we use rustls; openssl is build-toolchain pain
]

# Skip duplicate-version warnings for these — known cost of the ecosystem
# (different transitive deps pin different majors and the cost of forcing
# alignment isn't worth the security review of upstream patches).
skip = []

[advisories]
# Schema v2: cargo-deny ≥0.16 dropped the per-class severity scalars
# (yanked / unmaintained / notice / vulnerability = "deny"|"warn"|"allow").
# v2 reports all advisories by default; tune scope via [advisories.ignore]
# or the scope-enum fields below ("all" | "workspace" | "transitive" | "none").
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Walk every dep — workspace + transitive. Tightens the SX-05b fix:
# we want NEOTH advisories AND third-party advisories surfaced.
unmaintained = "all"
# Advisories acknowledged and ruled out as non-exploitable in NEOTH's
# threat model. Each ignore MUST carry a reason + plan-to-resolve so
# the audit pipeline stays honest. Re-evaluate every release.
#
# 2026-05-16: previously ignored RUSTSEC-2026-0098 / -0099 / -0104
# (rustls-webpki 0.101.7) dropped after the teloxide 0.13 → 0.17 bump
# pulled reqwest 0.13 + rustls-webpki 0.103.13 into the tree. Tree
# inspection confirms 0.101.7 no longer present.
#
# 2026-05-25 SX-05b: schema-fix unmasked 5 unmaintained advisories that
# were hidden behind the prior config-parse failure. All are unmaintained
# (not vulnerable) and have no safe upgrade; ignore with re-evaluation
# planned for v0.3.
ignore = [
    # bincode — team disbanded after doxxing incident. We use bincode 1.x
    # for WAL frame format; migration to bincode 2 or postcard requires
    # WAL format migration. Plan: evaluate postcard switch in v0.3.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x — WAL format-stable; v0.3 plans postcard migration." },
    # number_prefix — tiny formatting crate, transitive via indicatif.
    # No vulnerability; upstream indicatif owns the migration.
    { id = "RUSTSEC-2025-0119", reason = "number_prefix — transitive via indicatif; upstream migration tracked." },
    # paste — dtolnay archived; no vuln. Transitive via several macro
    # crates. Replacement (`pastey`) requires upstream migrations.
    { id = "RUSTSEC-2024-0436", reason = "paste — archived but no vuln; transitive only; pastey migration pending upstream." },
    # xsalsa20poly1305 — renamed to crypto_secretbox. Transitive via
    # peeroxide-dht v1.3.1. Needs upstream peeroxide bump.
    { id = "RUSTSEC-2023-0037", reason = "xsalsa20poly1305 — transitive via peeroxide-dht; upstream bump tracked." },
    # serial 0.4.0 — unmaintained since 2017 (RUSTSEC-2017-0008). Transitive
    # via portable-pty 0.8.1 (used by the claude-cli tmux adapter on
    # Linux/macOS). No safe upgrade exists; portable-pty pinned a
    # specific serial version. Migration: switch tmux adapter to a
    # different PTY crate OR await upstream portable-pty bump. Not a
    # vulnerability — unmaintained advisory only.
    { id = "RUSTSEC-2017-0008", reason = "serial 0.4.0 unmaintained — transitive via portable-pty; no vuln, only maintenance status. Upstream bump tracked." },
    # proc-macro-error2 — unmaintained fork, pulled transitively through
    # aquamarine/matrix-sdk and matrix-pickle/vodozemac. No safe upgrade is
    # available from NEOTH's side without replacing the Matrix stack.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained — transitive via matrix-sdk/vodozemac; no vuln, no safe direct upgrade. Re-evaluate with next Matrix stack bump." },
    { id = "RUSTSEC-2026-0318", reason = "Reviewed source-bound matrix-sdk-crypto 0.18.0 vendor backport; expires 2026-12-01 and must be removed or re-reviewed then." },
    # rustls-pemfile 2.2.0 — unmaintained thin wrapper, transitive via irc.
    # No direct NEOTH use; migrate once irc exposes a rustls-pki-types path or
    # the IRC adapter moves off this dependency chain.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained — transitive via irc; no vuln, no safe direct upgrade. Re-evaluate when replacing/bumping IRC transport." },
    # ttf-parser 0.25.1 — unmaintained, but still the newest line selected by
    # Slint 1.16/usvg and patched lopdf 0.42. No vulnerability is reported and
    # there is no compatible safe upgrade. Migrate when upstream adopts skrifa.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 unmaintained — transitive via current Slint/usvg and lopdf 0.42; no vulnerability or safe compatible upgrade. Re-evaluate every release and migrate when upstream adopts skrifa." },
    # rustybuzz 0.20.1 — unmaintained through the current Slint/usvg renderer.
    # No vulnerability or compatible upgrade exists; upstream's successor is
    # harfrust, so the dependency disappears when Slint/usvg migrates.
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz 0.20.1 unmaintained — transitive via current Slint/usvg; no vulnerability or safe compatible upgrade. Re-evaluate every release and migrate when upstream adopts harfrust." },
    # quick-xml <0.41 — two DoS advisories (2026-06-29): quadratic duplicate-
    # attribute check (0194) + unbounded NsReader namespace allocation (0195).
    # neothd's DIRECT quick-xml (CalDAV parser) is bumped to 0.41 (fixed).
    # The only remaining <0.41 copy is transitive through wayland-scanner, a
    # build-time proc macro over vendored Wayland protocol XML. No runtime or
    # operator-controlled XML reaches it. feed-rs and NEOTH's direct parser now
    # both resolve to 0.41. Drop both ignores when wayland-scanner bumps.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml <0.41 quadratic attr-check DoS — build-time only via wayland-scanner over vendored protocol XML; all runtime copies are 0.41. Drop when wayland-scanner bumps." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml <0.41 NsReader memory-exhaustion DoS — same build-time-only wayland-scanner chain; no operator-controlled XML. Drop when wayland-scanner bumps." },
    # pin-utils 0.1.0 — repository archived 2026-10-01 after its final
    # release; maintenance notice only, no vulnerability. It is pulled
    # transitively (futures-util consumers such as async-imap, nix 0.25 via
    # portable-pty, and the Slint build graph); NEOTH has no direct use to
    # migrate to core::pin::pin!.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils archived — transitive only (futures-util consumers, portable-pty, Slint); maintenance notice, no vulnerability and no safe upgrade. Re-evaluate every release." },
    # zvariant / zbus_names / zvariant_derive — merged into zbus 6.0.0 as its
    # `wire` module (2026-10-16); the standalone crates stopped receiving
    # releases. Maintenance notice only, no vulnerability. NEOTH resolves them
    # through secret-service 4.0 (zbus 4.4) and through zbus 5.15 used by
    # ashpd/rfd, ksni and the Slint winit backend. They disappear once those
    # consumers move to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant standalone crate retired into zbus 6 — transitive via secret-service 4.0 and zbus 5.15 (ashpd, ksni, Slint); maintenance notice, no vulnerability, no compatible upgrade. Drop when those consumers adopt zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names standalone crate retired into zbus 6 — same secret-service/zbus 5.15 chain; maintenance notice, no vulnerability, no compatible upgrade. Drop with RUSTSEC-2026-0370." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive standalone crate retired into zbus 6 — same secret-service/zbus 5.15 chain; maintenance notice, no vulnerability, no compatible upgrade. Drop with RUSTSEC-2026-0370." },
    # Operator-approved temporary exceptions (Alex, 2026-11-11). Both are real
    # vulnerabilities whose fixes need crate lines the pinned Matrix stack does
    # not accept: matrix-sdk 0.18 and its matrix-sdk-sqlite fix vodozemac 0.10
    # and rusqlite 0.37 (one `links = "sqlite3"` graph for the whole product).
    # packaging/advisory_exception_gate.py enforces the date, the audit.toml
    # mirror and removal once the resolved graph no longer needs them.
    #
    # vodozemac <= 0.11.1: the Olm root-key ratchet leaves root/chain key copies
    # in freed heap memory. Exploitation needs a separate way to read this
    # process's memory, a core dump or swap; it weakens forward secrecy of the
    # opt-in Matrix channel's Olm sessions. There is no remote vector.
    { id = "RUSTSEC-2026-0451", reason = "vodozemac 0.10 via pinned matrix-sdk 0.18 — degraded Olm key zeroization; needs local process-memory disclosure, Matrix channel only. Operator-approved; expires 2026-12-01 with the Matrix stack bump and must be removed or re-reviewed then." },
    # libsqlite3-sys < 0.39 bundles SQLite < 3.54 (CVE-2026-119375): a crafted
    # database plus `-wal` pair with mismatched page sizes can return
    # uninitialized page-cache memory. The vector is local and requires NEOTH
    # to open a database that a less trusted party wrote next to its WAL file.
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.35 (bundled SQLite < 3.54) via rusqlite 0.37, pinned by matrix-sdk-sqlite 0.18 — local crafted db/-wal pair only. Operator-approved; expires 2026-12-01 with the Matrix stack bump and must be removed or re-reviewed then." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
