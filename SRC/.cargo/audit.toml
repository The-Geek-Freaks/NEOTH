# cargo-audit configuration — the SINGLE source for RUSTSEC ignores.
#
# cargo-audit reads this file automatically when invoked from SRC/ (both the
# CI workflow's audit step and security.yml's audit job use
# `working-directory: SRC`), so neither workflow passes --ignore flags.
#
# cargo-deny does NOT read this file — SRC/deny.toml [advisories].ignore is
# the hand-synced mirror and carries the full reason + plan-to-resolve for
# every entry. WHEN YOU ADD/REMOVE AN ID HERE, UPDATE deny.toml IN THE SAME
# COMMIT (and vice versa). Re-evaluate every release.

[advisories]
ignore = [
    "RUSTSEC-2025-0141", # bincode 1.x unmaintained — WAL format-stable; postcard migration planned
    "RUSTSEC-2025-0119", # number_prefix unmaintained — transitive via indicatif
    "RUSTSEC-2024-0436", # paste archived, no vuln — transitive macro dep
    "RUSTSEC-2023-0037", # xsalsa20poly1305 renamed — transitive via peeroxide-dht
    "RUSTSEC-2017-0008", # serial unmaintained — transitive via portable-pty (tmux adapter)
    "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained — transitive via matrix-sdk/vodozemac
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained — transitive via irc
    "RUSTSEC-2026-0192", # ttf-parser unmaintained — latest Slint/lopdf graph; no safe upgrade, see deny.toml
    "RUSTSEC-2026-0206", # rustybuzz unmaintained — latest Slint/usvg graph; no safe upgrade, see deny.toml
    "RUSTSEC-2026-0194", # quick-xml <0.41 quadratic attr-check DoS — build-time only via wayland-scanner; see deny.toml
    "RUSTSEC-2026-0195", # quick-xml <0.41 NsReader memory DoS — same build-time-only chain; runtime copies are 0.41
    "RUSTSEC-2024-0384", # instant unmaintained — transitive via nostr-sdk; no vuln, no upgrade without a nostr stack bump
]
