[package]
name        = "neoth-migrate"
version     = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "Prior-AI memory import tool — migrates operator-declared memory stores into the NEOTH WAL + tier views."

# V10-06 GA blocker. Ships as a SEPARATE binary from `neothd` so a
# release of the daemon doesn't carry the migration-only deps
# (pulldown-cmark, walkdir, future lance + git2) — operators run it
# once at Day-65 cutover then never again.
#
# Build/run (the operator declares their stores in import-manifest.yaml):
#   cargo build -p neoth-migrate --release
#   ./neoth-migrate dry-run --manifest import.yaml   # scan-only (shippable)
#   ./neoth-migrate apply --manifest import.yaml --confirm   # POST-v1.0: not yet
#       implemented — apply validates the manifest then refuses, pointing to dry-run.
#
# The source list is operator-supplied (see
# `examples/import-manifest.example.yaml`); nothing is hardcoded to a
# specific machine. The manifest serde shape mirrors the schema in
# `neothd/src/migrate/mod.rs` (loose coupling via the YAML format, not a
# crate dependency — neoth-migrate stays independent of neothd).

[[bin]]
name = "neoth-migrate"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
clap               = { version = "4.5", features = ["derive"] }
serde              = { workspace = true }
serde_json         = { workspace = true }
serde_yaml         = "0.9"
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Markdown reader — pulldown-cmark is pure-Rust, no system deps.
# Used by the Markdown StoreKind (Obsidian vault, Hippocampus core,
# OpenClaw session-md).
pulldown-cmark = { version = "0.12", default-features = false }

# Recursive directory walk — honours ignore-files when configured.
# Same crate `neothd` already uses for K-Repo-Map, so the dep graph
# stays tight.
ignore = "0.4"

# V10-06 Pick #35 — Sqlite reader (cq_commons + context_mode_fts5).
# Bundled feature so the migrator ships without a system sqlite dep,
# matching `neothd`'s self-contained posture. Pinned to 0.37 in lockstep with
# `neothd` (GOLD-FEAT-10 / matrix-sdk-sqlite parity) — one workspace, one
# libsqlite3-sys (the `links="sqlite3"` native lib admits only one version).
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
