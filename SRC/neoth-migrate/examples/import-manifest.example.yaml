# NEOTH import manifest — EXAMPLE.
#
# Declare the prior-AI memory stores you want to migrate into NEOTH.
# Copy this file, edit the paths to match YOUR system, then run:
#
#   neoth-migrate dry-run --manifest <your-file>.yaml     # preview
#   neoth-migrate apply   --manifest <your-file>.yaml --confirm
#
# A leading `~/` expands to your home directory; absolute paths pass
# through unchanged. `kind` selects the reader; valid kinds are:
#   markdown       — a directory of .md files (e.g. an Obsidian vault)
#   markdown_file  — a single .md file
#   json_dir       — a directory of .json / .ajson files
#   json_file      — a single .json file
#   sqlite         — a .db file (or a directory containing one)
#   lance_arrow    — a LanceDB directory (counts datasets, SCAN-ONLY — apply is a no-op)
#   git_tree       — a directory of git repos (counts repos, SCAN-ONLY — apply is a no-op)
#   faiss_flat     — a directory of .bin flat-vector files (SCAN-ONLY — apply is a no-op)
#
# `hint` is optional and serves two mutually-exclusive purposes:
#
#   1. Sub-format discriminator (sqlite kind only) — tells the reader which
#      schema the .db file follows so it can extract the right tables:
#        hint: "hermes"      — Hermes / neothd memory store
#        hint: "openhuman"   — OpenHuman sqlite exports
#        hint: "cq-commons"  — CQ-Commons knowledge DB
#        hint: "veronica"    — Veronica assistant DB
#      Without a hint the sqlite reader attempts a generic key/value scan.
#
#   2. Scope override (all kinds) — prefix "scope:" to pin where imported
#      claims land in idx_groundtruth instead of defaulting to "global":
#        hint: "scope:global"     — store in the global scope (default)
#        hint: "scope:host:myhostname" — restrict to a specific host scope
#      The "scope:" prefix is stripped before writing; the remainder is the
#      scope tag. A hint that does NOT start with "scope:" is treated as a
#      sub-format key (case 1 above) and scope defaults to "global".
#
#   NOTE: sub-format key and scope override are mutually exclusive per source.
#   If you need both (e.g. Hermes DB in a non-global scope), split the source
#   into two entries using a wrapper script that exports to a JSON file first.

sources:
  - name: notes_vault
    path: ~/Documents/MyVault           # your Obsidian / markdown notes
    kind: markdown
    hint: "markdown notes directory"

  - name: core_memory
    path: ~/my-assistant/memory/CORE.md  # a single long-form memory file
    kind: markdown_file

  - name: chat_exports
    path: ~/Downloads/ai-chat-exports     # exported conversation JSON
    kind: json_dir

  - name: memory_index
    path: ~/my-assistant/memory/index.json
    kind: json_file

  - name: vector_store
    path: ~/my-assistant/memory/lancedb
    kind: lance_arrow

  - name: fts_db
    path: ~/my-assistant/memory.db        # SQLite full-text store
    kind: sqlite

  - name: code_backup
    path: ~/git-backup                    # directory of git repos
    kind: git_tree

  - name: flat_vectors
    path: ~/my-assistant/vectors          # directory of .bin vector files
    kind: faiss_flat
