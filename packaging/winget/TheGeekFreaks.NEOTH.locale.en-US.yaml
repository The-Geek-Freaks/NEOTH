ShortDescription: Personal AI agent — Neoth knows.
Description: |
  NEOTH is a personal AI agent that runs locally. It learns from your
  interactions, stores memory tier-aware (hot / warm / cold + ground
  truth), supports council-style multi-provider deliberation, ingests
  credentials from existing password managers + browsers (Bitwarden,
  Chrome, Firefox), and exposes a CLI + GUI surface for chat,
  recall, code workflows, and operator-controlled automation.

  Privacy-first by design: every cloud-provider call is gated by
  explicit operator consent; no telemetry phones home; the wizard
  walks first-time operators through the full setup with explained
  trade-offs.
