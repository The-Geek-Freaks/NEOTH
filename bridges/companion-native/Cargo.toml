[package]
name = "neoth-companion-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

# This crate intentionally owns a workspace boundary. It must never join the
# NEOTH workspace or rewrite SRC/Cargo.lock while the mobile toolchain is not
# yet owned by a build lane.
[workspace]

[dependencies]
ed25519-dalek = "=2.2.0"
futures-util = "=0.3.32"
getrandom = "=0.2.17"
hex = "=0.4.3"
hkdf = "=0.12.4"
peeroxide = { path = "../../SRC/vendor/peeroxide" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.23.5", features = ["serde", "v7"] }
zeroize = "=1.9.0"
