# =============================================================================
# NEOTH — Security Scanning
#
# Runs cargo-audit, cargo-deny, and trivy on a weekly schedule and on push to main.
# SARIF results are uploaded to GitHub Security tab (requires Advanced Security).
# Fails on HIGH or CRITICAL severity findings.
# =============================================================================

name: Security

on:
  schedule:
    - cron: '0 6 * * 1'        # every Monday 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write        # required to upload SARIF

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo-audit (RUSTSEC)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          # Cargo.lock lives at the workspace root (SRC/), not the
          # neothd member crate. Fixed 2026-05-26 — prior key
          # SRC/neothd/Cargo.lock didn't exist, so cache never hit
          # and cargo-audit found no lockfile to scan.
          key: security-audit-cargo-${{ hashFiles('SRC/Cargo.lock') }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        working-directory: SRC
        # cargo-audit reads Cargo.lock from the workspace root.
        # Honours the deny.toml ignore list so the unmaintained-only
        # advisories there (bincode 1.x, number_prefix, paste,
        # xsalsa20poly1305, serial) don't fail the audit gate —
        # they're tracked + migration-planned, not active vulns.
        # SX-04: `set -eo pipefail` is the GHA bash default, so the
        # pipe propagates cargo-audit's non-zero exit on RUSTSEC
        # findings instead of silently swallowing CVEs.
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2025-0119 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0037 \
            --ignore RUSTSEC-2017-0008 \
            --json 2>/dev/null \
            | tee /tmp/audit-result.json
          cargo audit \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2025-0119 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0037 \
            --ignore RUSTSEC-2017-0008

  deny:
    name: cargo-deny (license + supply chain)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: SRC/neothd/Cargo.toml
          command: check
          arguments: --all-features
          rust-version: '1.86'

  trivy:
    name: trivy (filesystem vuln scan)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        # Pinned to ≥0.35.0 — earlier versions affected by the
        # 2025 supply-chain compromise (Dependabot alert #1).
        # `.trivyignore` at the repo root mirrors the deny.toml +
        # cargo-audit ignores so we don't re-fail on the same
        # unmaintained-only advisories.
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()             # upload even if scan found issues
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'
