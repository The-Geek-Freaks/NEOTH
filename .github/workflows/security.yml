# =============================================================================
# NEOTH — Security Scanning
#
# Runs cargo-audit, cargo-deny, and trivy on a weekly schedule and on push to main.
# SARIF results are uploaded to GitHub Security tab (requires Advanced Security).
# Fails on HIGH or CRITICAL severity findings.
# =============================================================================

name: Security

on:
  schedule:
    - cron: '0 6 * * 1'        # every Monday 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write        # required to upload SARIF

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo-audit (RUSTSEC)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          # Cargo.lock lives at the workspace root (SRC/), not the
          # neothd member crate. Fixed 2026-05-26 — prior key
          # SRC/neothd/Cargo.lock didn't exist, so cache never hit
          # and cargo-audit found no lockfile to scan.
          key: security-audit-cargo-${{ hashFiles('SRC/Cargo.lock') }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        working-directory: SRC
        # cargo-audit reads Cargo.lock from the workspace root. cargo-audit does
        # NOT read deny.toml, so this --ignore list is a hand-synced mirror of
        # deny.toml's [advisories].ignore — keep the two in sync when adding an
        # ignore. Each entry there carries the full reason + plan-to-resolve;
        # the short tag here just names why it is acknowledged:
        #   0141 bincode1 / 0119 number_prefix / 0436 paste / 0037 xsalsa20poly1305
        #   / 0008 serial    — unmaintained-only, transitive, migration-planned.
        #   0187 lopdf       — DoS, transitive via pdf-extract (pins ^0.36); only
        #                      `neoth ingest` of operator-chosen PDFs = self-DoS.
        #   0071 rsa Marvin  — no upstream patch; transitive via russh/ssh-key
        #                      (TERMIX local SSH client); local use = safe per advisory.
        # SX-04: `set -eo pipefail` is the GHA bash default, so the
        # pipe propagates cargo-audit's non-zero exit on RUSTSEC
        # findings instead of silently swallowing CVEs.
        run: |
          cargo audit \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2025-0119 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0037 \
            --ignore RUSTSEC-2017-0008 \
            --ignore RUSTSEC-2026-0187 \
            --ignore RUSTSEC-2023-0071 \
            --json 2>/dev/null \
            | tee /tmp/audit-result.json
          cargo audit \
            --ignore RUSTSEC-2025-0141 \
            --ignore RUSTSEC-2025-0119 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0037 \
            --ignore RUSTSEC-2017-0008 \
            --ignore RUSTSEC-2026-0187 \
            --ignore RUSTSEC-2023-0071

  deny:
    name: cargo-deny (license + supply chain)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: SRC/neothd/Cargo.toml
          command: check
          arguments: --all-features
          rust-version: '1.86'

  trivy:
    name: trivy (filesystem vuln scan)
    runs-on: ubuntu-24.04
    # 2026-05-26: Trivy's CVE/GHSA identifiers don't map 1:1 to
    # cargo-audit's RUSTSEC-* IDs in `.trivyignore`. Until the
    # ignore-list translation is done (track via PROGRESS), surface
    # findings as a table for human review but don't block the merge
    # gate — cargo-audit + cargo-deny above already enforce the
    # RUSTSEC ignore policy authoritatively for the Rust dep tree.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (table output for human review)
        # Pinned to ≥0.35.0 — earlier versions affected by the
        # 2025 supply-chain compromise (Dependabot alert #1).
        # Table format prints findings inline so operators can audit
        # the CVE list directly from the run log without downloading
        # SARIF.
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: false
          trivyignores: '.trivyignore'

      - name: Run Trivy filesystem scan (SARIF for Security tab)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: false
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()             # upload even if scan found issues
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'
