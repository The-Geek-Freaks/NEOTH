# =============================================================================
# NEOTH — Security Scanning
#
# Runs cargo-audit, cargo-deny, and trivy on a weekly schedule and on push to main.
# SARIF results are uploaded to GitHub Security tab (requires Advanced Security).
# Fails on HIGH or CRITICAL severity findings.
# =============================================================================

name: Security

on:
  schedule:
    - cron: '0 6 * * 1'        # every Monday 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write        # required to upload SARIF

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo-audit (RUSTSEC)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          # Cargo.lock lives at the workspace root (SRC/), not the
          # neothd member crate. Fixed 2026-05-26 — prior key
          # SRC/neothd/Cargo.lock didn't exist, so cache never hit
          # and cargo-audit found no lockfile to scan.
          key: security-audit-cargo-${{ hashFiles('SRC/Cargo.lock') }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        working-directory: SRC
        # RUSTSEC ignores live in SRC/.cargo/audit.toml (read automatically by
        # cargo-audit from the working directory) — the single source shared
        # with CI's audit step. deny.toml [advisories].ignore is the hand-synced
        # mirror carrying the full reason + plan-to-resolve per entry; keep the
        # two files in sync in the same commit.
        # SX-04: `set -eo pipefail` is the GHA bash default, so the
        # pipe propagates cargo-audit's non-zero exit on RUSTSEC
        # findings instead of silently swallowing CVEs.
        run: |
          cargo audit --json 2>/dev/null | tee /tmp/audit-result.json
          cargo audit

  deny:
    name: cargo-deny (license + supply chain)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: SRC/neothd/Cargo.toml
          command: check
          arguments: --all-features
          rust-version: '1.86'

  trivy:
    name: trivy (filesystem vuln scan)
    runs-on: ubuntu-24.04
    # 2026-05-26: Trivy's CVE/GHSA identifiers don't map 1:1 to
    # cargo-audit's RUSTSEC-* IDs in `.trivyignore`. Until the
    # ignore-list translation is done (track via PROGRESS), surface
    # findings as a table for human review but don't block the merge
    # gate — cargo-audit + cargo-deny above already enforce the
    # RUSTSEC ignore policy authoritatively for the Rust dep tree.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Trivy filesystem scan (table output for human review)
        # Pinned to ≥0.35.0 — earlier versions affected by the
        # 2025 supply-chain compromise (Dependabot alert #1).
        # Table format prints findings inline so operators can audit
        # the CVE list directly from the run log without downloading
        # SARIF.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: false
          trivyignores: '.trivyignore'

      - name: Run Trivy filesystem scan (SARIF for Security tab)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: false
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        if: always()             # upload even if scan found issues
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'
