name: OpenClaw schema inventory
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false, fetch-depth: 1 }
      - name: Run extractor source tests
        run: python3 -m unittest scripts/test_extract_openclaw_channel_schema.py
      - name: Fetch and extract exact static metadata
        id: extract
        shell: bash
        env: { OPENCLAW_COMMIT: 4c667aac8859114bd8f0a589ac6cd1de8bfe1474 }
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/openclaw" "$RUNNER_TEMP/w169"
          curl --fail --location --retry 2 --retry-all-errors "https://raw.githubusercontent.com/openclaw/openclaw/${OPENCLAW_COMMIT}/src/config/bundled-channel-config-metadata.generated.ts" --output "$RUNNER_TEMP/openclaw/bundled-channel-config-metadata.generated.ts"
          fetch_status=$?
          if [ "$fetch_status" -eq 0 ]; then
            python3 scripts/extract_openclaw_channel_schema.py --metadata "$RUNNER_TEMP/openclaw/bundled-channel-config-metadata.generated.ts" --channel-inventory SRC/neoth-openclaw-custody/src/fixtures/pinned_channel_inventory_v1.json --commit "$OPENCLAW_COMMIT" --inventory "$RUNNER_TEMP/w169/openclaw_channel_schema_v1.json" --evidence "$RUNNER_TEMP/w169/openclaw_channel_schema_evidence_v1.json"
            status=$?
          else
            status=$fetch_status
          fi
          printf '{"status":%s,"commit":"%s"}\n' "$status" "$OPENCLAW_COMMIT" > "$RUNNER_TEMP/w169/status.json"
          exit "$status"
      - name: Compare frozen package schema with pinned extraction
        run: cmp "$RUNNER_TEMP/w169/openclaw_channel_schema_v1.json" SRC/neoth-openclaw-custody/src/fixtures/openclaw_channel_schema_v1.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        if: always()
        with:
          name: openclaw-schema-inventory-4c667aac
          path: ${{ runner.temp }}/w169
          if-no-files-found: warn
          retention-days: 14

  custody:
    name: Pinned custody package regressions
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false, fetch-depth: 1 }
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
          components: clippy, rustfmt
      - name: Record exact package source
        run: |
          git rev-parse HEAD
          sha256sum SRC/neoth-openclaw-custody/src/fixtures/openclaw_channel_schema_v1.json
      - name: Run custody package regressions
        timeout-minutes: 8
        working-directory: SRC
        run: cargo test --locked -p neoth-openclaw-custody -- --test-threads=1
      - name: Check custody package lint
        timeout-minutes: 3
        working-directory: SRC
        run: cargo clippy --locked -p neoth-openclaw-custody --all-targets --no-deps -- -D warnings
      - name: Check custody package formatting
        id: format
        working-directory: SRC
        run: cargo fmt -p neoth-openclaw-custody -- --check
      - name: Generate package formatting patch
        if: failure() && steps.format.outcome == 'failure'
        working-directory: SRC
        run: |
          cargo fmt -p neoth-openclaw-custody
          git diff --binary -- neoth-openclaw-custody > ../custody-rustfmt.patch
      - name: Retain package formatting patch
        if: failure() && steps.format.outcome == 'failure'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: custody-rustfmt-${{ github.sha }}
          path: custody-rustfmt.patch
          if-no-files-found: error
          retention-days: 3
