name: W1601 isolated n8n migration feasibility gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w1601-n8n-isolated-migration-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_CONTEXT: ''

jobs:
  isolated-migration:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Initialize redacted receipt
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/w1601-n8n-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 -p "$root/receipt"
          printf '{"schema":2,"source_sha":"%s","scenario":"n8n_isolated_migration_feasibility","outcome":"failed","failure_stage":"workflow_not_completed","cleanup_proven":false}\n' "$GITHUB_SHA" > "$root/receipt/receipt.json"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
      - name: Install fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-tools python3-yaml sqlite3
      - name: Verify migration helper boundaries
        run: python3 -m unittest discover -s packaging/tests -p test_n8n_update_migration_canary.py
      - name: Restore CLI-reference Cargo checkpoint
        id: cli-reference-cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-cli-reference-rust-1.91-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cli-reference-rust-1.91-cargo-
      - name: Build current public CLI
        working-directory: SRC
        run: cargo build -p neoth --bin neoth --locked
      - name: Save completed CLI-reference Cargo checkpoint
        if: ${{ success() && steps.cli-reference-cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ steps.cli-reference-cargo-cache.outputs.cache-primary-key }}
      - name: Run isolated source-preservation migration gate
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          canary_root="$RUNNER_TEMP/w1601-n8n-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export NEOTH_HOME="$canary_root/neoth-home" NO_COLOR=1 RUST_BACKTRACE=0
          export XDG_CONFIG_HOME="$canary_root/xdg-config" XDG_DATA_HOME="$canary_root/xdg-data" XDG_RUNTIME_DIR="$canary_root/xdg-runtime"
          mkdir -m 700 -p "$NEOTH_HOME" "$canary_root/receipt" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          receipt="$canary_root/receipt/receipt.json"
          fallback() {
            if [ ! -s "$receipt" ]; then
              printf '{"schema":2,"source_sha":"%s","scenario":"n8n_isolated_migration_feasibility","outcome":"failed","failure_stage":"workflow_before_receipt","cleanup_proven":false}\n' "$GITHUB_SHA" > "$receipt"
            fi
          }
          trap fallback ERR
          timeout 1200s dbus-run-session -- bash -euo pipefail -c '
            keyring_env=$(printf "\n" | timeout 20s gnome-keyring-daemon --unlock --components=secrets 2>/dev/null)
            eval "$keyring_env"
            keyring_env=$(timeout 20s gnome-keyring-daemon --start --components=secrets 2>/dev/null)
            eval "$keyring_env"
            exec python3 packaging/n8n_update_migration_canary.py --binary SRC/target/debug/neoth --home "$NEOTH_HOME" --receipt "'"$receipt"'"
          '
      - name: Finalize redacted receipt fallback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/w1601-n8n-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 -p "$root/receipt"
          test -s "$root/receipt/receipt.json" || printf '{"schema":2,"source_sha":"%s","scenario":"n8n_isolated_migration_feasibility","outcome":"failed","failure_stage":"workflow_receipt_missing","cleanup_proven":false}\n' "$GITHUB_SHA" > "$root/receipt/receipt.json"
      - name: Upload redacted migration receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w1601-n8n-isolated-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w1601-n8n-${{ github.run_id }}-${{ github.run_attempt }}/receipt/receipt.json
          if-no-files-found: warn
          retention-days: 7
