name: Unreleased Windows x64 Preview

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: '1'
  RUSTFLAGS: '-C target-feature=+crt-static'
  CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  NEOTH_SOURCE_HEAD: ${{ github.sha }}

jobs:
  preview-windows-x64:
    name: Build unreleased Windows x64 CLI and GUI preview
    runs-on: windows-2022
    # The preview keeps the release feature/profile identity but deliberately
    # uses preview-fast-v1 Cargo overrides for bounded feedback only.
    # The bounded steps total 332 minutes after the GUI allowance below;
    # retain the existing 28-minute orchestration/cache/artifact margin.
    timeout-minutes: 360
    env:
      PORTABLE_ACCEPTANCE_RECEIPTS: neoth portable acceptance receipts ${{ github.run_id }} ${{ github.run_attempt }}
    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Parse portable acceptance helpers
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptRoot = Join-Path $env:RUNNER_TEMP $env:PORTABLE_ACCEPTANCE_RECEIPTS
          New-Item -ItemType Directory -Path $receiptRoot -Force | Out-Null
          $targets = @(
            'packaging/tests/Test-PortablePreview.ps1',
            'packaging/tests/Test-PortableDiffImpact.ps1'
          )
          $errors = @()
          try {
            foreach ($relative in $targets) {
              $path = Join-Path $env:GITHUB_WORKSPACE $relative
              $tokens = $null
              $parseErrors = $null
              $helperAst = [System.Management.Automation.Language.Parser]::ParseFile(
                $path, [ref]$tokens, [ref]$parseErrors)
              $errors += @($parseErrors | ForEach-Object {
                [ordered]@{ file = $relative; message = $_.Message; line = $_.Extent.StartLineNumber }
              })
              if (-not $parseErrors) {
                $collector = $helperAst.Find({ param($node)
                  $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Add-Result'
                }, $false)
                if ($null -eq $collector) { throw "missing receipt collector in $relative" }
                & {
                  param($definition)
                  . ([scriptblock]::Create($definition))
                  $entries = [System.Collections.Generic.List[object]]::new()
                  $process = [pscustomobject]@{ ExitCode = 0; StdoutSha256 = ('a' * 64); StderrSha256 = ('b' * 64) }
                  Add-Result -Results $entries -Name 'empty_collector_binding' -Process $process
                  if ($entries.Count -ne 1 -or $entries[0].check -cne 'empty_collector_binding' -or
                      $entries[0].exit_code -ne 0 -or $entries[0].stdout_sha256 -cne ('a' * 64) -or
                      $entries[0].stderr_sha256 -cne ('b' * 64)) {
                    throw 'receipt collector did not append the first exact result'
                  }
                } $collector.Extent.Text
                if ($relative.EndsWith('Test-PortableDiffImpact.ps1')) {
                  $hasher = $helperAst.Find({ param($node)
                    $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Get-TextSha256'
                  }, $false)
                  if ($null -eq $hasher) { throw "missing output hasher in $relative" }
                  & {
                    param($definition)
                    . ([scriptblock]::Create($definition))
                    $emptySha = Get-TextSha256 -Text ''
                    if ($emptySha -cne 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855') {
                      throw 'empty process output did not retain its exact SHA-256'
                    }
                  } $hasher.Extent.Text
                }
              }
            }
            $status = if ($errors.Count -eq 0) { 'passed' } else { 'failed' }
          } catch {
            $status = 'failed'
            $errors += [ordered]@{ file = ''; message = $_.Exception.Message; line = 0 }
          }
          [ordered]@{
            schema_version = 1
            kind = 'portable_acceptance_ast_preflight'
            status = $status
            source_sha = $env:GITHUB_SHA
            targets = $targets
            errors = $errors
            receipt_binding_check = 'empty Add-Result collector and exact empty-output SHA-256'
            remote_only = $true
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $receiptRoot 'ast-preflight.json') -Encoding utf8
          if ($status -ne 'passed') { throw 'portable acceptance helper parse errors' }

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.93.0'
          targets: x86_64-pc-windows-msvc

      - name: Restore versioned preview Cargo registry cache
        timeout-minutes: 5
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-registry-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-registry-${{ hashFiles('SRC/Cargo.lock') }}-

      # Cargo fingerprints source and compile environment before reuse. The
      # cache namespace pins toolchain, CRT mode, preview profile, and lock.
      # An interrupted cache is a compatible recovery input only; Cargo itself
      # must reject stale fingerprints and only successful GUI completion writes
      # all-rust-complete.
      - name: Restore compatible Rust target cache
        timeout-minutes: 5
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: SRC/target/
          key: preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-all-rust-complete-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-all-rust-complete-${{ hashFiles('SRC/Cargo.lock') }}-
            preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-interrupted-${{ hashFiles('SRC/Cargo.lock') }}-
            preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-aux-complete-${{ hashFiles('SRC/Cargo.lock') }}-
            preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-cli-complete-${{ hashFiles('SRC/Cargo.lock') }}-

      - name: Build native CLI and compatibility executables
        timeout-minutes: 90
        working-directory: SRC/neothd
        run: cargo build --release --locked --bins --features release-desktop --target x86_64-pc-windows-msvc

      - name: Save completed CLI Cargo cache
        if: ${{ success() }}
        timeout-minutes: 5
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            SRC/target/
          key: preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-cli-complete-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save completed preview Cargo registry cache
        if: ${{ success() }}
        timeout-minutes: 5
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-registry-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build native migration and relay executables
        timeout-minutes: 15
        working-directory: SRC
        run: cargo build --release --locked -p neoth-migrate -p neoth-relay --target x86_64-pc-windows-msvc

      - name: Save completed migration and relay Cargo cache
        if: ${{ success() }}
        timeout-minutes: 5
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            SRC/target/
          key: preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-aux-complete-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build native desktop GUI
        # Preview 35534407998 reached the former 60-minute boundary while
        # compiling with one worker and without compiler diagnostics.  Allow
        # one bounded 30-minute recovery window; cache/profile/provenance and
        # the separate acceptance limits remain unchanged.
        timeout-minutes: 90
        working-directory: SRC
        run: cargo build --release --locked -p neothd-gui --features release-desktop --target x86_64-pc-windows-msvc

      - name: Save completed GUI Cargo cache
        if: ${{ success() }}
        timeout-minutes: 5
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            SRC/target/
          key: preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-all-rust-complete-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Node.js for Keet companion
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'

      - name: Build version-locked Keet standalone
        timeout-minutes: 20
        working-directory: bridges/keet
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm install --frozen-lockfile
          pnpm run make:win32-x64
          test -s out/win32-x64/neoth-keet-bridge.exe

      - name: Stage unreleased preview with source and payload inventory
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $previewName = "neoth-unreleased-preview-windows-x64-$env:GITHUB_SHA"
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $dist = [System.IO.Path]::GetFullPath((Join-Path $workspace 'dist'))
          $stage = [System.IO.Path]::GetFullPath((Join-Path $dist $previewName))
          $zip = [System.IO.Path]::GetFullPath((Join-Path $dist "$previewName.zip"))
          $zipSidecar = "$zip.sha256"
          $distPrefix = $dist.TrimEnd([char[]]@('\', '/')) + [System.IO.Path]::DirectorySeparatorChar
          foreach ($candidate in @($stage, $zip, $zipSidecar)) {
            if (-not $candidate.StartsWith($distPrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to write outside the preview dist directory: $candidate"
            }
            if (Test-Path -LiteralPath $candidate) {
              throw "Refusing to overwrite preexisting preview output: $candidate"
            }
          }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $payload = @{
            'neoth.exe' = "SRC/target/$target/release/neoth.exe"
            'neothd.exe' = "SRC/target/$target/release/neothd.exe"
            'neothd-gui.exe' = "SRC/target/$target/release/neothd-gui.exe"
            'neoth-migrate.exe' = "SRC/target/$target/release/neoth-migrate.exe"
            'neoth-relay.exe' = "SRC/target/$target/release/neoth-relay.exe"
            'neoth-keet-bridge.exe' = 'bridges/keet/out/win32-x64/neoth-keet-bridge.exe'
            'freedom.yaml.example' = 'SRC/freedom.yaml.example'
            'import-manifest.example.yaml' = 'SRC/neoth-migrate/examples/import-manifest.example.yaml'
            'README.md' = 'README.md'
            'LICENSE-MIT' = 'LICENSE-MIT'
            'LICENSE-APACHE' = 'LICENSE-APACHE'
            'THIRD_PARTY_LICENSES' = 'THIRD_PARTY_LICENSES'
          }
          foreach ($entry in $payload.GetEnumerator()) {
            $source = Join-Path $env:GITHUB_WORKSPACE $entry.Value
            if (-not (Test-Path -LiteralPath $source -PathType Leaf) -or (Get-Item -LiteralPath $source).Length -eq 0) {
              throw "preview payload source missing or empty: $($entry.Value)"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $stage $entry.Key) -Force
          }
          $provenance = [ordered]@{
            schema_version = 1
            artifact_kind = 'unreleased_windows_x64_preview'
            source_sha = $env:GITHUB_SHA
            workflow = 'preview-windows.yml'
            target = $target
            toolchain = '1.93.0'
            build_profile = 'release'
            optimization_profile = 'preview-fast-v1'
            cargo_profile_release_opt_level = '1'
            cargo_profile_release_debug = '0'
            cargo_profile_release_lto = 'false'
            cargo_profile_release_codegen_units = '16'
            crt_mode = 'static-msvc-v1'
            signing = 'none'
            github_release = 'not_created'
            installer = 'not_created'
            installed_acceptance = 'not_run'
            self_knowledge_snapshot = 'not_included; release-bound generation requires Graphify credentials'
          }
          $provenance | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $stage 'PREVIEW-PROVENANCE.json') -Encoding utf8
          @(
            '# Unreleased Windows Preview',
            '',
            "Source commit: $env:GITHUB_SHA",
            'This artifact is an unsigned, unreleased portable preview.',
            'Build profile: release; preview-fast-v1 overrides opt-level=1, debug=0, lto=false, codegen-units=16.',
            'It is neither a GitHub Release asset nor installed-product evidence.',
            'It intentionally excludes release-bound self-knowledge and does not include an installer.'
          ) | Set-Content -LiteralPath (Join-Path $stage 'UNRELEASED-PREVIEW.md') -Encoding utf8
          $inventory = Get-ChildItem -LiteralPath $stage -File -Recurse | Sort-Object FullName | ForEach-Object {
            [ordered]@{
              path = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
              bytes = $_.Length
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            schema_version = 1
            source_sha = $env:GITHUB_SHA
            files = @($inventory)
            excludes = @('SHA256SUMS.json')
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.json') -Encoding utf8
          Compress-Archive -LiteralPath $stage -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

      - name: Portable preview lifecycle acceptance
        id: portable_preview_lifecycle
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 30
        shell: pwsh
        env:
          SLINT_BACKEND: software
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptRoot = Join-Path $env:RUNNER_TEMP $env:PORTABLE_ACCEPTANCE_RECEIPTS
          New-Item -ItemType Directory -Path $receiptRoot -Force | Out-Null
          $workRoot = Join-Path $env:RUNNER_TEMP "neoth portable preview lifecycle $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT"
          $zip = Join-Path $env:GITHUB_WORKSPACE "dist/neoth-unreleased-preview-windows-x64-$env:GITHUB_SHA.zip"
          $sidecar = "$zip.sha256"
          $helper = Join-Path $env:GITHUB_WORKSPACE 'packaging/tests/Test-PortablePreview.ps1'
          $transcript = Join-Path $receiptRoot 'portable-preview-lifecycle.output.txt'
          $status = 'failed'
          $failure = $null
          try {
            & $helper -Archive $zip -ArchiveSha256 $sidecar -ExpectedSourceSha $env:GITHUB_SHA -WorkRoot $workRoot -GuiRuntimeProbe *>&1 |
              Tee-Object -LiteralPath $transcript
            $status = 'passed'
          } catch {
            $failure = $_.Exception.Message
            $_ | Out-String | Add-Content -LiteralPath $transcript -Encoding utf8
          }
          [ordered]@{
            schema_version = 1
            kind = 'portable_preview_lifecycle_ci'
            status = $status
            source_sha = $env:GITHUB_SHA
            archive = $zip
            archive_sha256_sidecar = $sidecar
            work_root = $workRoot
            helper = $helper
            gui_runtime_probe = 'SLINT_BACKEND=software on GitHub Windows only'
            acceptance_scope = 'unsigned uninstalled portable preview only'
            transcript = $transcript
            failure = $failure
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $receiptRoot 'portable-preview-lifecycle.json') -Encoding utf8
          if ($status -ne 'passed') { throw "portable preview lifecycle acceptance failed: $failure" }
          $neoth = Join-Path $workRoot "neoth-unreleased-preview-windows-x64-$env:GITHUB_SHA/neoth.exe"
          if (-not (Test-Path -LiteralPath $neoth -PathType Leaf)) { throw "lifecycle receipt passed without its verified extracted neoth.exe: $neoth" }
          "neoth_executable=$neoth" >> $env:GITHUB_OUTPUT

      - name: Portable diff-impact acceptance
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptRoot = Join-Path $env:RUNNER_TEMP $env:PORTABLE_ACCEPTANCE_RECEIPTS
          New-Item -ItemType Directory -Path $receiptRoot -Force | Out-Null
          $workRoot = Join-Path $env:RUNNER_TEMP "neoth portable diff impact $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT"
          $neoth = '${{ steps.portable_preview_lifecycle.outputs.neoth_executable }}'
          $helper = Join-Path $env:GITHUB_WORKSPACE 'packaging/tests/Test-PortableDiffImpact.ps1'
          $transcript = Join-Path $receiptRoot 'portable-diff-impact.output.txt'
          $status = 'failed'
          $failure = $null
          try {
            if ([string]::IsNullOrWhiteSpace($neoth) -or -not (Test-Path -LiteralPath $neoth -PathType Leaf)) {
              throw "verified lifecycle neoth.exe handoff is absent: $neoth"
            }
            & $helper -Executable $neoth -ExpectedSourceSha $env:GITHUB_SHA -WorkRoot $workRoot *>&1 |
              Tee-Object -LiteralPath $transcript
            $status = 'passed'
          } catch {
            $failure = $_.Exception.Message
            $_ | Out-String | Add-Content -LiteralPath $transcript -Encoding utf8
          }
          [ordered]@{
            schema_version = 1
            kind = 'portable_diff_impact_ci'
            status = $status
            source_sha = $env:GITHUB_SHA
            executable = $neoth
            work_root = $workRoot
            helper = $helper
            lifecycle_receipt = (Join-Path $receiptRoot 'portable-preview-lifecycle.json')
            acceptance_scope = 'unsigned uninstalled portable preview only'
            transcript = $transcript
            failure = $failure
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $receiptRoot 'portable-diff-impact.json') -Encoding utf8
          if ($status -ne 'passed') { throw "portable diff-impact acceptance failed: $failure" }

      - name: Upload unreleased preview artifact
        timeout-minutes: 10
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neoth-unreleased-preview-windows-x64-${{ github.sha }}
          path: |
            dist/neoth-unreleased-preview-windows-x64-${{ github.sha }}.zip
            dist/neoth-unreleased-preview-windows-x64-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload portable acceptance receipts
        if: ${{ always() && runner.os == 'Windows' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neoth-portable-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.PORTABLE_ACCEPTANCE_RECEIPTS }}
          if-no-files-found: warn
          retention-days: 7

      - name: Save interrupted preview Cargo cache
        if: ${{ always() && (failure() || cancelled()) }}
        timeout-minutes: 5
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            SRC/target/
          key: preview-windows-x64-rust-1.93-static-crt-preview-fast-v1-interrupted-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
