name: Connection-bound channel regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gchat-live-regressions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Require main branch dispatch
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          echo "W548_ROOT=${RUNNER_TEMP}/w548-gchat-live-regressions" >> "$GITHUB_ENV"

      - name: Set up Rust 1.91.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Restore Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-w548-gchat-cargo-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-w548-gchat-cargo-${{ hashFiles('SRC/Cargo.lock') }}-
            ${{ runner.os }}-gold-smoke-cargo-partial-${{ hashFiles('SRC/Cargo.lock') }}-
            ${{ runner.os }}-gold-smoke-cargo-

      - name: Record source provenance
        run: |
          set -euo pipefail
          mkdir -p "$W548_ROOT"/{source,log,receipt}
          git -C SRC rev-parse HEAD > "$W548_ROOT/source/head.txt"
          sha256sum \
            SRC/neothd/src/main.rs \
            SRC/neothd/src/lib.rs \
            SRC/neothd/src/shutdown.rs \
            SRC/neothd/src/cli/serve.rs \
            SRC/neothd/src/cli/serve_tests.rs \
            SRC/neothd/src/daemon/chat_runtime.rs \
            SRC/neothd/src/daemon/gui_chat_runtime.rs \
            SRC/neothd/src/daemon/webchat.rs \
            SRC/neothd/src/cluster/runtime_supervisor.rs \
            SRC/neothd/src/channels/webhook_listener.rs \
            SRC/neothd/src/cli/channel.rs \
            SRC/neothd/src/cli/connect.rs \
            SRC/neothd/src/cli/channel/converted_relink.rs \
            SRC/neothd/src/cli/channel/converted_relink/tests.rs \
            packaging/converted_channel_relink_product_canary.py \
            packaging/tests/test_converted_channel_relink_product_canary.py \
            packaging/gchat_converted_relink_product_canary.py \
            packaging/tests/test_gchat_converted_relink_product_canary.py \
            packaging/gchat_daemon_adoption_canary.py \
            packaging/tests/test_gchat_daemon_adoption_canary.py \
            packaging/bluebubbles_daemon_adoption_canary.py \
            packaging/tests/test_bluebubbles_daemon_adoption_canary.py \
            SRC/neoth-openclaw-custody/src/pinned_inventory.rs \
            SRC/neoth-openclaw-custody/src/pinned_schema.rs \
            SRC/neoth-openclaw-custody/src/fixtures/pinned_channel_inventory_v1.json \
            SRC/neoth-openclaw-custody/src/fixtures/openclaw_upstream_evidence_v1.json \
            SRC/neoth-openclaw-custody/src/fixtures/openclaw_channel_schema_v1.json \
            SRC/neoth-openclaw-custody/src/fixtures/openclaw_channel_schema_migration_policy_v1.json \
            SRC/neothd/src/cli/channel_relink.rs \
            SRC/neothd/src/channels/relink.rs \
            SRC/neothd/src/channels/registry.rs \
            SRC/neothd/src/channels/probe.rs \
            SRC/neothd/src/cli/doctor/checks/onboarding.rs \
            SRC/neothd/src/cli/onboarding_readiness.rs \
            SRC/neothd/src/cli/onboarding_status.rs \
            SRC/neothd/src/cli/doctor.rs \
            SRC/neothd/src/cli/privacy.rs \
            SRC/neothd/src/cli/doctor/checks/integrations.rs \
            SRC/neothd/src/daemon/post_init_cron.rs \
            SRC/neothd/src/channels/slack.rs \
            SRC/neothd/src/channels/whatsapp_webhook.rs \
            SRC/neothd/src/channels/discord.rs \
            SRC/neothd/src/channels/signal_api.rs \
            SRC/neothd/src/channels/line_api.rs \
            SRC/neothd/src/config/credentials.rs \
            SRC/neothd/src/cli/channel/openclaw_migration.rs \
            SRC/neothd/src/cli/channel/openclaw_migration/tests.rs \
            SRC/neothd/src/cli/channel/openclaw_migration/participants.rs \
            SRC/neothd/src/cli/channel/openclaw_migration/telegram_tests.rs \
            SRC/neothd/src/cli/channel/openclaw_migration/batch_tests.rs \
            SRC/neothd/src/config/credentials/file_migration_batch.rs \
            SRC/neothd/src/config/credentials/file_migration_batch/tests.rs \
            SRC/neothd/src/config/credentials/telegram_migration.rs \
            SRC/neothd/src/config/credentials/telegram_migration/tests.rs \
            SRC/neothd/src/config/credentials/slack_migration.rs \
            SRC/neothd/src/config/credentials/slack_migration/tests.rs \
            SRC/neothd/src/cli/mod.rs \
            SRC/neothd/src/cli/parity_drift.rs \
            SRC/neothd/src/channels/imessage_bluebubbles.rs \
            SRC/neothd/src/channels/gchat.rs \
            SRC/neothd/src/channels/readiness.rs \
            SRC/neothd/src/channels/routing.rs \
            SRC/neothd/src/cli/serve_tasks.rs \
            SRC/neothd/src/cli/consent.rs \
            SRC/neothd/src/cli/consent_outbox.rs \
            SRC/neothd/src/wal/writer.rs \
            SRC/neothd/src/daemon/omi_ingest_task.rs \
            SRC/neothd/src/memory/omi.rs \
            SRC/neothd/src/consent.rs \
            SRC/neothd/src/config/mod.rs \
            SRC/neothd/src/cli/cluster.rs \
            SRC/neothd/src/cluster/status_wire.rs \
            SRC/neothd/src/cluster/membership.rs \
            SRC/neothd/src/daemon/pidfile.rs \
            SRC/neothd/src/util/locked_file.rs \
            SRC/neothd/src/daemon/audit_rpc/mod.rs \
            SRC/neothd/src/daemon/audit_rpc/client.rs \
            SRC/neothd/src/daemon/audit_rpc/server.rs \
            SRC/neothd/src/daemon/audit_rpc/sidecar.rs \
            SRC/neothd/src/daemon/audit_rpc/token.rs \
            SRC/neothd/src/daemon/audit_rpc/transport/mod.rs \
            SRC/neothd/src/daemon/audit_rpc/transport/unix.rs \
            SRC/neothd/src/skills/store.rs \
            SRC/neothd/src/daemon/channel_live_registry.rs \
            SRC/neothd/src/daemon/proactive_dispatcher.rs \
            SRC/neothd/src/daemon/proactive_egress.rs \
            SRC/neothd/tests/proactive_egress_contract_source_gate.rs \
            SRC/neothd/Cargo.toml \
            SRC/Cargo.lock \
            .github/workflows/gchat-live-regressions.yml \
            > "$W548_ROOT/source/SHA256SUMS.txt"
          : > "$W548_ROOT/receipt/started.txt"
          : > "$W548_ROOT/receipt/passed.txt"
          : > "$W548_ROOT/receipt/failed.txt"
          : > "$W548_ROOT/receipt/executed.txt"

      - name: Verify compiled-CLI relink canary contracts
        run: |
          python3 packaging/tests/test_converted_channel_relink_product_canary.py
          python3 packaging/tests/test_gchat_converted_relink_product_canary.py
          python3 packaging/tests/test_gchat_daemon_adoption_canary.py
          python3 packaging/tests/test_bluebubbles_daemon_adoption_canary.py

      - name: Run focused channel and exact-target regressions
        working-directory: SRC
        run: |
          set -euo pipefail

          run_case() {
            local ordinal="$1"
            local kind="$2"
            local case_id="$3"
            local test_name="$4"
            shift 4
            local slug
            slug="$(printf '%s' "$case_id" | tr ':' '-' | tr -c '[:alnum:]' '-')"
            local discovery_log="$W548_ROOT/log/${ordinal}-discovery-${kind}-${slug}.log"
            local actual_log="$W548_ROOT/log/${ordinal}-actual-${kind}-${slug}.log"

            printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/started.txt"
            if ! timeout --kill-after=10s 1800s cargo test -p neoth --locked --features gchat-channel,irc-channel,nostr-channel "$@" "$test_name" -- --exact --list >"$discovery_log" 2>&1; then
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/failed.txt"
              cat "$discovery_log"
              exit 1
            fi
            if [ "$(grep -Fxc "$test_name: test" "$discovery_log")" -ne 1 ]; then
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/failed.txt"
              cat "$discovery_log"
              exit 1
            fi

            printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/executed.txt"
            if timeout --kill-after=10s 180s cargo test -p neoth --locked --features gchat-channel,irc-channel,nostr-channel "$@" "$test_name" -- --exact --test-threads=1 >"$actual_log" 2>&1 \
              && [ "$(grep -Fxc "test $test_name ... ok" "$actual_log")" -eq 1 ] \
              && [ "$(grep -Fc 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$actual_log")" -eq 1 ]; then
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/passed.txt"
            else
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/failed.txt"
              cat "$actual_log"
            fi
          }

          run_case 146 lib cli::channel::tests::channel_add_preflight_keeps_non_nostr_channels_eligible cli::channel::tests::channel_add_preflight_keeps_non_nostr_channels_eligible --lib
          run_case 147 lib cli::channel::tests::nostr_add_preflight_allows_a_compiled_runtime cli::channel::tests::nostr_add_preflight_allows_a_compiled_runtime --lib
          run_case 145 lib cli::channel::converted_relink::tests::failed_gchat_probe_keeps_generic_error_outside_canary cli::channel::converted_relink::tests::failed_gchat_probe_keeps_generic_error_outside_canary --lib
          run_case 140 lib cli::privacy::tests::audit_lists_no_channels_when_credentials_empty cli::privacy::tests::audit_lists_no_channels_when_credentials_empty --lib
          run_case 141 lib cli::privacy::tests::audit_warns_and_lists_configured_channels cli::privacy::tests::audit_warns_and_lists_configured_channels --lib
          run_case 142 lib cli::privacy::tests::audit_gchat_only_is_warn_and_never_claims_cli_only cli::privacy::tests::audit_gchat_only_is_warn_and_never_claims_cli_only --lib
          run_case 143 lib cli::privacy::tests::audit_partial_gchat_configuration_remains_privacy_relevant cli::privacy::tests::audit_partial_gchat_configuration_remains_privacy_relevant --lib
          run_case 144 lib cli::privacy::tests::audit_descriptor_channels_preserve_order_and_redact_configuration_values cli::privacy::tests::audit_descriptor_channels_preserve_order_and_redact_configuration_values --lib
          run_case 129 lib cli::doctor::tests::channels_wiring_gchat_only_is_visible_without_a_cli_only_claim cli::doctor::tests::channels_wiring_gchat_only_is_visible_without_a_cli_only_claim --lib
          run_case 130 lib cli::doctor::tests::channels_wiring_discord_only_uses_descriptor_fallback cli::doctor::tests::channels_wiring_discord_only_uses_descriptor_fallback --lib
          run_case 131 lib cli::doctor::tests::channels_wiring_partial_descriptor_config_needs_repair cli::doctor::tests::channels_wiring_partial_descriptor_config_needs_repair --lib
          run_case 132 lib cli::doctor::tests::channels_wiring_keeps_specialised_rows_without_descriptor_duplicates cli::doctor::tests::channels_wiring_keeps_specialised_rows_without_descriptor_duplicates --lib
          run_case 133 lib cli::doctor::tests::r2_p0_2_channels_wiring_pass_when_no_credentials cli::doctor::tests::r2_p0_2_channels_wiring_pass_when_no_credentials --lib
          run_case 134 lib cli::doctor::tests::r2_p0_2_channels_wiring_live_when_only_telegram_configured cli::doctor::tests::r2_p0_2_channels_wiring_live_when_only_telegram_configured --lib
          run_case 135 lib cli::doctor::tests::r2_p0_2_channels_wiring_warn_when_slack_partial cli::doctor::tests::r2_p0_2_channels_wiring_warn_when_slack_partial --lib
