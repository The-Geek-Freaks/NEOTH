      - name: Verify isolated Google Chat canary guards
        id: gchat-guards
        if: ${{ !cancelled() && steps.public-cli-build.outcome == 'success' }}
        timeout-minutes: 20
        working-directory: SRC
        run: |
          set -euo pipefail
          mkdir -p "$W548_ROOT/gchat-guards"
          cargo test -p neoth --locked --lib --features gchat-product-canary,irc-channel,nostr-channel \
            channels::gchat::tests:: -- --list > "$W548_ROOT/gchat-guards/discovery.log" 2>&1
          for name in canary_origin_is_strict_loopback_http_with_explicit_port canary_constructor_requires_exact_synthetic_key_and_origin_token_uri canary_pull_uses_loopback_while_ack_and_send_remain_refused pull_endpoint_uses_exact_loopback_path_and_preserves_production_host canary_rejects_nonempty_pull_response_before_run_can_ack_or_send new_pins_the_google_token_uri_against_key_file_endpoint_poisoning; do
            grep -Fx "channels::gchat::tests::$name: test" "$W548_ROOT/gchat-guards/discovery.log"
          done
          cargo test -p neoth --locked --lib --features gchat-product-canary,irc-channel,nostr-channel \
            channels::gchat::tests:: -- --test-threads=1 2>&1 | tee "$W548_ROOT/gchat-guards/tests.log"

          for name in gchat_canary_diagnostic_codes_are_fixed_and_complete failed_gchat_probe_emits_only_fixed_canary_code failed_gchat_candidate_preparation_emits_only_fixed_canary_code_after_reservation gchat_canary_preparation_codes_are_fixed_and_discard_the_error_chain gchat_canary_pre_reservation_failures_are_fixed_and_do_not_create_pending gchat_canary_real_candidate_constructor_failure_survives_redaction_as_fixed_code gchat_canary_begin_pending_conflict_is_fixed_without_rewriting_index_or_pair; do
            identity="cli::channel::converted_relink::tests::$name"
            discovery="$W548_ROOT/gchat-guards/${name}-discovery.log"
            actual="$W548_ROOT/gchat-guards/${name}-actual.log"
            cargo test -p neoth --locked --lib --features gchat-product-canary,irc-channel,nostr-channel \
              "$identity" -- --exact --list > "$discovery" 2>&1
            test "$(grep -Fxc "$identity: test" "$discovery")" -eq 1
            cargo test -p neoth --locked --lib --features gchat-product-canary,irc-channel,nostr-channel \
              "$identity" -- --exact --test-threads=1 2>&1 | tee "$actual"
            test "$(grep -Fxc "test $identity ... ok" "$actual")" -eq 1
            grep -Fq 'test result: ok. 1 passed; 0 failed;' "$actual"
          done

