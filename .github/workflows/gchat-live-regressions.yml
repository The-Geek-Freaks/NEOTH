name: Connection-bound channel regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gchat-live-regressions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Require main branch dispatch
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          echo "W548_ROOT=${RUNNER_TEMP}/w548-gchat-live-regressions" >> "$GITHUB_ENV"

      - name: Set up Rust 1.91.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Restore Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-w548-gchat-cargo-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-w548-gchat-cargo-${{ hashFiles('SRC/Cargo.lock') }}-
            ${{ runner.os }}-gold-smoke-cargo-partial-${{ hashFiles('SRC/Cargo.lock') }}-
            ${{ runner.os }}-gold-smoke-cargo-

      - name: Record source provenance
        run: |
          set -euo pipefail
          mkdir -p "$W548_ROOT"/{source,log,receipt}
          git -C SRC rev-parse HEAD > "$W548_ROOT/source/head.txt"
          sha256sum \
            SRC/neothd/src/installers/yt_dlp.rs \
            SRC/neothd/src/integrations/n8n/managed_update_target.rs \
            SRC/neothd/tests/no_outbound_network.rs \
            SRC/neothd/tests/mcp_catalogue_hotpath_source_gate.rs \
            SRC/neothd/src/main.rs \
            SRC/neothd/src/lib.rs \
            SRC/neothd/src/shutdown.rs \
            SRC/neothd/src/cli/serve.rs \
            SRC/neothd/src/cli/serve_tests.rs \
            SRC/neothd/src/daemon/chat_runtime.rs \
            SRC/neothd/src/daemon/gui_chat_runtime.rs \
            SRC/neothd/src/daemon/webchat.rs \
            SRC/neothd/src/cluster/runtime_supervisor.rs \
            SRC/neothd/src/channels/webhook_listener.rs \
            SRC/neothd/src/cli/channel.rs \
            SRC/neothd/src/cli/connect.rs \
            SRC/neothd/src/cli/channel/converted_relink.rs \
            SRC/neothd/src/cli/channel/converted_relink/tests.rs \
            packaging/converted_channel_relink_product_canary.py \
            packaging/tests/test_converted_channel_relink_product_canary.py \
            packaging/gchat_converted_relink_product_canary.py \
            packaging/tests/test_gchat_converted_relink_product_canary.py \
            packaging/gchat_daemon_adoption_canary.py \
            packaging/tests/test_gchat_daemon_adoption_canary.py \
            packaging/bluebubbles_daemon_adoption_canary.py \
            packaging/tests/test_bluebubbles_daemon_adoption_canary.py \
