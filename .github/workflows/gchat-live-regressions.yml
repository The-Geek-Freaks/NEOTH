name: Connection-bound channel regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gchat-live-regressions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Require main branch dispatch
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          echo "W548_ROOT=${RUNNER_TEMP}/w548-gchat-live-regressions" >> "$GITHUB_ENV"

      - name: Set up Rust 1.91.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Restore Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-w548-gchat-cargo-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-w548-gchat-cargo-${{ hashFiles('SRC/Cargo.lock') }}-
            ${{ runner.os }}-gold-smoke-cargo-partial-${{ hashFiles('SRC/Cargo.lock') }}-
            ${{ runner.os }}-gold-smoke-cargo-

      - name: Record source provenance
        run: |
          set -euo pipefail
          mkdir -p "$W548_ROOT"/{source,log,receipt}
          git -C SRC rev-parse HEAD > "$W548_ROOT/source/head.txt"
          sha256sum \
            SRC/neothd/src/cli/channel.rs \
            SRC/neothd/src/cli/channel/converted_relink.rs \
            SRC/neothd/src/cli/channel/converted_relink/tests.rs \
            packaging/converted_channel_relink_product_canary.py \
            packaging/tests/test_converted_channel_relink_product_canary.py \
            SRC/neoth-openclaw-custody/src/pinned_inventory.rs \
            SRC/neoth-openclaw-custody/src/pinned_schema.rs \
            SRC/neoth-openclaw-custody/src/fixtures/pinned_channel_inventory_v1.json \
            SRC/neoth-openclaw-custody/src/fixtures/openclaw_upstream_evidence_v1.json \
            SRC/neoth-openclaw-custody/src/fixtures/openclaw_channel_schema_v1.json \
            SRC/neothd/src/cli/channel_relink.rs \
            SRC/neothd/src/channels/relink.rs \
            SRC/neothd/src/config/credentials.rs \
            SRC/neothd/src/cli/channel/openclaw_migration.rs \
            SRC/neothd/src/cli/channel/openclaw_migration/tests.rs \
            SRC/neothd/src/config/credentials/slack_migration.rs \
            SRC/neothd/src/config/credentials/slack_migration/tests.rs \
            SRC/neothd/src/cli/mod.rs \
            SRC/neothd/src/channels/imessage_bluebubbles.rs \
            SRC/neothd/src/channels/gchat.rs \
            SRC/neothd/src/channels/readiness.rs \
            SRC/neothd/src/channels/routing.rs \
            SRC/neothd/src/cli/serve_tasks.rs \
            SRC/neothd/src/daemon/channel_live_registry.rs \
            SRC/neothd/src/daemon/proactive_dispatcher.rs \
            SRC/neothd/src/daemon/proactive_egress.rs \
            SRC/neothd/tests/proactive_egress_contract_source_gate.rs \
            SRC/neothd/Cargo.toml \
            SRC/Cargo.lock \
            .github/workflows/gchat-live-regressions.yml \
            > "$W548_ROOT/source/SHA256SUMS.txt"
          : > "$W548_ROOT/receipt/started.txt"
          : > "$W548_ROOT/receipt/passed.txt"
          : > "$W548_ROOT/receipt/failed.txt"
          : > "$W548_ROOT/receipt/executed.txt"

      - name: Verify compiled-CLI relink canary contracts
        run: python3 packaging/tests/test_converted_channel_relink_product_canary.py

      - name: Run focused channel and exact-target regressions
        working-directory: SRC
        run: |
          set -euo pipefail

          run_case() {
            local ordinal="$1"
            local kind="$2"
            local case_id="$3"
            local test_name="$4"
            shift 4
            local slug
            slug="$(printf '%s' "$case_id" | tr ':' '-' | tr -c '[:alnum:]' '-')"
            local discovery_log="$W548_ROOT/log/${ordinal}-discovery-${kind}-${slug}.log"
            local actual_log="$W548_ROOT/log/${ordinal}-actual-${kind}-${slug}.log"

            printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/started.txt"
            if ! timeout --kill-after=10s 1800s cargo test -p neoth --locked --features gchat-channel,irc-channel,nostr-channel "$@" "$test_name" -- --exact --list >"$discovery_log" 2>&1; then
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/failed.txt"
              cat "$discovery_log"
              exit 1
            fi
            if [ "$(grep -Fxc "$test_name: test" "$discovery_log")" -ne 1 ]; then
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/failed.txt"
              cat "$discovery_log"
              exit 1
            fi

            printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/executed.txt"
            if timeout --kill-after=10s 180s cargo test -p neoth --locked --features gchat-channel,irc-channel,nostr-channel "$@" "$test_name" -- --exact --test-threads=1 >"$actual_log" 2>&1 \
              && [ "$(grep -Fxc "test $test_name ... ok" "$actual_log")" -eq 1 ] \
              && [ "$(grep -Fc 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$actual_log")" -eq 1 ]; then
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/passed.txt"
            else
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/failed.txt"
              cat "$actual_log"
            fi
          }

          run_case 38 lib config::credentials::slack_migration::tests::snapshot_capture_preserves_missing_parent_as_absent_without_creating_it config::credentials::slack_migration::tests::snapshot_capture_preserves_missing_parent_as_absent_without_creating_it --lib
          run_case 39 lib config::credentials::slack_migration::tests::custody_commits_the_immutable_team_bound_pair_and_reverses_it_exactly config::credentials::slack_migration::tests::custody_commits_the_immutable_team_bound_pair_and_reverses_it_exactly --lib
          run_case 40 lib config::credentials::slack_migration::tests::custody_refuses_tampering_and_never_overwrites_a_mixed_pair config::credentials::slack_migration::tests::custody_refuses_tampering_and_never_overwrites_a_mixed_pair --lib
          run_case 41 lib config::credentials::slack_migration::tests::every_forward_and_reverse_pair_journal_boundary_recovers_to_one_exact_image config::credentials::slack_migration::tests::every_forward_and_reverse_pair_journal_boundary_recovers_to_one_exact_image --lib
          run_case 42 lib config::credentials::slack_migration::tests::optional_custody_is_absent_only_for_the_exact_missing_capability config::credentials::slack_migration::tests::optional_custody_is_absent_only_for_the_exact_missing_capability --lib
          run_case 43 lib config::credentials::slack_migration::tests::custody_create_new_refuses_a_second_capability_without_replacing_it config::credentials::slack_migration::tests::custody_create_new_refuses_a_second_capability_without_replacing_it --lib
          run_case 44 lib config::credentials::slack_migration::tests::bounded_pair_capture_refuses_an_oversized_credentials_leaf_before_loading_it config::credentials::slack_migration::tests::bounded_pair_capture_refuses_an_oversized_credentials_leaf_before_loading_it --lib
          run_case 45 lib config::credentials::slack_migration::tests::custody_handle_rejects_a_foreign_home_even_if_the_pair_shape_matches config::credentials::slack_migration::tests::custody_handle_rejects_a_foreign_home_even_if_the_pair_shape_matches --lib
          run_case 46 lib config::credentials::slack_migration::tests::encrypted_credentials_postimage_is_immutable_across_resume_and_exact_rollback config::credentials::slack_migration::tests::encrypted_credentials_postimage_is_immutable_across_resume_and_exact_rollback --lib
          run_case 47 lib cli::channel::openclaw_migration::tests::slack_migration_happy_path_keeps_one_postimage_and_restores_exact_before cli::channel::openclaw_migration::tests::slack_migration_happy_path_keeps_one_postimage_and_restores_exact_before --lib
          run_case 48 lib cli::channel::openclaw_migration::tests::every_forward_checkpoint_reopens_to_committed_without_reprobing_after_publication cli::channel::openclaw_migration::tests::every_forward_checkpoint_reopens_to_committed_without_reprobing_after_publication --lib
          run_case 49 lib cli::channel::openclaw_migration::tests::every_reverse_checkpoint_reopens_to_the_exact_before_pair cli::channel::openclaw_migration::tests::every_reverse_checkpoint_reopens_to_the_exact_before_pair --lib
          run_case 50 lib cli::channel::openclaw_migration::tests::source_include_request_and_target_drift_hold_without_publication cli::channel::openclaw_migration::tests::source_include_request_and_target_drift_hold_without_publication --lib
          run_case 51 lib cli::channel::openclaw_migration::tests::malformed_custody_and_terminal_receipt_never_become_success cli::channel::openclaw_migration::tests::malformed_custody_and_terminal_receipt_never_become_success --lib
          run_case 52 lib cli::channel::openclaw_migration::tests::missing_state_after_custody_or_rollback_direction_refuses_both_directions cli::channel::openclaw_migration::tests::missing_state_after_custody_or_rollback_direction_refuses_both_directions --lib
          run_case 53 lib cli::channel::openclaw_migration::tests::planning_refuses_keychain_and_public_status_is_redacted_and_lock_bound cli::channel::openclaw_migration::tests::planning_refuses_keychain_and_public_status_is_redacted_and_lock_bound --lib
          run_case 54 lib cli::default_invocation_tests::openclaw_slack_migration_requires_bound_inputs_and_explicit_confirmation cli::default_invocation_tests::openclaw_slack_migration_requires_bound_inputs_and_explicit_confirmation --lib
          run_case 55 lib config::credentials::slack_migration::tests::nofollow_pair_capture_rejects_a_symlinked_credentials_leaf config::credentials::slack_migration::tests::nofollow_pair_capture_rejects_a_symlinked_credentials_leaf --lib
          run_case 56 lib cli::channel::openclaw_migration::tests::provider_failures_missing_workspace_and_timeout_publish_nothing cli::channel::openclaw_migration::tests::provider_failures_missing_workspace_and_timeout_publish_nothing --lib

          run_case 01 lib daemon::proactive_dispatcher::tests::gchat_connection_bound_delivery_uses_the_published_instance_for_both_aliases daemon::proactive_dispatcher::tests::gchat_connection_bound_delivery_uses_the_published_instance_for_both_aliases --lib
          run_case 02 lib daemon::proactive_dispatcher::tests::gchat_missing_or_revoked_live_instance_is_sidecar_only_without_send daemon::proactive_dispatcher::tests::gchat_missing_or_revoked_live_instance_is_sidecar_only_without_send --lib
          run_case 03 lib daemon::proactive_dispatcher::tests::plan_delivery_gchat_feature_on_requires_complete_canonical_config daemon::proactive_dispatcher::tests::plan_delivery_gchat_feature_on_requires_complete_canonical_config --lib
          run_case 04 integration proactive_egress_contract_source_gate::google_chat_proactivity_uses_only_the_published_live_instance google_chat_proactivity_uses_only_the_published_live_instance --test proactive_egress_contract_source_gate

          run_case 05 lib daemon::proactive_dispatcher::tests::gchat_account_bound_recovery_uses_exact_published_handle_once daemon::proactive_dispatcher::tests::gchat_account_bound_recovery_uses_exact_published_handle_once --lib
          run_case 06 lib daemon::proactive_dispatcher::tests::gchat_account_bound_recovery_rejects_foreign_stale_and_revoked_handles daemon::proactive_dispatcher::tests::gchat_account_bound_recovery_rejects_foreign_stale_and_revoked_handles --lib
          run_case 07 lib daemon::proactive_dispatcher::tests::gchat_account_bound_recovery_policy_denial_never_sends daemon::proactive_dispatcher::tests::gchat_account_bound_recovery_policy_denial_never_sends --lib

          run_case 08 lib daemon::proactive_dispatcher::tests::default_connection_bound_account_recovery_delivers_once_and_never_replays daemon::proactive_dispatcher::tests::default_connection_bound_account_recovery_delivers_once_and_never_replays --lib
          run_case 09 lib daemon::proactive_dispatcher::tests::default_connection_bound_account_recovery_refuses_nonmatching_or_denied_state daemon::proactive_dispatcher::tests::default_connection_bound_account_recovery_refuses_nonmatching_or_denied_state --lib

          run_case 10 lib daemon::proactive_dispatcher::tests::invalid_persisted_live_channel_sealed_binding_is_quarantined_before_dispatch daemon::proactive_dispatcher::tests::invalid_persisted_live_channel_sealed_binding_is_quarantined_before_dispatch --lib
          run_case 11 lib daemon::proactive_dispatcher::tests::live_channel_sealed_binding_guard_rejects_before_egress_and_preserves_valid_queue daemon::proactive_dispatcher::tests::live_channel_sealed_binding_guard_rejects_before_egress_and_preserves_valid_queue --lib

          run_case 12 lib channels::gchat::tests::space_target_probe_reads_only_the_exact_configured_space channels::gchat::tests::space_target_probe_reads_only_the_exact_configured_space --lib
          run_case 13 lib channels::imessage_bluebubbles::tests::chat_target_probe_reads_only_the_exact_routed_guid_and_redacts_password channels::imessage_bluebubbles::tests::chat_target_probe_reads_only_the_exact_routed_guid_and_redacts_password --lib
          run_case 14 lib cli::channel::tests::channel_test_imessage_reads_the_routed_target_without_writing_files cli::channel::tests::channel_test_imessage_reads_the_routed_target_without_writing_files --lib
          run_case 15 lib cli::channel::tests::channel_test_imessage_wrong_routed_target_fails_without_writing_files cli::channel::tests::channel_test_imessage_wrong_routed_target_fails_without_writing_files --lib
          run_case 16 lib cli::channel::tests::channel_test_imessage_without_a_route_keeps_transport_only_behavior cli::channel::tests::channel_test_imessage_without_a_route_keeps_transport_only_behavior --lib

          run_case 17 lib cli::serve_tasks::converted_relink_traffic_tests::unimported_scalar_channels_remain_startable cli::serve_tasks::converted_relink_traffic_tests::unimported_scalar_channels_remain_startable --lib
          run_case 18 lib cli::serve_tasks::converted_relink_traffic_tests::pending_relink_blocks_both_converted_families_before_pipeline cli::serve_tasks::converted_relink_traffic_tests::pending_relink_blocks_both_converted_families_before_pipeline --lib
          run_case 19 lib cli::serve_tasks::converted_relink_traffic_tests::pending_committed_during_pipeline_suppresses_both_replies cli::serve_tasks::converted_relink_traffic_tests::pending_committed_during_pipeline_suppresses_both_replies --lib
          run_case 20 lib daemon::proactive_dispatcher::tests::reconstructed_imessage_transport_blocks_pending_and_corrupt_relink_but_keeps_absent_index daemon::proactive_dispatcher::tests::reconstructed_imessage_transport_blocks_pending_and_corrupt_relink_but_keeps_absent_index --lib
          run_case 21 lib daemon::channel_live_registry::tests::converted_traffic_permit_rechecks_index_at_transport_and_never_sends daemon::channel_live_registry::tests::converted_traffic_permit_rechecks_index_at_transport_and_never_sends --lib
          run_case 22 lib daemon::channel_live_registry::tests::converted_traffic_permit_blocks_pending_and_stale_generation_before_transport daemon::channel_live_registry::tests::converted_traffic_permit_blocks_pending_and_stale_generation_before_transport --lib
          run_case 23 lib channels::relink::tests::pending_write_reopen_idempotence_conflict_and_legacy_gate channels::relink::tests::pending_write_reopen_idempotence_conflict_and_legacy_gate --lib
          run_case 24 lib channels::relink::tests::defaultless_destination_and_corrupt_or_duplicate_index_are_refused channels::relink::tests::defaultless_destination_and_corrupt_or_duplicate_index_are_refused --lib
          run_case 25 lib channels::relink::tests::tampered_recomputed_schema_or_inventory_pin_is_refused_without_rewrite channels::relink::tests::tampered_recomputed_schema_or_inventory_pin_is_refused_without_rewrite --lib
          run_case 26 lib channels::relink::tests::prepared_pair_route_and_ready_require_the_exact_receipt_postimages channels::relink::tests::prepared_pair_route_and_ready_require_the_exact_receipt_postimages --lib
          run_case 27 lib channels::relink::tests::prepared_receipt_refuses_pair_drift_and_keeps_traffic_blocked channels::relink::tests::prepared_receipt_refuses_pair_drift_and_keeps_traffic_blocked --lib
          run_case 28 lib config::credentials::tests::relink_before_publish_observes_the_actual_encrypted_pair_postimage config::credentials::tests::relink_before_publish_observes_the_actual_encrypted_pair_postimage --lib
          run_case 29 lib config::credentials::tests::relink_before_publish_rejection_keeps_the_exact_pair_unchanged config::credentials::tests::relink_before_publish_rejection_keeps_the_exact_pair_unchanged --lib
          run_case 30 lib cli::default_invocation_tests::converted_relink_requires_explicit_source_target_and_private_stdin_credentials cli::default_invocation_tests::converted_relink_requires_explicit_source_target_and_private_stdin_credentials --lib
          run_case 31 lib cli::channel::converted_relink::tests::every_durable_checkpoint_recovers_the_same_encrypted_first_use_request cli::channel::converted_relink::tests::every_durable_checkpoint_recovers_the_same_encrypted_first_use_request --lib
          run_case 32 lib cli::channel::converted_relink::tests::ready_retry_is_idempotent_but_changed_request_material_is_refused cli::channel::converted_relink::tests::ready_retry_is_idempotent_but_changed_request_material_is_refused --lib
          run_case 33 lib cli::channel::converted_relink::tests::drift_while_probe_runs_or_a_failed_or_expired_probe_never_publishes cli::channel::converted_relink::tests::drift_while_probe_runs_or_a_failed_or_expired_probe_never_publishes --lib
          run_case 34 lib cli::channel::converted_relink::tests::sequential_imessage_and_gchat_relinks_remain_independently_ready cli::channel::converted_relink::tests::sequential_imessage_and_gchat_relinks_remain_independently_ready --lib
          run_case 35 lib cli::channel::converted_relink::tests::guidless_imessage_relink_is_valid_but_a_later_guid_filter_invalidates_ready cli::channel::converted_relink::tests::guidless_imessage_relink_is_valid_but_a_later_guid_filter_invalidates_ready --lib
          run_case 36 lib cli::channel::converted_relink::tests::gchat_key_replaced_during_successful_probe_is_rejected_before_publication cli::channel::converted_relink::tests::gchat_key_replaced_during_successful_probe_is_rejected_before_publication --lib
          run_case 37 lib cli::channel::converted_relink::tests::reserved_ambiguous_request_rejects_changed_password_but_recovers_exactly cli::channel::converted_relink::tests::reserved_ambiguous_request_rejects_changed_password_but_recovers_exactly --lib
          test "$(wc -l < "$W548_ROOT/receipt/started.txt")" -eq 56
          test "$(wc -l < "$W548_ROOT/receipt/executed.txt")" -eq 56
          test "$(wc -l < "$W548_ROOT/receipt/passed.txt")" -eq 56
          test ! -s "$W548_ROOT/receipt/failed.txt"

      - name: Build exact public CLI for relink lifecycle
        timeout-minutes: 20
        working-directory: SRC
        run: cargo build -p neoth --bin neoth --locked --features gchat-channel,irc-channel,nostr-channel

      - name: Exercise real public CLI relink against loopback BlueBubbles
        timeout-minutes: 5
        run: |
          mkdir -p "$W548_ROOT/product"
          python3 packaging/converted_channel_relink_product_canary.py \
            --binary "$PWD/SRC/target/debug/neoth" \
            --root "$W548_ROOT/product" \
            --home "$W548_ROOT/product/neoth-home" \
            --source "$W548_ROOT/product/openclaw.json" \
            --evidence-dir "$W548_ROOT/product/evidence" \
            --receipt "$W548_ROOT/product/receipt/receipt.json" \
            --workflow .github/workflows/gchat-live-regressions.yml

      - name: Upload public CLI relink lifecycle receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: converted-relink-public-cli-${{ github.sha }}
          path: |
            ${{ runner.temp }}/w548-gchat-live-regressions/product/evidence/
            ${{ runner.temp }}/w548-gchat-live-regressions/product/receipt/
          if-no-files-found: warn
          retention-days: 14

      - name: Save Cargo cache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-w548-gchat-cargo-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.sha }}

      - name: Upload source provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w548-gchat-live-regressions-source-${{ github.sha }}
          path: ${{ runner.temp }}/w548-gchat-live-regressions/source/
          retention-days: 14

      - name: Upload GChat regression logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w548-gchat-live-regressions-log-${{ github.sha }}
          path: ${{ runner.temp }}/w548-gchat-live-regressions/log/
          retention-days: 14

      - name: Upload GChat regression receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w548-gchat-live-regressions-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/w548-gchat-live-regressions/receipt/
          retention-days: 14
