            > "$W548_ROOT/source/SHA256SUMS.txt"
          : > "$W548_ROOT/receipt/started.txt"
          : > "$W548_ROOT/receipt/passed.txt"
          : > "$W548_ROOT/receipt/failed.txt"
          : > "$W548_ROOT/receipt/executed.txt"

      - name: Verify compiled-CLI relink canary contracts
        run: |
          python3 packaging/tests/test_converted_channel_relink_product_canary.py
          python3 packaging/tests/test_gchat_converted_relink_product_canary.py
          python3 packaging/tests/test_gchat_daemon_adoption_canary.py
          python3 packaging/tests/test_bluebubbles_daemon_adoption_canary.py

      - name: Run focused channel and exact-target regressions
        working-directory: SRC
        run: |
          set -euo pipefail

          run_case() {
            local ordinal="$1"
            local kind="$2"
            local case_id="$3"
            local test_name="$4"
            shift 4
            local slug
            slug="$(printf '%s' "$case_id" | tr ':' '-' | tr -c '[:alnum:]' '-')"
            local discovery_log="$W548_ROOT/log/${ordinal}-discovery-${kind}-${slug}.log"
            local actual_log="$W548_ROOT/log/${ordinal}-actual-${kind}-${slug}.log"

            printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/started.txt"
            if ! timeout --kill-after=10s 1800s cargo test -p neoth --locked --features gchat-channel,irc-channel,nostr-channel "$@" "$test_name" -- --exact --list >"$discovery_log" 2>&1; then
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/failed.txt"
              cat "$discovery_log"
              exit 1
            fi
            if [ "$(grep -Fxc "$test_name: test" "$discovery_log")" -ne 1 ]; then
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/failed.txt"
              cat "$discovery_log"
              exit 1
            fi

            printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/executed.txt"
            if timeout --kill-after=10s 180s cargo test -p neoth --locked --features gchat-channel,irc-channel,nostr-channel "$@" "$test_name" -- --exact --test-threads=1 >"$actual_log" 2>&1 \
              && [ "$(grep -Fxc "test $test_name ... ok" "$actual_log")" -eq 1 ] \
              && [ "$(grep -Fc 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$actual_log")" -eq 1 ]; then
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/passed.txt"
            else
              printf '%s\n' "$case_id" >> "$W548_ROOT/receipt/failed.txt"
              cat "$actual_log"
            fi
          }

          run_case 146 lib cli::channel::tests::channel_add_preflight_keeps_non_nostr_channels_eligible cli::channel::tests::channel_add_preflight_keeps_non_nostr_channels_eligible --lib
          run_case 147 lib cli::channel::tests::nostr_add_preflight_allows_a_compiled_runtime cli::channel::tests::nostr_add_preflight_allows_a_compiled_runtime --lib
          run_case 145 lib cli::channel::converted_relink::tests::failed_gchat_probe_keeps_generic_error_outside_canary cli::channel::converted_relink::tests::failed_gchat_probe_keeps_generic_error_outside_canary --lib
          run_case 140 lib cli::privacy::tests::audit_lists_no_channels_when_credentials_empty cli::privacy::tests::audit_lists_no_channels_when_credentials_empty --lib
          run_case 141 lib cli::privacy::tests::audit_warns_and_lists_configured_channels cli::privacy::tests::audit_warns_and_lists_configured_channels --lib
