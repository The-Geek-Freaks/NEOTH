          run_case 173 lib cli::serve_tasks::tests::oh03_secondary_probe_passes_for_named_slack_map_without_legacy_fields cli::serve_tasks::tests::oh03_secondary_probe_passes_for_named_slack_map_without_legacy_fields --lib
          run_case 174 lib cli::serve_tasks::tests::oh03_secondary_probe_rejects_partial_named_maps_even_with_legacy_shadows cli::serve_tasks::tests::oh03_secondary_probe_rejects_partial_named_maps_even_with_legacy_shadows --lib
          test "$(wc -l < "$W548_ROOT/receipt/started.txt")" -eq 174
          test "$(wc -l < "$W548_ROOT/receipt/executed.txt")" -eq 174
          test "$(wc -l < "$W548_ROOT/receipt/passed.txt")" -eq 174
          test ! -s "$W548_ROOT/receipt/failed.txt"

      - name: Build exact public CLI for relink lifecycle
        id: public-cli-build
        timeout-minutes: 20
        working-directory: SRC
        run: cargo build -p neoth --bin neoth --locked --features gchat-channel,irc-channel,nostr-channel

      - name: Exercise real public CLI relink against loopback BlueBubbles
        timeout-minutes: 5
        run: |
          mkdir -p "$W548_ROOT/product"
