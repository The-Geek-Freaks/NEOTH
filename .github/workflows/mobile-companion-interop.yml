name: Mobile Companion Hosted Interop R8 Candidate
on:
  workflow_dispatch:
    inputs:
      expected_head: { required: true, type: string }
      bridge_cargo_sha256: { required: true, type: string }
      bridge_lib_sha256: { required: true, type: string }
      bridge_header_sha256: { required: true, type: string }
      canonical_protocol_sha256: { required: true, type: string }
permissions: { contents: read }
jobs:
  hosted-interop:
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      BRIDGE_CARGO_SHA256: ${{ inputs.bridge_cargo_sha256 }}
      BRIDGE_LIB_SHA256: ${{ inputs.bridge_lib_sha256 }}
      BRIDGE_HEADER_SHA256: ${{ inputs.bridge_header_sha256 }}
      CANONICAL_PROTOCOL_SHA256: ${{ inputs.canonical_protocol_sha256 }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { fetch-depth: 1, persist-credentials: false }
      - name: Validate and materialize canonical interop selection
        id: selection_contract
        shell: bash
        run: |
          set -euo pipefail
          selection_dir="$RUNNER_TEMP/mobile-interop-selection"
          python3 .github/scripts/mobile/validate-mobile-interop-selection.py --output-dir "$selection_dir"
          cp .github/scripts/mobile/mobile-companion-interop-selection.json "$selection_dir/mobile-companion-interop-selection.json"
          test -s "$selection_dir/selection-custody.json"
          for group in libudx peeroxide dht core no_cluster bridge collector; do test -s "$selection_dir/$group.txt"; done
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with: { toolchain: 1.91.0 }
      - name: Restore mobile-interop Cargo checkpoint
        id: mobile_interop_cache_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
            bridges/companion-native/target/
          key: ${{ runner.os }}-mobile-interop-rust-1.91-j1-i0-d0-schema2-${{ hashFiles('SRC/Cargo.lock', 'bridges/companion-native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mobile-interop-rust-1.91-cargo-${{ hashFiles('SRC/Cargo.lock', 'bridges/companion-native/Cargo.lock') }}-
      - name: Run bounded scoped diagnostics collector regressions
        timeout-minutes: 2
        run: python3 -m unittest discover -s .github/scripts/mobile -p 'test_hosted_mobile_interop_diagnostics.py' -v
      - name: Run exact locked libudx OS-send completion regression
        id: exact_libudx_os_completion
        timeout-minutes: 10
        working-directory: SRC
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/libudx-os-completion-regressions"
          mkdir -p "$proof_dir"
          root_manifest=Cargo.toml
          root_lock=Cargo.lock
          libudx_manifest=vendor/libudx/Cargo.toml
          root_manifest_hash="$(sha256sum "$root_manifest" | awk '{print $1}')"
          root_lock_hash="$(sha256sum "$root_lock" | awk '{print $1}')"
          libudx_manifest_hash="$(sha256sum "$libudx_manifest" | awk '{print $1}')"
          root_manifest_backup="$RUNNER_TEMP/libudx-root-Cargo.toml"
          root_lock_backup="$RUNNER_TEMP/libudx-Cargo.lock"
          libudx_manifest_backup="$RUNNER_TEMP/libudx-vendor-Cargo.toml"
          cp "$root_manifest" "$root_manifest_backup"
          cp "$root_lock" "$root_lock_backup"
          cp "$libudx_manifest" "$libudx_manifest_backup"
          cleanup() {
            local status=$?
            cp "$root_manifest_backup" "$root_manifest"
            cp "$root_lock_backup" "$root_lock"
            cp "$libudx_manifest_backup" "$libudx_manifest"
            test "$(sha256sum "$root_manifest" | awk '{print $1}')" = "$root_manifest_hash"
            test "$(sha256sum "$root_lock" | awk '{print $1}')" = "$root_lock_hash"
            test "$(sha256sum "$libudx_manifest" | awk '{print $1}')" = "$libudx_manifest_hash"
            printf '%s\n' 'LIBUDX_TEST_WORKSPACE_RESTORED=1' | tee "$proof_dir/restoration-success.marker"
            exit "$status"
          }
          trap cleanup EXIT

          # The vendored crate is intentionally standalone. Admit it only into
          # this runner-local root overlay and retain the committed root lock.
          test "$(grep -Fxc '    "neoth-relay",' "$root_manifest")" -eq 1
          test "$(grep -Fxc '    "vendor/libudx",' "$root_manifest")" -eq 0
          sed -i '/^    "neoth-relay",$/a\    "vendor/libudx",' "$root_manifest"
          test "$(grep -Fxc '    "vendor/libudx",' "$root_manifest")" -eq 1
          test "$(grep -Fxc '[workspace]' "$libudx_manifest")" -eq 1
          sed -i '/^\[workspace\]$/d' "$libudx_manifest"
          test "$(grep -Fxc '[workspace]' "$libudx_manifest")" -eq 0

          # The root lock already pins every package record. Add only libudx's
          # four declared dev-dependency edges temporarily for --locked tests.
          test "$(grep -Fxc 'name = "libudx"' "$root_lock")" -eq 1
          for dependency in ' "rand 0.9.4",' ' "serde_json",' ' "sha2 0.10.9",' ' "tracing-subscriber",'; do
            test "$(grep -Fxc "$dependency" "$root_lock")" -ge 1
          done
          sed -i '/^name = "libudx"$/,/^\[\[package\]\]$/s/^ "thiserror 2\.0\.18",$/ "rand 0.9.4",\n "serde_json",\n "sha2 0.10.9",\n "thiserror 2.0.18",/' "$root_lock"
          sed -i '/^name = "libudx"$/,/^\[\[package\]\]$/s/^ "tracing",$/ "tracing",\n "tracing-subscriber",/' "$root_lock"
          for dependency in ' "rand 0.9.4",' ' "serde_json",' ' "sha2 0.10.9",' ' "tracing-subscriber",'; do
            test "$(sed -n '/^name = "libudx"$/,/^\[\[package\]\]$/p' "$root_lock" | grep -Fxc "$dependency")" -eq 1
          done

          mapfile -t libudx_identities < "$RUNNER_TEMP/mobile-interop-selection/libudx.txt"
          test "${#libudx_identities[@]}" -gt 0
          ordinal=0
          for identity in "${libudx_identities[@]}"
          do
            ordinal=$((ordinal + 1))
            cargo test -p libudx --lib --locked "$identity" -- --exact --nocapture 2>&1 | tee "$proof_dir/$ordinal.log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$proof_dir/$ordinal.log"
          done
          test "$ordinal" -eq "${#libudx_identities[@]}"
      - name: Run exact locked server publication regressions
        id: exact_server_publication
        timeout-minutes: 10
        working-directory: SRC
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/companion-publication-regressions"
          mkdir -p "$proof_dir"
          root_manifest=Cargo.toml
          root_lock=Cargo.lock
          vendor_manifest=vendor/peeroxide/Cargo.toml
          dht_vendor_manifest=vendor/peeroxide-dht/Cargo.toml
          root_manifest_hash="$(sha256sum "$root_manifest" | awk '{print $1}')"
          root_lock_hash="$(sha256sum "$root_lock" | awk '{print $1}')"
          vendor_manifest_hash="$(sha256sum "$vendor_manifest" | awk '{print $1}')"
          dht_vendor_manifest_hash="$(sha256sum "$dht_vendor_manifest" | awk '{print $1}')"
          root_manifest_backup="$RUNNER_TEMP/peeroxide-root-Cargo.toml"
          root_lock_backup="$RUNNER_TEMP/peeroxide-Cargo.lock"
          vendor_manifest_backup="$RUNNER_TEMP/peeroxide-vendor-Cargo.toml"
          dht_vendor_manifest_backup="$RUNNER_TEMP/peeroxide-dht-vendor-Cargo.toml"
          cp "$root_manifest" "$root_manifest_backup"
          cp "$root_lock" "$root_lock_backup"
          cp "$vendor_manifest" "$vendor_manifest_backup"
          cp "$dht_vendor_manifest" "$dht_vendor_manifest_backup"
          cleanup() {
            local status=$?
            cp "$root_manifest_backup" "$root_manifest"
            cp "$root_lock_backup" "$root_lock"
            cp "$vendor_manifest_backup" "$vendor_manifest"
            cp "$dht_vendor_manifest_backup" "$dht_vendor_manifest"
            test "$(sha256sum "$root_manifest" | awk '{print $1}')" = "$root_manifest_hash"
            test "$(sha256sum "$root_lock" | awk '{print $1}')" = "$root_lock_hash"
            test "$(sha256sum "$vendor_manifest" | awk '{print $1}')" = "$vendor_manifest_hash"
            test "$(sha256sum "$dht_vendor_manifest" | awk '{print $1}')" = "$dht_vendor_manifest_hash"
            printf '%s\n' 'PEEROXIDE_TEST_WORKSPACE_RESTORED=1' | tee "$proof_dir/restoration-success.marker"
            exit "$status"
          }
          trap cleanup EXIT

          # Peeroxide is a root [patch] crate with its own standalone workspace.
          # Test its private lib tests inside a transient root-member overlay only.
          test "$(grep -Fxc '    "neoth-relay",' "$root_manifest")" -eq 1
          test "$(grep -Fxc '    "vendor/peeroxide",' "$root_manifest")" -eq 0
          test "$(grep -Fxc '    "vendor/peeroxide-dht",' "$root_manifest")" -eq 0
          test "$(grep -Fxc 'exclude = [' "$root_manifest")" -eq 0
          test "$(grep -Fxc '    "vendor/libudx",' "$root_manifest")" -eq 0
          sed -i '/^    "neoth-relay",$/a\    "vendor/peeroxide",' "$root_manifest"
          test "$(grep -Fxc '    "vendor/peeroxide",' "$root_manifest")" -eq 1
          sed -i '/^    "vendor\/peeroxide",$/a\    "vendor/peeroxide-dht",' "$root_manifest"
          test "$(grep -Fxc '    "vendor/peeroxide-dht",' "$root_manifest")" -eq 1
          sed -i '/^    "vendor\/peeroxide-dht",$/a\]\nexclude = [\n    "vendor/libudx",' "$root_manifest"
          test "$(grep -Fxc 'exclude = [' "$root_manifest")" -eq 1
          test "$(grep -Fxc '    "vendor/libudx",' "$root_manifest")" -eq 1
          test "$(grep -Fxc '[workspace]' "$vendor_manifest")" -eq 1
          sed -i '/^\[workspace\]$/d' "$vendor_manifest"
          test "$(grep -Fxc '[workspace]' "$vendor_manifest")" -eq 0
          test "$(grep -Fxc '[workspace]' "$dht_vendor_manifest")" -eq 1
          sed -i '/^\[workspace\]$/d' "$dht_vendor_manifest"
          test "$(grep -Fxc '[workspace]' "$dht_vendor_manifest")" -eq 0

          # The root lock already contains every package record and version for
          # Peeroxide's dev closure.  It only lacks this non-member package's
          # three dev-dependency edges; add those exact existing edges briefly.
          test "$(grep -Fxc 'name = "peeroxide"' "$root_lock")" -eq 1
          test "$(grep -Fxc ' "hex",' "$root_lock")" -ge 1
          test "$(grep -Fxc ' "serde_json",' "$root_lock")" -ge 1
          test "$(grep -Fxc ' "tracing-subscriber",' "$root_lock")" -ge 1
          sed -i '/^name = "peeroxide"$/,/^\[\[package\]\]$/s/^ "libudx",$/ "hex",\n "libudx",/' "$root_lock"
          sed -i '/^name = "peeroxide"$/,/^\[\[package\]\]$/s/^ "thiserror 2\.0\.18",$/ "serde_json",\n "thiserror 2.0.18",/' "$root_lock"
          sed -i '/^name = "peeroxide"$/,/^\[\[package\]\]$/s/^ "tracing",$/ "tracing",\n "tracing-subscriber",/' "$root_lock"
          test "$(sed -n '/^name = "peeroxide"$/,/^\[\[package\]\]$/p' "$root_lock" | grep -Fxc ' "hex",')" -eq 1
          test "$(sed -n '/^name = "peeroxide"$/,/^\[\[package\]\]$/p' "$root_lock" | grep -Fxc ' "serde_json",')" -eq 1
          test "$(sed -n '/^name = "peeroxide"$/,/^\[\[package\]\]$/p' "$root_lock" | grep -Fxc ' "tracing-subscriber",')" -eq 1

          test "$(grep -Fxc 'name = "peeroxide-dht"' "$root_lock")" -eq 1
          test "$(grep -Fxc ' "serde",' "$root_lock")" -ge 1
          sed -i '/^name = "peeroxide-dht"$/,/^\[\[package\]\]$/s/^ "libudx",$/ "hex",\n "libudx",/' "$root_lock"
          sed -i '/^name = "peeroxide-dht"$/,/^\[\[package\]\]$/s/^ "sha2 0\.10\.9",$/ "serde",\n "serde_json",\n "sha2 0.10.9",/' "$root_lock"
          sed -i '/^name = "peeroxide-dht"$/,/^\[\[package\]\]$/s/^ "tracing",$/ "tracing",\n "tracing-subscriber",/' "$root_lock"
          test "$(sed -n '/^name = "peeroxide-dht"$/,/^\[\[package\]\]$/p' "$root_lock" | grep -Fxc ' "hex",')" -eq 1
          test "$(sed -n '/^name = "peeroxide-dht"$/,/^\[\[package\]\]$/p' "$root_lock" | grep -Fxc ' "serde",')" -eq 1
          test "$(sed -n '/^name = "peeroxide-dht"$/,/^\[\[package\]\]$/p' "$root_lock" | grep -Fxc ' "serde_json",')" -eq 1
          test "$(sed -n '/^name = "peeroxide-dht"$/,/^\[\[package\]\]$/p' "$root_lock" | grep -Fxc ' "tracing-subscriber",')" -eq 1

          mapfile -t peeroxide_identities < "$RUNNER_TEMP/mobile-interop-selection/peeroxide.txt"
          test "${#peeroxide_identities[@]}" -gt 0
          ordinal=0
          for identity in "${peeroxide_identities[@]}"
          do
            ordinal=$((ordinal + 1))
            cargo test -p peeroxide --lib --locked "$identity" -- --exact --nocapture 2>&1 | tee "$proof_dir/$ordinal.log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$proof_dir/$ordinal.log"
          done
          test "$ordinal" -eq "${#peeroxide_identities[@]}"
          mapfile -t dht_identities < "$RUNNER_TEMP/mobile-interop-selection/dht.txt"
          test "${#dht_identities[@]}" -gt 0
          dht_ordinal=0
          for identity in "${dht_identities[@]}"
          do
            dht_ordinal=$((dht_ordinal + 1))
            cargo test -p peeroxide-dht --lib --locked "$identity" -- --exact --nocapture 2>&1 | tee "$proof_dir/dht-$dht_ordinal.log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$proof_dir/dht-$dht_ordinal.log"
          done
          test "$dht_ordinal" -eq "${#dht_identities[@]}"
      - name: Build exact host debug CLI and cdylib
        id: exact_host_build
        timeout-minutes: 25
        run: bash .github/scripts/mobile/build-host-interop-bridge.sh "$RUNNER_TEMP/w2328-stage"
      - name: Prove both transient test overlays restored before cache admission
        id: overlay_restored
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx 'PEEROXIDE_TEST_WORKSPACE_RESTORED=1' "$RUNNER_TEMP/companion-publication-regressions/restoration-success.marker"
          grep -Fqx 'LIBUDX_TEST_WORKSPACE_RESTORED=1' "$RUNNER_TEMP/libudx-os-completion-regressions/restoration-success.marker"
          echo 'restored=true' >> "$GITHUB_OUTPUT"
      - name: Run exact no-cluster companion refusal regression
        id: exact_no_cluster
        timeout-minutes: 15
        working-directory: SRC
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          readarray -t no_cluster_identities < "$RUNNER_TEMP/mobile-interop-selection/no_cluster.txt"
          test "${#no_cluster_identities[@]}" -eq 1
          cargo test -p neoth --no-default-features --lib --locked "${no_cluster_identities[0]}" -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/companion-no-cluster-regression.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/companion-no-cluster-regression.log"
      - name: Run exact companion RPC and shutdown regressions
        id: exact_companion_rpc_shutdown
        timeout-minutes: 15
        working-directory: SRC
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/companion-rpc-regressions"
          mkdir -p "$proof_dir"
          mapfile -t core_identities < "$RUNNER_TEMP/mobile-interop-selection/core.txt"
          test "${#core_identities[@]}" -gt 0
          ordinal=0
          for identity in "${core_identities[@]}"
          do
            ordinal=$((ordinal + 1))
            cargo test -p neoth --lib --locked "$identity" -- --exact --nocapture 2>&1 | tee "$proof_dir/$ordinal.log"
            grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$proof_dir/$ordinal.log"
          done
          test "$ordinal" -eq "${#core_identities[@]}"
      - name: Run exact bridge public result regression
        id: exact_bridge_public_result
        timeout-minutes: 5
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          readarray -t bridge_identities < "$RUNNER_TEMP/mobile-interop-selection/bridge.txt"
          test "${#bridge_identities[@]}" -eq 1
          cargo test --manifest-path bridges/companion-native/Cargo.toml --locked "${bridge_identities[0]}" -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/companion-bridge-result-regression.log"
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/companion-bridge-result-regression.log"
      - name: Run fixed isolated-home pair/status/chat/revoke
        timeout-minutes: 10
        run: python3 -I .github/scripts/mobile/hosted-mobile-interop.py --staging "$RUNNER_TEMP/w2328-stage" --receipt "$RUNNER_TEMP/w2328-receipt.json" --allow-external-udp
      - name: Require successful-run receipt custody
        run: |
          test -s "$RUNNER_TEMP/w2328-stage/host-interop-manifest.json"
          test -s "$RUNNER_TEMP/w2328-receipt.json"
      - name: Save mobile-interop Cargo checkpoint
        if: ${{ always() && !cancelled() && steps.mobile_interop_cache_restore.outputs.cache-hit != 'true' && steps.exact_host_build.outcome == 'success' && steps.exact_server_publication.outcome == 'success' && steps.exact_libudx_os_completion.outcome == 'success' && steps.exact_no_cluster.outcome == 'success' && steps.exact_companion_rpc_shutdown.outcome == 'success' && steps.exact_bridge_public_result.outcome == 'success' && steps.overlay_restored.outputs.restored == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
            bridges/companion-native/target/
          key: ${{ runner.os }}-mobile-interop-rust-1.91-j1-i0-d0-schema2-${{ hashFiles('SRC/Cargo.lock', 'bridges/companion-native/Cargo.lock') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: mobile-companion-hosted-interop-r8
          path: |
            ${{ runner.temp }}/w2328-stage/host-interop-manifest.json
            ${{ runner.temp }}/w2328-receipt.json
            ${{ runner.temp }}/mobile-interop-selection/selection-custody.json
            ${{ runner.temp }}/mobile-interop-selection/mobile-companion-interop-selection.json
          if-no-files-found: warn
          retention-days: 14
