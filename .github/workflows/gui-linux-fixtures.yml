name: W228 Linux GUI fixture acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

# This deliberately has no relationship to CI's cancellable `ci-${{ github.ref }}`
# group. It is a manually dispatched, focused acceptance receipt and must not
# cancel or be cancelled by the full Windows/macOS matrix.
concurrency:
  group: w228-linux-gui-fixtures-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-gui-fixtures:
    name: W228 exact Linux GUI fixtures / Rust 1.91
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout dispatched source without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Rust 1.91
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Install Linux GUI dependencies and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apparmor-utils \
            dbus-user-session \
            libfontconfig1-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            xauth \
            xvfb \
            ffmpeg

      # Read-only reuse of CI's Linux/Rust-1.91 cache. This lane never saves a
      # partial target directory into that shared cache family.
      - name: Restore Linux Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: linux-1.91-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            linux-1.91-cargo-

      # This focused lane owns this target cache namespace. It may restore a
      # compatible earlier focused run, but never writes into CI's shared
      # cache family.
      - name: Restore focused GUI compile cache
        id: focused-gui-compile-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: SRC/target/
          key: w228-linux-gui-fixtures-rust-1.91-lock-${{ hashFiles('SRC/Cargo.lock') }}-jobs1-incremental0-devdebug0-testdebug0-target-${{ github.sha }}
          restore-keys: |
            w228-linux-gui-fixtures-rust-1.91-lock-${{ hashFiles('SRC/Cargo.lock') }}-jobs1-incremental0-devdebug0-testdebug0-target-

      - name: Bind the complete declared GUI fixture closure
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/w228-linux-gui-fixtures"
          mkdir -p "$evidence_root/source" "$evidence_root/log" "$evidence_root/receipt"
          git rev-parse HEAD | tee "$evidence_root/receipt/source-head.txt"
          printf '%s\n' "$GITHUB_REF" | tee "$evidence_root/receipt/source-ref.txt"
          printf '%s\n' 'binding-pending' > "$evidence_root/source/selection-status.txt"
          export EVIDENCE_ROOT="$evidence_root"
          python3 - <<'PY' > >(tee "$evidence_root/log/bind-source.log") 2>&1
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          evidence_root = Path(os.environ["EVIDENCE_ROOT"])
          matrix_path = root / "docs/verification/gold-wave95-96-test-matrix.json"
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          required_gui_class = matrix.get("requiredGuiClass")
          if required_gui_class != "neothd-gui::bin/neothd-gui":
              raise SystemExit("requiredGuiClass must be the neothd-gui binary harness")

          def require_names(value, label, expected_count):
              if not isinstance(value, list) or len(value) != expected_count:
                  raise SystemExit(f"{label} must be a {expected_count}-item string array")
              if any(not isinstance(name, str) or not re.fullmatch(r"[A-Za-z0-9_:]+", name) for name in value):
                  raise SystemExit(f"{label} contains a missing or malformed test identity")
              if len(value) != len(set(value)):
                  raise SystemExit(f"{label} contains a duplicate test identity")
              return value

          universal = require_names(matrix.get("requiredGuiTests"), "requiredGuiTests", 99)
          by_platform = matrix.get("requiredGuiTestsByPlatform")
          if not isinstance(by_platform, dict):
              raise SystemExit("requiredGuiTestsByPlatform is missing or malformed")
          linux = require_names(by_platform.get("Linux"), "requiredGuiTestsByPlatform.Linux", 29)
          selected = universal + linux
          if len(selected) != 128 or len(selected) != len(set(selected)):
              raise SystemExit("GUI fixture selection must contain exactly 128 unique identities (99 universal + 29 Linux)")

          supported_classes = {
              "neothd-gui::bin/neothd-gui": {"kind": "bin", "selector": ["--bin", "neothd-gui"]},
              "neothd-gui::gui_chat_bridge_public_api": {"kind": "integration", "selector": ["--test", "gui_chat_bridge_public_api"]},
          }
          classes_by_platform = matrix.get("requiredGuiClassesByPlatform")
          if not isinstance(classes_by_platform, dict):
              raise SystemExit("requiredGuiClassesByPlatform is missing or malformed")
          if "Linux" not in classes_by_platform:
              raise SystemExit("requiredGuiClassesByPlatform.Linux is missing")
          linux_classes = classes_by_platform["Linux"]
          if not isinstance(linux_classes, dict):
              raise SystemExit("requiredGuiClassesByPlatform.Linux is missing or malformed")
          unknown_class_names = sorted(set(linux_classes) - set(selected))
          if unknown_class_names:
              raise SystemExit(f"Linux GUI class override names are not selected fixtures: {unknown_class_names}")
          fixture_plan = []
          for name in selected:
              harness_class = linux_classes.get(name, required_gui_class)
              if name in linux_classes and harness_class != "neothd-gui::gui_chat_bridge_public_api":
                  raise SystemExit(f"unsupported Linux GUI class override for {name}: {harness_class!r}")
              if harness_class not in supported_classes:
                  raise SystemExit(f"unsupported GUI harness class for {name}: {harness_class!r}")
              fixture_plan.append({
                  "name": name,
                  "class": harness_class,
                  **supported_classes[harness_class],
              })

          bindings = matrix.get("guiSourceBindings")
          if not isinstance(bindings, list) or not bindings:
              raise SystemExit("guiSourceBindings is missing or malformed")
          bound_paths = set()
          actual_bindings = []
          for binding in bindings:
              if not isinstance(binding, dict) or set(binding) != {"path", "bytes", "sha256"}:
                  raise SystemExit("guiSourceBindings contains a malformed binding")
              path, expected_bytes, expected_hash = binding["path"], binding["bytes"], binding["sha256"]
              if (not isinstance(path, str) or not path or Path(path).is_absolute() or ".." in Path(path).parts
                      or not isinstance(expected_bytes, int) or expected_bytes < 0
                      or not isinstance(expected_hash, str) or len(expected_hash) != 64):
                  raise SystemExit("guiSourceBindings contains an invalid binding value")
              if path in bound_paths:
                  raise SystemExit(f"guiSourceBindings duplicates a path: {path}")
              bound_paths.add(path)
              candidate = root / path
              if not candidate.is_file():
                  raise SystemExit(f"declared GUI source binding is missing: {path}")
              payload = candidate.read_bytes()
              actual_hash = hashlib.sha256(payload).hexdigest().upper()
              if len(payload) != expected_bytes or actual_hash != expected_hash.upper():
                  raise SystemExit(f"declared GUI source binding drifted: {path}")
              actual_bindings.append({"path": path, "bytes": len(payload), "sha256": actual_hash})

          source_manifest = matrix.get("sourceManifest")
          if not isinstance(source_manifest, dict) or set(source_manifest) != {"path", "bytes", "sha256"}:
              raise SystemExit("sourceManifest is missing or malformed")
          manifest_path = source_manifest["path"]
          if (not isinstance(manifest_path, str) or not manifest_path or Path(manifest_path).is_absolute()
                  or ".." in Path(manifest_path).parts or not isinstance(source_manifest["bytes"], int)
                  or not isinstance(source_manifest["sha256"], str)):
              raise SystemExit("sourceManifest contains an invalid value")
          manifest = root / manifest_path
          manifest_payload = manifest.read_bytes() if manifest.is_file() else None
          if manifest_payload is None:
              raise SystemExit(f"declared source manifest is missing: {manifest_path}")
          manifest_hash = hashlib.sha256(manifest_payload).hexdigest().upper()
          if len(manifest_payload) != source_manifest["bytes"] or manifest_hash != source_manifest["sha256"].upper():
              raise SystemExit("declared source manifest hash or byte count drifted")

          try:
              manifest_document = json.loads(manifest_payload)
              manifest_files = manifest_document["files"]
          except (json.JSONDecodeError, KeyError, TypeError) as error:
              raise SystemExit(f"declared source manifest has no usable files array: {error}")
          workflow_path = ".github/workflows/gui-linux-fixtures.yml"
          workflow_entries = [entry for entry in manifest_files if isinstance(entry, dict) and entry.get("path") == workflow_path]
          if len(workflow_entries) != 1 or set(workflow_entries[0]) != {"path", "bytes", "sha256"}:
              raise SystemExit("source manifest must bind this exact GUI fixture workflow once")
          workflow_binding = workflow_entries[0]
          if (not isinstance(workflow_binding["bytes"], int) or workflow_binding["bytes"] < 0
                  or not isinstance(workflow_binding["sha256"], str) or len(workflow_binding["sha256"]) != 64):
              raise SystemExit("source manifest has an invalid GUI fixture workflow binding")
          workflow_payload = (root / workflow_path).read_bytes()
          workflow_hash = hashlib.sha256(workflow_payload).hexdigest().upper()
          if len(workflow_payload) != workflow_binding["bytes"] or workflow_hash != workflow_binding["sha256"].upper():
              raise SystemExit("executing GUI fixture workflow drifted from the declared source manifest")

          lock_path = root / "SRC/Cargo.lock"
          if not lock_path.is_file():
              raise SystemExit("SRC/Cargo.lock is missing")
          inputs = {
              "matrix": {"path": str(matrix_path.relative_to(root)), "sha256": hashlib.sha256(matrix_path.read_bytes()).hexdigest().upper()},
              "sourceManifest": {"path": manifest_path, "bytes": len(manifest_payload), "sha256": manifest_hash},
              "cargoLock": {"path": "SRC/Cargo.lock", "bytes": lock_path.stat().st_size, "sha256": hashlib.sha256(lock_path.read_bytes()).hexdigest().upper()},
              "guiCargoToml": {"path": "SRC/neothd-gui/Cargo.toml", "sha256": hashlib.sha256((root / "SRC/neothd-gui/Cargo.toml").read_bytes()).hexdigest().upper()},
              "workflow": {"path": workflow_path, "bytes": len(workflow_payload), "sha256": workflow_hash},
          }
          (evidence_root / "source" / "selected-fixtures.json").write_text(json.dumps({
              "schema": "neoth-w228-linux-gui-fixtures/v1",
              "defaultGuiClass": required_gui_class,
              "platformGuiClassOverrides": linux_classes,
              "universal": universal,
              "linux": linux,
              "selected": selected,
              "fixturePlan": fixture_plan,
              "counts": {"universal": len(universal), "linux": len(linux), "total": len(selected)},
          }, indent=2) + "\n", encoding="utf-8")
          (evidence_root / "source" / "gui-source-bindings.json").write_text(json.dumps(actual_bindings, indent=2) + "\n", encoding="utf-8")
          (evidence_root / "source" / "source-manifest.json").write_bytes(manifest_payload)
          (evidence_root / "source" / "workflow-binding.json").write_text(json.dumps({
              "head": os.environ.get("GITHUB_SHA"),
              "manifest": {"path": manifest_path, "bytes": len(manifest_payload), "sha256": manifest_hash},
              "workflow": inputs["workflow"],
          }, indent=2) + "\n", encoding="utf-8")
          (evidence_root / "source" / "inputs.json").write_text(json.dumps(inputs, indent=2) + "\n", encoding="utf-8")
          (evidence_root / "source" / "fixture-names.txt").write_text("\n".join(selected) + "\n", encoding="utf-8")
          (evidence_root / "source" / "fixture-plan.tsv").write_text(
              "".join(f"{entry['name']}\t{entry['class']}\t{entry['kind']}\n" for entry in fixture_plan),
              encoding="utf-8",
          )
          PY
          printf '%s\n' 'binding-verified' > "$evidence_root/source/selection-status.txt"
          test "$(cat "$evidence_root/receipt/source-head.txt")" = "$GITHUB_SHA"

      # The selected fixtures declare their canonical harness in the source
      # receipt. The real CLI is built once for callbacks that do not stage a
      # test-local executable; fixtures which intentionally stage `neoth`
      # keep their own PATH precedence. No `neoth --lib` test binary is
      # requested.
      - name: Build and run each exact GUI fixture once
        id: gui-fixtures
        shell: bash
        working-directory: SRC
        run: |
          set -uo pipefail
          evidence_root="$RUNNER_TEMP/w228-linux-gui-fixtures"
          result="$evidence_root/receipt/result.json"
          names="$evidence_root/source/fixture-names.txt"
          plan="$evidence_root/source/fixture-plan.tsv"
          failed="$evidence_root/receipt/failed-names.txt"
          executed="$evidence_root/receipt/executed-names.txt"
          started="$evidence_root/receipt/started-names.txt"
          completed="$evidence_root/receipt/completed-names.txt"
          passed="$evidence_root/receipt/passed-names.txt"
          unstarted="$evidence_root/receipt/unstarted-names.txt"
          : > "$failed"
          : > "$executed"
          : > "$started"
          : > "$completed"
          : > "$passed"
          : > "$unstarted"
          overall=0
          deadline_reached=false
          incomplete_reason=""
          # The GUI supervisor deletes DBUS_SESSION_BUS_ADDRESS before its
          # systemd-run exec. Provision or adopt only the standard per-user
          # runtime bus and user manager so that its production lookup path is
          # what this hosted lane proves.
          containment_runtime=""
          containment_readiness="$evidence_root/receipt/linux-contained-chat-readiness.txt"
          containment_diagnostics="$evidence_root/receipt/linux-contained-chat-diagnostics.txt"
          containment_apparmor_dir="$RUNNER_TEMP/neoth-w252-apparmor"
          containment_apparmor_profiles=()
          : > "$containment_diagnostics"
          cleanup_containment_apparmor() {
            local profile_file
            for profile_file in "${containment_apparmor_profiles[@]}"; do
              sudo timeout 10 apparmor_parser -R "$profile_file" >/dev/null 2>&1 || true
            done
          }
          trap cleanup_containment_apparmor EXIT
          install_containment_apparmor_profile() {
            local profile_name="$1" executable="$2" profile_file
            [[ -f "$executable" && -x "$executable" ]] || return 1
            [[ "$executable" != *[$'\t\n '\"\#\{\}\*\?\[\]]* ]] || return 1
            mkdir -p "$containment_apparmor_dir" || return 1
            profile_file="$containment_apparmor_dir/${profile_name}.profile"
            cat > "$profile_file" <<EOF
          #include <tunables/global>
          profile ${profile_name} ${executable} flags=(attach_disconnected,mediate_deleted,complain) {
            capability sys_admin,
            userns,
          }
          EOF
            sudo timeout 10 apparmor_parser -r "$profile_file" || return 1
            containment_apparmor_profiles=("$profile_file" "${containment_apparmor_profiles[@]}")
            cp "$profile_file" "$evidence_root/receipt/${profile_name}.apparmor" || return 1
          }
          containment_snapshot() {
            {
              echo '=== contained-chat manager snapshot ==='
              printf 'uid=%s runtime=%s\n' "$(id -u)" "$XDG_RUNTIME_DIR"
              stat -c 'runtime mode=%a uid=%u gid=%g type=%F' "$XDG_RUNTIME_DIR" || true
              stat -c '%n mode=%a uid=%u gid=%g type=%F' /usr/bin/systemd-run /usr/bin/systemctl || true
              timeout 10 /usr/bin/systemctl --user is-system-running || true
              timeout 10 /usr/bin/systemctl --user --failed --no-legend || true
              timeout 10 /usr/bin/systemctl --user list-units --all 'neoth-gui-chat-*' --no-legend || true
              timeout 15 /usr/bin/journalctl --user --no-pager -o short-precise -n 160 || true
            } >> "$containment_diagnostics" 2>&1
          }
          containment_userns_snapshot() {
            {
              echo '=== contained-chat user namespace diagnostic ==='
              for value_path in \
                /proc/sys/kernel/unprivileged_userns_clone \
                /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
                /sys/module/apparmor/parameters/enabled; do
                if [[ -r "$value_path" ]]; then
                  printf '%s=' "$value_path"
                  cat "$value_path" || true
                else
                  printf '%s=<unavailable>\n' "$value_path"
                fi
              done
              if command -v aa-status >/dev/null 2>&1; then
                sudo timeout 10 aa-status || true
              else
                echo 'aa-status=<unavailable>'
              fi
              echo '=== kernel userns/AppArmor records ==='
              sudo timeout 10 journalctl -k -b --no-pager -n 240 | grep -Ei 'apparmor|userns|user namespace|uid_map|gid_map|denied' || true
              echo '=== system userns/AppArmor records ==='
              sudo timeout 10 journalctl -b --no-pager -n 240 | grep -Ei 'apparmor|userns|user namespace|uid_map|gid_map|denied' || true
            } >> "$containment_diagnostics" 2>&1
          }
          start_containment_session() {
            local uid gid attempt runtime_stat
            uid="$(id -u)" || return 1
            gid="$(id -g)" || return 1
            containment_runtime="/run/user/$uid"
            export XDG_RUNTIME_DIR="$containment_runtime"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"

            # Preserve a usable runner session. If it is absent, ask the
            # system manager for the real user@UID service rather than running
            # private dbus/systemd processes without its cgroup substrate.
            if ! timeout 1 /usr/bin/systemctl --user show-environment >/dev/null 2>&1; then
              sudo timeout --kill-after=5s 30s /usr/bin/systemctl start "user@${uid}.service" || return 1
              for attempt in 1 2 3 4 5; do
                if timeout 1 /usr/bin/systemctl --user show-environment >/dev/null 2>&1; then
                  break
                fi
                sleep 1 || return 1
              done
              timeout 1 /usr/bin/systemctl --user show-environment >/dev/null 2>&1 || return 1
            fi

            [[ -S "$XDG_RUNTIME_DIR/bus" ]] || return 1
            runtime_stat="$(stat -c '%u:%g:%a:%F' "$XDG_RUNTIME_DIR")" || return 1
            [[ "$runtime_stat" == "$uid:$gid:700:directory" ]] || return 1
            command -v apparmor_parser >/dev/null 2>&1 || return 1

            {
              echo '=== contained-chat readiness ==='
              printf 'uid=%s runtime=%s\n' "$uid" "$XDG_RUNTIME_DIR"
              stat -c 'runtime mode=%a uid=%u gid=%g type=%F' "$XDG_RUNTIME_DIR" || return 1
              stat -c '%n mode=%a uid=%u gid=%g type=%F' /usr/bin/systemd-run /usr/bin/systemctl || return 1
              timeout 1 /usr/bin/systemctl --user show-environment >/dev/null || return 1
              timeout 10 /usr/bin/systemctl --user is-system-running || true
              echo 'contained-chat manager readiness passed; namespace acceptance is exercised by the required actual fixtures'
            } > "$containment_readiness" 2>&1 || return 1
          }
          if ! start_containment_session; then
            containment_userns_snapshot
            containment_snapshot
            cat "$containment_readiness" >&2 || true
            exit 1
          fi
          export NEOTH_GUI_REQUIRE_SYSTEMD_CONTAINMENT_TESTS=1
          # Finish the runner-side protocol with time for receipt creation and
          # the always-uploaded artifacts before GitHub's 90-minute job limit.
          deadline_seconds=4500
          SECONDS=0
          reserve_timeout() {
            local cap_seconds="$1"
            local label="$2"
            local remaining_seconds=$((deadline_seconds - SECONDS))
            if [[ "$remaining_seconds" -le 90 ]]; then
              deadline_reached=true
              incomplete_reason="deadline reserve reached before ${label}"
              return 1
            fi
            command_timeout=$((remaining_seconds - 90))
            if [[ "$command_timeout" -gt "$cap_seconds" ]]; then
              command_timeout="$cap_seconds"
            fi
          }

          if reserve_timeout 1500 'CLI build'; then
            timeout --preserve-status "$command_timeout" cargo build -p neoth --bin neoth --locked 2>&1 | tee "$evidence_root/log/build-neoth-cli.log"
            build_status=${PIPESTATUS[0]}
          else
            build_status=124
          fi
          if [[ "$build_status" -ne 0 ]]; then
            printf '%s\n' '__build_neoth_cli__' >> "$failed"
            overall=1
          fi

          if [[ "$build_status" -eq 0 ]]; then
            export PATH="$PWD/target/debug:$PATH"
            gui_build_status=0
            contained_gui_helper_path="$evidence_root/receipt/contained-gui-helper.path"
            contained_gui_helper_receipt="$evidence_root/receipt/contained-gui-helper.json"
            if reserve_timeout 1500 'production GUI helper build'; then
              timeout --preserve-status "$command_timeout" cargo build -p neothd-gui --bin neothd-gui --locked --message-format=json 2>&1 | tee "$evidence_root/log/build-neothd-gui-helper.log"
              helper_build_status=${PIPESTATUS[0]}
            else
              helper_build_status=124
            fi
            if [[ "$helper_build_status" -ne 0 ]]; then
              printf '%s\n' '__build_neothd_gui_production_helper__' >> "$failed"
              gui_build_status="$helper_build_status"
              overall=1
            else
              if ! python3 - "$evidence_root/log/build-neothd-gui-helper.log" > "$contained_gui_helper_path" <<'PY'
          import json
          import os
          import sys

          log_path = sys.argv[1]
          executables = []
          for raw_line in open(log_path, encoding="utf-8", errors="replace"):
              try:
                  event = json.loads(raw_line)
              except json.JSONDecodeError:
                  continue
              if not isinstance(event, dict):
                  continue
              target = event.get("target")
              profile = event.get("profile")
              executable = event.get("executable")
              if (
                  event.get("reason") == "compiler-artifact"
                  and isinstance(target, dict)
                  and target.get("name") == "neothd-gui"
                  and target.get("kind") == ["bin"]
                  and isinstance(profile, dict)
                  and profile.get("test") is False
                  and isinstance(executable, str)
              ):
                  executables.append(os.path.realpath(executable))
          if len(executables) != 1:
              raise SystemExit(
                  f"expected one production neothd-gui helper executable, found {len(executables)}"
              )
          print(executables[0])
          PY
              then
                printf '%s\n' '__discover_neothd_gui_production_helper__' >> "$failed"
                gui_build_status=125
                overall=1
              else
                contained_gui_helper="$(cat "$contained_gui_helper_path")" || contained_gui_helper=""
                if [[ ! -f "$contained_gui_helper" || ! -x "$contained_gui_helper" ]]; then
                  printf '%s\n' '__validate_neothd_gui_production_helper__' >> "$failed"
                  gui_build_status=125
                  overall=1
                else
                  helper_sha256="$(sha256sum "$contained_gui_helper" | awk '{print $1}')" || helper_sha256=""
                  helper_bytes="$(stat -c '%s' "$contained_gui_helper")" || helper_bytes=""
                  helper_source_head="$(git rev-parse HEAD)" || helper_source_head=""
                  if [[ ! "$helper_sha256" =~ ^[0-9a-f]{64}$ || ! "$helper_bytes" =~ ^[0-9]+$ || ! "$helper_source_head" =~ ^[0-9a-f]{40}$ ]]; then
                    printf '%s\n' '__receipt_neothd_gui_production_helper__' >> "$failed"
                    gui_build_status=125
                    overall=1
                  elif ! python3 - "$contained_gui_helper_receipt" "$contained_gui_helper" "$helper_sha256" "$helper_bytes" "$helper_source_head" <<'PY'
          import json
          import sys
          from pathlib import Path

          receipt, executable, sha256, byte_count, source_head = sys.argv[1:]
          Path(receipt).write_text(json.dumps({
              "schema": "neoth-w272-linux-gui-helper/v1",
              "sourceHead": source_head,
              "executable": executable,
              "sha256": sha256,
              "bytes": int(byte_count),
          }, indent=2) + "\n", encoding="utf-8")
          PY
                  then
                    printf '%s\n' '__receipt_neothd_gui_production_helper__' >> "$failed"
                    gui_build_status=125
                    overall=1
                  elif ! install_containment_apparmor_profile 'neoth-w272-neothd-gui' "$contained_gui_helper"; then
                    printf '%s\n' '__apparmor_neothd_gui_production_helper__' >> "$failed"
                    gui_build_status=125
                    overall=1
                  else
                    export NEOTH_GUI_TEST_SYSTEMD_HELPER="$contained_gui_helper"
                  fi
                fi
              fi
            fi

            if [[ "$gui_build_status" -eq 0 ]]; then
              # Compile every exact harness selected by the canonical class
              # mapping once. The built production helper above is shared by
              # both harness classes during fixture execution.
              mapfile -t harness_kinds < <(cut -f3 "$plan" | sort -u)
              for harness_kind in "${harness_kinds[@]}"; do
                case "$harness_kind" in
                  bin)
                    selector=(--bin neothd-gui)
                    log_suffix=bin-neothd-gui
                    ;;
                  integration)
                    selector=(--test gui_chat_bridge_public_api)
                    log_suffix=integration-gui-chat-bridge-public-api
                    ;;
                  *)
                    echo "unsupported GUI fixture harness kind: $harness_kind" >&2
                    printf '%s\n' "__unsupported_gui_harness_${harness_kind}__" >> "$failed"
                    gui_build_status=125
                    overall=1
                    continue
                    ;;
                esac
                if reserve_timeout 1500 "GUI ${harness_kind} harness build"; then
                  timeout --preserve-status "$command_timeout" cargo test -p neothd-gui "${selector[@]}" --locked --no-run --message-format=json 2>&1 | tee "$evidence_root/log/build-gui-test-harness-${log_suffix}.log"
                  harness_build_status=${PIPESTATUS[0]}
                else
                  harness_build_status=124
                fi
                if [[ "$harness_build_status" -ne 0 ]]; then
                  printf '%s\n' "__build_neothd_gui_${log_suffix}__" >> "$failed"
                  gui_build_status="$harness_build_status"
                  overall=1
                fi
              done
            fi
          else
            gui_build_status=125
          fi
          if [[ "$build_status" -eq 0 && "$gui_build_status" -eq 0 ]]; then
            printf '%s\n' 'compile_ready=true' >> "$GITHUB_OUTPUT"
            mapfile -t tests < "$names"
            index=0
            while IFS=$'\t' read -r test_name required_gui_class harness_kind; do
              index=$((index + 1))
              case "$harness_kind" in
                bin) selector=(--bin neothd-gui) ;;
                integration) selector=(--test gui_chat_bridge_public_api) ;;
                *)
                  printf '%s\n' "$test_name" >> "$failed"
                  overall=1
                  continue
                  ;;
              esac
              log="$evidence_root/log/test-$(printf '%03d' "$index").log"
              execution_receipt="$evidence_root/receipt/test-$(printf '%03d' "$index")-execution.txt"
              printf '%s\n' "$test_name" >> "$started"
              run_fixture() {
                echo "=== fixture ${index}/${#tests[@]}: $test_name [$required_gui_class] ==="
                echo "=== discovery ==="
                if ! reserve_timeout 720 "fixture ${index} discovery"; then
                  echo "deadline reserve reached before discovery: $test_name" >&2
                  return 1
                fi
                listed="$(timeout --preserve-status "$command_timeout" cargo test -p neothd-gui "${selector[@]}" --locked "$test_name" -- --exact --list)"
                list_status=$?
                printf '%s\n' "$listed"
                if [[ "$list_status" -ne 0 ]]; then
                  echo "discovery command failed: $list_status" >&2
                  return 1
                fi
                if [[ "$(printf '%s\n' "$listed" | grep -Fxc "$test_name: test")" -ne 1 ]]; then
                  echo "fixture discovery was missing, ambiguous, or malformed: $test_name" >&2
                  return 1
                fi
                echo "=== execution ==="
                printf '%s\n' "$test_name" >> "$executed"
                if ! reserve_timeout 720 "fixture ${index} execution"; then
                  echo "deadline reserve reached before execution: $test_name" >&2
                  return 1
                fi
                xvfb-run --auto-servernum timeout --preserve-status "$command_timeout" cargo test -p neothd-gui "${selector[@]}" --locked "$test_name" -- --exact --test-threads=1 2>&1 | tee "$execution_receipt"
                run_status=${PIPESTATUS[0]}
                if [[ "$run_status" -ne 0 ]]; then
                  echo "exact execution command failed: $run_status" >&2
                  return 1
                fi
                terminal_summary="$(grep -F 'test result:' "$execution_receipt" | tail -n 1)"
                if [[ "$terminal_summary" != *'test result: ok. 1 passed; 0 failed; 0 ignored;'* ]]; then
                  echo "exact execution did not prove one non-ignored passing test: $test_name" >&2
                  return 1
                fi
              }
              if run_fixture > >(tee "$log") 2>&1; then
                test_status=0
                printf '%s\n' "$test_name" >> "$passed"
              else
                test_status=$?
                containment_userns_snapshot
                containment_snapshot
                cat "$containment_diagnostics" >> "$log"
                printf '%s\n' "$test_name" >> "$failed"
                overall=1
              fi
              printf '%s\n' "$test_name" >> "$completed"
              if [[ "$deadline_reached" == true ]]; then
                break
              fi
            done < "$plan"
          fi

          mapfile -t expected_tests < "$names"
          for test_name in "${expected_tests[@]}"; do
            grep -Fqx "$test_name" "$started" || printf '%s\n' "$test_name" >> "$unstarted"
          done
          if [[ -s "$unstarted" && "$overall" -eq 0 ]]; then
            overall=1
            incomplete_reason="fixture loop ended before every selected identity started"
          fi
          if [[ "$deadline_reached" == true ]]; then
            overall=1
          fi

          invariant_status="$evidence_root/receipt/proof-invariant-status.txt"
          export RESULT_PATH="$result" INVARIANT_STATUS_PATH="$invariant_status" EXECUTED_PATH="$executed" STARTED_PATH="$started" COMPLETED_PATH="$completed" PASSED_PATH="$passed" FAILED_PATH="$failed" UNSTARTED_PATH="$unstarted" BUILD_STATUS="$build_status" GUI_BUILD_STATUS="$gui_build_status" EXPECTED_PATH="$names" FIXTURE_PLAN_PATH="$plan" DEADLINE_REACHED="$deadline_reached" INCOMPLETE_REASON="$incomplete_reason" DEADLINE_SECONDS="$deadline_seconds"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = Path(os.environ["EXPECTED_PATH"]).read_text(encoding="utf-8").splitlines()
          executed = Path(os.environ["EXECUTED_PATH"]).read_text(encoding="utf-8").splitlines()
          started = Path(os.environ["STARTED_PATH"]).read_text(encoding="utf-8").splitlines()
          completed = Path(os.environ["COMPLETED_PATH"]).read_text(encoding="utf-8").splitlines()
          passed = Path(os.environ["PASSED_PATH"]).read_text(encoding="utf-8").splitlines()
          failed = Path(os.environ["FAILED_PATH"]).read_text(encoding="utf-8").splitlines()
          unstarted = Path(os.environ["UNSTARTED_PATH"]).read_text(encoding="utf-8").splitlines()
          selectors = {
              "bin": ["--bin", "neothd-gui"],
              "integration": ["--test", "gui_chat_bridge_public_api"],
          }
          fixture_plan = []
          for line in Path(os.environ["FIXTURE_PLAN_PATH"]).read_text(encoding="utf-8").splitlines():
              name, harness_class, kind = line.split("\t")
              if kind not in selectors:
                  raise SystemExit(f"unsupported fixture harness kind in receipt: {kind}")
              fixture_plan.append({
                  "name": name,
                  "class": harness_class,
                  "kind": kind,
                  "selector": selectors[kind],
              })
          if [entry["name"] for entry in fixture_plan] != expected:
              raise SystemExit("fixture plan no longer binds the exact selected identities")
          coverage_complete = started == expected and completed == expected
          proof_complete = (
              started == expected
              and completed == expected
              and executed == expected
              and passed == expected
              and not failed
          )
          status = "passed" if proof_complete else ("failed" if coverage_complete else "incomplete")
          Path(os.environ["RESULT_PATH"]).write_text(json.dumps({
              "schema": "neoth-w228-linux-gui-fixtures-result/v1",
              "status": status,
              "complete": proof_complete,
              "coverageComplete": coverage_complete,
              "fixturePlan": fixture_plan,
              "expectedCount": len(expected),
              "startedCount": len(started),
              "completedCount": len(completed),
              "actualExecutedCount": len(executed),
              "passedNames": passed,
              "failedNames": failed,
              "unstartedNames": unstarted,
              "buildNeothCliExit": int(os.environ["BUILD_STATUS"]),
              "buildGuiTestHarnessExit": int(os.environ["GUI_BUILD_STATUS"]),
              "deadlineSeconds": int(os.environ["DEADLINE_SECONDS"]),
              "deadlineReached": os.environ["DEADLINE_REACHED"] == "true",
              "incompleteReason": os.environ["INCOMPLETE_REASON"] or None,
          }, indent=2) + "\n", encoding="utf-8")
          Path(os.environ["INVARIANT_STATUS_PATH"]).write_text(
              "proof-complete\n" if proof_complete else "proof-incomplete\n", encoding="utf-8"
          )
          if not proof_complete:
              raise SystemExit("fixture receipt invariants did not prove every selected identity exactly once")
          PY
          receipt_status=$?
          if [[ "$receipt_status" -ne 0 ]]; then
            if [[ ! -f "$invariant_status" ]] || [[ "$(cat "$invariant_status")" != 'proof-incomplete' ]]; then
              printf '%s\n' '__receipt_writer__' >> "$failed"
            fi
            overall=1
          fi
          test "$(wc -l < "$completed")" -eq "$(wc -l < "$names")" || overall=1
          exit "$overall"

      - name: Save focused GUI compile cache after successful target builds
        if: always() && steps.gui-fixtures.outputs.compile_ready == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: SRC/target/
          key: w228-linux-gui-fixtures-rust-1.91-lock-${{ hashFiles('SRC/Cargo.lock') }}-jobs1-incremental0-devdebug0-testdebug0-target-${{ github.sha }}

      - name: Upload GUI fixture source bindings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w228-linux-gui-fixtures-source-${{ github.sha }}
          path: ${{ runner.temp }}/w228-linux-gui-fixtures/source/
          if-no-files-found: error
          retention-days: 14

      - name: Upload GUI fixture logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w228-linux-gui-fixtures-log-${{ github.sha }}
          path: ${{ runner.temp }}/w228-linux-gui-fixtures/log/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload GUI fixture receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w228-linux-gui-fixtures-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/w228-linux-gui-fixtures/receipt/
          if-no-files-found: error
          retention-days: 14
