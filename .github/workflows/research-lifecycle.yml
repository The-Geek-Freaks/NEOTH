name: Research and loop lifecycle quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-lifecycle:
    name: Research and loop lifecycle quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require main branch dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Research and loop lifecycle quality is main-only (got $GITHUB_REF)"
            exit 1
          }

      - name: Prepare source log and receipt evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/w190-research-lifecycle"
          mkdir -p "$evidence_root/source" "$evidence_root/log" "$evidence_root/receipt"
          git rev-parse HEAD > "$evidence_root/receipt/source-head.txt"
          printf '%s\n' "$GITHUB_REF" > "$evidence_root/receipt/source-ref.txt"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Restore gold-smoke Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-gold-smoke-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gold-smoke-cargo-partial-${{ hashFiles('SRC/Cargo.lock') }}-
            ${{ runner.os }}-gold-smoke-cargo-

      - name: Bind required research and Skill tests to source identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence_root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "w190-research-lifecycle"
          matrix_path = root / "docs/verification/gold-wave95-96-test-matrix.json"
          payload = json.loads(matrix_path.read_text(encoding="utf-8"))
          expected_wave_counts = {
              "wave190": 10,
              "wave191": 5,
              "wave192": 10,
              "wave193": 5,
              "wave194": 4,
              "wave196": 4,
              "wave197": 11,
              "wave198": 6,
              "wave199": 5,
              "wave202": 23,
              "wave205": 3,
              "wave204": 15,
              "wave206": 18,
              "wave204205BehaviorRepair": 2,
              "wave206BudgetRepair": 3,
              "wave207": 17,
              "wave208": 30,
              "wave209": 16,
              "wave210": 13,
              "wave211": 5,
              "wave212": 31,
              "wave213": 12,
              "wave214": 3,
              "wave213ActualStartRepair": 1,
              "wave215": 3,
              "wave213TestScopeRepair": 1,
              "wave216": 10,
              "wave217": 4,
              "wave218": 2,
              "wave220": 2,
              "wave222": 1,
              "wave221": 2,
              "wave224RegistryAcceptance": 4,
              "wave225": 1,
              "wave226": 21,
              "wave227AutonomyAcceptance": 25,
              "wave230LiveThroughputAcceptance": 12,
              "wave229LiveAssignmentAcceptance": 1,
              "wave231RecallChipAcceptance": 25,
              "wave231ResponseFeedbackAcceptance": 26,
              "wave232WindowsRegressionAcceptance": 2,
              "wave234NativeRepairAcceptance": 4,
              "wave235CancellationSettlementAcceptance": 4,
              "wave239NativeReadAcceptance": 10,
              "wave242ContextStatusAcceptance": 1,
              "wave246RecallCitationAcceptance": 5,
              "wave247ImportLifecycleAcceptance": 6,
              "wave249UnixContextAcceptance": 7,
              "wave253ImportPreviewAcceptance": 1,
              "wave257ContextDoctorAcceptance": 4,
              "wave256NativeSearchAcceptance": 5,
              "wave262DiscordEgressAcceptance": 7,
              "wave268SignalEgressAcceptance": 3,
              "wave270HippocampusAcceptance": 11,
              "wave269NativeReadinessAcceptance": 2,
              "wave271DoctorCallerAcceptance": 1,
              "wave275SelfImproveCliAcceptance": 13,
              "wave276RecallResumeAcceptance": 1,
              "wave277ChannelDoctorAcceptance": 9,
              "wave278RetryRoleReceiptAcceptance": 1,
              "wave279NativeGlobAcceptance": 13,
              "wave285BackgroundRoleAcceptance": 2,
              "wave287DoctorContractRepair": 1,
              "wave280RetentionAcceptance": 51,
              "wave289CronRoleAcceptance": 8,
              "wave292NormalChatRoleAcceptance": 7,
              "wave296AgentsRoleAcceptance": 4,
              "wave297ArchitectureEvidenceAcceptance": 4,
              "wave300CodingRoleAcceptance": 2,
              "wave301DirectRoleCliAcceptance": 4,
              "wave302CronLoopRoleAcceptance": 3,
              "wave303DissentRoleAcceptance": 2,
              "wave299GraphifyWitnessAcceptance": 4,
              "wave308AdversarialRoleAcceptance": 2,
              "wave310LiveEgressSessionAcceptance": 3,
              "wave316WalSessionParentAcceptance": 44,
              "wave315DirectRetryAcceptance": 13,
              "wave318RetentionInventoryAcceptance": 3,
              "wave323CodegraphParentAcceptance": 25,
              "wave329ResearchCliAcceptance": 3,
              "wave333ManagedBrowserResolverAcceptance": 8,
              "wave331DreamIntegratedAcceptance": 24,
              "wave350DreamOutboxAcceptance": 2,
              "wave347ManagedBrowserInstallAcceptance": 11,
              "wave352ManagedBrowserCliAcceptance": 7,
              "wave355EnabledRetentionCallerAcceptance": 2,
              "wave359DreamOptInAcceptance": 12,
              "wave363NightlyBackupAcceptance": 26,
              "wave366CliReferenceAcceptance": 1,
              "wave374ScopedClusterAcceptance": 6,
              "wave383ErrorAwareRetryAcceptance": 2,
              "wave373AuthenticatedLeafAcceptance": 22,
              "wave392OutboundClusterAcceptance": 10,
              "wave400SessionPreviewAcceptance": 4,
              "wave411CapabilityDecayAcceptance": 17,
              "wave449QuorumBudgetAcceptance": 37,
              "wave462RepairAcceptance": 4,
              "wave469LiveAuthorityStreamWizardAcceptance": 3,
              "wave478ConcurrentBudgetAcceptance": 1,
              "wave485BuddyTaskDelegateAcceptance": 2,
              "wave500RequestBoundConsentProofAcceptance": 2,
          }
          required_names = []
          for wave_name, expected in expected_wave_counts.items():
              wave = payload.get(wave_name)
              if not isinstance(wave, dict):
                  raise SystemExit(f"Grouped test matrix has no {wave_name} object")
              names = wave.get("requiredTests")
              if not isinstance(names, list) or len(names) != expected:
                  raise SystemExit(f"{wave_name} requiredTests must contain exactly {expected} identities")
              required_names.extend(names)
          expected_count = sum(expected_wave_counts.values())
          if expected_count != 890:
              raise SystemExit(f"Grouped required test catalog must contain exactly 890 identities (got {expected_count})")
          if not all(isinstance(name, str) and name for name in required_names):
              raise SystemExit("Grouped requiredTests contains an invalid identity")
          if len(required_names) != expected_count or len(set(required_names)) != expected_count:
              raise SystemExit("Grouped requiredTests contains a duplicate or missing identity")
          native_tests = payload.get("requiredNativeTests")
          if not isinstance(native_tests, list):
              raise SystemExit("Grouped test matrix has no requiredNativeTests")

          # This hosted lane is Linux. Require exact platform identities in
          # addition to portable tests; other native platforms run in full CI.
          platform_tests = payload.get("requiredNativeTestsByPlatform", {}).get("Linux", [])
          if not isinstance(platform_tests, list):
              raise SystemExit("Grouped Linux native source records must be a list")
          native_tests = native_tests + platform_tests
          records = []
          for name in required_names:
              matches = [entry for entry in native_tests if isinstance(entry, dict) and entry.get("test") == name]
              if len(matches) != 1:
                  raise SystemExit(f"Grouped required test must have exactly one native source record: {name}")
              entry = matches[0]
              source_path = entry.get("sourcePath")
              expected = entry.get("sourceSha256")
              if not isinstance(source_path, str) or not source_path or not isinstance(expected, str) or not expected:
                  raise SystemExit(f"Grouped native source record is incomplete: {name}")
              source = root / source_path
              if not source.is_file():
                  raise SystemExit(f"Grouped native source is missing: {source_path}")
              actual = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual.lower() != expected.lower():
                  raise SystemExit(f"Grouped native source SHA-256 mismatch: {source_path}")
              records.append({"test": name, "sourcePath": source_path, "sourceSha256": actual})
          if len(records) != expected_count or len({record["test"] for record in records}) != expected_count:
              raise SystemExit("Grouped source identity binding has missing or duplicate records")

          (evidence_root / "source" / "fixture-identities.json").write_text(
              json.dumps({"schema": "neoth-grouped-research-skill-evidence/v1", "fixtures": records}, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          (evidence_root / "source" / "fixture-names.txt").write_text(
              "\n".join(required_names) + "\n", encoding="utf-8", newline="\n"
          )
          (evidence_root / "source" / "inputs.sha256").write_text(
              "".join(
                  f"{hashlib.sha256((root / path).read_bytes()).hexdigest()}  {path}\n"
                  for path in ("docs/verification/gold-wave95-96-test-matrix.json", "SRC/Cargo.lock")
              ),
              encoding="utf-8",
              newline="\n",
          )
          (evidence_root / "receipt" / "selection.json").write_text(
              json.dumps({"requiredCount": len(required_names), "selectedCount": len(records)}, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Compile and run exact research and Skill lifecycle fixtures
        id: research-lifecycle-fixtures
        shell: bash
        working-directory: SRC
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/w190-research-lifecycle"
          log="$evidence_root/log/cargo-research-lifecycle.log"
          : > "$log"
          : > "$evidence_root/receipt/failed-fixtures.txt"
          expected_count="$(wc -l < "$evidence_root/source/fixture-names.txt" | tr -d '[:space:]')"
          [[ "$expected_count" == "890" ]] || {
            echo "Grouped fixture catalog must contain exactly 890 identities (got $expected_count)" >&2
            exit 1
          }
          artifact_log="$evidence_root/log/neoth-lib-test-artifacts.jsonl"
          compile_stderr="$evidence_root/log/neoth-lib-test-compile.stderr.log"
          binary_receipt="$evidence_root/receipt/neoth-lib-test-binary.json"
          {
            echo "=== compile neoth lib test binary ==="
            if ! cargo test -p neoth --lib --locked --no-run --message-format=json > "$artifact_log" 2> "$compile_stderr"; then
              cat "$compile_stderr"
              python - "$artifact_log" <<'PY'
          import json
          import pathlib
          import sys

          rendered_limit = 20
          rendered_char_limit = 8_000
          emitted = 0
          for raw in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines():
              try:
                  message = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              diagnostic = message.get("message") if message.get("reason") == "compiler-message" else None
              rendered = diagnostic.get("rendered") if isinstance(diagnostic, dict) else None
              if not isinstance(rendered, str) or not rendered:
                  continue
              if emitted == rendered_limit:
                  print(f"Cargo diagnostic output capped at {rendered_limit} messages", file=sys.stderr)
                  break
              print(rendered[:rendered_char_limit], end="" if rendered.endswith("\n") else "\n", file=sys.stderr)
              emitted += 1
          if emitted == 0:
              print("no rendered Cargo diagnostics found; raw JSON artifact is retained", file=sys.stderr)
          PY
              echo "neoth lib test binary compilation failed" >&2
              exit 1
            fi
            cat "$compile_stderr"
            python - "$artifact_log" "$binary_receipt" <<'PY'
          import json
          import pathlib
          import sys

          artifact_log = pathlib.Path(sys.argv[1])
          receipt_path = pathlib.Path(sys.argv[2])
          candidates = []
          for line_number, raw in enumerate(artifact_log.read_text(encoding="utf-8").splitlines(), 1):
              try:
                  message = json.loads(raw)
              except json.JSONDecodeError as error:
                  raise SystemExit(f"invalid Cargo JSON artifact line {line_number}: {error}")
              if message.get("reason") != "compiler-artifact":
                  continue
              target = message.get("target")
              if not isinstance(target, dict):
                  continue
              profile = message.get("profile")
              if not isinstance(profile, dict):
                  continue
              executable = message.get("executable")
              if (
                  target.get("name") == "neothd"
                  and target.get("kind") == ["lib"]
                  and target.get("src_path", "").endswith("/neothd/src/lib.rs")
                  and profile.get("test") is True
              ):
                  if not isinstance(executable, str) or not executable:
                      raise SystemExit("neoth lib test artifact has no executable path")
                  candidates.append({
                      "packageId": message.get("package_id"),
                      "targetName": target.get("name"),
                      "targetKind": target.get("kind"),
                      "sourcePath": target.get("src_path"),
                      "executable": executable,
                  })
          if len(candidates) != 1:
              raise SystemExit(
                  f"expected exactly one neoth lib test binary artifact, found {len(candidates)}"
              )
          receipt_path.write_text(
              json.dumps(
                  {
                      "schema": "neoth-research-lifecycle-test-binary/v1",
                      "candidateCount": len(candidates),
                      "selected": candidates[0],
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          } 2>&1 | tee -a "$log"
          test_binary="$(python - "$binary_receipt" <<'PY'
          import json
          import pathlib
          import sys

          receipt = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          selected = receipt.get("selected")
          executable = selected.get("executable") if isinstance(selected, dict) else None
          if receipt.get("candidateCount") != 1 or not isinstance(executable, str) or not executable:
              raise SystemExit("selected neoth lib test binary receipt is incomplete or ambiguous")
          print(executable)
          PY
          )"
          [[ -x "$test_binary" ]] || {
            echo "selected neoth lib test binary is not executable: $test_binary" >&2
            exit 1
          }
          {
            echo "=== selected neoth lib test binary ==="
            printf '%s\n' "$test_binary"
          } 2>&1 | tee -a "$log"
          # Cargo runs package tests from the package root; keep direct harness
          # execution at the same working directory.
          cd neothd
          executed=0
          while IFS= read -r test_name; do
            test_name="${test_name%$'\r'}"
            [[ -n "$test_name" ]] || { echo "empty Grouped fixture identity" >&2; exit 1; }
            {
              echo "=== list $test_name ==="
              if ! listed="$("$test_binary" "$test_name" --exact --list)"; then
                echo "exact Grouped discovery failed: $test_name" >&2
                exit 1
              fi
              listed="${listed//$'\r'/}"
              printf '%s\n' "$listed"
              match_count="$(printf '%s\n' "$listed" | grep -Fxc "$test_name: test" || true)"
              [[ "$match_count" == "1" ]] || {
                echo "exact Grouped discovery must select one fixture: $test_name (got $match_count)" >&2
                exit 1
              }
              echo "=== run $test_name ==="
              if ! timeout --kill-after=10s 180s "$test_binary" "$test_name" --exact --test-threads=1; then
                echo "exact Grouped fixture failed: $test_name" >&2
                printf '%s\n' "$test_name" >> "$evidence_root/receipt/failed-fixtures.txt"
              fi
            } 2>&1 | tee -a "$log"
            executed=$((executed + 1))
          done < "$evidence_root/source/fixture-names.txt"
          [[ "$executed" == "$expected_count" ]] || {
            echo "Grouped execution count must be $expected_count (got $executed)" >&2
            exit 1
          }
          printf '%s\n' "$executed" > "$evidence_root/receipt/executed-count.txt"
          # Finish independent fixtures to expose all behavior failures in one
          # run. Failed discovery/compilation remains an immediate failure.
          [[ ! -s "$evidence_root/receipt/failed-fixtures.txt" ]] || {
            echo "selected behavior fixtures failed; see failed-fixtures.txt" >&2
            exit 1
          }

      - name: Save interrupted gold-smoke Cargo cache
        if: ${{ !cancelled() && failure() && steps.research-lifecycle-fixtures.outcome == 'failure' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-gold-smoke-cargo-partial-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload grouped source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w190-research-lifecycle-source-${{ github.sha }}
          path: ${{ runner.temp }}/w190-research-lifecycle/source/
          if-no-files-found: error
          retention-days: 14

      - name: Upload grouped Cargo log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w190-research-lifecycle-log-${{ github.sha }}
          path: ${{ runner.temp }}/w190-research-lifecycle/log/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload grouped lifecycle receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w190-research-lifecycle-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/w190-research-lifecycle/receipt/
          if-no-files-found: error
          retention-days: 14
