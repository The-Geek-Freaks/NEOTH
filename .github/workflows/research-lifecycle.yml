name: Research and loop lifecycle quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-lifecycle:
    name: Research and loop lifecycle quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require main branch dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Research and loop lifecycle quality is main-only (got $GITHUB_REF)"
            exit 1
          }

      - name: Prepare source log and receipt evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/w190-research-lifecycle"
          mkdir -p "$evidence_root/source" "$evidence_root/log" "$evidence_root/receipt"
          git rev-parse HEAD > "$evidence_root/receipt/source-head.txt"
          printf '%s\n' "$GITHUB_REF" > "$evidence_root/receipt/source-ref.txt"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Restore gold-smoke Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-gold-smoke-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gold-smoke-cargo-partial-${{ hashFiles('SRC/Cargo.lock') }}-
            ${{ runner.os }}-gold-smoke-cargo-

      - name: Bind W190-W191 required tests to source identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          evidence_root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "w190-research-lifecycle"
          matrix_path = root / "docs/verification/gold-wave95-96-test-matrix.json"
          payload = json.loads(matrix_path.read_text(encoding="utf-8"))
          wave190 = payload.get("wave190")
          if not isinstance(wave190, dict):
              raise SystemExit("W190 test matrix has no wave190 object")
          wave191 = payload.get("wave191")
          if not isinstance(wave191, dict):
              raise SystemExit("W191 test matrix has no wave191 object")
          wave193 = payload.get("wave193")
          if not isinstance(wave193, dict):
              raise SystemExit("W193 test matrix has no wave193 object")
          wave190_names = wave190.get("requiredTests")
          wave191_names = wave191.get("requiredTests")
          wave193_names = wave193.get("requiredTests")
          native_tests = payload.get("requiredNativeTests")
          if not isinstance(wave190_names, list) or len(wave190_names) != 10:
              raise SystemExit("W190 requiredTests must contain exactly 10 identities")
          if not isinstance(wave191_names, list) or len(wave191_names) != 5:
              raise SystemExit("W191 requiredTests must contain exactly 5 identities")
          if not isinstance(wave193_names, list) or len(wave193_names) != 5:
              raise SystemExit("W193 requiredTests must contain exactly 5 identities")
          required_names = wave190_names + wave191_names + wave193_names
          if len(required_names) != 20:
              raise SystemExit("W190-W191-W193 requiredTests must contain exactly 20 identities")
          if not all(isinstance(name, str) and name for name in required_names):
              raise SystemExit("W190-W191-W193 requiredTests contains an invalid identity")
          if len(required_names) != len(set(required_names)):
              raise SystemExit("W190-W191-W193 requiredTests contains a duplicate identity")
          if not isinstance(native_tests, list):
              raise SystemExit("W190-W191-W193 test matrix has no requiredNativeTests")

          records = []
          for name in required_names:
              matches = [entry for entry in native_tests if isinstance(entry, dict) and entry.get("test") == name]
              if len(matches) != 1:
                  raise SystemExit(f"W190-W191-W193 required test must have exactly one native source record: {name}")
              entry = matches[0]
              source_path = entry.get("sourcePath")
              expected = entry.get("sourceSha256")
              if not isinstance(source_path, str) or not source_path or not isinstance(expected, str) or not expected:
                  raise SystemExit(f"W190-W191-W193 native source record is incomplete: {name}")
              source = root / source_path
              if not source.is_file():
                  raise SystemExit(f"W190-W191-W193 native source is missing: {source_path}")
              actual = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual.lower() != expected.lower():
                  raise SystemExit(f"W190-W191-W193 native source SHA-256 mismatch: {source_path}")
              records.append({"test": name, "sourcePath": source_path, "sourceSha256": actual})
          if len(records) != 20 or len({record["test"] for record in records}) != 20:
              raise SystemExit("W190-W191-W193 source identity binding must contain exactly 20 unique records")

          (evidence_root / "source" / "fixture-identities.json").write_text(
              json.dumps({"schema": "neoth-w190-w191-w193-research-loop-evidence/v1", "fixtures": records}, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          (evidence_root / "source" / "fixture-names.txt").write_text(
              "\n".join(required_names) + "\n", encoding="utf-8", newline="\n"
          )
          (evidence_root / "source" / "inputs.sha256").write_text(
              "".join(
                  f"{hashlib.sha256((root / path).read_bytes()).hexdigest()}  {path}\n"
                  for path in ("docs/verification/gold-wave95-96-test-matrix.json", "SRC/Cargo.lock")
              ),
              encoding="utf-8",
              newline="\n",
          )
          (evidence_root / "receipt" / "selection.json").write_text(
              json.dumps({"requiredCount": len(required_names), "selectedCount": len(records)}, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Compile and run exact W190-W191-W193 research and loop fixtures
        id: research-lifecycle-fixtures
        shell: bash
        working-directory: SRC
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/w190-research-lifecycle"
          log="$evidence_root/log/cargo-research-lifecycle.log"
          : > "$log"
          executed=0
          while IFS= read -r test_name; do
            test_name="${test_name%$'\r'}"
            [[ -n "$test_name" ]] || { echo "empty W190-W191-W193 fixture identity" >&2; exit 1; }
            {
              echo "=== list $test_name ==="
              if ! listed="$(cargo test -p neoth --lib --locked "$test_name" -- --exact --list)"; then
                echo "exact W190-W191-W193 discovery failed: $test_name" >&2
                exit 1
              fi
              listed="${listed//$'\r'/}"
              printf '%s\n' "$listed"
              match_count="$(printf '%s\n' "$listed" | grep -Fxc "$test_name: test" || true)"
              [[ "$match_count" == "1" ]] || {
                echo "exact W190-W191-W193 discovery must select one fixture: $test_name (got $match_count)" >&2
                exit 1
              }
              echo "=== run $test_name ==="
              if ! cargo test -p neoth --lib --locked "$test_name" -- --exact --test-threads=1; then
                echo "exact W190-W191-W193 fixture failed: $test_name" >&2
                exit 1
              fi
            } 2>&1 | tee -a "$log"
            executed=$((executed + 1))
          done < "$evidence_root/source/fixture-names.txt"
          [[ "$executed" == "20" ]] || {
            echo "W190-W191-W193 execution count must be 20 (got $executed)" >&2
            exit 1
          }
          printf '%s\n' "$executed" > "$evidence_root/receipt/executed-count.txt"

      - name: Save interrupted gold-smoke Cargo cache
        if: ${{ !cancelled() && failure() && steps.research-lifecycle-fixtures.outcome == 'failure' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-gold-smoke-cargo-partial-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload W190-W191 source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w190-research-lifecycle-source-${{ github.sha }}
          path: ${{ runner.temp }}/w190-research-lifecycle/source/
          if-no-files-found: error
          retention-days: 14

      - name: Upload W190-W191 Cargo log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w190-research-lifecycle-log-${{ github.sha }}
          path: ${{ runner.temp }}/w190-research-lifecycle/log/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload W190-W191 lifecycle receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w190-research-lifecycle-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/w190-research-lifecycle/receipt/
          if-no-files-found: error
          retention-days: 14
