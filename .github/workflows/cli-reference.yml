name: Generate CLI reference

on:
  workflow_dispatch:
    inputs:
      companion_regressions:
        description: 'Also run canonical mobile core plus retained companion authority and revoke regressions'
        type: boolean
        default: false
      codegraph_contract_regressions:
        description: 'Also run the exact Codegraph catalog, stdio, and descriptor contract regressions'
        type: boolean
        default: false
      updater_status_regressions:
        description: 'Also run the exact updater-status live-binding and offline-boundary regressions'
        type: boolean
        default: false
      macos_provider_regression:
        description: 'Run the exact native macOS Buddy provider GUI callback regression'
        type: boolean
        default: false
      slim_clippy:
        description: 'Also verify the exact slim-core production Clippy contract'
        type: boolean
        default: false
      workspace_clippy:
        description: 'Also verify the exact Linux-quality workspace Clippy contract'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cli-reference-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  generate:
    name: Export exact-source CLI reference
    if: ${{ !inputs.macos_provider_regression }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.workspace_clippy && 90 || (inputs.companion_regressions || inputs.codegraph_contract_regressions || inputs.updater_status_regressions) && 75 || 50 }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
          components: clippy

      - name: Install Linux workspace-Clippy build deps
        if: ${{ inputs.workspace_clippy }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            xauth \
            xvfb \
            ffmpeg

      # This cache family belongs to this workflow. Its key intentionally tracks
      # the Rust toolchain and lockfile, while Cargo still validates all current
      # source inputs; it is an accelerator, never an acceptance receipt.
      - name: Restore CLI-reference Cargo checkpoint
        id: cli-reference-cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-cli-reference-rust-1.91-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cli-reference-rust-1.91-cargo-

      - name: Check exact-source slim-core production Clippy
        if: ${{ inputs.slim_clippy }}
        timeout-minutes: 20
        working-directory: SRC
        run: cargo clippy -p neoth --lib --bins --no-default-features --locked --no-deps -- -D warnings

      # Catch shared test-code type errors before dispatching the expensive
      # native matrix. This checks default-feature core tests without linking
      # or executing them; it does not replace native behavior or GUI gates.
      - name: Type-check core test targets before native validation
        timeout-minutes: 15
        working-directory: SRC
        run: cargo check -p neoth --tests --locked --keep-going

      - name: Build current public CLI
        timeout-minutes: 25
        working-directory: SRC
        run: cargo build -p neoth --bin neoth --locked

      # This optional contract is deliberately narrow: each listed identity is
      # discovered and run once, while the ordinary type check, public CLI
      # build, generated-reference export, and optional companion mode remain
      # unchanged. It is a source-bound hosted proof, not a substitute for the
      # broader product or native acceptance lanes.
      - name: Run exact Codegraph contract regressions
        id: exact_codegraph_contract
        if: ${{ inputs.codegraph_contract_regressions }}
        timeout-minutes: 20
        working-directory: SRC
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/neoth-codegraph-contract-regressions"
          mkdir -p "$proof_dir"
          printf '%s\n' "$GITHUB_SHA" > "$proof_dir/source-head.txt"
          cat > "$proof_dir/selection.tsv" <<'EOF'
          mcp::codegraph_server::tests::codegraph_tools_lists_twelve_canonical_tools	SRC/neothd/src/mcp/codegraph_server.rs
          mcp::codegraph_server::tests::stdio_server_negotiates_and_requires_initialized_notification	SRC/neothd/src/mcp/codegraph_server.rs
          mcp::codegraph_server::tests::generated_descriptor_allowlist_requires_exact_canonical_set_without_duplicates	SRC/neothd/src/mcp/codegraph_server.rs
          EOF
          cat > "$proof_dir/source-paths.tsv" <<'EOF'
          SRC/neothd/src/cli/mcp.rs	cli-mcp-source
          SRC/neothd/src/mcp/codegraph_server.rs	codegraph-server-source
          docs/cli-commands.md	generated-cli-reference
          .github/workflows/cli-reference.yml	workflow-source
          SRC/Cargo.lock	root-lock
          SRC/Cargo.toml	root-manifest
          SRC/neothd/Cargo.toml	neoth-manifest
          EOF
          sha256sum \
            neothd/src/cli/mcp.rs \
            neothd/src/mcp/codegraph_server.rs \
            ../docs/cli-commands.md \
            ../.github/workflows/cli-reference.yml \
            Cargo.lock \
            Cargo.toml \
            neothd/Cargo.toml > "$proof_dir/SHA256SUMS.txt"
          selected=0
          visited=0
          failed_or_missing=0
          while IFS=$'\t' read -r identity source_path; do
            test -n "$identity"
            test "$source_path" = 'SRC/neothd/src/mcp/codegraph_server.rs'
            selected=$((selected + 1))
            cargo test -p neoth --lib --locked "$identity" -- --exact --list 2>&1 | tee "$proof_dir/$selected.discovery.log"
            test "$(grep -Fxc "$identity: test" "$proof_dir/$selected.discovery.log")" -eq 1
            cargo test -p neoth --lib --locked "$identity" -- --exact --nocapture 2>&1 | tee "$proof_dir/$selected.test.log"
            test "$(grep -Fxc "test $identity ... ok" "$proof_dir/$selected.test.log")" -eq 1
            test "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$proof_dir/$selected.test.log")" -eq 1
            visited=$((visited + 1))
          done < "$proof_dir/selection.tsv"
          test "$selected" -eq 3
          test "$visited" -eq 3
          printf 'selected=%s\nvisited=%s\nfailed_or_missing=%s\n' "$selected" "$visited" "$failed_or_missing" > "$proof_dir/final-counts.txt"

      - name: Upload Codegraph contract regression evidence
        if: ${{ always() && inputs.codegraph_contract_regressions }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codegraph-contract-regressions-${{ github.sha }}
          path: ${{ runner.temp }}/neoth-codegraph-contract-regressions/
          if-no-files-found: error
          retention-days: 14

      # Reuse the producer-validated mobile core selection to avoid a copied
      # lifecycle subset drifting behind it. The two retained authority/chat
      # guards are outside core and are appended in their established order.
      # This remains a narrow hosted diagnostic, not mobile product acceptance.
      - name: Run canonical mobile core and retained companion regressions
        if: ${{ inputs.companion_regressions }}
        timeout-minutes: 20
        env:
          CARGO_TERM_COLOR: never
          RUST_BACKTRACE: '1'
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/neoth-companion-regressions"
          selection_dir="$RUNNER_TEMP/neoth-cli-mobile-selection"
          mkdir -p "$proof_dir"
          python3 .github/scripts/mobile/validate-mobile-interop-selection.py --output-dir "$selection_dir"
          printf '%s\n' "$GITHUB_SHA" > "$proof_dir/source-head.txt"
          cp "$selection_dir/core.txt" "$proof_dir/canonical-core.txt"
          cp "$selection_dir/selection-custody.json" "$proof_dir/selection-custody.json"
          cp .github/scripts/mobile/mobile-companion-interop-selection.json "$proof_dir/canonical-selection.json"
          declare -A selected=()
          while IFS= read -r identity; do
            test -n "$identity"
            test -z "${selected[$identity]+x}"
            selected[$identity]=1
            printf '%s\n' "$identity"
          done < "$proof_dir/canonical-core.txt" > "$proof_dir/selection.txt"
          for identity in \
            daemon::companion_authority::real_store_regression::status_only_grant_is_denied_before_chat_challenge_and_chat_challenge_is_one_use \
            daemon::chat_runtime::tests::companion_revoke_between_effect_intent_and_provider_start_launches_nothing
          do
            if test -z "${selected[$identity]+x}"; then
              selected[$identity]=1
              printf '%s\n' "$identity" >> "$proof_dir/selection.txt"
            fi
          done
          python3 - "$proof_dir/selection-custody.json" > "$selection_dir/canonical-source-paths.txt" <<'PY'
          import json
          import sys
          custody = json.load(open(sys.argv[1], encoding='utf-8'))
          for path in custody['sourcePaths']:
              print(path)
          PY
          canonical_source_count="$(wc -l < "$selection_dir/canonical-source-paths.txt")"
          test "$canonical_source_count" -gt 0
          test "$(sort -u "$selection_dir/canonical-source-paths.txt" | wc -l)" -eq "$canonical_source_count"
          cat "$selection_dir/canonical-source-paths.txt" > "$proof_dir/source-paths.txt"
          declare -A source_paths=()
          while IFS= read -r source_path; do
            test -n "$source_path"
            test -z "${source_paths[$source_path]+x}"
            source_paths[$source_path]=1
          done < "$proof_dir/source-paths.txt"
          for source_path in \
            'SRC/neothd/src/daemon/companion_authority.rs' \
            'SRC/neothd/src/daemon/chat_runtime.rs'
          do
            if test -z "${source_paths[$source_path]+x}"; then
              source_paths[$source_path]=1
              printf '%s\n' "$source_path" >> "$proof_dir/source-paths.txt"
            fi
          done
          expected_source_count="${#source_paths[@]}"
          test "$(wc -l < "$proof_dir/source-paths.txt")" -eq "$expected_source_count"
          while IFS= read -r source_path; do
            sha256sum "$source_path"
          done < "$proof_dir/source-paths.txt" > "$proof_dir/SHA256SUMS.txt"
          canonical_identity_count="$(wc -l < "$proof_dir/canonical-core.txt")"
          test "$canonical_identity_count" -gt 0
          expected_identity_count="${#selected[@]}"
          test "$(wc -l < "$proof_dir/selection.txt")" -eq "$expected_identity_count"
          ordinal=0
          while IFS= read -r identity; do
            ordinal=$((ordinal + 1))
            (cd SRC && cargo test -p neoth --lib --locked "$identity" -- --exact --nocapture) 2>&1 | tee "$proof_dir/$ordinal.log"
            test "$(grep -Fxc "test $identity ... ok" "$proof_dir/$ordinal.log")" -eq 1
            test "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$proof_dir/$ordinal.log")" -eq 1
          done < "$proof_dir/selection.txt"
          test "$ordinal" -eq "$expected_identity_count"
          printf 'selected=%s\nvisited=%s\nfailed_or_missing=0\n' "$expected_identity_count" "$ordinal" > "$proof_dir/final-counts.txt"

      - name: Upload companion regression evidence
        if: ${{ always() && inputs.companion_regressions }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companion-regressions-${{ github.sha }}
          path: ${{ runner.temp }}/neoth-companion-regressions/
          if-no-files-found: error
          retention-days: 14

      # This optional batch shares the already-built default-feature neoth
      # library. It executes six updater-status, five self-update owner, six manual-Cron, and five
      # offline agents-owner identities once each, retaining source-bound logs for narrow status-and-owner admission.
      - name: Run exact updater-status regressions
        if: ${{ inputs.updater_status_regressions }}
        timeout-minutes: 20
        working-directory: SRC
        env:
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/neoth-updater-status-regressions"
          mkdir -p "$proof_dir"
          printf '%s\n' "$GITHUB_SHA" > "$proof_dir/source-head.txt"
          printf '%s\n' \
            'daemon::audit_rpc::tests::updater_status_client_round_trips_live_listener_and_refuses_invalid_requests' \
            'daemon::audit_rpc::tests::updater_status_binding_rejects_noncanonical_or_foreign_chain_bases' \
            'cli::updater::tests::live_daemon_binding_selects_only_a_canonical_direct_child' \
            'cli::updater::tests::default_status_uses_offline_canonical_chain_when_daemon_absent' \
            'daemon::audit_rpc::client::tests::updater_status_connected_stall_expires_hard_without_offline_fallback' \
            'daemon::audit_rpc::client::tests::updater_status_offline_classification_uses_io_kind_never_diagnostics' \
            'daemon::audit_rpc::tests::w2452_self_update_audit_live_listener_admits_only_d2_and_de' \
            'cli::update::tests::w2452_consumer_offline_d2_then_de_continues_preexisting_rotated_tail' \
            'daemon::pidfile::tests::w2452_offline_audit_interlock_preserves_pid_bytes_and_blocks_daemon_start' \
            'cli::update::tests::w2452_consumer_connected_postwrite_eof_never_creates_offline_segment' \
            'cli::update::tests::w2452_applied_audit_failure_blocks_render_and_restart_gate' \
            'cli::cron::tests::w2457_manual_cron_owner_runs_real_job_and_drains_writer_once' \
            'cli::cron::tests::w2457_manual_cron_owner_refuses_live_daemon_before_work_factory' \
            'cli::cron::tests::w2457_manual_cron_owner_runs_exactly_one_offline_work_transaction' \
            'daemon::pidfile::tests::w2457_manual_cron_interlock_preserves_bytes_and_respects_daemon_holder' \
            'daemon::pidfile::tests::w2457_manual_cron_interlock_fails_closed_for_malformed_held_pidfile' \
            'daemon::pidfile::tests::w2457_manual_cron_interlock_blocks_cross_process_daemon_start' \
            'cli::agents::tests::w2464_live_daemon_rejects_real_fan_out_before_provider_or_wal' \
            'cli::agents::tests::w2464_offline_real_fan_out_finalizes_writer_before_owner_release' \
            'cli::agents::tests::w2464_controlled_real_fan_out_blocks_daemon_until_terminal_writer_cleanup' \
            'cli::agents::tests::w2464_cancelled_real_fan_out_retains_lease_until_retained_writer_clone_releases' \
            'daemon::pidfile::tests::w2464_agents_fan_out_interlock_blocks_cross_process_daemon_start_then_releases' > "$proof_dir/selection.txt"
          printf '%s\n' \
            'SRC/neothd/src/cli/serve.rs' \
            'SRC/neothd/src/cli/serve_tasks.rs' \
            'SRC/neothd/src/cli/updater.rs' \
            'SRC/neothd/src/daemon/audit_rpc/server.rs' \
            'SRC/neothd/src/daemon/audit_rpc/client.rs' \
            'SRC/neothd/src/daemon/audit_rpc/mod.rs' \
            'SRC/neothd/src/daemon/audit_rpc/tests.rs' \
            'SRC/neothd/src/cli/update.rs' \
            'SRC/neothd/src/cli/internal.rs' \
            'SRC/neothd/src/cli/agents.rs' \
            'SRC/neothd/src/daemon/pidfile.rs' \
            'SRC/neothd/src/wal/writer.rs' \
            'SRC/neothd/src/cli/cron.rs' \
            'SRC/neothd/src/cron/runner.rs' \
            'SRC/neothd/src/config/mod.rs' \
            'SRC/neothd/src/consent.rs' \
            'SRC/neothd/src/providers/cost_authorization.rs' > "$proof_dir/source-paths.txt"
          while IFS= read -r source_path; do
            sha256sum "${source_path#SRC/}"
          done < "$proof_dir/source-paths.txt" > "$proof_dir/SHA256SUMS.txt"
          expected_updater_count="$(wc -l < "$proof_dir/selection.txt")"
          test "$expected_updater_count" -eq 22
          ordinal=0
          while IFS= read -r identity; do
            ordinal=$((ordinal + 1))
            cargo test -p neoth --lib --locked "$identity" -- --exact --nocapture 2>&1 | tee "$proof_dir/$ordinal.log"
            test "$(grep -Fxc "test $identity ... ok" "$proof_dir/$ordinal.log")" -eq 1
            test "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$proof_dir/$ordinal.log")" -eq 1
          done < "$proof_dir/selection.txt"
          test "$ordinal" -eq "$expected_updater_count"
          printf 'selected=%s\nvisited=%s\nfailed_or_missing=0\n' "$expected_updater_count" "$ordinal" > "$proof_dir/final-counts.txt"

      - name: Upload updater-status regression evidence
        if: ${{ always() && inputs.updater_status_regressions }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-status-regressions-${{ github.sha }}
          path: ${{ runner.temp }}/neoth-updater-status-regressions/
          if-no-files-found: error
          retention-days: 14

      # Generate without changing the committed snapshot or bypassing its
      # equality test. A maintainer imports only the SHA/digest-bound output.
      # Export before the longer workspace gate so valid derived docs can be
      # imported independently. An artifact is not a workspace-Clippy pass.
      - name: Export generated reference
        timeout-minutes: 1
        shell: bash
        run: |
          reference_dir="$RUNNER_TEMP/neoth-cli-reference"
          mkdir -p "$reference_dir"
          SRC/target/debug/neoth completions --reference > "$reference_dir/cli-commands.md"
          printf '%s\n' "$GITHUB_SHA" > "$reference_dir/source-head.txt"
          (cd "$reference_dir" && sha256sum cli-commands.md > SHA256SUMS)

      - name: Upload generated reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-cli-reference
          path: ${{ runner.temp }}/neoth-cli-reference/
          if-no-files-found: error

      - name: Check exact Linux-quality workspace Clippy
        if: ${{ inputs.workspace_clippy }}
        # The successful Core614 gate took 28m20s; Core309 hit 30m without
        # compiler diagnostics. Keep the same check with enough hosted time.
        timeout-minutes: 45
        working-directory: SRC
        run: cargo clippy --workspace --all-targets --features "wizard wasm-plugin-host" --locked -- -D warnings

      # Publish one immutable, successful compile checkpoint per lockfile.
      # Failed or cancelled gates never save state, and cache contents do not
      # constitute evidence for the strict source and release checks above.
      - name: Save completed CLI-reference Cargo checkpoint
        if: ${{ success() && steps.cli-reference-cargo-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 10
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ steps.cli-reference-cargo-cache.outputs.cache-primary-key }}

  macos-provider-regression:
    name: Exact macOS Buddy provider GUI regression
    if: ${{ inputs.macos_provider_regression && github.ref == 'refs/heads/main' }}
    runs-on: macos-14
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout requested source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Prepare exact macOS provider regression evidence
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/neoth-macos-provider-regression"
          mkdir -p "$proof_dir"
          printf '%s\n' "$GITHUB_SHA" > "$proof_dir/source-head.txt"
          printf '%s\n' 'buddy_provider_gui_tests::w2263_buddy_provider_callbacks_execute_canonical_receipts_then_refresh_readback' > "$proof_dir/test-identity.txt"

      - name: Setup Rust 1.91
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Restore macOS native Cargo checkpoint
        id: macos-provider-cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          # The provider-fixture checkpoint is producer-specific. Existing
          # generic complete/partial keys remain fallback accelerators only.
          key: ${{ runner.os }}-1.91-cargo-provider-${{ hashFiles('SRC/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-1.91-cargo-provider-${{ hashFiles('SRC/Cargo.lock') }}-
            ${{ runner.os }}-1.91-cargo-complete-${{ hashFiles('SRC/Cargo.lock') }}
            ${{ runner.os }}-1.91-cargo-partial-${{ hashFiles('SRC/Cargo.lock') }}-
            ${{ runner.os }}-1.91-cargo-${{ hashFiles('SRC/Cargo.lock') }}
            ${{ runner.os }}-1.91-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-nextest@0.9.134

      # The native harness resolves target/debug/neoth beside its test executable;
      # build the real public CLI before running its GUI callback path.
      - name: Build current public CLI for native GUI harness
        timeout-minutes: 45
        working-directory: SRC
        shell: bash
        run: |
          set -o pipefail
          cargo build -p neoth --bin neoth --locked 2>&1 | tee "$RUNNER_TEMP/neoth-macos-provider-regression/cli-build.log"

      - name: Compile exact macOS native GUI harness
        id: compile-macos-native-gui
        timeout-minutes: 120
        working-directory: SRC
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run -p neothd-gui --test neothd-gui-macos-native --locked --profile ci --features neothd-gui/macos-native-gui-test --no-run 2>&1 | tee "$RUNNER_TEMP/neoth-macos-provider-regression/gui-compile.log"

      - name: Run exact Buddy provider GUI callback regression
        timeout-minutes: 35
        working-directory: SRC
        shell: bash
        run: |
          set -euo pipefail
          identity='buddy_provider_gui_tests::w2263_buddy_provider_callbacks_execute_canonical_receipts_then_refresh_readback'
          proof_dir="$RUNNER_TEMP/neoth-macos-provider-regression"
          filter="test(=$identity)"
          cargo nextest list -p neothd-gui --test neothd-gui-macos-native --locked --profile ci --features neothd-gui/macos-native-gui-test -E "$filter" --message-format json > "$proof_dir/selection.json"
          python3 - "$proof_dir/selection.json" "$identity" <<'PY'
          import json
          import sys

          listing_path, identity = sys.argv[1:]
          with open(listing_path, encoding="utf-8") as listing_file:
              listing = json.load(listing_file)
          suites = listing.get("rust-suites")
          if not isinstance(suites, dict):
              raise SystemExit("nextest selection has no rust-suites object")
          binary_id = "neothd-gui::neothd-gui-macos-native"
          suite = suites.get(binary_id)
          if not isinstance(suite, dict) or suite.get("binary-id") != binary_id:
              raise SystemExit("exact macOS provider test is not owned by the native GUI harness")
          testcases = suite.get("testcases")
          if not isinstance(testcases, dict):
              raise SystemExit("native GUI harness has no testcase map")
          runnable = [
              name for name, testcase in testcases.items()
              if isinstance(testcase, dict)
              and testcase.get("ignored") is False
              and testcase.get("filter-match") == {"status": "matches"}
          ]
          if runnable != [identity]:
              raise SystemExit(f"exact macOS provider selection is not one runnable test: {runnable!r}")
          PY
          cargo nextest run -p neothd-gui --test neothd-gui-macos-native --locked --profile ci --features neothd-gui/macos-native-gui-test -E "$filter" --no-tests=fail --nocapture 2>&1 | tee "$proof_dir/test.log"

      # This is an optional, producer-specific accelerator. It runs after the
      # unchanged strict callback so cache upload cannot add latency to its
      # measurement or turn its result into acceptance evidence.
      - name: Save completed macOS provider compile checkpoint
        if: ${{ always() && !cancelled() && steps.compile-macos-native-gui.outcome == 'success' && steps.macos-provider-cargo-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ steps.macos-provider-cargo-cache.outputs.cache-primary-key }}

      - name: Upload macOS provider regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-provider-regression-${{ github.sha }}
          path: ${{ runner.temp }}/neoth-macos-provider-regression/
          if-no-files-found: error
          retention-days: 14
