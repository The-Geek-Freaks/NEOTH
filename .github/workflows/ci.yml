# =============================================================================
# NEOTH — Continuous Integration
#
# Pick #30 (Session 14, Codex feedback 2026-05-19): Windows added to the
# matrix. Local MSVC verification has been stable for the full Session-14
# work (2000+ tests, Win32 DACL on WAL + views.db + code_map.db, no /proc
# or AF_UNIX dependencies in the daemon's hot path). The Phase-1 rationale
# (Unix-only IPC + signals) no longer holds — the daemon's signal handler
# uses `tokio::signal::ctrl_c()` on Windows + SIGTERM/SIGHUP on Unix, both
# gated behind `cfg(unix)/cfg(windows)`. Tests that genuinely require Unix
# semantics (mlock, /proc, AF_UNIX) are individually `#[cfg(unix)]`-gated.
#
# Workspace-wide invariant (CDX-08):
# Every cargo step below uses --workspace explicitly so cross-crate breakage
# (e.g. a neothd refactor that breaks the plugin SDK's stable surface) fails
# CI rather than slipping through under cargo's default-package selection.
# The workspace has three members today: neothd, neoth-plugin-sdk, neothd-gui.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # On a PR, a new push cancels the stale run (saves runner minutes during
  # rapid iteration). On a push to MAIN, do NOT cancel: each commit must get a
  # complete CI verdict. The `${{ github.sha }}` suffix gives every main commit
  # its own concurrency group, so a fast push cadence (e.g. an autonomous build
  # loop pushing every ~20 min while CI takes ~30 min) no longer leaves main
  # perpetually "cancelled" instead of green — the prior root cause of CI never
  # showing a success status on main.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0          # cleaner cache hits in CI
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        toolchain: [stable, beta]
        # Windows CI runs only on stable — beta on Windows would
        # double the runtime budget for marginal value (beta-gated
        # bugs are extremely rare on the MSVC target). Re-enable
        # if a regression surfaces.
        exclude:
          - os: windows-2022
            toolchain: beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      # ADV-11 (F4 finding): the `inventory` crate uses #[link_section]
      # for plugin-hook registration. On x86_64-pc-windows-gnu (MinGW
      # default without VS Build Tools), GNU ld silently garbage-
      # collects custom link sections without --whole-archive, so
      # `inventory::iter::<Hook>().count() == 0` even though `cargo
      # build` succeeds. NEOTH targets MSVC on Windows for this reason.
      # Fail the job if a GNU toolchain ever slips in.
      - name: Enforce MSVC toolchain on Windows (ADV-11)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          host=$(rustc --version --verbose | grep '^host:' | awk '{print $2}')
          echo "rustc host triple: $host"
          if [[ "$host" != *"-msvc" ]]; then
            echo "::error::ADV-11: Windows builds require an MSVC host triple."
            echo "::error::Got '$host'. inventory!{} link-section registration"
            echo "::error::silently breaks on GNU ld; switch to a -msvc toolchain."
            exit 1
          fi

      # neothd-gui pulls Slint's Femtovg backend on Linux, which needs
      # fontconfig + X11 dev headers via yeslogic-fontconfig-sys + x11rb.
      # Skip the install on non-Linux runners (Windows + macOS ship the
      # required libs in their SDK).
      - name: Install Linux build deps (fontconfig + X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-${{ matrix.toolchain }}-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.toolchain }}-cargo-

      # Advisory, NOT a merge gate: the autonomous build loop deliberately
      # does not run `cargo fmt` (huge cross-file diffs collide with parallel
      # work), so fmt drift must not block the real correctness gates below
      # (clippy -D warnings, build, test, audit). Reports drift without
      # skipping the steps that actually prove the code works.
      - name: cargo fmt --check (workspace, advisory)
        continue-on-error: true
        working-directory: SRC
        run: cargo fmt --all -- --check

      # CDX-08 cross-crate guarantee.
      #
      # We do NOT pass `--all-features` here: that activates `qwen-cuda`,
      # whose cudarc dep panics in build.rs when `nvcc` is not on PATH —
      # which is the case on macOS-14 and Windows-2022 GitHub-hosted
      # runners. The dedicated `feature-flag compile / qwen-cuda` job
      # further down covers that feature on a CUDA-capable host.
      #
      # Stable toolchain: `-D warnings` (hard gate). Beta toolchain:
      # `-W warnings` (advisory) — beta catches stabilising clippy
      # lints early, but they shouldn't block the merge gate.
      - name: cargo clippy --workspace (stable, hard gate)
        if: matrix.toolchain == 'stable'
        working-directory: SRC
        run: cargo clippy --workspace --all-targets --features "wizard wasm-plugin-host" -- -D warnings

      - name: cargo clippy --workspace (beta, advisory)
        if: matrix.toolchain == 'beta'
        working-directory: SRC
        run: cargo clippy --workspace --all-targets --features "wizard wasm-plugin-host" -- -W warnings

      - name: cargo build --workspace --release
        working-directory: SRC
        run: cargo build --workspace --release

      # Unix runners: parallel test execution (default).
      - name: cargo test --workspace --release (unix)
        if: runner.os != 'Windows'
        working-directory: SRC
        run: cargo test --workspace --release

      # Windows runner: serialise tests with --test-threads=1.
      # Rationale: webhook_listener port-binding tests race on the
      # localhost ephemeral-port pool under parallel execution on
      # Windows. The race is harmless in production (the daemon binds
      # one port total) but trips CI. Documented as a known flake in
      # HANDOFF_2026-05-18 §8.
      - name: cargo test --workspace --release (windows, single-threaded)
        if: runner.os == 'Windows'
        working-directory: SRC
        run: cargo test --workspace --release -- --test-threads=1

      # cargo-audit runs only on Linux to save 2-3 minutes per CI cycle
      # — the advisory database is OS-independent so one run covers the
      # whole matrix.
      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-24.04'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (workspace lockfile)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: SRC
        # RUSTSEC ignores live in SRC/.cargo/audit.toml (read automatically
        # from the working directory) — shared with security.yml's audit job.
        # deny.toml [advisories].ignore is the hand-synced mirror with the
        # full reasons. The prior bare invocation had NO ignores while
        # security.yml carried 7 — that drift kept ubuntu CI red on every
        # push once RUSTSEC-2026-0187 (lopdf) + RUSTSEC-2023-0071 (rsa)
        # landed in the DB (root-caused 2026-07-02).
        run: cargo audit

      # Artifact upload: one binary per OS, restricted to non-PR pushes.
      # Without the PR guard, fork-PR runs would publish untrusted binaries
      # under the repo's artifact namespace (Release Engineer review).
      - name: Upload binary artifact (linux)
        if: |
          matrix.os == 'ubuntu-24.04' &&
          matrix.toolchain == 'stable' &&
          github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: neothd-linux-x86_64-ci
          path: SRC/target/release/neothd
          retention-days: 3

      - name: Upload binary artifact (macos)
        if: |
          matrix.os == 'macos-14' &&
          matrix.toolchain == 'stable' &&
          github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: neothd-macos-arm64-ci
          path: SRC/target/release/neothd
          retention-days: 3

      - name: Upload binary artifact (windows)
        if: |
          matrix.os == 'windows-2022' &&
          matrix.toolchain == 'stable' &&
          github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: neothd-windows-x86_64-ci
          path: SRC/target/release/neothd.exe
          retention-days: 3

  # ──────────────────────────────────────────────────────────────────
  # Pick #34 wasm32 step (Session 19, 2026-05-21)
  #
  # Closes the "missing only the wasm32-unknown-unknown CI step"
  # gap from the post-v0.1 backlog. The example plugin in
  # examples/wasm-plugin-hello/ MUST keep compiling against the
  # current wasm_plugin manifest schema + the wasmtime version the
  # daemon links against. Without this job a wasmtime bump (Session
  # 19 went 26 → 36) could silently break operator-loadable plugins.
  #
  # Linux-only because wasm32 target is host-agnostic — one job
  # covers all three host OSes.
  # ──────────────────────────────────────────────────────────────────
  wasm-plugin:
    name: example WASM plugin builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache wasm32 build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/wasm-plugin-hello/target
          key: ${{ runner.os }}-wasm32-${{ hashFiles('examples/wasm-plugin-hello/Cargo.toml') }}

      - name: cargo build --release --target wasm32-unknown-unknown
        run: |
          cargo build \
            --release \
            --target wasm32-unknown-unknown \
            --manifest-path examples/wasm-plugin-hello/Cargo.toml

      - name: Verify wasm artefact exists + has the magic header
        run: |
          ARTEFACT=examples/wasm-plugin-hello/target/wasm32-unknown-unknown/release/wasm_plugin_hello.wasm
          test -f "$ARTEFACT"
          # Magic bytes `\0asm` + version 1 LE.
          head -c 8 "$ARTEFACT" | od -An -tx1 | grep -q "00 61 73 6d 01 00 00 00"

      - name: Upload wasm artefact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: example-wasm-plugin-hello
          path: examples/wasm-plugin-hello/target/wasm32-unknown-unknown/release/wasm_plugin_hello.wasm
          retention-days: 3

  # ──────────────────────────────────────────────────────────────────
  # D14b qwen-cuda / qwen-metal feature-flag compile (Session 19)
  #
  # Real GPU runs need a runner with CUDA / Metal toolchain installed
  # — out of scope for free GitHub Actions runners. This job runs the
  # feature-flag compile only, which catches the most common failure
  # mode (the feature gate compiles cleanly against the candle API).
  # GPU forward-pass + sampling-loop verification still needs an
  # operator with the matching host hardware.
  #
  # qwen-cuda runs on ubuntu (nvcc not actually invoked — `cargo check
  # --features qwen-cuda` compiles candle's CUDA gate without needing
  # the CUDA toolkit because candle-core 0.8 declares the kernels
  # via `bindgen_cuda` only at build-time of the *kernels* crate, not
  # at our crate's check time). qwen-metal runs on macos for the same
  # reason.
  # ──────────────────────────────────────────────────────────────────
  feature-matrix:
    name: feature-flag compile / ${{ matrix.feature }}
    runs-on: ${{ matrix.os }}
    # 2026-05-26: cudarc 0.13.9's build.rs unconditionally execs `nvcc`
    # and panics when it's missing — the old comment claiming "nvcc not
    # actually invoked" was outdated. Free GitHub-hosted runners don't
    # ship the CUDA toolkit so the qwen-cuda compile-check is expected
    # to fail. Marking the JOB continue-on-error so a CUDA-host-required
    # feature doesn't gate the whole matrix; an operator with a CUDA
    # workstation runs the verification locally (compile + actual GPU
    # forward-pass). qwen-metal on macOS-14 still runs hard since the
    # Metal toolchain ships in the Xcode SDK.
    continue-on-error: ${{ matrix.feature == 'qwen-cuda' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, feature: qwen-cuda }
          - { os: macos-14, feature: qwen-metal }
          # PC-01 clipboard — verify arboard (x11rb + wl-clipboard-rs) compiles on
          # a headless Linux runner (the pure-Rust backends need no display libs
          # at build time; default-OFF in source so this matrix entry is its check).
          - { os: ubuntu-24.04, feature: os-clipboard }
          # GR-RESID-IROH — the experimental iroh QUIC cluster transport. Compile-
          # verifies the full iroh dep tree gates cleanly (default-OFF in source;
          # the unit tests run elsewhere — the loopback round-trip is #[ignore]
          # because it needs a live relay/discovery network).
          - { os: ubuntu-24.04, feature: cluster-iroh }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SRC/target
          key: ${{ runner.os }}-feature-${{ matrix.feature }}-${{ hashFiles('SRC/Cargo.lock') }}

      - name: Pre-flight — verify nvcc available (qwen-cuda only)
        if: matrix.feature == 'qwen-cuda'
        run: |
          if command -v nvcc >/dev/null 2>&1; then
            nvcc --version
          else
            echo "::warning::nvcc not on PATH; cudarc build.rs will panic. Skipping qwen-cuda compile-check on this runner (continue-on-error)."
            exit 0
          fi

      - name: cargo check --features ${{ matrix.feature }}
        if: matrix.feature != 'qwen-cuda' || hashFiles('/usr/local/cuda/bin/nvcc', '/usr/bin/nvcc') != ''
        working-directory: SRC
        run: cargo check -p neothd --features ${{ matrix.feature }}

  # ──────────────────────────────────────────────────────────────────
  # HARNESS-05 — committed gold-smoke eval suite. Builds neothd and runs
  # `neothd eval` over the deterministic, no-LLM, config-free smoke suite
  # (version/help/capabilities/fact-check + harness self-check). The suite
  # exits non-zero on any case failure → this job gates the build. The
  # report.json + report.md are uploaded as artifacts (even on failure) so
  # a maintainer can see exactly which smoke case broke.
  # The `check` job above already build+tests default + neoth-gui + the mcp
  # core via `cargo {build,test} --workspace --release`; the feature-matrix
  # job above adds cluster-iroh — together these cover the requested
  # default + cluster-iroh + gui + mcp matrix.
  # ──────────────────────────────────────────────────────────────────
  gold-smoke:
    name: gold-smoke eval suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-gold-smoke-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gold-smoke-cargo-

      - name: Build neothd (release)
        working-directory: SRC
        run: cargo build -p neothd --bin neothd --release

      - name: Run gold-smoke eval suite
        working-directory: SRC
        run: |
          export PATH="$PWD/target/release:$PATH"
          neothd eval neothd/eval-suites/gold-smoke.json --out-dir "$GITHUB_WORKSPACE/eval-report"

      - name: Upload eval report (report.json + report.md)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-smoke-report
          path: |
            eval-report/report.json
            eval-report/report.md
          if-no-files-found: error
