# =============================================================================
# NEOTH — Continuous Integration
#
# Pick #30 (Session 14, Codex feedback 2026-05-19): Windows added to the
# matrix. Local MSVC verification has been stable for the full Session-14
# work (2000+ tests, Win32 DACL on WAL + views.db + code_map.db, no /proc
# or AF_UNIX dependencies in the daemon's hot path). The Phase-1 rationale
# (Unix-only IPC + signals) no longer holds — the daemon's signal handler
# uses `tokio::signal::ctrl_c()` on Windows + SIGTERM/SIGHUP on Unix, both
# gated behind `cfg(unix)/cfg(windows)`. Tests that genuinely require Unix
# semantics (mlock, /proc, AF_UNIX) are individually `#[cfg(unix)]`-gated.
#
# Workspace-wide invariant (CDX-08):
# General build/test/lint steps use --workspace explicitly so cross-crate
# breakage (e.g. a neothd refactor that breaks the plugin SDK's stable surface)
# fails CI rather than slipping through under cargo's default-package
# selection. Explicit package/feature/MSRV contract probes are documented
# exceptions and select their intended target with -p/--manifest-path.
# The workspace has five members: neoth, neoth-plugin-sdk, neothd-gui,
# neoth-migrate, and neoth-relay.
# =============================================================================

name: CI

on:
  schedule:
    - cron: '17 2 * * 1'       # weekly integration proof, Monday 02:17 UTC
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Rapid Gold pushes use preflight.yml and do not enqueue this full matrix.
  # A newer PR, scheduled, or milestone run supersedes an older run for the
  # same ref. release.yml still requires a fresh green exact-HEAD verdict.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0          # cleaner cache hits in CI
  RUST_BACKTRACE: 1
  # CI exercises debug test binaries. Full DWARF on the monolithic test binary
  # adds several GB at link time and can exhaust a hosted runner before tests
  # start. Release artifacts are built only by release.yml and are unaffected.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  keet-bridge:
    name: Keet companion / frozen standalone
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.32.1 --activate

      - name: Install, verify, test, and package
        working-directory: bridges/keet
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run check:notices
          pnpm test
          pnpm run make:linux-x64
          test -x out/linux-x64/neoth-keet-bridge
          EXPECTED="$(node -p 'require("./package.json").version')"
          test "$(out/linux-x64/neoth-keet-bridge --version)" = "$EXPECTED"

  license-notices:
    name: Exact distribution license notices
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify lost-feature inventory contract
        run: python3 scripts/test_lost_feature_integrity.py

      - name: Verify OpenClaw provider parity snapshot
        run: python3 packaging/tests/test_openclaw_provider_parity.py

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Verify all locked release-target notices
        run: python3 packaging/generate_rust_notices.py --check

      - name: Verify clean-machine authenticity bootstrap contract
        run: python3 packaging/test_bootstrap_verifier.py

      - name: Verify release workflow and public asset contracts
        run: |
          python3 .github/release-tools/test-release-isolation.py
          python3 packaging/tests/test_release_asset_contract.py
          python3 packaging/tests/test_release_capability_contract.py
          python3 packaging/tests/test_release_gate_contract.py

  release-signer:
    name: Isolated release signer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
          components: rustfmt

      - name: Cache signer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .github/release-tools/neoth-release-signer/target/
          key: release-signer-${{ hashFiles('.github/release-tools/neoth-release-signer/Cargo.lock') }}

      - name: Verify formatting
        run: cargo fmt --manifest-path .github/release-tools/neoth-release-signer/Cargo.toml -- --check

      - name: Test locked signer implementation
        run: cargo test --locked --manifest-path .github/release-tools/neoth-release-signer/Cargo.toml

      - name: Install cargo-audit
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-audit

      # ci.yml audits exactly one dependency graph. The primary workspace
      # lockfile remains owned by security.yml; this isolated signer lockfile
      # is not part of that workspace scan and must keep its own contract.
      - name: Audit signer lockfile without workspace exceptions
        working-directory: .github/release-tools/neoth-release-signer
        run: cargo audit

  linux-quality:
    name: Linux quality / Rust 1.91
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Warm caches otherwise compile all large workspace frontends together
      # and can exceed the hosted runner's memory budget.
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust 1.91
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
          components: rustfmt, clippy

      - name: Install Linux build deps (fontconfig + X11)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - name: Cache Cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: linux-1.91-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            linux-1.91-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-nextest@0.9.134

      - name: cargo fmt --check (workspace)
        timeout-minutes: 5
        working-directory: SRC
        run: cargo fmt --all -- --check

      # GOLD-SEC-16: keep the supported no-default-feature launcher contract
      # separate because workspace feature unification enables wizard.
      - name: cargo clippy slim core
        timeout-minutes: 20
        working-directory: SRC
        run: cargo clippy -p neoth --lib --bins --no-default-features --locked --no-deps -- -D warnings

      # CDX-08 cross-crate guarantee. qwen-cuda remains in the dedicated
      # feature matrix because hosted runners do not provide nvcc.
      - name: cargo clippy workspace
        timeout-minutes: 30
        working-directory: SRC
        run: cargo clippy --workspace --all-targets --features "wizard wasm-plugin-host" --locked -- -D warnings

      - name: cargo doctest workspace
        timeout-minutes: 20
        working-directory: SRC
        run: cargo test --workspace --doc --locked

      - name: cargo nextest workspace (Linux)
        timeout-minutes: 50
        working-directory: SRC
        env:
          # On a cold/evicted cache this step compiles the whole workspace
          # test profile; at 2 build jobs the parallel neothd + GUI frontend
          # compiles exceed the hosted runner's memory budget (3x exit 143 at
          # the same compile point, 2026-07-20). One job keeps the peak
          # bounded; the warm-cache case loses nothing.
          CARGO_BUILD_JOBS: 1
        run: |
          rm -f target/nextest/ci/junit.xml
          cargo nextest run --workspace --locked --profile ci

      - name: Upload Linux JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-junit-linux
          path: SRC/target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  platform-tests:
    name: ${{ matrix.os }} tests / Rust 1.91
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            test_threads: 4
            junit_name: macos
          - os: windows-2022
            # Localhost port-binding tests race on Windows under parallel
            # process execution; serial execution preserves the real contract.
            test_threads: 1
            junit_name: windows
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust 1.91
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Enforce MSVC toolchain on Windows (ADV-11)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          host=$(rustc --version --verbose | grep '^host:' | awk '{print $2}')
          echo "rustc host triple: $host"
          if [[ "$host" != *"-msvc" ]]; then
            echo "::error::ADV-11: Windows builds require an MSVC host triple."
            echo "::error::Got '$host'. inventory!{} link-section registration"
            echo "::error::silently breaks on GNU ld; switch to a -msvc toolchain."
            exit 1
          fi

      - name: Cache Cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-1.91-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.91-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-nextest@0.9.134

      - name: cargo nextest workspace
        timeout-minutes: 50
        shell: bash
        working-directory: SRC
        run: |
          rm -f target/nextest/ci/junit.xml
          cargo nextest run --workspace --locked --profile ci --test-threads ${{ matrix.test_threads }}

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-junit-${{ matrix.junit_name }}
          path: SRC/target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  beta-advisory:
    name: Ubuntu beta compile + Clippy (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust beta
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # beta selected below
        with:
          toolchain: beta
          components: clippy

      - name: Install Linux build deps (fontconfig + X11)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - name: Cache Cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: linux-beta-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            linux-beta-cargo-

      - name: cargo clippy workspace (beta)
        timeout-minutes: 40
        working-directory: SRC
        run: cargo clippy --workspace --all-targets --features "wizard wasm-plugin-host" --locked -- -W warnings

  # ──────────────────────────────────────────────────────────────────
  # Pick #34 wasm32 step (Session 19, 2026-05-21)
  #
  # Closes the wasm32 example-coverage gap from the post-v0.1 backlog.
  # Every shipped example MUST keep compiling against the versioned
  # neoth-plugin-sdk guest ABI. Without this job an SDK or hostcall change
  # could silently leave operator-facing examples unbuildable.
  #
  # Linux-only because wasm32 target is host-agnostic — one job
  # covers all three host OSes.
  # ──────────────────────────────────────────────────────────────────
  wasm-plugin:
    name: example WASM plugins build against ABI v1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
          targets: wasm32-unknown-unknown

      - name: Cache wasm32 build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/wasm-plugin-hello/target
            SRC/examples/wasm_plugins/echo/target
            SRC/examples/wasm_plugins/recall_summariser/target
            SRC/examples/wasm_plugins/hook_post_provider/target
          key: ${{ runner.os }}-wasm32-${{ hashFiles('examples/wasm-plugin-hello/Cargo.toml', 'examples/wasm-plugin-hello/src/**/*.rs', 'SRC/examples/wasm_plugins/**/Cargo.toml', 'SRC/examples/wasm_plugins/**/src/**/*.rs', 'SRC/neoth-plugin-sdk/Cargo.toml', 'SRC/neoth-plugin-sdk/src/**/*.rs') }}

      - name: Build all shipped guest examples
        run: |
          for manifest in \
            examples/wasm-plugin-hello/Cargo.toml \
            SRC/examples/wasm_plugins/echo/Cargo.toml \
            SRC/examples/wasm_plugins/recall_summariser/Cargo.toml \
            SRC/examples/wasm_plugins/hook_post_provider/Cargo.toml
          do
            cargo build --release --target wasm32-unknown-unknown --manifest-path "$manifest"
          done

      - name: Verify WASM artefacts + versioned NEOTH exports
        run: |
          for artefact in \
            examples/wasm-plugin-hello/target/wasm32-unknown-unknown/release/wasm_plugin_hello.wasm \
            SRC/examples/wasm_plugins/echo/target/wasm32-unknown-unknown/release/neoth_plugin_echo.wasm \
            SRC/examples/wasm_plugins/recall_summariser/target/wasm32-unknown-unknown/release/neoth_plugin_recall_summariser.wasm \
            SRC/examples/wasm_plugins/hook_post_provider/target/wasm32-unknown-unknown/release/neoth_plugin_hook_post_provider.wasm
          do
            test -f "$artefact"
            # Magic bytes `\0asm` + version 1 LE.
            head -c 8 "$artefact" | od -An -tx1 | grep -q "00 61 73 6d 01 00 00 00"
            grep -a -q "neoth_abi_version" "$artefact"
            grep -a -q "neoth_run" "$artefact"
          done

      - name: Upload wasm artefact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: example-wasm-plugins
          path: |
            examples/wasm-plugin-hello/target/wasm32-unknown-unknown/release/wasm_plugin_hello.wasm
            SRC/examples/wasm_plugins/echo/target/wasm32-unknown-unknown/release/neoth_plugin_echo.wasm
            SRC/examples/wasm_plugins/recall_summariser/target/wasm32-unknown-unknown/release/neoth_plugin_recall_summariser.wasm
            SRC/examples/wasm_plugins/hook_post_provider/target/wasm32-unknown-unknown/release/neoth_plugin_hook_post_provider.wasm
          retention-days: 3

  # ──────────────────────────────────────────────────────────────────
  # D14b qwen-cuda / qwen-metal feature-flag compile (Session 19)
  #
  # Real GPU runs need a runner with CUDA / Metal toolchain installed
  # — out of scope for free GitHub Actions runners. This job runs the
  # feature-flag compile only, which catches the most common failure
  # mode (the feature gate compiles cleanly against the candle API).
  # GPU forward-pass + sampling-loop verification still needs an
  # operator with the matching host hardware.
  #
  # qwen-cuda runs on ubuntu (nvcc not actually invoked — `cargo check
  # --features qwen-cuda` compiles candle's CUDA gate without needing
  # the CUDA toolkit because candle-core 0.8 declares the kernels
  # via `bindgen_cuda` only at build-time of the *kernels* crate, not
  # at our crate's check time). qwen-metal runs on macos for the same
  # reason.
  # ──────────────────────────────────────────────────────────────────
  feature-matrix:
    name: feature-flag compile / ${{ matrix.feature }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # 2026-05-26: cudarc 0.13.9's build.rs unconditionally execs `nvcc`
    # and panics when it's missing — the old comment claiming "nvcc not
    # actually invoked" was outdated. Free GitHub-hosted runners don't
    # ship the CUDA toolkit so the qwen-cuda compile-check is expected
    # to fail. Marking the JOB continue-on-error so a CUDA-host-required
    # feature doesn't gate the whole matrix; an operator with a CUDA
    # workstation runs the verification locally (compile + actual GPU
    # forward-pass). qwen-metal on macOS-14 still runs hard since the
    # Metal toolchain ships in the Xcode SDK.
    continue-on-error: ${{ matrix.feature == 'qwen-cuda' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, feature: qwen-cuda }
          - { os: macos-14, feature: qwen-metal }
          # PC-01 clipboard — verify arboard (x11rb + wl-clipboard-rs) compiles on
          # a headless Linux runner (the pure-Rust backends need no display libs
          # at build time; default-OFF in source so this matrix entry is its check).
          - { os: ubuntu-24.04, feature: os-clipboard }
          # C6 / GR-RESID-IROH — the iroh QUIC cluster transport is default-OFF
          # for ordinary source builds but part of the native release-desktop
          # bundle. This compile sentinel covers the full iroh dependency tree;
          # test_release_capability_contract.py separately proves every native
          # release target selects that bundle while musl stays release-server.
          # The live relay/discovery round-trip remains #[ignore].
          - { os: ubuntu-24.04, feature: cluster-iroh }
          # TERMIX / GOLD-DEP-RUSSH-01 — SSH forwarding is deliberately a
          # source-build opt-in, never a stock release capability.  Compile
          # and run its hermetic contract tests on the patched lockfile so the
          # optional client dependency cannot silently rot behind the default
          # feature set.
          - { os: ubuntu-24.04, feature: ssh-tunnel }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SRC/target
          key: ${{ runner.os }}-feature-${{ matrix.feature }}-${{ hashFiles('SRC/Cargo.lock') }}

      - name: Pre-flight — verify nvcc available (qwen-cuda only)
        id: cuda-preflight
        if: matrix.feature == 'qwen-cuda'
        run: |
          if command -v nvcc >/dev/null 2>&1; then
            nvcc --version
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::nvcc not on PATH; cudarc build.rs will panic. Skipping qwen-cuda compile-check on this runner (continue-on-error)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo check --features ${{ matrix.feature }}
        if: matrix.feature != 'qwen-cuda' || steps.cuda-preflight.outputs.available == 'true'
        working-directory: SRC
        run: cargo check -p neoth --locked --features ${{ matrix.feature }}

      - name: cargo test ssh-tunnel contract
        if: matrix.feature == 'ssh-tunnel'
        working-directory: SRC
        run: cargo test -p neoth --locked --features ssh-tunnel transport::ssh_ -- --test-threads=1

  # ──────────────────────────────────────────────────────────────────
  # HARNESS-05 — committed gold-smoke eval suite. Builds both public binaries and runs
  # `neoth eval` over the deterministic, no-LLM, config-free smoke suite
  # (version/help/capabilities/fact-check + harness self-check). The suite
  # exits non-zero on any case failure → this job gates the build. The
  # report.json + report.md are uploaded as artifacts (even on failure) so
  # a maintainer can see exactly which smoke case broke.
  # The Linux quality and platform-test jobs cover the default workspace,
  # including GUI and MCP. The feature matrix adds cluster-iroh coverage.
  # ──────────────────────────────────────────────────────────────────
  gold-smoke:
    name: gold-smoke eval suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-gold-smoke-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gold-smoke-cargo-

      # The Linux quality job owns the MSRV/no-default Clippy contract. Smoke
      # only needs runnable launchers; debug avoids a second release/LTO build.
      - name: Build neoth + neothd compatibility launchers (debug)
        timeout-minutes: 25
        working-directory: SRC
        run: cargo build -p neoth --bins --locked

      - name: Run gold-smoke eval suite
        timeout-minutes: 10
        working-directory: SRC
        run: |
          export PATH="$PWD/target/debug:$PATH"
          neoth eval neothd/eval-suites/gold-smoke.json --out-dir "$GITHUB_WORKSPACE/eval-report"

      - name: Upload eval report (report.json + report.md)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gold-smoke-report
          path: |
            eval-report/report.json
            eval-report/report.md
          if-no-files-found: error

  # One stable branch-protection target. `always()` is essential: without it,
  # a failed prerequisite would skip this job and could leave an old required
  # check looking green. Advisory beta is intentionally not a dependency.
  gold-ci:
    name: Gold CI
    if: ${{ always() }}
    needs:
      - keet-bridge
      - license-notices
      - release-signer
      - linux-quality
      - platform-tests
      - wasm-plugin
      - feature-matrix
      - gold-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Gold contract
        shell: bash
        env:
          KEET_BRIDGE: ${{ needs['keet-bridge'].result }}
          LICENSE_NOTICES: ${{ needs['license-notices'].result }}
          RELEASE_SIGNER: ${{ needs['release-signer'].result }}
          LINUX_QUALITY: ${{ needs['linux-quality'].result }}
          PLATFORM_TESTS: ${{ needs['platform-tests'].result }}
          WASM_PLUGIN: ${{ needs['wasm-plugin'].result }}
          FEATURE_MATRIX: ${{ needs['feature-matrix'].result }}
          GOLD_SMOKE: ${{ needs['gold-smoke'].result }}
        run: |
          failed=0
          for contract in \
            "keet-bridge=$KEET_BRIDGE" \
            "license-notices=$LICENSE_NOTICES" \
            "release-signer=$RELEASE_SIGNER" \
            "linux-quality=$LINUX_QUALITY" \
            "platform-tests=$PLATFORM_TESTS" \
            "wasm-plugin=$WASM_PLUGIN" \
            "feature-matrix=$FEATURE_MATRIX" \
            "gold-smoke=$GOLD_SMOKE"
          do
            name="${contract%%=*}"
            result="${contract#*=}"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name finished with result '$result'"
              failed=1
            else
              echo "$name: success"
            fi
          done
          exit "$failed"
