# =============================================================================
# NEOTH — Release Workflow
#
# Triggered by tags matching vMAJOR.MINOR.PATCH (e.g., v0.1.0).
# Builds release binaries for Linux (gnu + musl + aarch64) and macOS (x86_64 + arm64).
# Windows: stretch goal, not included in Phase 1 (see ci.yml for rationale).
# Signing: cosign keyless (Sigstore OIDC) — no key management required.
# Release Engineer review (OPEN_DECISIONS.md D-001): cargo-dist rejected;
# the matrix below already implements the chosen pipeline.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # stable, e.g. v1.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # pre-release, e.g. v1.0.0-gold-rc1 / -rc.1 / -beta.1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false    # never cancel an in-progress release

# Job-level permissions — see release job for additional id-token: write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # Build matrix
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 GNU — native runner
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: false
            archive_ext: tar.gz

          # Linux x86_64 musl — static binary, no libc dependency
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            use_cross: true
            archive_ext: tar.gz

          # Linux aarch64 GNU — cross-compiled (Raspberry Pi / ARM servers)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            use_cross: true
            archive_ext: tar.gz

          # macOS x86_64 (Intel)
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            archive_ext: tar.gz

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
            archive_ext: tar.gz

          # Windows x86_64 — R-08 Session 28: zero-install Windows
          # path needs a release artifact for install-binary.ps1 +
          # the winget submission to point at. .zip not tar.gz per
          # Windows convention + winget's NestedInstallerType:
          # portable default handling.
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            use_cross: false
            archive_ext: zip

          # Windows aarch64 (ARM laptops — Surface Pro X, Snapdragon
          # X Elite). Native build on windows-2022 runners.
          - target: aarch64-pc-windows-msvc
            os: windows-2022
            use_cross: false
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: release-${{ matrix.target }}-cargo-${{ hashFiles('SRC/neothd/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-cargo-

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # MAR-02: bake the release verification pubkey into the binary at build
      # time. `neoth release setup` sets this repo VARIABLE automatically via
      # `gh variable set` — nothing to edit here. Empty until setup runs (then
      # the self-updater simply has no pinned key yet, which is the safe default).
      # Native desktop targets ship two extra features that the headless cross
      # targets below (musl, aarch64-linux) deliberately OMIT — same native-only
      # rationale for both:
      #   * `os-clipboard` (PC-01) — `arboard`'s x11rb/wl-clipboard-rs (Linux) /
      #     native (macOS/Windows) backends build cleanly on a native runner; a
      #     clipboard is moot on a headless server and cross-compiling a display
      #     backend is fragile. Runtime gated by `tools.os.clipboard.*` (off by default).
      #   * `wasm-plugin-host` (V10-04, GOLD-HON-15) — bundles the wasmtime/cranelift
      #     WASM runtime so the desktop release binaries carry the plugin sandbox
      #     (per the "features default-ON in release binaries" rule). The cross
      #     server/embedded targets omit it (wasmtime cross-compile is fragile +
      #     plugins are a desktop surface). Runtime gated by `plugins.*` + the
      #     default-inactive `neoth plugin enable` flow; source builds opt in via
      #     `--features wasm-plugin-host`.
      - name: Build (native)
        if: "!matrix.use_cross"
        working-directory: SRC/neothd
        env:
          NEOTH_RELEASE_MINISIGN_PUBKEY: ${{ vars.NEOTH_RELEASE_MINISIGN_PUBKEY }}
        run: cargo build --release --features os-clipboard,wasm-plugin-host --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        working-directory: SRC/neothd
        env:
          NEOTH_RELEASE_MINISIGN_PUBKEY: ${{ vars.NEOTH_RELEASE_MINISIGN_PUBKEY }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package archive
        id: archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_EXT="${{ matrix.archive_ext }}"
          ARCHIVE_NAME="neothd-${VERSION}-${TARGET}"

          # Binary name + extension differ on Windows. R-08 (Session
          # 28): branch on $TARGET so install-binary.{sh,ps1} +
          # winget can both pull the right archive shape.
          if [[ "$TARGET" == *windows* ]]; then
            BINARY_NAME="neothd.exe"
          else
            BINARY_NAME="neothd"
          fi
          BINARY_PATH="SRC/target/${TARGET}/release/${BINARY_NAME}"

          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "${BINARY_PATH}" "dist/${ARCHIVE_NAME}/${BINARY_NAME}"
          cp README.md "dist/${ARCHIVE_NAME}/" 2>/dev/null || true
          cp LICENSE-MIT "dist/${ARCHIVE_NAME}/" 2>/dev/null || true
          cp LICENSE-APACHE "dist/${ARCHIVE_NAME}/" 2>/dev/null || true

          cd dist
          if [[ "$ARCHIVE_EXT" == "zip" ]]; then
            # Windows path — 7-Zip ships on every windows-2022 runner
            # and produces a true ZIP that matches the winget
            # NestedInstallerType: portable expectation.
            7z a -tzip "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}/" >/dev/null
            ARCHIVE_FILE="${ARCHIVE_NAME}.zip"
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}/"
            ARCHIVE_FILE="${ARCHIVE_NAME}.tar.gz"
          fi

          # SHA-256 — sha256sum is available on Linux + macOS + Git-
          # for-Windows bash. The output goes to a .sha256 sidecar
          # that install-binary.{sh,ps1} verify against.
          SHA256=$(sha256sum "${ARCHIVE_FILE}" | cut -d' ' -f1)
          echo "${SHA256}  ${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256"

          echo "archive=${ARCHIVE_FILE}" >> "$GITHUB_OUTPUT"
          echo "checksum=${ARCHIVE_FILE}.sha256" >> "$GITHUB_OUTPUT"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.archive_name }}
          path: |
            dist/${{ steps.archive.outputs.archive }}
            dist/${{ steps.archive.outputs.checksum }}
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Create GitHub Release + upload all assets
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create release + upload assets
      id-token: write       # cosign keyless OIDC signing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      # Keyless cosign signing via Sigstore OIDC — no secret keys required.
      # Verification: `cosign verify-blob --bundle <file>.cosign.bundle <file>`
      # Identity bound to the GitHub Actions workflow URL; transparency log entry
      # on Rekor (https://rekor.sigstore.dev).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign archives (cosign keyless — public-download provenance)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cd dist
          # Sign BOTH the Unix tarballs AND the Windows .zip archives —
          # the prior loop covered only *.tar.gz, leaving every Windows
          # release artifact unsigned (gremium quality-lens v1.0 blocker).
          shopt -s nullglob
          for f in *.tar.gz *.zip; do
            cosign sign-blob --yes "$f" --bundle "${f}.cosign.bundle"
          done

      # Session 28f release-drift fix — TWO complementary signing schemes:
      #   1. cosign (above) → public-download PROVENANCE (Sigstore
      #      transparency log; anyone downloading verifies the artifact was
      #      built by this exact workflow). No key management.
      #   2. minisign (below) → self-update VERIFY path (the daemon's
      #      `updater::sig_verify` has a compile-time pinned pubkey + reads
      #      a `<asset>.minisig` companion; ed25519, offline, rustls/no-ring
      #      friendly). MV-01b prereq #2.
      #
      # The minisign step is GRACEFUL-SKIP when the secrets aren't set, so
      # adding the secrets is a non-breaking deploy: existing releases keep
      # shipping cosign-only; once Alex provisions the keypair the next
      # release also ships `.minisig` companions and the unattended
      # self-update path (`require_signature = true`) starts accepting them.
      #
      # Provisioning (Alex action, one-time — DAU-friendly, NO `minisign` tool,
      # no install, no password). MAR-02: the keygen + signing are BUILT INTO
      # neoth itself (`updater::sig_keygen`):
      #   1. Run `neoth release keygen` locally — NEOTH mints the keypair
      #      IN-PROCESS and prints the PUBLIC key + the SECRET (base64) with
      #      step-by-step instructions.
      #   2. Repo Settings → Secrets → Actions → add:
      #        NEOTH_RELEASE_MINISIGN_SECRET = the SECRET line from keygen.
      #   3. Bake the PUBLIC key into the release builds: set
      #      `NEOTH_RELEASE_MINISIGN_PUBKEY=<public key from keygen>` on the
      #      `cargo build --release` steps (working-directory: SRC/neothd, above).
      #
      # GRACEFUL-SKIP when the secret is unset (non-breaking: existing releases
      # keep shipping cosign-only; once the secret lands the next release also
      # ships `.minisig` companions and unattended self-update accepts them).
      - name: Sign archives (neoth release sign — in-process, self-update verify)
        env:
          NEOTH_RELEASE_MINISIGN_SECRET: ${{ secrets.NEOTH_RELEASE_MINISIGN_SECRET }}
        run: |
          if [ -z "$NEOTH_RELEASE_MINISIGN_SECRET" ]; then
            echo "::notice::NEOTH_RELEASE_MINISIGN_SECRET not set — skipping signing."
            echo "::notice::Run 'neoth release keygen' + add the secret to enable unattended self-update."
            exit 0
          fi
          # Dogfood: sign with NEOTH's OWN in-process signer — the linux neothd
          # binary from this very release. No external minisign tool, no password.
          LINUX_TARBALL=$(ls dist/*x86_64-unknown-linux-gnu*.tar.gz 2>/dev/null | head -1)
          if [ -z "$LINUX_TARBALL" ]; then
            echo "::error::no linux x86_64 tarball in dist/ to source the signer binary"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signer"
          tar xzf "$LINUX_TARBALL" -C "$RUNNER_TEMP/signer"
          NEOTH=$(find "$RUNNER_TEMP/signer" -name neothd -type f | head -1)
          if [ -z "$NEOTH" ]; then
            echo "::error::neothd binary not found inside $LINUX_TARBALL"; exit 1
          fi
          chmod +x "$NEOTH"
          cd dist
          shopt -s nullglob
          for f in *.tar.gz *.zip; do
            "$NEOTH" release sign "$f" \
              || { echo "::error::neoth release sign failed for $f"; exit 1; }
          done
          echo "minisign companions produced (in-process, no minisign tool):"
          ls -la *.minisig 2>/dev/null || echo "  (none — investigate)"

      - name: Create GitHub Release
        # SHA-pinned to immutable release tag (mutable @v2 tag is hijack risk).
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.0.8
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
            dist/*.cosign.bundle
            dist/*.minisig
          body: |
            ## Installation

            Download the binary for your platform, verify the SHA-256 checksum,
            and place `neothd` on your PATH.

            ```sh
            # Verify checksum (Linux example)
            sha256sum -c neothd-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.sha256

            # Verify cosign signature (public-download provenance — proves
            # the binary was built by this GitHub Actions workflow):
            cosign verify-blob \
              --bundle neothd-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.cosign.bundle \
              --certificate-identity-regexp "https://github.com/.*/neoth/.github/workflows/release.yml@.*" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              neothd-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

            # Verify minisign signature (when a .minisig companion is present
            # — used by the daemon's `neoth update --self` for unattended
            # verification against a compile-time pinned pubkey; the public
            # key is published with each release once provisioned):
            minisign -V -P "$(cat NEOTH_RELEASE_MINISIGN_PUBKEY.txt)" \
              -m neothd-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            ```

            See [PLAN/00_DESIGN_v1.1_FINAL.md](PLAN/00_DESIGN_v1.1_FINAL.md) for architecture notes.
