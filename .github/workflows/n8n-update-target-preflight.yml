name: W1592 n8n update-target compiled CLI preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w1592-n8n-update-target-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  update-target-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
      - name: Initialize redacted preflight receipt
        shell: bash
        run: |
          set -euo pipefail
          canary_root="$RUNNER_TEMP/w1592-n8n-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 -p "$canary_root/receipt"
          printf '{"schema":1,"source_sha":"%s","scenario":"n8n_update_target_preflight","outcome":"failed","failure_stage":"workflow_not_completed"}\n' "$GITHUB_SHA" > "$canary_root/receipt/receipt.json"
      - name: Verify preflight helper boundaries
        run: python3 -m unittest discover -s packaging/tests -p test_n8n_update_target_preflight_canary.py
      - name: Restore CLI-reference Cargo checkpoint
        id: cli-reference-cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-cli-reference-rust-1.91-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cli-reference-rust-1.91-cargo-
      - name: Build current public CLI
        working-directory: SRC
        run: cargo build -p neoth --bin neoth --locked
      - name: Save completed CLI-reference Cargo checkpoint
        if: ${{ success() && steps.cli-reference-cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ steps.cli-reference-cargo-cache.outputs.cache-primary-key }}
      - name: Run compiled update-target preflight
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          canary_root="$RUNNER_TEMP/w1592-n8n-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export NEOTH_HOME="$canary_root/neoth-home" NO_COLOR=1 RUST_BACKTRACE=0
          mkdir -m 700 -p "$NEOTH_HOME" "$canary_root/receipt"
          receipt="$canary_root/receipt/receipt.json"
          preserve_receipt() {
            if [ ! -s "$receipt" ]; then
              printf '{"schema":1,"source_sha":"%s","scenario":"n8n_update_target_preflight","outcome":"failed","failure_stage":"workflow_before_receipt"}\n' "$GITHUB_SHA" > "$receipt"
            fi
          }
          trap preserve_receipt ERR
          python3 packaging/n8n_update_target_preflight_canary.py --binary SRC/target/debug/neoth --home "$NEOTH_HOME" --receipt "$receipt"
      - name: Finalize redacted receipt fallback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          canary_root="$RUNNER_TEMP/w1592-n8n-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          receipt="$canary_root/receipt/receipt.json"
          mkdir -m 700 -p "$canary_root/receipt"
          if [ ! -s "$receipt" ]; then
            printf '{"schema":1,"source_sha":"%s","scenario":"n8n_update_target_preflight","outcome":"failed","failure_stage":"workflow_receipt_missing"}\n' "$GITHUB_SHA" > "$receipt"
          fi
      - name: Upload redacted preflight receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w1592-n8n-update-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w1592-n8n-${{ github.run_id }}-${{ github.run_attempt }}/receipt/receipt.json
          if-no-files-found: warn
          retention-days: 7
