name: W330 managed-browser CFT provenance acquisition

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w330-managed-browser-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-provenance:
    # The resulting receipt is meaningful only for the source that can later
    # review and import it. This workflow never installs or launches a browser.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CFT_VERSION: 154.0.8037.57
      CFT_REVISION: "1689415"
      CFT_METADATA_URL: https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json
      CFT_ARCHIVE_LIMIT_BYTES: "536870912"
      CFT_MEMBER_LIMIT_BYTES: "536870912"
      CFT_TOTAL_UNCOMPRESSED_LIMIT_BYTES: "2147483648"
      CFT_NOTICE_LIMIT_BYTES: "262144"
      CFT_TOTAL_NOTICE_LIMIT_BYTES: "1048576"
    steps:
      - name: Checkout main without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Acquire bounded Chrome for Testing provenance only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'

          receipt_root="$RUNNER_TEMP/w330-managed-browser-provenance"
          receipt_out="$receipt_root/receipt"
          mkdir -p "$receipt_out"
          git rev-parse HEAD > "$receipt_out/source-head.txt"

          RECEIPT_OUT="$receipt_out" python3 - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import tempfile
          from datetime import datetime, timezone
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path, PurePosixPath

          VERSION = os.environ["CFT_VERSION"]
          REVISION = os.environ["CFT_REVISION"]
          METADATA_URL = os.environ["CFT_METADATA_URL"]
          ARCHIVE_LIMIT = int(os.environ["CFT_ARCHIVE_LIMIT_BYTES"])
          MEMBER_LIMIT = int(os.environ["CFT_MEMBER_LIMIT_BYTES"])
          TOTAL_UNCOMPRESSED_LIMIT = int(os.environ["CFT_TOTAL_UNCOMPRESSED_LIMIT_BYTES"])
          NOTICE_LIMIT = int(os.environ["CFT_NOTICE_LIMIT_BYTES"])
          TOTAL_NOTICE_LIMIT = int(os.environ["CFT_TOTAL_NOTICE_LIMIT_BYTES"])
          METADATA_LIMIT = 16 * 1024 * 1024
          INVENTORY_MEMBER_LIMIT = 10_000
          RECEIPT_FILE_LIMIT = 8 * 1024 * 1024
          OUT = Path(os.environ["RECEIPT_OUT"])
          source_head = (OUT / "source-head.txt").read_text(encoding="utf-8").strip()
          github_identity = {
              "server_url": os.environ.get("GITHUB_SERVER_URL", ""),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
          }
          if not source_head or any(not value for value in github_identity.values()):
              raise RuntimeError("GitHub acquisition identity is incomplete")
          if github_identity["sha"] != source_head:
              raise RuntimeError("GitHub SHA does not match checked-out source head")
          acquired_started_utc = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          TARGETS = {
              "win64": "chrome-headless-shell-win64/chrome-headless-shell.exe",
              "linux64": "chrome-headless-shell-linux64/chrome-headless-shell",
              "mac-x64": "chrome-headless-shell-mac-x64/chrome-headless-shell",
              "mac-arm64": "chrome-headless-shell-mac-arm64/chrome-headless-shell",
          }
          OFFICIAL_ARCHIVE_PREFIX = (
              f"https://storage.googleapis.com/chrome-for-testing-public/{VERSION}/"
          )
          OFFICIAL_METADATA_URL = "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json"
          if METADATA_URL != OFFICIAL_METADATA_URL:
              raise RuntimeError("metadata source is not the exact official CFT known-good URL")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise urllib.error.HTTPError(newurl, code, "redirect refused", headers, fp)

          OPENER = urllib.request.build_opener(NoRedirect())

          def open_exact(url, limit):
              request = urllib.request.Request(url, headers={"User-Agent": "NEOTH-W330-provenance/1"})
              response = OPENER.open(request, timeout=30)
              if response.geturl() != url:
                  response.close()
                  raise RuntimeError(f"redirected source refused: {url!r}")
              length = response.headers.get("Content-Length")
              if length is not None and (not length.isdecimal() or int(length) > limit):
                  response.close()
                  raise RuntimeError(f"source exceeds bounded limit: {url!r}")
              return response

          def read_bounded(url, limit):
              chunks = []
              total = 0
              with open_exact(url, limit) as response:
                  while True:
                      chunk = response.read(64 * 1024)
                      if not chunk:
                          break
                      total += len(chunk)
                      if total > limit:
                          raise RuntimeError(f"source exceeds bounded limit while reading: {url!r}")
                      chunks.append(chunk)
              return b"".join(chunks)

          def expected_url(platform):
              return (
                  f"{OFFICIAL_ARCHIVE_PREFIX}{platform}/"
                  f"chrome-headless-shell-{platform}.zip"
              )

          def validate_member(info, seen):
              name = info.filename
              path = PurePosixPath(name)
              if (
                  not name
                  or "\\" in name
                  or path.is_absolute()
                  or ".." in path.parts
                  or name in seen
              ):
                  raise RuntimeError(f"unsafe or duplicate ZIP member: {name!r}")
              seen.add(name)
              mode = info.external_attr >> 16
              file_type = stat.S_IFMT(mode)
              if file_type == stat.S_IFLNK:
                  raise RuntimeError(f"ZIP symlink refused: {name!r}")
              if file_type not in (0, stat.S_IFREG, stat.S_IFDIR):
                  raise RuntimeError(f"ZIP special file type refused: {name!r}")
              if info.file_size > MEMBER_LIMIT:
                  raise RuntimeError(f"oversize ZIP member refused: {name!r}")

          def sha256_member(zf, info):
              digest = hashlib.sha256()
              total = 0
              with zf.open(info, "r") as member:
                  while True:
                      chunk = member.read(64 * 1024)
                      if not chunk:
                          break
                      total += len(chunk)
                      if total > MEMBER_LIMIT:
                          raise RuntimeError(f"member exceeds bounded read: {info.filename!r}")
                      digest.update(chunk)
              if total != info.file_size:
                  raise RuntimeError(f"member size changed while hashing: {info.filename!r}")
              return digest.hexdigest(), total

          def capture_notice(zf, info, remaining_total):
              capture_limit = min(NOTICE_LIMIT, remaining_total)
              digest = hashlib.sha256()
              total = 0
              captured = bytearray()
              with zf.open(info, "r") as member:
                  while True:
                      chunk = member.read(64 * 1024)
                      if not chunk:
                          break
                      total += len(chunk)
                      if total > MEMBER_LIMIT:
                          raise RuntimeError(f"notice member exceeds bounded read: {info.filename!r}")
                      digest.update(chunk)
                      remaining_capture = capture_limit - len(captured)
                      if remaining_capture > 0:
                          captured.extend(chunk[:remaining_capture])
              if total != info.file_size:
                  raise RuntimeError(f"notice member size changed while hashing: {info.filename!r}")
              return {
                  "member_bytes": total,
                  "member_sha256": digest.hexdigest(),
                  "captured_bytes": len(captured),
                  "text_omitted": capture_limit == 0,
                  "text_truncated": total > len(captured),
                  "utf8_text": bytes(captured).decode("utf-8", errors="replace"),
              }

          metadata_raw = read_bounded(METADATA_URL, METADATA_LIMIT)
          metadata_sha256 = hashlib.sha256(metadata_raw).hexdigest()
          try:
              metadata = json.loads(metadata_raw)
          except json.JSONDecodeError as error:
              raise RuntimeError("official CFT metadata is not valid JSON") from error
          matches = [
              item for item in metadata.get("versions", [])
              if item.get("version") == VERSION and item.get("revision") == REVISION
          ]
          if len(matches) != 1:
              raise RuntimeError("exact CFT version/revision is absent or ambiguous in official metadata")
          downloads = matches[0].get("downloads", {}).get("chrome-headless-shell", [])
          if not isinstance(downloads, list):
              raise RuntimeError("official metadata has no headless-shell download list")
          feed_urls = {item.get("platform"): item.get("url") for item in downloads}
          if set(TARGETS) - set(feed_urls):
              raise RuntimeError("official metadata omits one or more required CFT targets")
          for platform in TARGETS:
              if feed_urls[platform] != expected_url(platform):
                  raise RuntimeError(f"official metadata URL is not the exact allowed URL for {platform}")

          target_receipts = []
          notices = []
          notice_bytes = 0
          with tempfile.TemporaryDirectory(prefix="w330-cft-") as temporary:
              temporary_path = Path(temporary)
              for platform, executable in TARGETS.items():
                  url = expected_url(platform)
                  archive = temporary_path / f"{platform}.zip"
                  archive_digest = hashlib.sha256()
                  downloaded = 0
                  try:
                      with open_exact(url, ARCHIVE_LIMIT) as response, archive.open("wb") as output:
                          while True:
                              chunk = response.read(64 * 1024)
                              if not chunk:
                                  break
                              downloaded += len(chunk)
                              if downloaded > ARCHIVE_LIMIT:
                                  raise RuntimeError(f"archive exceeds 512 MiB: {platform}")
                              archive_digest.update(chunk)
                              output.write(chunk)

                      with zipfile.ZipFile(archive) as zf:
                          infos = zf.infolist()
                          if len(infos) > INVENTORY_MEMBER_LIMIT:
                              raise RuntimeError(f"ZIP member inventory exceeds cap: {platform}")
                          seen = set()
                          total_uncompressed = 0
                          inventory = []
                          for info in infos:
                              validate_member(info, seen)
                              total_uncompressed += info.file_size
                              if total_uncompressed > TOTAL_UNCOMPRESSED_LIMIT:
                                  raise RuntimeError(f"ZIP uncompressed inventory exceeds cap: {platform}")
                              inventory.append({
                                  "name": info.filename,
                                  "compressed_bytes": info.compress_size,
                                  "uncompressed_bytes": info.file_size,
                                  "is_directory": info.is_dir(),
                              })
                          executable_infos = [info for info in infos if info.filename == executable]
                          if len(executable_infos) != 1 or executable_infos[0].is_dir():
                              raise RuntimeError(f"expected executable missing or ambiguous: {platform}")
                          executable_sha256, executable_bytes = sha256_member(zf, executable_infos[0])

                          for info in infos:
                              basename = PurePosixPath(info.filename).name.upper()
                              if info.is_dir() or not any(token in basename for token in ("LICENSE", "NOTICE", "COPYRIGHT")):
                                  continue
                              captured = capture_notice(zf, info, TOTAL_NOTICE_LIMIT - notice_bytes)
                              notice_bytes += captured["captured_bytes"]
                              notices.append({
                                  "platform": platform,
                                  "member": info.filename,
                                  **captured,
                              })

                      target_receipts.append({
                          "platform": platform,
                          "url": url,
                          "archive_bytes": downloaded,
                          "archive_sha256": archive_digest.hexdigest(),
                          "expected_executable": executable,
                          "expected_executable_bytes": executable_bytes,
                          "expected_executable_sha256": executable_sha256,
                          "zip_member_count": len(inventory),
                          "zip_uncompressed_bytes": total_uncompressed,
                          "zip_inventory": inventory,
                      })
                  finally:
                      archive.unlink(missing_ok=True)

          provenance = {
              "schema": "neoth.managed_browser.cft_provenance.v1",
              "acquisition_kind": "observed_official_tls_artifacts",
              "acquisition_started_utc": acquired_started_utc,
              "acquisition_completed_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "github_acquisition_identity": github_identity,
              "checked_out_source_head": source_head,
              "version": VERSION,
              "revision": REVISION,
              "product": "chrome-headless-shell",
              "metadata": {"url": METADATA_URL, "sha256": metadata_sha256},
              "targets": target_receipts,
              "limits": {
                  "archive_bytes_per_target": ARCHIVE_LIMIT,
                  "member_bytes": MEMBER_LIMIT,
                  "zip_uncompressed_bytes_per_target": TOTAL_UNCOMPRESSED_LIMIT,
                  "notice_bytes_per_member": NOTICE_LIMIT,
                  "notice_bytes_total": TOTAL_NOTICE_LIMIT,
              },
              "limitations": [
                  "Observed official TLS delivery and SHA-256 inventory are not vendor signatures.",
                  "This receipt does not prove browser runtime acceptance, installation, or execution.",
                  "No browser executable, archive, unpacked member, or runtime output is uploaded.",
              ],
          }
          (OUT / "cft-provenance.json").write_text(json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (OUT / "bundled-notices.json").write_text(json.dumps({"notices": notices}, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          for name in ("cft-provenance.json", "bundled-notices.json", "source-head.txt"):
              if (OUT / name).stat().st_size > RECEIPT_FILE_LIMIT:
                  raise RuntimeError(f"receipt file exceeds small-artifact cap: {name}")
          sums = []
          for path in sorted(OUT.iterdir()):
              if path.is_file() and path.name not in {"SHA256SUMS"}:
                  sums.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          (OUT / "SHA256SUMS").write_text("\n".join(sums) + "\n", encoding="utf-8")
          PY

      - name: Upload small CFT provenance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w330-managed-browser-cft-provenance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/w330-managed-browser-provenance/receipt/cft-provenance.json
            ${{ runner.temp }}/w330-managed-browser-provenance/receipt/bundled-notices.json
            ${{ runner.temp }}/w330-managed-browser-provenance/receipt/SHA256SUMS
            ${{ runner.temp }}/w330-managed-browser-provenance/receipt/source-head.txt
          if-no-files-found: error
          retention-days: 14
