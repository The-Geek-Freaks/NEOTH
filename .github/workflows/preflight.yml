# =============================================================================
# NEOTH — Fast push preflight
#
# This workflow intentionally does not compile or link the Rust workspace.
# Feature waves land in small reviewed commits, while the expensive cross-OS
# matrix runs on pull requests, the weekly integration cadence, and explicit
# milestone dispatches. Preflight itself runs on both pull requests and pushes
# to main so the same stable status context can be required before merge.
# release.yml still requires fresh successful full CI and Security runs for
# the exact release HEAD.
# =============================================================================

name: Preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-contracts:
    name: Format, metadata and static contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: GUI token and motion source contracts
        shell: pwsh
        run: |
          ./SRC/_gui_lint.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./SRC/_gui_lint.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup Rust with rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
          components: rustfmt

      - name: Test vendored arrayref provenance gate
        # Fixture coverage exercises byte tampering, archive expansion, manifest
        # dependency/build injection, VCS metadata, patch, and lock spoofing.
        # Keep this before Cargo: the yanked path patch must be proved first.
        run: python3 packaging/tests/test_arrayref_provenance_gate.py

      - name: Verify vendored arrayref provenance before Cargo metadata
        run: python3 packaging/arrayref_provenance_gate.py

      - name: Test vendored imbl provenance gate
        # Keep fixture coverage before Cargo: a path-patched backport must be
        # authenticated before the workspace graph can consume it.
        run: python3 packaging/tests/test_imbl_provenance_gate.py

      - name: Verify vendored imbl provenance before Cargo metadata
        run: python3 packaging/imbl_provenance_gate.py

      - name: Test reviewed Matrix backport provenance gate
        # Six fixture cases cover reviewed postimages, source-only boundaries,
        # archive and vendor tampering, duplicate/registry identities, and the
        # canonical anymap3 plus expiring exception constraints.
        run: python3 packaging/tests/test_matrix_backport_provenance_gate.py

      - name: Verify reviewed Matrix final provenance before Cargo metadata
        # Final acceptance intentionally validates the integrated lock and both
        # synchronized advisory exceptions; source-only mode is not acceptance.
        run: python3 packaging/matrix_backport_provenance_gate.py

      - name: Validate locked workspace metadata without dependencies
        working-directory: SRC
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Check Rust formatting without compiling
        id: format-check
        working-directory: SRC
        run: cargo fmt --all -- --check

      - name: Create exact rustfmt patch receipt
        if: ${{ failure() && steps.format-check.outcome == 'failure' }}
        shell: bash
        run: |
          receipt_dir="$RUNNER_TEMP/neoth-preflight-rustfmt-receipt"
          mkdir -p "$receipt_dir"
          git -C SRC rev-parse HEAD > "$receipt_dir/source-head.txt"
          cargo fmt --manifest-path SRC/Cargo.toml --all
          git diff --binary --full-index -- SRC > "$receipt_dir/rustfmt.patch"
          (
            cd "$receipt_dir"
            sha256sum rustfmt.patch source-head.txt > SHA256SUMS
          )

      - name: Upload exact rustfmt patch receipt
        if: ${{ failure() && steps.format-check.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preflight-rustfmt-patch-receipt
          path: ${{ runner.temp }}/neoth-preflight-rustfmt-receipt
          if-no-files-found: error
          retention-days: 14

      - name: Deny transitive build tools in static contracts
        shell: bash
        run: |
          deny_dir="$RUNNER_TEMP/neoth-preflight-deny"
          mkdir -p "$deny_dir"
          for tool in cargo rustc rustup cc gcc clang c++ ld cmake make ninja npm npx pnpm yarn bun docker podman; do
            printf '%s\n' '#!/usr/bin/env sh' \
              'echo "build tool denied by NEOTH push preflight" >&2' \
              'exit 97' > "$deny_dir/$tool"
            chmod 0755 "$deny_dir/$tool"
          done
          echo "$deny_dir" >> "$GITHUB_PATH"

      - name: Run offline packaging and release contracts
        run: |
          python3 .github/scripts/mobile/test_mobile_interop_selection.py
          python3 packaging/tests/test_ci_cadence_contract.py
          python3 packaging/tests/test_bluebubbles_daemon_adoption_canary.py
          python3 packaging/tests/test_preview_windows_workflow_contract.py
          python3 packaging/tests/test_generate_release_manifests.py
          python3 packaging/tests/test_openclaw_provider_parity.py
          python3 packaging/tests/test_publish_crates_contract.py
          python3 packaging/tests/test_roadmap_release_gate.py
          python3 packaging/tests/test_release_asset_contract.py
          python3 packaging/tests/test_release_capability_contract.py
          python3 packaging/tests/test_release_gate_contract.py
          python3 packaging/tests/test_workflow_replay_gate.py
          python3 packaging/test_bootstrap_verifier.py
          python3 .github/release-tools/test-release-isolation.py
          python3 scripts/test_lost_feature_integrity.py
          python3 -m unittest scripts/test_extract_openclaw_channel_schema.py
          bash packaging/linux/test-contracts.sh
      - name: Generate delivery inventory
        shell: bash
        run: |
          set -euo pipefail
          selection_dir="$RUNNER_TEMP/mobile-interop-selection"
          inventory_dir="$RUNNER_TEMP/neoth-delivery-inventory"
          mkdir -p "$inventory_dir"
          python3 .github/scripts/mobile/validate-mobile-interop-selection.py --output-dir "$selection_dir"
          python3 packaging/roadmap_release_gate.py --open-items-json > "$inventory_dir/roadmap-open-items.json"
          cp "$selection_dir/selection-custody.json" "$inventory_dir/selection-custody.json"
          test -s "$inventory_dir/roadmap-open-items.json"
          test -s "$inventory_dir/selection-custody.json"
      - name: Upload delivery inventory
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preflight-delivery-inventory
          path: ${{ runner.temp }}/neoth-delivery-inventory
          if-no-files-found: error
          retention-days: 14

      - name: Validate checked-in shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')
