name: Obsidian Archive Bridge product canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-bridge-product-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  BRIDGE_DIR: SRC/neothd/assets/obsidian_archive_bridge

jobs:
  product-canary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Prepare failure receipt before build
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/obsidian-bridge-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 -p "$evidence"
          # Bridge pathname sockets must fit the product's <100-byte cap.
          root="$(mktemp -d "$RUNNER_TEMP/ab.XXXXXX")"
          printf 'BRIDGE_CANARY_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
          printf '{"schema_version":1,"source_head":"%s","outcome":"failed","stage":"product_not_started","cleanup_proven":false}\n' "$GITHUB_SHA" > "$evidence/receipt.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Verify locked tracked plugin bundle
        working-directory: ${{ env.BRIDGE_DIR }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          git diff --exit-code -- main.js package-lock.json manifest.json
          npm test
      - name: Verify canary helper boundaries
        run: python3 -m unittest discover -s packaging/tests -p test_obsidian_archive_bridge_product_canary.py
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
      - name: Restore CLI-reference Cargo checkpoint
        id: cli-reference-cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-cli-reference-rust-1.91-cargo-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cli-reference-rust-1.91-cargo-
      - name: Build current public CLI
        working-directory: SRC
        run: cargo build -p neoth --bin neoth --locked
      - name: Save completed CLI-reference Cargo checkpoint
        if: ${{ success() && steps.cli-reference-cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ steps.cli-reference-cargo-cache.outputs.cache-primary-key }}
      - name: Run isolated compiled CLI daemon and bundled plugin lifecycle
        shell: bash
        env:
          NO_COLOR: '1'
          RUST_BACKTRACE: '0'
        run: |
          set -euo pipefail
          root="$BRIDGE_CANARY_ROOT"
          python3 packaging/obsidian_archive_bridge_product_canary.py \
            --binary "$PWD/SRC/target/debug/neoth" \
            --root "$root" --home "$root/neoth-home" --vault "$root/vault" \
            --receipt "$root/receipt/receipt.json" \
            --workflow .github/workflows/obsidian-bridge-product.yml
      - name: Preserve redacted product receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          receipt="${BRIDGE_CANARY_ROOT:-}/receipt/receipt.json"
          evidence="$RUNNER_TEMP/obsidian-bridge-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [ -n "${BRIDGE_CANARY_ROOT:-}" ] && [ -f "$receipt" ] && [ ! -L "$receipt" ]; then
            cp "$receipt" "$evidence/receipt.json"
          fi
      - name: Upload redacted product receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: obsidian-bridge-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/obsidian-bridge-evidence-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
          if-no-files-found: error
          retention-days: 7
