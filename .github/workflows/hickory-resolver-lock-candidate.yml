name: Hickory resolver lock candidate

on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact main commit whose SRC/Cargo.lock is the baseline
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hickory-resolver-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: ${{ inputs.source_head }}
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_head }}
          persist-credentials: false

      - name: Require exact main producer and preserve baseline
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
          mkdir -p hickory-resolver-lock
          git rev-parse HEAD > hickory-resolver-lock/source-head.txt
          git rev-parse HEAD:SRC/Cargo.lock > hickory-resolver-lock/source-lock-blob.txt
          cp SRC/Cargo.lock hickory-resolver-lock/baseline-Cargo.lock
          cp THIRD_PARTY_LICENSES hickory-resolver-lock/baseline-THIRD_PARTY_LICENSES
          sha256sum SRC/Cargo.lock SRC/Cargo.toml SRC/neothd/Cargo.toml \
            packaging/generate_rust_notices.py packaging/rust-license-snapshots.json \
            .github/workflows/hickory-resolver-lock-candidate.yml \
            > hickory-resolver-lock/source-SHA256SUMS.txt

      - name: Set up Rust 1.91.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Resolve the compatible Hickory 0.26.3 family
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path SRC/Cargo.toml \
            -p hickory-resolver@0.26.2 --precise 0.26.3 \
            2>&1 | tee hickory-resolver-lock/solver.log
          cp SRC/Cargo.lock hickory-resolver-lock/solver-Cargo.lock
          python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import re
          import tomllib

          root = Path("hickory-resolver-lock")
          before_path = root / "baseline-Cargo.lock"
          solver_path = root / "solver-Cargo.lock"
          after_path = root / "resolved-Cargo.lock"
          before_text = before_path.read_text()
          solver_text = solver_path.read_text()
          before = tomllib.loads(before_text)["package"]
          solved = tomllib.loads(solver_text)["package"]
          family = {"hickory-resolver", "hickory-net", "hickory-proto"}
          key = lambda p: (p["name"], p["version"], p.get("source", ""))

          # Cargo may retarget broad windows-sys edges unrelated to Hickory.
          # Preserve every non-family package block byte-for-byte and require
          # Cargo's real locked feature check to accept that narrower graph.
          replacements = {}
          for block in re.split(r"(?=^\[\[package\]\])", solver_text, flags=re.MULTILINE):
              packages = tomllib.loads(block).get("package", [])
              if not packages:
                  continue
              package = packages[0]
              if package["name"] in family:
                  if len(packages) != 1 or package["name"] in replacements:
                      raise SystemExit("ambiguous solved Hickory block")
                  if package["version"] != "0.26.3":
                      raise SystemExit("solver did not produce exact Hickory family")
                  replacements[package["name"]] = block
          if set(replacements) != family:
              raise SystemExit("missing solved Hickory package block")

          candidate_blocks = []
          replaced = set()
          for block in re.split(r"(?=^\[\[package\]\])", before_text, flags=re.MULTILINE):
              packages = tomllib.loads(block).get("package", [])
              name = packages[0]["name"] if packages else None
              if name in family:
                  if len(packages) != 1 or name in replaced:
                      raise SystemExit("ambiguous baseline Hickory block")
                  replaced.add(name)
                  candidate_blocks.append(replacements[name])
              else:
                  candidate_blocks.append(block)
          if replaced != family:
              raise SystemExit("baseline Hickory family missing")
          candidate_text = "".join(candidate_blocks)
          after = tomllib.loads(candidate_text)["package"]
          old = {key(p): p for p in before}
          new = {key(p): p for p in after}
          solver = {key(p): p for p in solved}
          if len(old) != len(before) or len(new) != len(after) or len(solver) != len(solved):
              raise SystemExit("duplicate package identity")
          old_other = {k: p for k, p in old.items() if k[0] not in family}
          new_other = {k: p for k, p in new.items() if k[0] not in family}
          if old_other != new_other:
              raise SystemExit("minimal candidate changed a non-Hickory package")
          after_path.write_text(candidate_text, encoding="utf-8", newline="\n")
          Path("SRC/Cargo.lock").write_bytes(after_path.read_bytes())
          solver_changes = [
              {"identity": list(k), "before": old.get(k), "after": solver.get(k)}
              for k in sorted(set(old) | set(solver))
              if old.get(k) != solver.get(k)
          ]
          for name in family:
              selected = [p for p in after if p["name"] == name]
              if len(selected) != 1 or selected[0]["version"] != "0.26.3":
                  raise SystemExit(f"expected exact coherent {name} 0.26.3")
          changed = [
              {"identity": list(k), "before": old.get(k), "after": new.get(k)}
              for k in sorted(set(old) | set(new))
              if old.get(k) != new.get(k)
          ]
          report = {
              "schema": "neoth.hickory-family-candidate.v1",
              "baselineSha256": sha256(before_path.read_bytes()).hexdigest(),
              "candidateSha256": sha256(after_path.read_bytes()).hexdigest(),
              "solverSha256": sha256(solver_path.read_bytes()).hexdigest(),
              "solverChanges": solver_changes,
              "nonFamilyPackagesPreserved": old_other == new_other,
              "changes": changed,
              "unrelatedPackageChanges": [d for d in changed if d["identity"][0] not in family],
              "requiredFamilyVersion": "0.26.3",
              "rootAdmissionRequired": True,
              "imported": False,
          }
          (root / "package-delta.json").write_text(json.dumps(report, indent=2) + "\n")
          if len(changed) != 6 or any(d["identity"][0] not in family for d in changed):
              raise SystemExit("candidate must replace exactly the three Hickory packages")
          PY
          git diff --binary --full-index -- SRC/Cargo.lock \
            > hickory-resolver-lock/Cargo.lock.patch

      - name: Compile the actual Iroh feature contract with the candidate lock
        working-directory: SRC
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p neoth --locked --features cluster-iroh \
            2>&1 | tee ../hickory-resolver-lock/cluster-iroh-check.log

      - name: Reproduce and verify distribution notices for the candidate lock
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/tests/test_generate_rust_notices.py \
            2>&1 | tee hickory-resolver-lock/notice-tests.log
          python3 packaging/generate_rust_notices.py --write \
            2>&1 | tee hickory-resolver-lock/notice-generate.log
          python3 packaging/generate_rust_notices.py --check \
            2>&1 | tee hickory-resolver-lock/notice-check.log
          cp THIRD_PARTY_LICENSES hickory-resolver-lock/THIRD_PARTY_LICENSES
          git diff --binary --full-index -- THIRD_PARTY_LICENSES \
            > hickory-resolver-lock/THIRD_PARTY_LICENSES.patch
          sha256sum hickory-resolver-lock/resolved-Cargo.lock \
            hickory-resolver-lock/THIRD_PARTY_LICENSES \
            hickory-resolver-lock/package-delta.json \
            > hickory-resolver-lock/candidate-SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("hickory-resolver-lock")
          (root / "hosted-result.json").write_text(json.dumps({
              "producer": (root / "source-head.txt").read_text().strip(),
              "irohFeatureCompile": "success",
              "noticeUnitTests": "success",
              "noticeReproduction": "success",
              "rootAdmissionRequired": True,
              "productRuntimeTested": False,
              "goldComplete": False,
          }, indent=2) + "\n")
          PY

      - name: Retain original candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hickory-resolver-lock-${{ github.sha }}
          path: hickory-resolver-lock/
          if-no-files-found: error
          retention-days: 14
