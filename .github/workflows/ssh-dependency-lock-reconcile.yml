name: SSH dependency lock reconciliation

on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact main commit to reconcile
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ssh-dependency-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ inputs.source_head }}
      CARGO_BUILD_JOBS: 1
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_head }}
          persist-credentials: false

      - name: Require exact main producer
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code

      - name: Set up Rust 1.91.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Verify the existing vendored dependency before resolution
        run: python3 packaging/arrayref_provenance_gate.py

      - name: Prepare the exact Russh manifest candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("SRC/neothd/Cargo.toml")
          before = 'russh               = { version = "0.62.5", default-features = false, features = ["ring"], optional = true }'
          after = before.replace('"0.62.5"', '"=0.63.2"')
          source = path.read_text(encoding="utf-8")
          if source.count(before) != 1:
              raise SystemExit("Expected Russh 0.62.5 preimage is absent or ambiguous")
          path.write_text(source.replace(before, after), encoding="utf-8", newline="\n")
          PY

      - name: Resolve exact versions without compiling or testing
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path SRC/Cargo.toml -p russh --precise 0.63.2
          cargo update --manifest-path SRC/Cargo.toml -p pageant --precise 0.2.3
          cargo metadata --manifest-path SRC/neothd/Cargo.toml --locked --format-version 1 --features ssh-tunnel > /dev/null
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          lock = tomllib.loads(Path("SRC/Cargo.lock").read_text(encoding="utf-8"))
          for name, version in (("russh", "0.63.2"), ("pageant", "0.2.3")):
              actual = [package["version"] for package in lock["package"] if package["name"] == name]
              if actual != [version]:
                  raise SystemExit(f"Unexpected resolved {name} versions: {actual}")
          PY
          test "$(git diff --name-only | LC_ALL=C sort)" = $'SRC/Cargo.lock\nSRC/neothd/Cargo.toml'

      - name: Seal exact candidate patch and postimages
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ssh-dependency-lock"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-head.txt"
          git diff --binary --full-index -- SRC/Cargo.lock SRC/neothd/Cargo.toml > "$evidence/candidate.patch"
          cp SRC/Cargo.lock "$evidence/Cargo.lock"
          cp SRC/neothd/Cargo.toml "$evidence/neothd-Cargo.toml"
          printf '%s\n' 'Exact Russh 0.63.2 and Pageant 0.2.3 resolved; locked ssh-tunnel metadata succeeded; no compilation or tests ran' > "$evidence/validation.txt"
          (cd "$evidence" && sha256sum source-head.txt candidate.patch Cargo.lock neothd-Cargo.toml validation.txt > SHA256SUMS)

      - name: Upload exact candidate for Root review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ssh-dependency-lock-${{ github.sha }}
          path: ${{ runner.temp }}/ssh-dependency-lock
          if-no-files-found: error
          retention-days: 14
