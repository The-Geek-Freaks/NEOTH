name: Security dependency lock reconciliation

on:
  workflow_dispatch:
    inputs:
      source_head:
        description: Exact main commit to reconcile
        required: true
        type: string
      october_2026:
        description: Prepare twelve exact October security targets; ZIP parent migration remains open
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: security-dependency-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && !inputs.october_2026
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ inputs.source_head }}
      CARGO_BUILD_JOBS: 1
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_head }}
          persist-credentials: false
      - name: Require exact main producer
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
      - name: Set up Rust 1.91.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
      - name: Test and prove vendor source custody before Cargo
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/tests/test_arrayref_provenance_gate.py
          python3 packaging/arrayref_provenance_gate.py
          python3 packaging/tests/test_imbl_provenance_gate.py
          python3 packaging/imbl_provenance_gate.py --source-only
      - name: Resolve exact security and imbl dependencies without compilation
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path SRC/Cargo.toml -p imbl --precise 6.1.0
          cargo update --manifest-path SRC/Cargo.toml -p imbl-sized-chunks --precise 0.2.0
      - name: Restore every unrelated Cargo.lock package block from Head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          path = Path("SRC/Cargo.lock")
          baseline = subprocess.check_output(
              ["git", "show", "HEAD:SRC/Cargo.lock"], text=True
          )
          updated = path.read_text(encoding="utf-8")
          excluded = {"imbl", "imbl-sized-chunks", "bitmaps"}

          def split(content: str) -> tuple[str, list[tuple[dict[str, object], str]]]:
              pieces = content.split("[[package]]\n")
              if len(pieces) < 2:
                  raise SystemExit("Cargo.lock has no package records")
              header = pieces[0]
              records = []
              for suffix in pieces[1:]:
                  raw = "[[package]]\n" + suffix
                  parsed = tomllib.loads(raw).get("package")
                  if not isinstance(parsed, list) or len(parsed) != 1:
                      raise SystemExit("Cargo.lock package block is not singular TOML")
                  package = parsed[0]
                  if not isinstance(package, dict) or not isinstance(package.get("name"), str) or not isinstance(package.get("version"), str):
                      raise SystemExit("Cargo.lock package block has no string name/version")
                  records.append((package, raw))
              return header, records

          baseline_header, baseline_records = split(baseline)
          updated_header, updated_records = split(updated)
          if updated_header != baseline_header:
              raise SystemExit("Cargo.lock header drifted outside the reviewed package records")
          baseline_unrelated = [(package, raw) for package, raw in baseline_records if package["name"] not in excluded]
          baseline_identity = {
              (package["name"], package["version"]): raw
              for package, raw in baseline_unrelated
          }
          if len(baseline_identity) != len(baseline_unrelated):
              raise SystemExit("Head Cargo.lock has duplicate unrelated name/version identities")
          expected_names = {name for name, _ in baseline_identity}
          for package, _ in updated_records:
              if package["name"] not in excluded and package["name"] not in expected_names:
                  raise SystemExit(f"unrelated package added by resolution: {package['name']}@{package['version']}")
          selected = [
              (package, raw)
              for package, raw in updated_records
              if package["name"] in {"imbl", "imbl-sized-chunks"}
          ]
          selected_names = [package["name"] for package, _ in selected]
          if selected_names.count("imbl") != 1 or selected_names.count("imbl-sized-chunks") != 1:
              raise SystemExit("resolution did not produce one imbl and one imbl-sized-chunks block")
          if any(package["name"] == "bitmaps" for package, _ in updated_records):
              raise SystemExit("resolution left a bitmaps block before lock restoration")
          rebuilt = baseline_header + "".join(raw for _, raw in baseline_unrelated) + "".join(raw for _, raw in selected)
          path.write_text(rebuilt, encoding="utf-8", newline="\n")

          _, final_records = split(path.read_text(encoding="utf-8"))
          final_unrelated = [(package, raw) for package, raw in final_records if package["name"] not in excluded]
          final_identity = {
              (package["name"], package["version"]): raw
              for package, raw in final_unrelated
          }
          if len(final_identity) != len(final_unrelated) or final_identity != baseline_identity or final_unrelated != baseline_unrelated:
              raise SystemExit("unrelated Cargo.lock package blocks were not restored byte-for-byte")
          final_names = [package["name"] for package, _ in final_records]
          if final_names.count("imbl") != 1 or final_names.count("imbl-sized-chunks") != 1 or "bitmaps" in final_names:
              raise SystemExit("restored Cargo.lock has an invalid imbl/bitmaps block set")
          PY
          sha256sum SRC/Cargo.lock > "$RUNNER_TEMP/restored-lock.SHA256SUMS"
          cargo metadata --manifest-path SRC/Cargo.toml --locked --all-features --format-version 1 > "$RUNNER_TEMP/security-metadata.json"
          sha256sum -c "$RUNNER_TEMP/restored-lock.SHA256SUMS"
      - name: Require exact locked graph before retiring exceptions
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/imbl_provenance_gate.py
          python3 - <<'PY'
          from pathlib import Path
          import json, os, tomllib
          lock = tomllib.loads(Path("SRC/Cargo.lock").read_text(encoding="utf-8"))
          expected = (("jsonwebtoken", "10.4.0"), ("wasmtime", "36.0.16"), ("autocfg", "1.5.1"), ("faster-hex", "0.10.1"), ("russh", "0.63.2"), ("pageant", "0.2.3"), ("imbl", "6.1.0"), ("imbl-sized-chunks", "0.2.0"))
          for name, version in expected:
              actual = [p["version"] for p in lock["package"] if p["name"] == name]
              if actual != [version]: raise SystemExit(f"Unexpected resolved {name}: {actual}")
          if any(p["name"] in {"rsa", "bitmaps"} for p in lock["package"]):
              raise SystemExit("rsa or bitmaps remains in Cargo.lock")
          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "security-metadata.json").read_text())
          packages = metadata["packages"]
          if any(p["name"] == "bitmaps" for p in packages): raise SystemExit("bitmaps remains in resolved metadata")
          jwt_ids = {p["id"] for p in packages if p["name"] == "jsonwebtoken"}
          jwt_nodes = [n for n in metadata["resolve"]["nodes"] if n["id"] in jwt_ids]
          if len(jwt_nodes) != 1 or "aws_lc_rs" not in jwt_nodes[0]["features"] or "rust_crypto" in jwt_nodes[0]["features"]:
              raise SystemExit("JWT backend selection is not exclusively AWS-LC")
          imbl = [p for p in packages if p["name"] == "imbl"]
          if len(imbl) != 1 or imbl[0].get("version") != "6.1.0" or imbl[0].get("source") is not None:
              raise SystemExit("imbl is not the single reviewed path-patched package")
          chunks = [p for p in packages if p["name"] == "imbl-sized-chunks"]
          if len(chunks) != 1 or chunks[0].get("version") != "0.2.0" or chunks[0].get("source") != "registry+https://github.com/rust-lang/crates.io-index":
              raise SystemExit("imbl-sized-chunks is not the reviewed registry package")
          PY
      - name: Retire bitmaps exceptions after graph proof only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          updates = {
              Path("SRC/.cargo/audit.toml"): '''    # Temporary Matrix-only `bitmaps` exceptions. Both advisories have no
              # upstream-compatible fix: the Matrix SDK's immutable-collections chain
              # selects bitmaps 3.x, and NEOTH has no direct use or safe substitution.
              # Re-evaluate 2026-11-13 with the next Matrix stack update.
              "RUSTSEC-2026-0247",
              "RUSTSEC-2025-0167",
          ''',
              Path("SRC/deny.toml"): '''    # Temporary synchronized exceptions: `bitmaps` is Matrix-only through the
              # Matrix SDK immutable-collections chain. There is no upstream-compatible
              # fix, NEOTH does not use it directly, and replacing it locally would fork
              # the Matrix stack. Re-evaluate both with the next Matrix stack update on
              # 2026-11-13.
              { id = "RUSTSEC-2026-0247", reason = "bitmaps is Matrix-only via the matrix-sdk immutable-collections chain; no upstream-compatible fix and no direct NEOTH use. Re-evaluate 2026-11-13." },
              { id = "RUSTSEC-2025-0167", reason = "bitmaps is Matrix-only via the matrix-sdk immutable-collections chain; no upstream-compatible fix and no direct NEOTH use. Re-evaluate 2026-11-13." },
          ''',
          }
          for path, removed in updates.items():
              source = path.read_text(encoding="utf-8")
              if source.count(removed) != 1: raise SystemExit(f"Expected unique bitmaps preimage in {path}")
              path.write_text(source.replace(removed, ""), encoding="utf-8", newline="\n")
          PY
          python3 packaging/tests/test_advisory_exception_gate.py
          python3 packaging/advisory_exception_gate.py --metadata "$RUNNER_TEMP/security-metadata.json"
          test "$(git diff --name-only | LC_ALL=C sort)" = $'SRC/.cargo/audit.toml\nSRC/Cargo.lock\nSRC/deny.toml'
      - name: Seal candidate postimages and evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/security-dependency-lock"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-head.txt"
          git diff --binary --full-index -- SRC/Cargo.lock SRC/.cargo/audit.toml SRC/deny.toml > "$evidence/candidate.patch"
          cp SRC/Cargo.lock SRC/.cargo/audit.toml SRC/deny.toml "$evidence/"
          cp "$RUNNER_TEMP/security-metadata.json" "$evidence/metadata.json"
          sha256sum packaging/imbl_provenance_gate.py packaging/tests/test_imbl_provenance_gate.py packaging/vendor-provenance/imbl-6.1.0.crate > "$evidence/imbl-gate-sources.SHA256SUMS"
          find SRC/vendor/imbl -type f -print0 | sort -z | xargs -0 sha256sum > "$evidence/imbl-vendor.SHA256SUMS"
          printf '%s\n' 'Source-only vendor gates passed before Cargo; exact locked graph verified; rsa and bitmaps absent; closed advisory gate passed; no product build ran' > "$evidence/validation.txt"
          (cd "$evidence" && sha256sum source-head.txt candidate.patch Cargo.lock audit.toml deny.toml metadata.json imbl-gate-sources.SHA256SUMS imbl-vendor.SHA256SUMS validation.txt > SHA256SUMS)
      - name: Upload candidate for independent Root admission
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-dependency-lock-${{ github.sha }}
          path: ${{ runner.temp }}/security-dependency-lock
          if-no-files-found: error
          retention-days: 14

  vendored-imbl-tests:
    if: github.ref == 'refs/heads/main' && !inputs.october_2026
    needs: reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ inputs.source_head }}
      CARGO_BUILD_JOBS: 1
    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_head }}
          persist-credentials: false
      - name: Require exact main producer
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code
      - name: Download exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-dependency-lock-${{ github.sha }}
          path: ${{ runner.temp }}/security-dependency-lock
      - name: Admit postimages and prove full imbl provenance
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/security-dependency-lock"
          (cd "$evidence" && sha256sum -c SHA256SUMS)
          test "$(cat "$evidence/source-head.txt")" = "$EXPECTED_HEAD"
          sha256sum -c "$evidence/imbl-gate-sources.SHA256SUMS"
          sha256sum -c "$evidence/imbl-vendor.SHA256SUMS"
          cp "$evidence/Cargo.lock" SRC/Cargo.lock
          cp "$evidence/audit.toml" SRC/.cargo/audit.toml
          cp "$evidence/deny.toml" SRC/deny.toml
          python3 packaging/imbl_provenance_gate.py
          python3 packaging/advisory_exception_gate.py --metadata "$evidence/metadata.json"
      - name: Set up Rust 1.91.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
      - name: Run all vendored imbl tests in isolated copy
        shell: bash
        run: |
          set -euo pipefail
          test_root="$RUNNER_TEMP/imbl-6.1.0-tests"
          cp -a SRC/vendor/imbl "$test_root"
          CARGO_TARGET_DIR="$RUNNER_TEMP/imbl-target" cargo test --manifest-path "$test_root/Cargo.toml"
          CARGO_TARGET_DIR="$RUNNER_TEMP/imbl-target" cargo test --manifest-path "$test_root/Cargo.toml" --all-features
          git diff --exit-code -- SRC/vendor/imbl

  october-security-patches:
    if: github.ref == 'refs/heads/main' && inputs.october_2026
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ inputs.source_head }}
      CARGO_BUILD_JOBS: 1
    steps:
      - name: Check out exact main source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_head }}
          persist-credentials: false
      - name: Bind baseline and preserve failure evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          export PROOF="$RUNNER_TEMP/october-security-patches"
          printf 'PROOF=%s\n' "$PROOF" >> "$GITHUB_ENV"
          mkdir -p "$PROOF"
          printf '%s\n' "$EXPECTED_HEAD" > "$PROOF/source-head.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$PROOF/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$PROOF/run-attempt.txt"
          printf '%s\n' 'DIAGNOSTIC_ONLY_UNTIL_CANDIDATE_RECEIPT' > "$PROOF/STATUS.txt"
          cp SRC/Cargo.lock "$PROOF/baseline-Cargo.lock"
          cp SRC/neothd/Cargo.toml "$PROOF/baseline-neothd-Cargo.toml"
          sha256sum SRC/.cargo/audit.toml SRC/deny.toml > "$PROOF/unchanged-policy.SHA256SUMS"
      - name: Set up Rust 1.91.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'
      - name: Verify existing vendor source custody
        run: |
          python3 packaging/arrayref_provenance_gate.py
          python3 packaging/imbl_provenance_gate.py --source-only
      - name: Prepare only the reviewed Wasmtime and Zstd manifest requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          proof = Path(os.environ["PROOF"])
          baseline = tomllib.loads((proof / "baseline-Cargo.lock").read_text())
          for name, version in (("negentropy", "0.5.0"), ("quinn-proto", "0.11.15"), ("rustls", "0.23.45"), ("wasmtime", "36.0.16"), ("crypto-bigint", "0.7.5"), ("ctutils", "0.4.2"), ("rustls-webpki", "0.103.15"), ("webpki-root-certs", "1.0.7"), ("webpki-roots", "1.0.7"), ("zstd", "0.13.3"), ("zstd-safe", "7.2.4"), ("zstd-sys", "2.0.16+zstd.1.5.7"), ("zip", "1.1.4")):
              rows = [p for p in baseline["package"] if p["name"] == name and not (name == "webpki-roots" and p["version"] == "0.26.11")]
              if len(rows) != 1 or rows[0]["version"] != version:
                  raise SystemExit(f"Baseline target absent or ambiguous: {name}@{version}")
          path = Path("SRC/neothd/Cargo.toml")
          source = path.read_text(encoding="utf-8")
          for before, after in (
              ('wasmtime = { version = "=36.0.16", default-features = false, features = ["cranelift", "runtime"], optional = true }',
               'wasmtime = { version = "=36.0.19", default-features = false, features = ["cranelift", "runtime"], optional = true }'),
              ('zstd = "0.13"', 'zstd = "=0.14.3"'),
          ):
              if source.count(before) != 1:
                  raise SystemExit("Reviewed manifest preimage absent or ambiguous")
              source = source.replace(before, after)
          path.write_text(source, encoding="utf-8", newline="\n")
          (Path(os.environ["PROOF"]) / "manifest.expected-after.toml").write_bytes(path.read_bytes())
          PY
      - name: Resolve only the twelve exact patch targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tomllib
          from pathlib import Path
          proof = Path(os.environ["PROOF"])
          targets = (
              ("negentropy", "0.5.0", "0.5.2"),
              ("quinn-proto", "0.11.15", "0.11.18"),
              ("rustls", "0.23.45", "0.23.46"),
              ("wasmtime", "36.0.16", "36.0.19"),
              ("crypto-bigint", "0.7.5", "0.7.10"),
              ("ctutils", "0.4.2", "0.4.4"),
              ("rustls-webpki", "0.103.15", "0.103.16"),
              ("webpki-root-certs", "1.0.7", "1.0.10"),
              ("webpki-roots", "1.0.7", "1.0.10"),
              ("zstd", "0.13.3", "0.14.3"),
              ("zstd-safe", "7.2.4", "8.2.0"),
              ("zstd-sys", "2.0.16+zstd.1.5.7", "2.1.2+zstd.1.5.7"),
          )
          for name, before, after in targets:
              lock = tomllib.loads(Path("SRC/Cargo.lock").read_text())
              rows = [p for p in lock["package"] if p["name"] == name and not (name == "webpki-roots" and p["version"] == "0.26.11")]
              (proof / "last-resolution-Cargo.lock").write_bytes(Path("SRC/Cargo.lock").read_bytes())
              (proof / "last-target-rows.json").write_text(json.dumps({"target": name, "rows": rows}, indent=2) + "\n")
              if len(rows) != 1 or rows[0]["version"] not in (before, after):
                  raise SystemExit(f"Current target absent, ambiguous or unreviewed: {name}")
              # Earlier resolution may already satisfy an exact manifest edit.
              selector = f'{name}@{rows[0]["version"]}'
              with (proof / f"resolve-{name}.log").open("w") as log:
                  result = subprocess.run(
                      ["cargo", "update", "--manifest-path", "SRC/Cargo.toml",
                       "-p", selector, "--precise", after],
                      stdout=log, stderr=subprocess.STDOUT,
                  )
              (proof / "last-resolution-Cargo.lock").write_bytes(Path("SRC/Cargo.lock").read_bytes())
              if result.returncode:
                  raise SystemExit(f"Precise resolution failed: {selector}; see artifact log")
          PY
          cp SRC/Cargo.lock "$PROOF/Cargo.lock"
          sha256sum SRC/Cargo.lock > "$PROOF/resolved-lock.SHA256SUMS"
          cargo metadata --manifest-path SRC/Cargo.toml --locked --all-features --format-version 1 > "$PROOF/metadata-1.json"
          sha256sum -c "$PROOF/resolved-lock.SHA256SUMS"
          cargo metadata --manifest-path SRC/Cargo.toml --locked --all-features --format-version 1 > "$PROOF/metadata-2.json"
          sha256sum -c "$PROOF/resolved-lock.SHA256SUMS"
      - name: Prove exact versions and retain every package delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, tomllib
          from pathlib import Path
          proof = Path(os.environ["PROOF"])
          baseline = tomllib.loads((proof / "baseline-Cargo.lock").read_text())
          candidate = tomllib.loads((proof / "Cargo.lock").read_text())
          targets = {
              "negentropy": ("0.5.2", "a3d66662cb5ca384d4991509755ed5a42dd8e31c4282bf881938e506fc3146ec"),
              "quinn-proto": ("0.11.18", "a9746dbde176634f4f2f1faf2404e30a31b2bc1e9cafb5329c95d8177a18c9fc"),
              "rustls": ("0.23.46", "48e13bd8c0e9365c43cfa5c9e8f9ad49d3c8444926c9aac819e0e4dc503c8fdf"),
              "wasmtime": ("36.0.19", "60e5f244a2c9d40afa9e9a607ee7f048c0648bb1c22cc28b130c5fc71e23d71d"),
              "crypto-bigint": ("0.7.10", "9c035cb64cba03dad2fb921f3e218785e8cf9a41790da5eb3a1400f62fa2be11"),
              "ctutils": ("0.4.4", "12218662ccac37d9714f2191252553d67585b97df8c839cbe49e0bde278dc865"),
              "rustls-webpki": ("0.103.16", "4443b1b6d39d7c663139942cc4558262562d2c84123bb6282ef177009ca8b281"),
              "webpki-root-certs": ("1.0.10", "58ec80e73fd8baf57bf0d9615554c75348bda990d6d5bbeab964dd068319fecb"),
              "webpki-roots": ("1.0.10", "1c1c8e20c8a38fc7d65abfe74eb7280e4aa667e8eec8bc84996d2874810748d9"),
              "zstd": ("0.14.3", "db3ae9bf90af6e40197bef767eeefc46ad6397420fe873830bd85e5fbbfb3c70"),
              "zstd-safe": ("8.2.0", "ded520f16b29e1a9b771c722221b2b0a0398c2316d9bb3c42b458a5414d7434b"),
              "zstd-sys": ("2.1.2+zstd.1.5.7", "481ada9c543b2323cbb7bbdbb5249177fbf0188ed959ed2c15e4b22421c84ed3"),
          }
          registry = "registry+https://github.com/rust-lang/crates.io-index"
          for name, (version, checksum) in targets.items():
              rows = [p for p in candidate["package"] if p["name"] == name and not (name == "webpki-roots" and p["version"] == "0.26.11")]
              if len(rows) != 1 or rows[0]["version"] != version or rows[0].get("source") != registry or rows[0].get("checksum") != checksum:
                  raise SystemExit(f"Unexpected exact package or provenance: {name}")
          # The independent Candle -> ZIP migration must not be hidden in this
          # patch batch. Retain its exact package entries and audit findings.
          for name in ("zip", "candle-core", "candle-nn", "candle-transformers"):
              before = [p for p in baseline["package"] if p["name"] == name]
              after = [p for p in candidate["package"] if p["name"] == name]
              if not before or before != after:
                  raise SystemExit(f"Deferred parent-migration package changed: {name}")
          def keyed(packages):
              result = {(p["name"], p["version"], p.get("source")): p for p in packages}
              if len(result) != len(packages):
                  raise SystemExit("Duplicate package identity")
              return result
          old, new = keyed(baseline["package"]), keyed(candidate["package"])
          added = [p for key, p in new.items() if key not in old]
          removed = [p for key, p in old.items() if key not in new]
          changed = [{"before": old[key], "after": p} for key, p in new.items() if key in old and old[key] != p]
          for package in added:
              if package.get("source") != registry or not package.get("checksum"):
                  raise SystemExit("New package has unreviewed non-registry provenance")
          for change in changed:
              if change["before"].get("checksum") != change["after"].get("checksum"):
                  raise SystemExit("Checksum drift for unchanged package identity")
          for package in removed:
              if package.get("source") != registry:
                  raise SystemExit("Existing local or Git dependency unexpectedly removed")
          first = json.loads((proof / "metadata-1.json").read_text())
          second = json.loads((proof / "metadata-2.json").read_text())
          if first != second:
              raise SystemExit("Locked metadata changed between resolutions")
          for name, (version, _) in targets.items():
              if [p["version"] for p in first["packages"] if p["name"] == name and not (name == "webpki-roots" and p["version"] == "0.26.11")] != [version]:
                  raise SystemExit(f"Exact target missing or duplicated in metadata: {name}")
          # Keep the existing compatibility wrapper; it delegates root data to
          # the updated 1.x package, and is not itself a second data target.
          wrapper = [p for p in candidate["package"] if p["name"] == "webpki-roots" and p["version"] == "0.26.11"]
          original_wrapper = [p for p in baseline["package"] if p["name"] == "webpki-roots" and p["version"] == "0.26.11"]
          if len(wrapper) != 1 or len(original_wrapper) != 1 or wrapper[0].get("source") != registry or wrapper[0].get("checksum") != original_wrapper[0].get("checksum") or wrapper[0].get("dependencies") != ["webpki-roots 1.0.10"]:
              raise SystemExit("Unexpected webpki-roots compatibility wrapper")
          if any(p["name"] in {"rsa", "bitmaps"} for p in first["packages"]):
              raise SystemExit("Previously removed dependency reintroduced")
          if Path("SRC/neothd/Cargo.toml").read_bytes() != (proof / "manifest.expected-after.toml").read_bytes():
              raise SystemExit("Manifest drift after exact edit")
          paths = set(subprocess.check_output(["git", "diff", "HEAD", "--name-only"], text=True).splitlines())
          if paths != {"SRC/Cargo.lock", "SRC/neothd/Cargo.toml"}:
              raise SystemExit(f"Unexpected candidate paths: {paths}")
          delta = {"semantics": "lossless package-entry delta; upgrades appear as removed plus added", "added": added, "removed": removed, "changed": changed, "rootDeltaReviewRequired": True}
          (proof / "package-delta.json").write_text(json.dumps(delta, indent=2) + "\n")
          (proof / "metadata-normalized.sha256").write_text(hashlib.sha256(json.dumps(first, sort_keys=True, separators=(",", ":")).encode()).hexdigest() + "\n")
          PY
          sha256sum -c "$PROOF/unchanged-policy.SHA256SUMS"
      - name: Install the pinned audit tool
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853
        with:
          tool: cargo-audit@0.22.2
      - name: Require targeted advisories absent and retain remaining findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, re, subprocess
          from pathlib import Path
          proof = Path(os.environ["PROOF"])
          result = subprocess.run(["cargo", "audit", "--json"], cwd="SRC", capture_output=True, text=True)
          (proof / "audit.json").write_text(result.stdout)
          (proof / "audit.stderr.txt").write_text(result.stderr)
          if result.returncode not in (0, 1):
              raise SystemExit("Audit execution failed")
          audit = json.loads(result.stdout)
          findings = audit["vulnerabilities"]["list"]
          expected_ids = {
              "RUSTSEC-2026-0365", "RUSTSEC-2026-0341", "RUSTSEC-2026-0339",
              "RUSTSEC-2026-0342", "RUSTSEC-2026-0340", "RUSTSEC-2026-0338",
              "RUSTSEC-2026-0347", "RUSTSEC-2026-0348", "RUSTSEC-2026-0349",
              "RUSTSEC-2026-0346", "RUSTSEC-2026-0363",
              "RUSTSEC-2026-0387", "RUSTSEC-2026-0385", "RUSTSEC-2026-0382",
              "RUSTSEC-2026-0380", "RUSTSEC-2026-0379", "RUSTSEC-2026-0383",
              "RUSTSEC-2026-0381", "RUSTSEC-2026-0391", "RUSTSEC-2026-0398",
              "RUSTSEC-2026-0403", "RUSTSEC-2026-0410",
          }
          if len(expected_ids) != 22:
              raise SystemExit("Expected exactly twenty-two unique targeted advisory IDs")
          (proof / "target-advisories.json").write_text(json.dumps(sorted(expected_ids), indent=2) + "\n")
          target_names = {"negentropy", "quinn-proto", "rustls", "wasmtime", "crypto-bigint", "ctutils", "rustls-webpki", "webpki-root-certs", "webpki-roots", "zstd", "zstd-safe", "zstd-sys"}
          if any(item["advisory"]["id"] in expected_ids or item["package"]["name"] in target_names for item in findings):
              raise SystemExit("A targeted advisory remains")
          if not isinstance(audit.get("database"), dict) or not isinstance(audit.get("warnings"), dict):
              raise SystemExit("Incomplete audit result")
          ignored = audit["settings"]["ignore"]
          if not isinstance(ignored, list) or expected_ids.intersection(ignored):
              raise SystemExit("Targeted advisory was ignored")
          database = audit["database"]
          revision = database.get("last-commit", "")
          updated = datetime.datetime.fromisoformat(database["last-updated"])
          now = datetime.datetime.now(datetime.timezone.utc)
          if not re.fullmatch(r"[0-9a-f]{40}", revision) or updated.utcoffset() is None:
              raise SystemExit("Audit database provenance missing")
          age_seconds = (now - updated).total_seconds()
          if not -300 <= age_seconds <= 14 * 24 * 60 * 60:
              raise SystemExit("Audit database outside the 14-day freshness bound")
          (proof / "audit-database.json").write_text(json.dumps({
              "database": database, "checkedUtc": now.isoformat(),
              "maxAgeDays": 14, "ageSeconds": age_seconds,
              "fetchDiagnostics": "audit.stderr.txt",
          }, indent=2) + "\n")
          remaining = {"exitCode": result.returncode, "database": database, "vulnerabilities": findings, "warnings": audit["warnings"], "deferredParentMigration": {"parent": "candle-core@0.8.4", "dependency": "zip@1.1.4", "advisories": ["RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369"], "accepted": False}, "fullSecurityAccepted": False}
          (proof / "remaining-findings.json").write_text(json.dumps(remaining, indent=2) + "\n")
          PY
      - name: Generate and verify notices for this candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/generate_rust_notices.py --write 2>&1 | tee "$PROOF/notices-write.log"
          python3 packaging/generate_rust_notices.py --check 2>&1 | tee "$PROOF/notices-check.log"
          sha256sum -c "$PROOF/resolved-lock.SHA256SUMS"
          sha256sum -c "$PROOF/unchanged-policy.SHA256SUMS"
          cp THIRD_PARTY_LICENSES "$PROOF/THIRD_PARTY_LICENSES"
      - name: Seal review-only candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          proof = Path(os.environ["PROOF"])
          paths = set(subprocess.check_output(["git", "diff", "HEAD", "--name-only"], text=True).splitlines())
          if not {"SRC/Cargo.lock", "SRC/neothd/Cargo.toml"} <= paths <= {"SRC/Cargo.lock", "SRC/neothd/Cargo.toml", "THIRD_PARTY_LICENSES"}:
              raise SystemExit(f"Unexpected final paths: {paths}")
          receipt = {
              "producer": os.environ["EXPECTED_HEAD"], "run": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "status": "ROOT_REVIEW_REQUIRED",
              "targetAdvisoriesRemoved": 22, "productCompiled": False,
              "zipParentMigrationAccepted": False,
              "productTestsRun": False, "fullSecurityAccepted": False, "goldAccepted": False,
          }
          (proof / "candidate.json").write_text(json.dumps(receipt, indent=2) + "\n")
          (proof / "STATUS.txt").write_text("ROOT_REVIEW_REQUIRED_NO_PRODUCT_BUILD\n")
          (proof / "candidate.patch").write_bytes(subprocess.check_output(["git", "diff", "HEAD", "--binary", "--full-index", "--", "SRC/Cargo.lock", "SRC/neothd/Cargo.toml", "THIRD_PARTY_LICENSES"]))
          hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(proof.iterdir()) if p.is_file() and p.name != "artifact-hashes.json"}
          (proof / "artifact-hashes.json").write_text(json.dumps(hashes, indent=2) + "\n")
          PY
      - name: Retain original candidate or diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: october-security-patches-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.PROOF }}
          if-no-files-found: error
          retention-days: 14
