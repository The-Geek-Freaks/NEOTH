# =============================================================================
# NEOTH — W460 hosted Windows storage regressions
#
# This manual lane compiles only the neoth library, then executes the exact
# Windows regressions selected below. It does not build the workspace, GUI, or
# release targets.
# =============================================================================

name: Windows storage regressions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-storage-regressions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regressions:
    name: Exact storage, managed-browser and Paperless regressions
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_TEST_THREADS: 1
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust 1.91
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.91.0'

      - name: Restore Cargo registry and target cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            SRC/target/
          key: ${{ runner.os }}-1.91-cargo-complete-${{ hashFiles('SRC/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-1.91-cargo-partial-${{ hashFiles('SRC/Cargo.lock') }}-
            ${{ runner.os }}-1.91-cargo-${{ hashFiles('SRC/Cargo.lock') }}
            ${{ runner.os }}-1.91-cargo-

      - name: Compile and run exact selected regressions
        id: regression-run
        shell: bash
        working-directory: SRC
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'

          evidence="$RUNNER_TEMP/windows-storage-regressions"
          mkdir -p "$evidence/logs"
          git rev-parse HEAD > "$evidence/SOURCE_HEAD"
          test "$(cat "$evidence/SOURCE_HEAD")" = "$GITHUB_SHA"

          cat > "$evidence/selection.tsv" <<'EOF'
          tools::managed_browser::tests::controlled_install_publishes_marker_resolves_and_is_idempotent	neothd/src/tools/managed_browser.rs
          tools::managed_browser::tests::controlled_zip_fixture_extracts_only_the_expected_root_and_executable	neothd/src/tools/managed_browser.rs
          tools::managed_browser::tests::controlled_zip_fixture_rejects_escape_and_case_collision_before_write	neothd/src/tools/managed_browser.rs
          tools::managed_browser::tests::controlled_zip_fixture_rejects_excessive_member_inventory	neothd/src/tools/managed_browser.rs
          tools::managed_browser::tests::exact_marker_and_executable_resolve_and_revalidate	neothd/src/tools/managed_browser.rs
          tools::managed_browser::tests::missing_generation_fails_closed_without_ambient_fallback	neothd/src/tools/managed_browser.rs
          tools::managed_browser::tests::replaced_published_generation_fails_identity_confirmation_without_cleanup	neothd/src/tools/managed_browser.rs
