          daemon::doc_ingest_cron::tests::corrupt_state_fails_closed_without_overwrite	neothd/src/daemon/doc_ingest_cron.rs
          daemon::doc_ingest_cron::tests::nested_unknown_state_field_fails_closed_without_overwrite	neothd/src/daemon/doc_ingest_cron.rs
          cli::proactive::tests::document_discovery_list_without_state_does_not_create_home	neothd/src/cli/proactive.rs
          cli::proactive::tests::document_discovery_cli_lists_real_revision_and_dismisses_without_source_effect	neothd/src/cli/proactive.rs
