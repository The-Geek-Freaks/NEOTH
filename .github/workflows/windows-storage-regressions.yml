          memory::document_claims::tests::reopened_database_replays_from_durable_ledger	neothd/src/memory/document_claims.rs
          memory::migrations::tests::v45_to_v46_creates_document_claim_ledger_and_stamps_version	neothd/src/memory/migrations/mod.rs
          skills::document_staging::tests::request_validation_rejects_unowned_or_unsafe_targets	neothd/src/skills/document_staging.rs
          skills::document_staging::tests::staged_skill_prompt_binds_selected_id_and_schema_without_wiki_target	neothd/src/skills/document_staging.rs
