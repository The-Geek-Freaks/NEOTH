          installers::obsidian_archive_bridge::tests::repair_resumes_panic_interrupted_predecessor_update_without_losing_additions	neothd/src/installers/obsidian_archive_bridge.rs
          installers::obsidian_archive_bridge::tests::repair_recovers_concurrent_payload_replacement_during_update	neothd/src/installers/obsidian_archive_bridge.rs
          skills::store::reported_commit_tests::private_stage_create_new_reports_sharing_violation_with_retained_delete_parent	neothd/src/skills/store.rs
          skills::store::reported_commit_tests::private_stage_create_new_succeeds_after_releasing_delete_binding	neothd/src/skills/store.rs
