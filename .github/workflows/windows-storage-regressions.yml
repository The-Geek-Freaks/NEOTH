          reflection::periodic::retention_v2_tests::v2_receipt_before_committed_ordering_is_idempotent_after_restart	neothd/src/reflection/retention_v2_tests.rs
          reflection::periodic::retention_v2_tests::v2_unlink_attempted_after_partial_unlink_is_reconciled_truthfully	neothd/src/reflection/retention_v2_tests.rs
          installers::paperless_bootstrap::tests::dotenv_parser_accepts_literal_and_basic_quoted_admin_values	neothd/src/installers/paperless_bootstrap.rs
          installers::paperless_bootstrap::tests::dotenv_parser_rejects_ambiguous_or_duplicate_admin_values	neothd/src/installers/paperless_bootstrap.rs
          installers::paperless_bootstrap::tests::canonical_origin_accepts_only_literal_ipv4_loopback	neothd/src/installers/paperless_bootstrap.rs
          installers::paperless_bootstrap::tests::file_persistence_refuses_existing_token_and_preserves_url	neothd/src/installers/paperless_bootstrap.rs
          installers::paperless_bootstrap::tests::keychain_write_follows_real_pair_publication_and_rechecks_effective_state	neothd/src/installers/paperless_bootstrap.rs
          installers::paperless_bootstrap::tests::obtains_token_from_a_bounded_local_http_endpoint	neothd/src/installers/paperless_bootstrap.rs
          installers::paperless_lifecycle::tests::parses_only_a_single_literal_env_port	neothd/src/installers/paperless_lifecycle.rs
          installers::paperless_lifecycle::tests::exact_identifier_rejects_multiple_or_spaced_container_ids	neothd/src/installers/paperless_lifecycle.rs
          installers::paperless_lifecycle::tests::compose_never_pulls_and_uses_pinned_engine_endpoint	neothd/src/installers/paperless_lifecycle.rs
          installers::paperless_lifecycle::tests::receipt_matches_all_pinned_indexes_and_contains_config_proof	neothd/src/installers/paperless_lifecycle.rs
          installers::paperless_lifecycle::tests::container_validation_rejects_stopped_and_mixed_bindings	neothd/src/installers/paperless_lifecycle.rs
          installers::paperless_lifecycle::tests::image_verification_uses_engine_platform_not_windows_host	neothd/src/installers/paperless_lifecycle.rs
          installers::paperless_lifecycle::tests::docker_command_removes_only_compose_interpolation_overrides	neothd/src/installers/paperless_lifecycle.rs
          installers::paperless_lifecycle::tests::windows_guarded_dispatcher_keeps_existing_token_and_binds_full_install	neothd/src/installers/paperless_lifecycle.rs
