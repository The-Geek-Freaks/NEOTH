          installers::paperless_staging::tests::requested_namespace_revalidation_rejects_wrong_generation_with_held_delete_binding	neothd/src/installers/paperless_staging.rs
          skills::doc_distill::tests::review_handle_rejects_later_writer_and_deleter	neothd/src/skills/doc_distill.rs
          skills::doc_distill::tests::final_reparse_point_is_rejected_before_document_bytes_are_admitted	neothd/src/skills/doc_distill.rs
          skills::doc_distill::tests::intermediate_reparse_point_is_rejected_from_the_disk_root_walk	neothd/src/skills/doc_distill.rs
          skills::creator::tests::writer_rejects_reparse_skill_directory_without_touching_target	neothd/src/skills/creator.rs
          skills::creator::tests::writer_rejects_reparse_manifest_without_touching_target	neothd/src/skills/creator.rs
          memory::document_claims::tests::invalid_batch_never_creates_a_ledger_or_fact_row	neothd/src/memory/document_claims.rs
          memory::document_claims::tests::first_apply_then_same_document_replay_does_not_inflate_fact	neothd/src/memory/document_claims.rs
          memory::document_claims::tests::different_document_corroborates_once_then_replays	neothd/src/memory/document_claims.rs
