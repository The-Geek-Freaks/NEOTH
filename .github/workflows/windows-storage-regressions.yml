          skills::document_staging::tests::matching_skill_is_retained_as_canonical_inactive_yaml	neothd/src/skills/document_staging.rs
          skills::document_staging::tests::unsafe_skill_is_rejected_before_proposal_material_exists	neothd/src/skills/document_staging.rs
          skills::document_staging::tests::wiki_candidate_cannot_supply_the_operator_target	neothd/src/skills/document_staging.rs
          skills::document_staging::tests::malformed_candidate_stops_before_reflexion	neothd/src/skills/document_staging.rs
