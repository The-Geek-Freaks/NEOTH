          cli::proactive::tests::document_vault_note_accept_reconciles_exact_bytes_and_refuses_operator_edit	neothd/src/cli/proactive.rs
          daemon::audit_rpc::server::w61_code_map_result_receipt_tests::document_route_receipts_are_explicitly_allowlisted_extended_events	neothd/src/daemon/audit_rpc/server.rs
