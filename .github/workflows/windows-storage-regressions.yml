          daemon::doc_ingest_cron::tests::retiring_worker_fences_late_blocking_state_publication	neothd/src/daemon/doc_ingest_cron.rs
          daemon::doc_ingest_cron::tests::cancellation_before_commit_preserves_existing_state_bytes	neothd/src/daemon/doc_ingest_cron.rs
          daemon::doc_ingest_cron::tests::valid_hex_digest_tampering_refuses_state_mutation	neothd/src/daemon/doc_ingest_cron.rs
