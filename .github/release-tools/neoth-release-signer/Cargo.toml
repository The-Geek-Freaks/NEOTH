[package]
name = "neoth-release-signer"
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
anyhow = "=1.0.103"
base64 = "=0.22.1"
blake2 = "=0.10.6"
ed25519-dalek = "=2.2.0"
minisign-verify = "=0.2.5"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
