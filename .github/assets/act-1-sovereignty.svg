<svg width="1400" height="260" viewBox="0 0 1400 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Act I - The Sovereignty</title>
  <desc id="desc">NEOTH sovereignty section banner: private memory, operator control, local-first trust.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="82%">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset=".62" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="line" x1="130" y1="0" x2="1270" y2="0">
      <stop offset="0" stop-color="#00ff80" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff80" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00ff80" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:"SF Pro Display",Inter,"Helvetica Neue",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>

  <rect width="1400" height="260" rx="40" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="258" rx="39" stroke="white" stroke-opacity=".08"/>
  <path d="M150 150 C 330 92, 500 208, 700 150 C 900 92, 1070 208, 1250 150" stroke="url(#line)" stroke-width="2" fill="none" filter="url(#glow)">
    <animate attributeName="opacity" values=".35;.75;.35" dur="6s" repeatCount="indefinite"/>
  </path>

  <text x="92" y="74" fill="#00ff80" class="mono" font-size="11" letter-spacing="6">ACT I / SOVEREIGNTY</text>
  <text x="92" y="143" fill="white" class="sans" font-size="58" font-weight="100" letter-spacing="14">THE SOVEREIGNTY</text>
  <text x="96" y="182" fill="#9a9a9a" class="sans" font-size="15" letter-spacing="5">YOUR MEMORY. YOUR RULES. YOUR AUDIT TRAIL.</text>

  <g transform="translate(1115 63)" stroke="#00ff80" stroke-opacity=".72" filter="url(#glow)">
    <path d="M70 0 L130 104 H10 Z" fill="#00ff80" fill-opacity=".035"/>
    <path d="M70 28 L104 88 H36 Z" fill="none"/>
    <circle cx="70" cy="70" r="5" fill="#00ff80" stroke="none">
      <animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="1300" y="222" text-anchor="end" fill="#555" class="mono" font-size="10" letter-spacing="4">LOCAL-FIRST / WAL / CONSENT</text>
</svg>
