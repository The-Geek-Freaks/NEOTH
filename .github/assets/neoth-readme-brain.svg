<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="NEOTH three hemispheres and six memory layers">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }
      .title { font-size: 28px; font-weight: 300; letter-spacing: 6px; fill: #fff; }
      .label { font-size: 12px; letter-spacing: 1.7px; }
      .small { font-size: 10px; letter-spacing: 1px; fill: #d8d8d8; opacity: .8; }
    </style>
  </defs>

  <rect width="1280" height="560" rx="36" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="558" rx="36" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <text x="640" y="54" class="sans title" text-anchor="middle">THREE ROLES / SIX MEMORY LAYERS</text>
  <text x="640" y="84" class="mono" font-size="10" letter-spacing="3" fill="#00ff80" text-anchor="middle" opacity=".78">FAST HELP, DEEP THINKING, AUDITED SYNTHESIS</text>

  <g class="mono" text-anchor="middle">
    <rect x="90" y="138" width="280" height="124" rx="26" fill="#00ff80" opacity=".075" stroke="#00ff80" stroke-opacity=".34"/>
    <text x="230" y="178" class="label" fill="#00ff80">LEFT HEMISPHERE</text>
    <text x="230" y="208" class="small">fast answer</text>
    <text x="230" y="230" class="small">implementation</text>

    <rect x="910" y="138" width="280" height="124" rx="26" fill="#05d5ff" opacity=".075" stroke="#05d5ff" stroke-opacity=".34"/>
    <text x="1050" y="178" class="label" fill="#05d5ff">RIGHT HEMISPHERE</text>
    <text x="1050" y="208" class="small">deep analysis</text>
    <text x="1050" y="230" class="small">risk + review</text>

    <circle cx="640" cy="200" r="92" fill="#fff" opacity=".045" stroke="#fff" stroke-opacity=".16" filter="url(#glow)"/>
    <text x="640" y="185" class="sans" font-size="44" font-weight="100" letter-spacing="14" fill="#fff">NEOTH</text>
    <text x="640" y="222" class="label" fill="#ff2a6d">CALLOSUM / CEREBELLUM</text>
    <text x="640" y="246" class="small">orchestrate, route, dissent</text>
  </g>

  <path d="M370,200 C462,148 545,148 560,200" fill="none" stroke="#00ff80" stroke-opacity=".52"/>
  <path d="M910,200 C818,148 735,148 720,200" fill="none" stroke="#05d5ff" stroke-opacity=".52"/>
  <path d="M560,236 C510,314 360,324 250,342" fill="none" stroke="#00ff80" stroke-opacity=".32"/>
  <path d="M720,236 C770,314 920,324 1030,342" fill="none" stroke="#05d5ff" stroke-opacity=".32"/>
  <path d="M640,292 L640,342" stroke="#ff2a6d" stroke-opacity=".42"/>

  <g class="mono">
    <rect x="72" y="352" width="172" height="82" rx="16" fill="#00ff80" opacity=".07" stroke="#00ff80" stroke-opacity=".26"/>
    <text x="96" y="382" class="label" fill="#00ff80">L1 HOT</text>
    <text x="96" y="410" class="small">session + canvas</text>

    <rect x="260" y="352" width="172" height="82" rx="16" fill="#00ff80" opacity=".055" stroke="#00ff80" stroke-opacity=".2"/>
    <text x="284" y="382" class="label" fill="#00ff80">L2 WARM</text>
    <text x="284" y="410" class="small">recent recall</text>

    <rect x="448" y="352" width="172" height="82" rx="16" fill="#05d5ff" opacity=".07" stroke="#05d5ff" stroke-opacity=".26"/>
    <text x="472" y="382" class="label" fill="#05d5ff">L3 EPISODIC</text>
    <text x="472" y="410" class="small">events + time</text>

    <rect x="636" y="352" width="172" height="82" rx="16" fill="#05d5ff" opacity=".055" stroke="#05d5ff" stroke-opacity=".2"/>
    <text x="660" y="382" class="label" fill="#05d5ff">L4 SEMANTIC</text>
    <text x="660" y="410" class="small">concept recall</text>

    <rect x="824" y="352" width="172" height="82" rx="16" fill="#ff2a6d" opacity=".07" stroke="#ff2a6d" stroke-opacity=".26"/>
    <text x="848" y="382" class="label" fill="#ff2a6d">L5 KNOWLEDGE</text>
    <text x="848" y="410" class="small">skills + lessons</text>

    <rect x="1012" y="352" width="196" height="82" rx="16" fill="#fff" opacity=".055" stroke="#fff" stroke-opacity=".18"/>
    <text x="1036" y="382" class="label" fill="#fff">L6 VAULT</text>
    <text x="1036" y="410" class="small">Obsidian mirror</text>
  </g>

  <text x="640" y="496" class="mono" font-size="10" letter-spacing="3" fill="#00ff80" opacity=".7" text-anchor="middle">not one opaque chat history: evidence, regions, layers, redactions</text>
</svg>
