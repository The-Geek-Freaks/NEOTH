<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="NEOTH - Neural Engine Obligated To Help">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#222"/>
      <stop offset="58%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <linearGradient id="pulseGreen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00ff80" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ff80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseBlue" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#05d5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#05d5ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#05d5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulsePink" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff2a6d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2a6d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff2a6d" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glassShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="42" fill="url(#bg)"/>

  <circle cx="225" cy="95" r="230" fill="#ff2a6d" opacity="0.045">
    <animate attributeName="cx" values="210;270;210" dur="19s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="330" r="260" fill="#05d5ff" opacity="0.055">
    <animate attributeName="cx" values="1030;970;1030" dur="23s" repeatCount="indefinite"/>
  </circle>

  <rect x="214" y="72" width="852" height="268" rx="48" fill="#fff" opacity="0.024" stroke="#fff" stroke-opacity="0.12" filter="url(#glassShadow)"/>
  <rect x="250" y="104" width="780" height="204" rx="34" fill="#000" opacity="0.13" stroke="#fff" stroke-opacity="0.055"/>

  <path d="M92,210 C280,84 450,336 640,210 C830,84 1000,336 1188,210" fill="none" stroke="url(#pulseGreen)" stroke-width="1.4" opacity="0.72">
    <animate attributeName="d" dur="13s" repeatCount="indefinite" values="M92,210 C280,84 450,336 640,210 C830,84 1000,336 1188,210;M92,210 C280,336 450,84 640,210 C830,336 1000,84 1188,210;M92,210 C280,84 450,336 640,210 C830,84 1000,336 1188,210"/>
  </path>
  <path d="M118,210 C326,262 462,154 640,210 C818,262 954,154 1162,210" fill="none" stroke="url(#pulseBlue)" stroke-width="1" opacity="0.55">
    <animate attributeName="d" dur="17s" repeatCount="indefinite" values="M118,210 C326,262 462,154 640,210 C818,262 954,154 1162,210;M118,210 C326,154 462,262 640,210 C818,154 954,262 1162,210;M118,210 C326,262 462,154 640,210 C818,262 954,154 1162,210"/>
  </path>
  <path d="M140,210 C360,198 464,222 640,210 C816,198 920,222 1140,210" fill="none" stroke="url(#pulsePink)" stroke-width="0.8" stroke-dasharray="3 10" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-260" dur="21s" repeatCount="indefinite"/>
  </path>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <text x="640" y="218" font-size="88" font-weight="100" letter-spacing="34" fill="#ffffff" filter="url(#softGlow)">NEOTH</text>
    <line x1="552" y1="252" x2="728" y2="252" stroke="#fff" stroke-opacity="0.28"/>
    <text x="640" y="288" font-size="11" font-weight="300" letter-spacing="9" fill="#bdbdbd">YOUR BUDDY, YOUR LIFE</text>
  </g>

  <text x="74" y="66" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" letter-spacing="5" fill="#00ff80" opacity="0.72">N-01</text>
  <text x="1206" y="66" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10" letter-spacing="5" fill="#a8a8a8" opacity="0.55" text-anchor="end">SOVEREIGN CORE</text>
  <text x="640" y="372" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="9" letter-spacing="4" fill="#00ff80" opacity="0.68" text-anchor="middle">// neural engine obligated to help</text>
</svg>
