<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH market position</title>
  <desc id="desc">Positioning map comparing NEOTH, Hermes, OpenHuman, and OpenClaw across sovereign memory, managed convenience, coding workflow and operator-grade control.</desc>
  <defs>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="axisArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#666"/>
    </marker>
    <style>
      .sans{font-family:"SF Pro Display",Inter,"Helvetica Neue",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>

  <rect width="1400" height="560" rx="40" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="558" rx="39" stroke="white" stroke-opacity=".08"/>

  <text x="700" y="58" text-anchor="middle" fill="white" class="sans" font-size="34" font-weight="200" letter-spacing="5">WHERE NEOTH FITS</text>
  <text x="700" y="91" text-anchor="middle" fill="#929292" class="sans" font-size="15">The overlap: daily buddy, sovereign memory, coding workflow, private mesh and operator controls.</text>

  <g transform="translate(60 126)">
    <rect width="870" height="350" rx="24" fill="#080808" stroke="white" stroke-opacity=".08"/>
    <path d="M88 286 H802" stroke="#666" stroke-width="1.4" marker-end="url(#axisArrow)"/>
    <path d="M88 286 V56" stroke="#666" stroke-width="1.4" marker-end="url(#axisArrow)"/>
    <path d="M88 228 H802 M88 170 H802 M88 112 H802" stroke="white" stroke-opacity=".05"/>
    <path d="M266 286 V56 M444 286 V56 M622 286 V56" stroke="white" stroke-opacity=".05"/>

    <text x="222" y="329" text-anchor="middle" fill="#8d8d8d" class="sans" font-size="14">single-session assistant</text>
    <text x="800" y="329" text-anchor="end" fill="#00ff80" class="sans" font-size="14">durable audited memory</text>
    <text x="34" y="292" text-anchor="middle" fill="#8d8d8d" class="sans" font-size="14" transform="rotate(-90 34 292)">consumer-simple</text>
    <text x="34" y="78" text-anchor="middle" fill="#05d5ff" class="sans" font-size="14" transform="rotate(-90 34 78)">operator-grade</text>

    <text x="172" y="262" fill="#4d4d4d" class="sans" font-size="20" font-weight="200">plain chat</text>
    <text x="334" y="248" fill="#4d4d4d" class="sans" font-size="20" font-weight="200">vault tools</text>
    <text x="486" y="92" fill="#4d4d4d" class="sans" font-size="20" font-weight="200">agent workflow</text>

    <g transform="translate(690 82)" filter="url(#glow)">
      <circle r="40" fill="#00ff80" fill-opacity=".12" stroke="#00ff80" stroke-opacity=".74"/>
      <text x="0" y="6" text-anchor="middle" fill="white" class="sans" font-size="17" font-weight="600">NEOTH</text>
    </g>
    <g transform="translate(520 120)">
      <circle r="27" fill="#05d5ff" fill-opacity=".09" stroke="#05d5ff" stroke-opacity=".5"/>
      <text x="0" y="54" text-anchor="middle" fill="#ddd" class="sans" font-size="15">Hermes</text>
    </g>
    <g transform="translate(608 230)">
      <circle r="27" fill="#ff2a6d" fill-opacity=".09" stroke="#ff2a6d" stroke-opacity=".5"/>
      <text x="0" y="54" text-anchor="middle" fill="#ddd" class="sans" font-size="15">OpenHuman</text>
    </g>
    <g transform="translate(408 145)">
      <circle r="27" fill="#05d5ff" fill-opacity=".08" stroke="#05d5ff" stroke-opacity=".44"/>
      <text x="0" y="54" text-anchor="middle" fill="#ddd" class="sans" font-size="15">OpenClaw</text>
    </g>

    <g class="mono" font-size="10" letter-spacing="2.3">
      <rect x="612" y="136" width="166" height="30" rx="8" fill="#00ff80" fill-opacity=".08" stroke="#00ff80" stroke-opacity=".24"/>
      <text x="695" y="156" text-anchor="middle" fill="#00ff80">NO HOSTED CORE</text>
      <rect x="612" y="176" width="166" height="30" rx="8" fill="#05d5ff" fill-opacity=".08" stroke="#05d5ff" stroke-opacity=".24"/>
      <text x="695" y="196" text-anchor="middle" fill="#05d5ff">WAL EVIDENCE</text>
      <rect x="612" y="216" width="166" height="30" rx="8" fill="#ff2a6d" fill-opacity=".08" stroke="#ff2a6d" stroke-opacity=".24"/>
      <text x="695" y="236" text-anchor="middle" fill="#ff2a6d">BUDDY + CODE + MESH</text>
    </g>
  </g>

  <g transform="translate(970 126)" class="sans">
    <rect width="350" height="350" rx="24" fill="#101010" stroke="white" stroke-opacity=".09"/>
    <text x="28" y="44" fill="#00ff80" class="mono" font-size="11" letter-spacing="4">READ THE MAP</text>
    <text x="28" y="82" fill="white" font-size="20" font-weight="300">NEOTH is not just one lane.</text>

    <text x="28" y="122" fill="#929292" font-size="14">
      <tspan x="28" y="122">Hermes:</tspan>
      <tspan x="28" y="142">persistent server-agent</tspan>
      <tspan x="28" y="162">workflow.</tspan>
    </text>

    <text x="28" y="198" fill="#929292" font-size="14">
      <tspan x="28" y="198">OpenHuman:</tspan>
      <tspan x="28" y="218">managed memory and</tspan>
      <tspan x="28" y="238">OAuth convenience.</tspan>
    </text>

    <text x="28" y="274" fill="#929292" font-size="14">
      <tspan x="28" y="274">OpenClaw:</tspan>
      <tspan x="28" y="294">gateway breadth, live</tspan>
      <tspan x="28" y="314">tools and channels.</tspan>
    </text>

    <path d="M210 110 V330" stroke="white" stroke-opacity=".08"/>
    <text x="230" y="142" fill="#ddd" font-size="14">
      <tspan x="230" y="142">NEOTH combines</tspan>
      <tspan x="230" y="162">friendly setup</tspan>
      <tspan x="230" y="182">with sovereign</tspan>
      <tspan x="230" y="202">audit, code, plugins</tspan>
      <tspan x="230" y="222">and private mesh.</tspan>
    </text>
  </g>
</svg>
