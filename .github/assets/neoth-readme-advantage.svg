<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH advantage map</title>
  <desc id="desc">NEOTH combines personal buddy, private memory, coding studio and operator runtime.</desc>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect width="1400" height="420" rx="34" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="418" rx="33" stroke="white" stroke-opacity=".08"/>
  <text x="70" y="60" fill="white" class="sans" font-size="25" font-weight="700">The overlap is the product</text>
  <text x="70" y="92" fill="#8d8d8d" class="sans" font-size="15">NEOTH 1.0 is not only chat, not only memory, not only coding, not only automation. It is the operator-owned overlap.</text>

  <g transform="translate(370 120)" filter="url(#glow)">
    <circle cx="180" cy="120" r="118" fill="#00ff80" opacity=".16" stroke="#00ff80" stroke-opacity=".55"/>
    <circle cx="310" cy="120" r="118" fill="#ff2a6d" opacity=".16" stroke="#ff2a6d" stroke-opacity=".55"/>
    <circle cx="245" cy="230" r="118" fill="#05d5ff" opacity=".16" stroke="#05d5ff" stroke-opacity=".55"/>
    <text x="130" y="92" fill="#00ff80" class="sans" font-size="17" font-weight="700">Daily buddy</text>
    <text x="286" y="92" fill="#ff2a6d" class="sans" font-size="17" font-weight="700">Coding studio</text>
    <text x="190" y="300" fill="#05d5ff" class="sans" font-size="17" font-weight="700">Private operator runtime</text>
    <text x="245" y="176" text-anchor="middle" fill="white" class="sans" font-size="34" font-weight="200" letter-spacing="10">NEOTH</text>
    <text x="245" y="206" text-anchor="middle" fill="#aaa" class="mono" font-size="11" letter-spacing="2">LOYAL MEMORY CORE</text>
  </g>

  <g class="sans" font-size="14">
    <rect x="82" y="145" width="250" height="52" rx="14" fill="#121212" stroke="#00ff80" stroke-opacity=".35"/><text x="207" y="177" text-anchor="middle" fill="white">No-YAML path for normal users</text>
    <rect x="82" y="215" width="250" height="52" rx="14" fill="#121212" stroke="#ff2a6d" stroke-opacity=".35"/><text x="207" y="247" text-anchor="middle" fill="white">Canvas + Kanban + repo memory</text>
    <rect x="82" y="285" width="250" height="52" rx="14" fill="#121212" stroke="#05d5ff" stroke-opacity=".35"/><text x="207" y="317" text-anchor="middle" fill="white">Auditable local-first control</text>
    <rect x="1068" y="145" width="250" height="52" rx="14" fill="#121212" stroke="#00ff80" stroke-opacity=".35"/><text x="1193" y="177" text-anchor="middle" fill="white">Six memory layers</text>
    <rect x="1068" y="215" width="250" height="52" rx="14" fill="#121212" stroke="#ff2a6d" stroke-opacity=".35"/><text x="1193" y="247" text-anchor="middle" fill="white">Three coordinating brain roles</text>
    <rect x="1068" y="285" width="250" height="52" rx="14" fill="#121212" stroke="#05d5ff" stroke-opacity=".35"/><text x="1193" y="317" text-anchor="middle" fill="white">Private mesh + automation</text>
  </g>
</svg>
