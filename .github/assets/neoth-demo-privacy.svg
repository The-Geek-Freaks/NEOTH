<svg width="960" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">NEOTH fail-closed privacy audit</title>
  <desc id="d">Running the privacy audit in fully-local mode shows zero cloud calls, zero profile-to-cloud extractions, and zero unapproved channel egress — the boundary defaults to denied.</desc>
  <defs>
    <style>
      .mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:"SF Pro Display",Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif}
    </style>
    <filter id="p-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="420" rx="20" fill="#0d0d0d"/>
  <rect x="1" y="1" width="958" height="418" rx="19" stroke="white" stroke-opacity=".08"/>
  <rect x="28" y="28" width="904" height="364" rx="16" fill="#0a0a0a" stroke="white" stroke-opacity=".08"/>
  <g><circle cx="56" cy="56" r="6" fill="#00ff80"/><circle cx="78" cy="56" r="6" fill="#05d5ff"/><circle cx="100" cy="56" r="6" fill="#ff2a6d"/></g>
  <text x="480" y="60" text-anchor="middle" fill="#8f8f8f" class="mono" font-size="12" letter-spacing="3">FAIL-CLOSED · FULLY LOCAL</text>
  <line x1="28" y1="80" x2="932" y2="80" stroke="white" stroke-opacity=".07"/>

  <g class="mono" font-size="14">
    <text x="56" y="118" fill="#00ff80">$ <tspan fill="#e8e8e8">neoth privacy audit --last 30d</tspan>
      <animate attributeName="opacity" dur="11s" values="0;1;1;1;1" keyTimes="0;.06;.5;.95;1" repeatCount="indefinite"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" dur="11s" values="0;0;1;1;1" keyTimes="0;.22;.28;.95;1" repeatCount="indefinite"/>
      <text x="56" y="162" fill="#b8b8b8">cloud provider calls</text><text x="620" y="162" fill="#00ff80">0</text><text x="900" y="162" text-anchor="end" fill="#6f6f6f">no data left device</text>
      <text x="56" y="196" fill="#b8b8b8">profile → cloud extractions</text><text x="620" y="196" fill="#00ff80">0</text><text x="900" y="196" text-anchor="end" fill="#6f6f6f">fail-closed by default</text>
      <text x="56" y="230" fill="#b8b8b8">unapproved channel egress</text><text x="620" y="230" fill="#00ff80">0</text><text x="900" y="230" text-anchor="end" fill="#6f6f6f">denied until granted</text>
      <text x="56" y="264" fill="#b8b8b8">provider fallbacks (silent)</text><text x="620" y="264" fill="#00ff80">0</text><text x="900" y="264" text-anchor="end" fill="#6f6f6f">every failover audited</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" dur="11s" values="0;0;1;1;1" keyTimes="0;.60;.66;.95;1" repeatCount="indefinite"/>
    <rect x="56" y="292" width="848" height="64" rx="12" fill="#111f1a" stroke="#00ff80" stroke-opacity=".4" filter="url(#p-glow)"/>
    <text x="88" y="332" fill="#00ff80" class="sans" font-size="22" font-weight="300">✓  LOCAL ONLY</text>
    <text x="880" y="332" text-anchor="end" fill="#8f8f8f" class="mono" font-size="12">the boundary starts at "no"</text>
  </g>
</svg>
