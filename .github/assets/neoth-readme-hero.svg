<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH - Sovereign Buddy</title>
  <desc id="desc">Animated NEOTH hero with a living neural sine wave and three moving particles.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="78%">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset=".52" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="pulseGrad" x1="120" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#00ff80" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff80" stop-opacity=".92"/>
      <stop offset="1" stop-color="#00ff80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="120" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#05d5ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#05d5ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#05d5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:"SF Pro Display",Inter,"Helvetica Neue",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .logo{font-family:"SF Pro Display",Inter,"Helvetica Neue",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:100;letter-spacing:34px}
    </style>
  </defs>

  <rect width="1400" height="420" rx="40" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="418" rx="39" stroke="white" stroke-opacity=".07"/>

  <circle cx="250" cy="96" r="230" fill="#ff2a6d" opacity=".045" filter="url(#softGlow)">
    <animate attributeName="opacity" dur="16s" values=".035;.07;.035" repeatCount="indefinite"/>
  </circle>
  <circle cx="1160" cy="330" r="250" fill="#05d5ff" opacity=".05" filter="url(#softGlow)">
    <animate attributeName="opacity" dur="18s" values=".035;.075;.035" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="210" r="220" fill="#00ff80" opacity=".035" filter="url(#softGlow)">
    <animate attributeName="opacity" dur="13s" values=".025;.055;.025" repeatCount="indefinite"/>
  </circle>

  <rect x="310" y="108" width="780" height="190" rx="48" fill="#ffffff" fill-opacity=".022" stroke="white" stroke-opacity=".085"/>
  <rect x="335" y="132" width="730" height="142" rx="38" fill="#050505" fill-opacity=".42" stroke="white" stroke-opacity=".045"/>

  <path id="mainPulse" d="M130 208 C 320 76, 496 342, 700 208 C 904 74, 1080 340, 1270 208" stroke="url(#pulseGrad)" stroke-width="2" fill="none" filter="url(#softGlow)">
    <animate attributeName="d" dur="14s" repeatCount="indefinite"
      values="M130 208 C 320 76, 496 342, 700 208 C 904 74, 1080 340, 1270 208;
              M130 208 C 320 340, 496 78, 700 208 C 904 338, 1080 80, 1270 208;
              M130 208 C 320 76, 496 342, 700 208 C 904 74, 1080 340, 1270 208"/>
    <animate attributeName="opacity" dur="7s" values=".44;.78;.44" repeatCount="indefinite"/>
  </path>
  <path id="deepPulse" d="M130 242 C 325 338, 502 132, 700 242 C 898 350, 1075 132, 1270 242" stroke="url(#blueGrad)" stroke-width="1.1" fill="none" opacity=".38">
    <animate attributeName="d" dur="19s" repeatCount="indefinite"
      values="M130 242 C 325 338, 502 132, 700 242 C 898 350, 1075 132, 1270 242;
              M130 242 C 325 138, 502 348, 700 242 C 898 136, 1075 348, 1270 242;
              M130 242 C 325 338, 502 132, 700 242 C 898 350, 1075 132, 1270 242"/>
  </path>

  <circle r="3.4" fill="#00ff80" filter="url(#softGlow)">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#mainPulse"/>
    </animateMotion>
    <animate attributeName="r" dur="2.4s" values="2.5;4.1;2.5" repeatCount="indefinite"/>
    <animate attributeName="opacity" dur="2.4s" values=".25;1;.25" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#ff2a6d" filter="url(#softGlow)">
    <animateMotion dur="9s" begin="-3s" repeatCount="indefinite" rotate="auto">
      <mpath href="#mainPulse"/>
    </animateMotion>
    <animate attributeName="r" dur="3s" values="2.2;3.7;2.2" repeatCount="indefinite"/>
    <animate attributeName="opacity" dur="3s" values=".18;.92;.18" repeatCount="indefinite"/>
  </circle>
  <circle r="2.8" fill="#05d5ff" filter="url(#softGlow)">
    <animateMotion dur="11s" begin="-5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#deepPulse"/>
    </animateMotion>
    <animate attributeName="r" dur="3.3s" values="2;3.5;2" repeatCount="indefinite"/>
    <animate attributeName="opacity" dur="3.3s" values=".16;.9;.16" repeatCount="indefinite"/>
  </circle>

  <text x="718" y="198" text-anchor="middle" fill="#ffffff" class="logo" font-size="92">NEOTH</text>
  <rect x="622" y="226" width="156" height="1" fill="url(#pulseGrad)" opacity=".9"/>
  <text x="700" y="262" text-anchor="middle" fill="#a8a8a8" class="sans" font-size="12" letter-spacing="8">NEURAL ENGINE OBLIGATED TO HELP</text>
  <text x="700" y="360" text-anchor="middle" fill="#666666" class="mono" font-size="10" letter-spacing="4">YOUR BUDDY. YOUR MEMORY. YOUR RULES.</text>
</svg>
