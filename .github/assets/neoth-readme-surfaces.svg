<svg width="1400" height="500" viewBox="0 0 1400 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH 1.0 surfaces</title>
  <desc id="desc">A single NEOTH memory and permission core connected to GUI, CLI, channels, Obsidian, n8n, Paperless, email, calendar, coding and cluster surfaces.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#00ff80" stop-opacity=".42"/>
      <stop offset=".42" stop-color="#111"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .node{fill:#121212;stroke:white;stroke-opacity:.1}
      .green{stroke:#00ff80}.pink{stroke:#ff2a6d}.blue{stroke:#05d5ff}
    </style>
  </defs>
  <rect width="1400" height="500" rx="34" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="498" rx="33" stroke="white" stroke-opacity=".08"/>
  <text x="70" y="62" fill="white" class="sans" font-size="25" font-weight="700">One buddy with many doors</text>
  <text x="70" y="94" fill="#8b8b8b" class="sans" font-size="15">The same memory, permission model, profile, redactions, and audit trail follow the operator across every surface.</text>

  <g stroke-width="2" stroke-opacity=".42">
    <path class="green" d="M700 252 L260 145"/><path class="green" d="M700 252 L260 252"/><path class="green" d="M700 252 L260 360"/>
    <path class="pink" d="M700 252 L520 125"/><path class="pink" d="M700 252 L520 380"/>
    <path class="blue" d="M700 252 L880 125"/><path class="blue" d="M700 252 L880 380"/>
    <path class="green" d="M700 252 L1140 145"/><path class="blue" d="M700 252 L1140 252"/><path class="pink" d="M700 252 L1140 360"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="700" cy="252" r="110" fill="url(#core)" stroke="#00ff80" stroke-opacity=".5"/>
    <text x="700" y="244" text-anchor="middle" fill="white" class="sans" font-size="42" font-weight="200" letter-spacing="16">NEOTH</text>
    <text x="700" y="282" text-anchor="middle" fill="#a3a3a3" class="mono" font-size="11" letter-spacing="3">MEMORY + POLICY + AUDIT</text>
  </g>

  <g class="sans" font-size="14">
    <g transform="translate(120 112)"><rect class="node green" width="280" height="66" rx="16"/><text x="140" y="30" text-anchor="middle" fill="white" font-weight="700">GUI Wizard</text><text x="140" y="50" text-anchor="middle" fill="#8d8d8d" font-size="12">normal users, visual controls</text></g>
    <g transform="translate(120 220)"><rect class="node green" width="280" height="66" rx="16"/><text x="140" y="30" text-anchor="middle" fill="white" font-weight="700">CLI + Terminal</text><text x="140" y="50" text-anchor="middle" fill="#8d8d8d" font-size="12">operators, scripts, SSH</text></g>
    <g transform="translate(120 328)"><rect class="node green" width="280" height="66" rx="16"/><text x="140" y="30" text-anchor="middle" fill="white" font-weight="700">Phone + Chat</text><text x="140" y="50" text-anchor="middle" fill="#8d8d8d" font-size="12">Telegram, WhatsApp, Slack, Discord, Keet</text></g>

    <g transform="translate(430 82)"><rect class="node pink" width="180" height="66" rx="16"/><text x="90" y="30" text-anchor="middle" fill="white" font-weight="700">Obsidian</text><text x="90" y="50" text-anchor="middle" fill="#8d8d8d" font-size="12">human-readable vault</text></g>
    <g transform="translate(430 352)"><rect class="node pink" width="180" height="66" rx="16"/><text x="90" y="30" text-anchor="middle" fill="white" font-weight="700">Coding Studio</text><text x="90" y="50" text-anchor="middle" fill="#8d8d8d" font-size="12">canvas, Kanban, review</text></g>

    <g transform="translate(790 82)"><rect class="node blue" width="180" height="66" rx="16"/><text x="90" y="30" text-anchor="middle" fill="white" font-weight="700">n8n + Cron</text><text x="90" y="50" text-anchor="middle" fill="#8d8d8d" font-size="12">workflows, routines</text></g>
    <g transform="translate(790 352)"><rect class="node blue" width="180" height="66" rx="16"/><text x="90" y="30" text-anchor="middle" fill="white" font-weight="700">Paperless</text><text x="90" y="50" text-anchor="middle" fill="#8d8d8d" font-size="12">OCR, documents, knowledge</text></g>

    <g transform="translate(1000 112)"><rect class="node green" width="280" height="66" rx="16"/><text x="140" y="30" text-anchor="middle" fill="white" font-weight="700">Email + Calendar</text><text x="140" y="50" text-anchor="middle" fill="#8d8d8d" font-size="12">drafts, scheduling, reminders</text></g>
    <g transform="translate(1000 220)"><rect class="node blue" width="280" height="66" rx="16"/><text x="140" y="30" text-anchor="middle" fill="white" font-weight="700">Local Models</text><text x="140" y="50" text-anchor="middle" fill="#8d8d8d" font-size="12">Qwen, Ouro, CLIP, Whisper</text></g>
    <g transform="translate(1000 328)"><rect class="node pink" width="280" height="66" rx="16"/><text x="140" y="30" text-anchor="middle" fill="white" font-weight="700">Private Mesh</text><text x="140" y="50" text-anchor="middle" fill="#8d8d8d" font-size="12">LAN, Tailscale, Hysteria, cluster</text></g>
  </g>
</svg>
