<svg width="1400" height="480" viewBox="0 0 1400 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH surfaces orbit</title>
  <desc id="desc">NEOTH memory, policy and audit core with user, knowledge, automation and infrastructure surfaces orbiting it.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#00ff80" stop-opacity=".28"/>
      <stop offset=".44" stop-color="#111"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:"SF Pro Display",Inter,"Helvetica Neue",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .node{fill:#121212;stroke:white;stroke-opacity:.1}
      .title{font-weight:200;letter-spacing:.02em}
    </style>
  </defs>
  <rect width="1400" height="480" rx="40" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="478" rx="39" stroke="white" stroke-opacity=".08"/>
  <text x="72" y="62" fill="white" class="sans title" font-size="30">One memory. Many doors.</text>
  <text x="72" y="92" fill="#9a9a9a" class="sans" font-size="15">Surfaces change. The memory core stays yours.</text>

  <circle cx="700" cy="258" r="160" stroke="white" stroke-opacity=".055"/>
  <circle cx="700" cy="258" r="220" stroke="white" stroke-opacity=".045" stroke-dasharray="6 14"/>
  <circle cx="700" cy="258" r="96" fill="url(#core)" stroke="#00ff80" stroke-opacity=".48" filter="url(#glow)"/>
  <text x="700" y="244" text-anchor="middle" fill="white" class="sans" font-size="38" font-weight="200" letter-spacing="14">NEOTH</text>
  <text x="700" y="276" text-anchor="middle" fill="#9a9a9a" class="mono" font-size="10" letter-spacing="3">MEMORY</text>
  <text x="700" y="298" text-anchor="middle" fill="#05d5ff" class="mono" font-size="10" letter-spacing="3">POLICY + AUDIT</text>

  <g stroke-width="1.5" stroke-opacity=".36">
    <path d="M700 258 L294 150" stroke="#00ff80"/>
    <path d="M700 258 L294 258" stroke="#00ff80"/>
    <path d="M700 258 L294 366" stroke="#00ff80"/>
    <path d="M700 258 L530 116" stroke="#ff2a6d"/>
    <path d="M700 258 L530 400" stroke="#ff2a6d"/>
    <path d="M700 258 L870 116" stroke="#05d5ff"/>
    <path d="M700 258 L870 400" stroke="#05d5ff"/>
    <path d="M700 258 L1106 150" stroke="#00ff80"/>
    <path d="M700 258 L1106 258" stroke="#05d5ff"/>
    <path d="M700 258 L1106 366" stroke="#ff2a6d"/>
  </g>

  <g class="sans" font-size="14">
    <g transform="translate(126 118)"><rect class="node" width="300" height="64" rx="16" stroke="#00ff80" stroke-opacity=".35"/><text x="150" y="28" text-anchor="middle" fill="white" font-weight="600">Human Surfaces</text><text x="150" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">GUI, CLI, phone, team chat</text></g>
    <g transform="translate(126 226)"><rect class="node" width="300" height="64" rx="16" stroke="#00ff80" stroke-opacity=".35"/><text x="150" y="28" text-anchor="middle" fill="white" font-weight="600">Coding Studio</text><text x="150" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">canvas, Kanban, review memory</text></g>
    <g transform="translate(126 334)"><rect class="node" width="300" height="64" rx="16" stroke="#ff2a6d" stroke-opacity=".35"/><text x="150" y="28" text-anchor="middle" fill="white" font-weight="600">Personal Memory</text><text x="150" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">profile, preferences, redactions</text></g>
    <g transform="translate(444 84)"><rect class="node" width="172" height="64" rx="16" stroke="#ff2a6d" stroke-opacity=".35"/><text x="86" y="28" text-anchor="middle" fill="white" font-weight="600">Obsidian</text><text x="86" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">vault mirror</text></g>
    <g transform="translate(444 368)"><rect class="node" width="172" height="64" rx="16" stroke="#05d5ff" stroke-opacity=".35"/><text x="86" y="28" text-anchor="middle" fill="white" font-weight="600">Paperless</text><text x="86" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">docs + OCR</text></g>
    <g transform="translate(784 84)"><rect class="node" width="172" height="64" rx="16" stroke="#05d5ff" stroke-opacity=".35"/><text x="86" y="28" text-anchor="middle" fill="white" font-weight="600">n8n / Cron</text><text x="86" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">routines</text></g>
    <g transform="translate(784 368)"><rect class="node" width="172" height="64" rx="16" stroke="#05d5ff" stroke-opacity=".35"/><text x="86" y="28" text-anchor="middle" fill="white" font-weight="600">Local Models</text><text x="86" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">Qwen, Ouro</text></g>
    <g transform="translate(974 118)"><rect class="node" width="300" height="64" rx="16" stroke="#00ff80" stroke-opacity=".35"/><text x="150" y="28" text-anchor="middle" fill="white" font-weight="600">Action Surfaces</text><text x="150" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">email, calendar, tools, workflows</text></g>
    <g transform="translate(974 226)"><rect class="node" width="300" height="64" rx="16" stroke="#05d5ff" stroke-opacity=".35"/><text x="150" y="28" text-anchor="middle" fill="white" font-weight="600">Trust Surfaces</text><text x="150" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">audit, doctor, policy, WAL</text></g>
    <g transform="translate(974 334)"><rect class="node" width="300" height="64" rx="16" stroke="#ff2a6d" stroke-opacity=".35"/><text x="150" y="28" text-anchor="middle" fill="white" font-weight="600">Private Mesh</text><text x="150" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">LAN, Tailscale, Hysteria, Keet</text></g>
  </g>
</svg>
