<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH trust stack</title>
  <desc id="desc">A bottom-up trust stack: WAL evidence, local learning and routing, permissioned profile memory, capability gates, and operator override.</desc>
  <defs>
    <linearGradient id="rail" x1="290" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05d5ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff80" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="44%" r="82%">
      <stop offset="0" stop-color="#191919"/>
      <stop offset=".62" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <filter id="glow" x="-25%" y="-80%" width="150%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#00ff80"/>
    </marker>
    <style>
      .sans{font-family:"SF Pro Display",Inter,"Helvetica Neue",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .layer{fill:#111;stroke:white;stroke-opacity:.09}
    </style>
  </defs>

  <rect width="1400" height="520" rx="40" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="518" rx="39" stroke="white" stroke-opacity=".08"/>

  <text x="700" y="60" text-anchor="middle" fill="white" class="sans" font-size="34" font-weight="200" letter-spacing="5">TRUST IS A CONTROL PLANE</text>
  <text x="700" y="94" text-anchor="middle" fill="#929292" class="sans" font-size="15">Every durable memory and meaningful action crosses evidence, policy, capability, and operator control.</text>

  <path d="M700 426 V142" stroke="url(#rail)" stroke-width="3" marker-end="url(#arrow)" filter="url(#glow)"/>

  <g class="sans">
    <g transform="translate(250 382)">
      <rect class="layer" width="900" height="72" rx="18" stroke="#05d5ff" stroke-opacity=".45" filter="url(#glow)"/>
      <text x="34" y="29" fill="#05d5ff" class="mono" font-size="12" letter-spacing="4">01 / FOUNDATION</text>
      <text x="34" y="55" fill="white" font-size="20" font-weight="300">WAL evidence, request destinations, event history, integrity verification</text>
    </g>

    <g transform="translate(290 306)">
      <rect class="layer" width="820" height="66" rx="18" stroke="#00ff80" stroke-opacity=".38"/>
      <text x="34" y="27" fill="#00ff80" class="mono" font-size="12" letter-spacing="4">02 / LOCAL LEARNING</text>
      <text x="34" y="51" fill="white" font-size="19" font-weight="300">Qwen/Ouro profile extraction, provider routing, no silent cloud fallback</text>
    </g>

    <g transform="translate(330 234)">
      <rect class="layer" width="740" height="62" rx="18" stroke="#ff2a6d" stroke-opacity=".38"/>
      <text x="34" y="25" fill="#ff2a6d" class="mono" font-size="12" letter-spacing="4">03 / PERMISSIONED MEMORY</text>
      <text x="34" y="49" fill="white" font-size="19" font-weight="300">profile claims, evidence, confidence, redaction and relearn controls</text>
    </g>

    <g transform="translate(370 166)">
      <rect class="layer" width="660" height="58" rx="18" stroke="#05d5ff" stroke-opacity=".38"/>
      <text x="34" y="24" fill="#05d5ff" class="mono" font-size="12" letter-spacing="4">04 / CAPABILITY GATES</text>
      <text x="34" y="46" fill="white" font-size="18" font-weight="300">tools, plugins, channels and automation need scoped grants</text>
    </g>

    <g transform="translate(410 104)">
      <rect width="580" height="52" rx="18" fill="#141414" stroke="#ff2a6d" stroke-opacity=".48" filter="url(#glow)"/>
      <text x="290" y="33" text-anchor="middle" fill="white" font-size="19" font-weight="300">Operator override: approve, deny, redact, pause</text>
    </g>
  </g>

  <g class="mono" font-size="11" letter-spacing="2.8">
    <rect x="96" y="150" width="170" height="38" rx="8" fill="#111" stroke="#ff2a6d" stroke-opacity=".32"/>
    <text x="181" y="174" text-anchor="middle" fill="#ff2a6d">APPROVE</text>
    <rect x="96" y="204" width="170" height="38" rx="8" fill="#111" stroke="#ff2a6d" stroke-opacity=".32"/>
    <text x="181" y="228" text-anchor="middle" fill="#ff2a6d">REDACT</text>
    <rect x="1134" y="150" width="170" height="38" rx="8" fill="#111" stroke="#05d5ff" stroke-opacity=".32"/>
    <text x="1219" y="174" text-anchor="middle" fill="#05d5ff">VERIFY</text>
    <rect x="1134" y="204" width="170" height="38" rx="8" fill="#111" stroke="#00ff80" stroke-opacity=".32"/>
    <text x="1219" y="228" text-anchor="middle" fill="#00ff80">ROUTE</text>
  </g>

  <text x="700" y="488" text-anchor="middle" fill="#666" class="mono" font-size="10" letter-spacing="4">PRIVATE MEANS CHECKABLE: MEMORY, ACTIONS, PROVIDERS AND PLUGINS LEAVE EVIDENCE</text>
</svg>
