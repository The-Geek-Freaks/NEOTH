<svg width="1400" height="480" viewBox="0 0 1400 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH coding loop</title>
  <desc id="desc">NEOTH coding buddy loop: plan, split, dispatch, implement, verify, review, promote memory, resume.</desc>
  <defs>
    <linearGradient id="loop" x1="340" y1="160" x2="1060" y2="360">
      <stop offset="0" stop-color="#00ff80"/>
      <stop offset=".5" stop-color="#05d5ff"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:"SF Pro Display",Inter,"Helvetica Neue",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .title{font-weight:200;letter-spacing:.02em}
      .node{fill:#121212;stroke:white;stroke-opacity:.1}
    </style>
  </defs>
  <rect width="1400" height="480" rx="40" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="478" rx="39" stroke="white" stroke-opacity=".08"/>
  <text x="72" y="62" fill="white" class="sans title" font-size="30">The coding buddy that remembers the repo.</text>
  <text x="72" y="92" fill="#9a9a9a" class="sans" font-size="15">Planning, execution, verification and review all feed durable project memory.</text>

  <ellipse cx="700" cy="258" rx="360" ry="138" stroke="url(#loop)" stroke-width="2.4" stroke-opacity=".72" filter="url(#glow)"/>
  <path d="M1010 218 L1062 258 L1008 296" stroke="#ff2a6d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <g class="sans" font-size="14">
    <g transform="translate(278 138)"><rect class="node" width="164" height="64" rx="16" stroke="#00ff80" stroke-opacity=".38"/><text x="82" y="28" text-anchor="middle" fill="white" font-weight="600">Plan</text><text x="82" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">canvas</text></g>
    <g transform="translate(508 92)"><rect class="node" width="164" height="64" rx="16" stroke="#00ff80" stroke-opacity=".38"/><text x="82" y="28" text-anchor="middle" fill="white" font-weight="600">Split</text><text x="82" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">Kanban</text></g>
    <g transform="translate(728 92)"><rect class="node" width="164" height="64" rx="16" stroke="#00ff80" stroke-opacity=".38"/><text x="82" y="28" text-anchor="middle" fill="white" font-weight="600">Dispatch</text><text x="82" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">role-bound work</text></g>
    <g transform="translate(958 138)"><rect class="node" width="164" height="64" rx="16" stroke="#00ff80" stroke-opacity=".38"/><text x="82" y="28" text-anchor="middle" fill="white" font-weight="600">Implement</text><text x="82" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">patch</text></g>
    <g transform="translate(958 310)"><rect class="node" width="164" height="64" rx="16" stroke="#05d5ff" stroke-opacity=".38"/><text x="82" y="28" text-anchor="middle" fill="white" font-weight="600">Verify</text><text x="82" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">tests + gates</text></g>
    <g transform="translate(728 356)"><rect class="node" width="164" height="64" rx="16" stroke="#05d5ff" stroke-opacity=".38"/><text x="82" y="28" text-anchor="middle" fill="white" font-weight="600">Review</text><text x="82" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">dissent</text></g>
    <g transform="translate(508 356)"><rect class="node" width="164" height="64" rx="16" stroke="#ff2a6d" stroke-opacity=".38"/><text x="82" y="28" text-anchor="middle" fill="white" font-weight="600">Promote</text><text x="82" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">project memory</text></g>
    <g transform="translate(278 310)"><rect class="node" width="164" height="64" rx="16" stroke="#ff2a6d" stroke-opacity=".38"/><text x="82" y="28" text-anchor="middle" fill="white" font-weight="600">Resume</text><text x="82" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">no re-explain</text></g>
  </g>

  <g filter="url(#glow)">
    <circle cx="700" cy="258" r="86" fill="#101010" stroke="#00ff80" stroke-opacity=".42"/>
    <text x="700" y="246" text-anchor="middle" fill="white" class="sans" font-size="31" font-weight="200" letter-spacing="9">NEOTH</text>
    <text x="700" y="276" text-anchor="middle" fill="#9a9a9a" class="mono" font-size="10" letter-spacing="3">REPO MEMORY</text>
  </g>

  <g class="mono" font-size="11" letter-spacing="2.4">
    <rect x="102" y="202" width="170" height="38" rx="8" fill="#111" stroke="#00ff80" stroke-opacity=".32"/><text x="187" y="226" text-anchor="middle" fill="#00ff80">CANVAS</text>
    <rect x="102" y="250" width="170" height="38" rx="8" fill="#111" stroke="#ff2a6d" stroke-opacity=".32"/><text x="187" y="274" text-anchor="middle" fill="#ff2a6d">KANBAN</text>
    <rect x="1128" y="202" width="170" height="38" rx="8" fill="#111" stroke="#05d5ff" stroke-opacity=".32"/><text x="1213" y="226" text-anchor="middle" fill="#05d5ff">REVIEW</text>
    <rect x="1128" y="250" width="170" height="38" rx="8" fill="#111" stroke="#ff2a6d" stroke-opacity=".32"/><text x="1213" y="274" text-anchor="middle" fill="#ff2a6d">MEMORY</text>
  </g>
</svg>
