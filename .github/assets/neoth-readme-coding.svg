<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="NEOTH coding buddy canvas Kanban dispatch review memory">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="75%">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }
      .h { font-size: 28px; font-weight: 300; letter-spacing: 6px; fill: #fff; }
      .label { font-size: 12px; letter-spacing: 1.8px; }
      .tiny { font-size: 10px; letter-spacing: 1px; fill: #d8d8d8; opacity: .8; }
    </style>
  </defs>
  <rect width="1280" height="520" rx="36" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="518" rx="36" fill="none" stroke="#fff" stroke-opacity=".08"/>

  <text x="640" y="54" class="sans h" text-anchor="middle">CODING BUDDY CONTROL LOOP</text>
  <text x="640" y="84" class="mono" font-size="10" letter-spacing="3" fill="#00ff80" text-anchor="middle" opacity=".78">PROMPT -> CANVAS -> KANBAN -> HEMISPHERES -> PATCH / TEST / MEMORY</text>

  <g class="mono">
    <rect x="58" y="136" width="210" height="102" rx="18" fill="#00ff80" opacity=".075" stroke="#00ff80" stroke-opacity=".32"/>
    <text x="84" y="170" class="label" fill="#00ff80">OPERATOR PROMPT</text>
    <text x="84" y="198" class="tiny">"add migration + tests"</text>
    <text x="84" y="220" class="tiny">constraints + repo memory</text>

    <rect x="326" y="118" width="250" height="138" rx="22" fill="#05d5ff" opacity=".07" stroke="#05d5ff" stroke-opacity=".32"/>
    <text x="352" y="154" class="label" fill="#05d5ff">PLANNING CANVAS</text>
    <text x="352" y="184" class="tiny">tasks, deps, risks</text>
    <text x="352" y="206" class="tiny">acceptance criteria</text>
    <text x="352" y="228" class="tiny">operator-visible plan</text>

    <rect x="640" y="112" width="360" height="150" rx="22" fill="#fff" opacity=".045" stroke="#fff" stroke-opacity=".13"/>
    <text x="666" y="146" class="label" fill="#fff">KANBAN SESSION</text>
    <g>
      <rect x="666" y="170" width="52" height="62" rx="10" fill="#00ff80" opacity=".11" stroke="#00ff80" stroke-opacity=".28"/>
      <text x="692" y="194" class="tiny" text-anchor="middle">TODO</text>
      <text x="692" y="215" class="tiny" text-anchor="middle">3</text>
      <rect x="730" y="170" width="70" height="62" rx="10" fill="#05d5ff" opacity=".11" stroke="#05d5ff" stroke-opacity=".28"/>
      <text x="765" y="194" class="tiny" text-anchor="middle">ACTIVE</text>
      <text x="765" y="215" class="tiny" text-anchor="middle">2</text>
      <rect x="812" y="170" width="70" height="62" rx="10" fill="#ff2a6d" opacity=".11" stroke="#ff2a6d" stroke-opacity=".28"/>
      <text x="847" y="194" class="tiny" text-anchor="middle">REVIEW</text>
      <text x="847" y="215" class="tiny" text-anchor="middle">1</text>
      <rect x="894" y="170" width="70" height="62" rx="10" fill="#fff" opacity=".07" stroke="#fff" stroke-opacity=".22"/>
      <text x="929" y="194" class="tiny" text-anchor="middle">DONE</text>
      <text x="929" y="215" class="tiny" text-anchor="middle">4</text>
    </g>

    <rect x="1062" y="136" width="160" height="102" rx="18" fill="#ff2a6d" opacity=".075" stroke="#ff2a6d" stroke-opacity=".32"/>
    <text x="1142" y="170" class="label" fill="#ff2a6d" text-anchor="middle">OUTPUT</text>
    <text x="1142" y="198" class="tiny" text-anchor="middle">patch + tests</text>
    <text x="1142" y="220" class="tiny" text-anchor="middle">review summary</text>
  </g>

  <g class="mono">
    <rect x="190" y="335" width="270" height="104" rx="20" fill="#00ff80" opacity=".07" stroke="#00ff80" stroke-opacity=".28"/>
    <text x="216" y="370" class="label" fill="#00ff80">LEFT HEMISPHERE</text>
    <text x="216" y="400" class="tiny">fast implementation</text>
    <text x="216" y="422" class="tiny">small scoped fixes</text>

    <rect x="505" y="335" width="270" height="104" rx="20" fill="#05d5ff" opacity=".07" stroke="#05d5ff" stroke-opacity=".28"/>
    <text x="531" y="370" class="label" fill="#05d5ff">RIGHT HEMISPHERE</text>
    <text x="531" y="400" class="tiny">architecture + review</text>
    <text x="531" y="422" class="tiny">risks, patterns, dissent</text>

    <rect x="820" y="335" width="270" height="104" rx="20" fill="#ff2a6d" opacity=".07" stroke="#ff2a6d" stroke-opacity=".28"/>
    <text x="846" y="370" class="label" fill="#ff2a6d">MEMORY PROMOTION</text>
    <text x="846" y="400" class="tiny">decisions, tests, findings</text>
    <text x="846" y="422" class="tiny">durable repo context</text>
  </g>

  <path d="M268,187 L326,187" stroke="#00ff80" stroke-width="1.4" opacity=".6"/>
  <path d="M576,187 L640,187" stroke="#05d5ff" stroke-width="1.4" opacity=".6"/>
  <path d="M1000,187 L1062,187" stroke="#ff2a6d" stroke-width="1.4" opacity=".6"/>
  <path d="M820,262 C800,306 702,318 640,335" fill="none" stroke="#05d5ff" stroke-opacity=".45"/>
  <path d="M760,262 C720,306 420,318 325,335" fill="none" stroke="#00ff80" stroke-opacity=".45"/>
  <path d="M895,262 C930,306 952,318 955,335" fill="none" stroke="#ff2a6d" stroke-opacity=".45"/>
  <text x="640" y="484" class="mono" font-size="10" letter-spacing="3" fill="#00ff80" opacity=".72" text-anchor="middle">the code loop remembers why the code changed</text>
</svg>
