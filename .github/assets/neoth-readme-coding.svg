<svg width="1400" height="460" viewBox="0 0 1400 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH Coding Buddy</title>
  <desc id="desc">NEOTH coding workflow with planning canvas, Kanban, three brain roles, tests, review and durable project memory.</desc>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .card{fill:#121212;stroke:white;stroke-opacity:.1}
      .head{fill:#1a1a1a;stroke:white;stroke-opacity:.08}
    </style>
  </defs>
  <rect width="1400" height="460" rx="34" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="458" rx="33" stroke="white" stroke-opacity=".08"/>
  <text x="70" y="60" fill="white" class="sans" font-size="25" font-weight="700">The coding buddy that remembers the repo</text>
  <text x="70" y="92" fill="#8d8d8d" class="sans" font-size="15">Plan visually, split work, dispatch roles, verify tests, promote decisions into memory, and resume without explaining the project again.</text>

  <g transform="translate(70 128)">
    <rect width="385" height="258" rx="24" class="card"/>
    <text x="28" y="40" fill="#00ff80" class="mono" font-size="13" letter-spacing="2">CANVAS</text>
    <rect x="28" y="66" width="329" height="42" rx="10" class="head"/><text x="45" y="92" fill="white" class="sans" font-size="14">Goal -> acceptance criteria</text>
    <rect x="28" y="122" width="156" height="86" rx="12" fill="#0d0d0d" stroke="#00ff80" stroke-opacity=".35"/><text x="106" y="153" text-anchor="middle" fill="white" class="sans" font-size="13">Design</text><text x="106" y="176" text-anchor="middle" fill="#8d8d8d" class="sans" font-size="11">architecture + risk</text>
    <rect x="201" y="122" width="156" height="86" rx="12" fill="#0d0d0d" stroke="#ff2a6d" stroke-opacity=".35"/><text x="279" y="153" text-anchor="middle" fill="white" class="sans" font-size="13">Implementation</text><text x="279" y="176" text-anchor="middle" fill="#8d8d8d" class="sans" font-size="11">patch + tests</text>
    <path d="M106 208 V230 H279 V208" stroke="#05d5ff" stroke-opacity=".45"/>
    <text x="192" y="246" text-anchor="middle" fill="#05d5ff" class="mono" font-size="11">reviewable plan, not chat soup</text>
  </g>

  <g transform="translate(505 128)">
    <rect width="390" height="258" rx="24" class="card"/>
    <text x="28" y="40" fill="#ff2a6d" class="mono" font-size="13" letter-spacing="2">KANBAN</text>
    <g class="sans" font-size="12">
      <rect x="28" y="65" width="96" height="154" rx="12" fill="#0d0d0d" stroke="#00ff80" stroke-opacity=".28"/><text x="76" y="91" text-anchor="middle" fill="white">Todo</text>
      <rect x="147" y="65" width="96" height="154" rx="12" fill="#0d0d0d" stroke="#ff2a6d" stroke-opacity=".28"/><text x="195" y="91" text-anchor="middle" fill="white">Doing</text>
      <rect x="266" y="65" width="96" height="154" rx="12" fill="#0d0d0d" stroke="#05d5ff" stroke-opacity=".28"/><text x="314" y="91" text-anchor="middle" fill="white">Review</text>
      <rect x="44" y="112" width="64" height="28" rx="7" fill="#111"/><rect x="44" y="150" width="64" height="28" rx="7" fill="#111"/>
      <rect x="163" y="112" width="64" height="28" rx="7" fill="#111"/><rect x="282" y="112" width="64" height="28" rx="7" fill="#111"/><rect x="282" y="150" width="64" height="28" rx="7" fill="#111"/>
    </g>
    <text x="195" y="246" text-anchor="middle" fill="#8d8d8d" class="mono" font-size="11">Backlog -> Todo -> Doing -> Review -> Done</text>
  </g>

  <g transform="translate(945 128)">
    <rect width="385" height="258" rx="24" class="card"/>
    <text x="28" y="40" fill="#05d5ff" class="mono" font-size="13" letter-spacing="2">THREE BRAIN ROLES</text>
    <circle cx="93" cy="124" r="58" fill="#101010" stroke="#00ff80" stroke-opacity=".45" filter="url(#glow)"/>
    <circle cx="193" cy="124" r="58" fill="#101010" stroke="#ff2a6d" stroke-opacity=".45" filter="url(#glow)"/>
    <circle cx="293" cy="124" r="58" fill="#101010" stroke="#05d5ff" stroke-opacity=".45" filter="url(#glow)"/>
    <text x="93" y="119" text-anchor="middle" fill="white" class="sans" font-size="13" font-weight="700">Fast</text><text x="93" y="140" text-anchor="middle" fill="#8d8d8d" class="sans" font-size="11">ship</text>
    <text x="193" y="119" text-anchor="middle" fill="white" class="sans" font-size="13" font-weight="700">Deep</text><text x="193" y="140" text-anchor="middle" fill="#8d8d8d" class="sans" font-size="11">reason</text>
    <text x="293" y="119" text-anchor="middle" fill="white" class="sans" font-size="13" font-weight="700">Sync</text><text x="293" y="140" text-anchor="middle" fill="#8d8d8d" class="sans" font-size="11">orchestrate</text>
    <text x="193" y="218" text-anchor="middle" fill="#8d8d8d" class="sans" font-size="13">Tests, review findings, decisions, and tradeoffs become durable project memory.</text>
  </g>
</svg>
