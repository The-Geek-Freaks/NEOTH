<svg width="1400" height="500" viewBox="0 0 1400 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH system map</title>
  <desc id="desc">The NEOTH 1.0 system map from user surfaces through trust gates to memory, providers and automation.</desc>
  <defs>
    <linearGradient id="bus" x1="120" y1="250" x2="1280" y2="250">
      <stop offset="0" stop-color="#00ff80"/><stop offset=".5" stop-color="#ff2a6d"/><stop offset="1" stop-color="#05d5ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .box{fill:#121212;stroke:white;stroke-opacity:.1}
    </style>
  </defs>
  <rect width="1400" height="500" rx="34" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="498" rx="33" stroke="white" stroke-opacity=".08"/>
  <text x="70" y="60" fill="white" class="sans" font-size="25" font-weight="700">The 1.0 control plane</text>
  <text x="70" y="92" fill="#8d8d8d" class="sans" font-size="15">All routes pass through the same trust model: profile, policy, permission gate, WAL, provider routing, and recall.</text>

  <path d="M116 250 H1284" stroke="url(#bus)" stroke-width="4" filter="url(#glow)"/>

  <g class="sans" font-size="14">
    <g transform="translate(70 136)"><rect class="box" width="220" height="228" rx="24"/><text x="110" y="38" text-anchor="middle" fill="#00ff80" class="mono" font-size="12" letter-spacing="2">SURFACES</text><text x="34" y="78" fill="white">GUI</text><text x="34" y="108" fill="white">CLI</text><text x="34" y="138" fill="white">Channels</text><text x="34" y="168" fill="white">Obsidian</text><text x="34" y="198" fill="white">n8n / Cron</text></g>
    <g transform="translate(335 136)"><rect class="box" width="220" height="228" rx="24"/><text x="110" y="38" text-anchor="middle" fill="#ff2a6d" class="mono" font-size="12" letter-spacing="2">TRUST GATES</text><text x="34" y="78" fill="white">Autonomy policy</text><text x="34" y="108" fill="white">Consent prompts</text><text x="34" y="138" fill="white">Capability leases</text><text x="34" y="168" fill="white">Prompt-injection guard</text><text x="34" y="198" fill="white">Redaction registry</text></g>
    <g transform="translate(600 136)"><rect class="box" width="220" height="228" rx="24"/><text x="110" y="38" text-anchor="middle" fill="#05d5ff" class="mono" font-size="12" letter-spacing="2">MEMORY</text><text x="34" y="78" fill="white">WAL source of truth</text><text x="34" y="108" fill="white">SQLite region views</text><text x="34" y="138" fill="white">Embeddings</text><text x="34" y="168" fill="white">Profile evidence</text><text x="34" y="198" fill="white">Vault mirror</text></g>
    <g transform="translate(865 136)"><rect class="box" width="220" height="228" rx="24"/><text x="110" y="38" text-anchor="middle" fill="#00ff80" class="mono" font-size="12" letter-spacing="2">INTELLIGENCE</text><text x="34" y="78" fill="white">Three brain roles</text><text x="34" y="108" fill="white">Council trigger</text><text x="34" y="138" fill="white">Provider routing</text><text x="34" y="168" fill="white">Local Qwen / Ouro</text><text x="34" y="198" fill="white">Skill router</text></g>
    <g transform="translate(1130 136)"><rect class="box" width="220" height="228" rx="24"/><text x="110" y="38" text-anchor="middle" fill="#ff2a6d" class="mono" font-size="12" letter-spacing="2">ACTION</text><text x="34" y="78" fill="white">Coding tasks</text><text x="34" y="108" fill="white">Documents</text><text x="34" y="138" fill="white">Email / Calendar</text><text x="34" y="168" fill="white">Paperless</text><text x="34" y="198" fill="white">Cluster nodes</text></g>
  </g>
</svg>
