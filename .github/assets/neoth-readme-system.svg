<svg width="1400" height="512" viewBox="0 0 1400 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH control plane</title>
  <desc id="desc">Layered NEOTH architecture with surfaces, trust gates, runtime, WAL and provider sidecars.</desc>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:"SF Pro Display",Inter,"Helvetica Neue",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .title{font-weight:200;letter-spacing:.02em}
      .box{fill:#121212;stroke:white;stroke-opacity:.1}
    </style>
  </defs>
  <rect width="1400" height="512" rx="40" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="510" rx="39" stroke="white" stroke-opacity=".08"/>
  <text x="72" y="62" fill="white" class="sans title" font-size="30">The 1.0 control plane.</text>
  <text x="72" y="92" fill="#9a9a9a" class="sans" font-size="15">Every route crosses trust gates and lands in the WAL-backed memory core.</text>

  <g transform="translate(240 126)" class="sans">
    <rect x="0" y="0" width="920" height="52" rx="16" class="box" stroke="#00ff80" stroke-opacity=".35"/>
    <text x="460" y="33" text-anchor="middle" fill="white" font-size="16" font-weight="600">Surfaces: GUI, CLI, channels, email, calendar, n8n, coding</text>
    <rect x="48" y="72" width="824" height="52" rx="16" class="box" stroke="#05d5ff" stroke-opacity=".38"/>
    <text x="460" y="105" text-anchor="middle" fill="white" font-size="16" font-weight="600">Trust gates: identity, policy, consent, sanitizer, capability leases</text>
    <rect x="96" y="144" width="728" height="72" rx="16" fill="#101010" stroke="#00ff80" stroke-opacity=".42" filter="url(#glow)"/>
    <text x="460" y="174" text-anchor="middle" fill="white" font-size="24" font-weight="200" letter-spacing="8">NEOTH RUNTIME</text>
    <text x="460" y="198" text-anchor="middle" fill="#9a9a9a" class="mono" font-size="10" letter-spacing="3">PIPELINE + RECALL + SKILLS + PROVIDER ROUTING</text>
    <rect x="48" y="236" width="824" height="52" rx="16" class="box" stroke="#ff2a6d" stroke-opacity=".38"/>
    <text x="460" y="269" text-anchor="middle" fill="white" font-size="16" font-weight="600">Memory views: profile, episodes, council, motor, habits, embeddings</text>
    <rect x="0" y="308" width="920" height="52" rx="16" fill="#101010" stroke="#05d5ff" stroke-opacity=".45" filter="url(#glow)"/>
    <text x="460" y="341" text-anchor="middle" fill="#05d5ff" class="mono" font-size="12" letter-spacing="3">WAL SOURCE OF TRUTH + AUDIT + RECOVERY</text>
  </g>

  <g class="mono" font-size="11" letter-spacing="2.2">
    <rect x="72" y="190" width="154" height="42" rx="8" fill="#111" stroke="#00ff80" stroke-opacity=".32"/>
    <text x="149" y="216" text-anchor="middle" fill="#00ff80">LOCAL MODELS</text>
    <rect x="72" y="248" width="154" height="42" rx="8" fill="#111" stroke="#05d5ff" stroke-opacity=".32"/>
    <text x="149" y="274" text-anchor="middle" fill="#05d5ff">CLOUD APIs</text>
    <rect x="1174" y="190" width="154" height="42" rx="8" fill="#111" stroke="#ff2a6d" stroke-opacity=".32"/>
    <text x="1251" y="216" text-anchor="middle" fill="#ff2a6d">PLUGINS</text>
    <rect x="1174" y="248" width="154" height="42" rx="8" fill="#111" stroke="#05d5ff" stroke-opacity=".32"/>
    <text x="1251" y="274" text-anchor="middle" fill="#05d5ff">MESH</text>
  </g>
  <path d="M226 211 H336" stroke="#00ff80" stroke-opacity=".32"/>
  <path d="M226 269 H336" stroke="#05d5ff" stroke-opacity=".32"/>
  <path d="M1064 211 H1174" stroke="#ff2a6d" stroke-opacity=".32"/>
  <path d="M1064 269 H1174" stroke="#05d5ff" stroke-opacity=".32"/>
</svg>
