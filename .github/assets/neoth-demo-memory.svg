<svg width="960" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">NEOTH memory with receipts</title>
  <desc id="d">A user asks NEOTH to remember a preference; NEOTH stores it with evidence across five memory tiers plus the vault, and the WAL chain verifies.</desc>
  <defs>
    <style>
      .mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:"SF Pro Display",Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif}
    </style>
    <filter id="m-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="420" rx="20" fill="#0d0d0d"/>
  <rect x="1" y="1" width="958" height="418" rx="19" stroke="white" stroke-opacity=".08"/>
  <text x="40" y="52" fill="white" class="sans" font-size="20" font-weight="300">Memory with receipts</text>
  <text x="40" y="76" fill="#8f8f8f" class="sans" font-size="13">Say it once. NEOTH stores it with evidence — and you can prove what it kept.</text>

  <!-- chat side -->
  <g class="mono" font-size="14">
    <rect x="40" y="104" width="440" height="276" rx="16" fill="#0a0a0a" stroke="white" stroke-opacity=".08"/>
    <text x="64" y="144" fill="#05d5ff">you<tspan fill="#e8e8e8">: remember I prefer Rust</tspan>
      <animate attributeName="opacity" dur="11s" values="0;1;1;1;1" keyTimes="0;.06;.5;.95;1" repeatCount="indefinite"/>
    </text>
    <g opacity="0">
      <animate attributeName="opacity" dur="11s" values="0;0;1;1;1" keyTimes="0;.2;.26;.95;1" repeatCount="indefinite"/>
      <text x="64" y="188" fill="#00ff80">neoth<tspan fill="#e8e8e8">: saved to profile</tspan></text>
      <text x="64" y="212" fill="#6f6f6f">        confidence 0.94 · evidence linked</text>
      <text x="64" y="236" fill="#6f6f6f">        awaiting nothing — approved fact</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="11s" values="0;0;1;1;1" keyTimes="0;.62;.68;.95;1" repeatCount="indefinite"/>
      <text x="64" y="292" fill="#00ff80">$ <tspan fill="#e8e8e8">neoth verify</tspan></text>
      <text x="64" y="320" fill="#00ff80">✓ <tspan fill="#b8b8b8">WAL chain intact — 0 gaps, HMAC ok</tspan></text>
      <text x="64" y="344" fill="#6f6f6f">  tamper-evident · yours end to end</text>
    </g>
  </g>

  <!-- tiers side -->
  <g>
    <rect x="504" y="104" width="416" height="276" rx="16" fill="#0a0a0a" stroke="white" stroke-opacity=".08"/>
    <text x="528" y="140" fill="#00ff80" class="mono" font-size="11" letter-spacing="2">FIVE MEMORY TIERS + VAULT</text>
    <g class="sans" font-size="14">
      <g><rect x="528" y="156" width="368" height="30" rx="8" fill="#18241d"/><text x="546" y="176" fill="white">episode</text><text x="880" y="176" text-anchor="end" fill="#8a8a8a" class="mono" font-size="11">short recall</text>
        <animate attributeName="opacity" dur="11s" values="0;0;1;1;1" keyTimes="0;.30;.34;.95;1" repeatCount="indefinite"/></g>
      <g opacity="0"><rect x="528" y="190" width="368" height="30" rx="8" fill="#111f24"/><text x="546" y="210" fill="white">profile</text><text x="880" y="210" text-anchor="end" fill="#00ff80" class="mono" font-size="11">← "prefers Rust"</text>
        <animate attributeName="opacity" dur="11s" values="0;0;1;1;1" keyTimes="0;.34;.38;.95;1" repeatCount="indefinite"/></g>
      <g opacity="0"><rect x="528" y="224" width="368" height="30" rx="8" fill="#151515"/><text x="546" y="244" fill="white">ground truth</text><text x="880" y="244" text-anchor="end" fill="#8a8a8a" class="mono" font-size="11">immutable anchors</text>
        <animate attributeName="opacity" dur="11s" values="0;0;1;1;1" keyTimes="0;.38;.42;.95;1" repeatCount="indefinite"/></g>
      <g opacity="0"><rect x="528" y="258" width="368" height="30" rx="8" fill="#151515"/><text x="546" y="278" fill="white">consolidated</text><text x="880" y="278" text-anchor="end" fill="#8a8a8a" class="mono" font-size="11">merged facts</text>
        <animate attributeName="opacity" dur="11s" values="0;0;1;1;1" keyTimes="0;.42;.46;.95;1" repeatCount="indefinite"/></g>
      <g opacity="0"><rect x="528" y="292" width="368" height="30" rx="8" fill="#151515"/><text x="546" y="312" fill="white">long-term</text><text x="880" y="312" text-anchor="end" fill="#8a8a8a" class="mono" font-size="11">durable knowledge</text>
        <animate attributeName="opacity" dur="11s" values="0;0;1;1;1" keyTimes="0;.46;.50;.95;1" repeatCount="indefinite"/></g>
      <g opacity="0"><rect x="528" y="326" width="368" height="30" rx="8" fill="#24151a"/><text x="546" y="346" fill="white">+ vault mirror</text><text x="880" y="346" text-anchor="end" fill="#8a8a8a" class="mono" font-size="11">Obsidian / Paperless</text>
        <animate attributeName="opacity" dur="11s" values="0;0;1;1;1" keyTimes="0;.50;.54;.95;1" repeatCount="indefinite"/></g>
    </g>
  </g>
</svg>
