<svg width="960" height="420" viewBox="0 0 960 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">NEOTH first run</title>
  <desc id="d">A terminal installs NEOTH from the source bootstrap script, launches the GUI, and the wizard asks plain setup questions.</desc>
  <defs>
    <style>
      .mono{font-family:"JetBrains Mono","SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:"SF Pro Display",Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif}
    </style>
  </defs>
  <rect width="960" height="420" rx="20" fill="#0d0d0d"/>
  <rect x="1" y="1" width="958" height="418" rx="19" stroke="white" stroke-opacity=".08"/>
  <rect x="28" y="28" width="904" height="364" rx="16" fill="#0a0a0a" stroke="white" stroke-opacity=".08"/>
  <g>
    <circle cx="56" cy="56" r="6" fill="#00ff80"/>
    <circle cx="78" cy="56" r="6" fill="#05d5ff"/>
    <circle cx="100" cy="56" r="6" fill="#ff2a6d"/>
  </g>
  <text x="480" y="60" text-anchor="middle" fill="#8f8f8f" class="mono" font-size="12" letter-spacing="3">NEOTH · FIRST RUN</text>
  <line x1="28" y1="80" x2="932" y2="80" stroke="white" stroke-opacity=".07"/>

  <g class="mono" font-size="14">
    <!-- command 1 -->
    <text x="56" y="120" fill="#00ff80">$ <tspan fill="#e8e8e8">curl -fsSL raw.githubusercontent.com/…/SRC/install.sh | bash</tspan>
      <animate attributeName="opacity" dur="12s" values="0;1;1;1;1;1" keyTimes="0;.04;.5;.9;.95;1" repeatCount="indefinite"/>
    </text>
    <text x="56" y="148" fill="#6f6f6f">resolving latest source · building neothd …</text>
    <text x="56" y="176" fill="#00ff80">✓ <tspan fill="#b8b8b8">neothd + neothd-gui installed</tspan>
      <animate attributeName="opacity" dur="12s" values="0;0;1;1;1;1" keyTimes="0;.16;.2;.9;.95;1" repeatCount="indefinite"/>
    </text>
    <text x="56" y="148" fill="#6f6f6f" opacity="0">
      <animate attributeName="opacity" dur="12s" values="0;0;1;1;0;0" keyTimes="0;.06;.09;.15;.18;1" repeatCount="indefinite"/>
    </text>
    <!-- command 2 -->
    <text x="56" y="216" fill="#00ff80">$ <tspan fill="#e8e8e8">neoth gui</tspan>
      <animate attributeName="opacity" dur="12s" values="0;0;1;1;1;1" keyTimes="0;.24;.28;.9;.95;1" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- wizard card -->
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" values="0;0;1;1;1;1" keyTimes="0;.34;.4;.9;.95;1" repeatCount="indefinite"/>
    <rect x="56" y="238" width="848" height="128" rx="12" fill="#111f1a" stroke="#00ff80" stroke-opacity=".25"/>
    <text x="76" y="266" fill="#00ff80" class="mono" font-size="11" letter-spacing="2">SETUP WIZARD · PLAIN QUESTIONS · YAML OPTIONAL</text>
    <g class="sans" font-size="14" fill="#d8d8d8">
      <text x="76" y="298">•  Who are you, and what may NEOTH remember?</text>
      <text x="76" y="322">•  Local-only, or cloud providers too?</text>
      <text x="76" y="346">•  Which channels? How much autonomy?</text>
    </g>
  </g>
</svg>
