<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH 1.0 first run flow</title>
  <desc id="desc">From install to wizard, memory, surfaces, action, verification and improvement.</desc>
  <defs>
    <linearGradient id="line" x1="120" y1="180" x2="1280" y2="180">
      <stop offset="0" stop-color="#00ff80"/>
      <stop offset=".5" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#05d5ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes dash{to{stroke-dashoffset:-48}}
      .dash{stroke-dasharray:14 18;animation:dash 4s linear infinite}
    </style>
  </defs>
  <rect width="1400" height="360" rx="30" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="358" rx="29" stroke="white" stroke-opacity=".08"/>
  <text x="70" y="62" fill="white" class="sans" font-size="24" font-weight="700">One setup. One buddy. Every surface.</text>
  <text x="70" y="92" fill="#8a8a8a" class="sans" font-size="15">NEOTH 1.0 is designed so normal users can start in the GUI while pros keep every lever reachable.</text>

  <path d="M135 180 H1265" stroke="url(#line)" stroke-width="3" filter="url(#glow)"/>
  <path class="dash" d="M135 180 H1265" stroke="white" stroke-opacity=".25" stroke-width="2"/>

  <g class="sans" font-size="15" fill="white">
    <g transform="translate(90 128)">
      <rect width="160" height="104" rx="18" fill="#121212" stroke="#00ff80" stroke-opacity=".45"/>
      <circle cx="80" cy="36" r="15" fill="#00ff80" opacity=".2"/><text x="80" y="42" text-anchor="middle" fill="#00ff80" font-weight="700">1</text>
      <text x="80" y="72" text-anchor="middle" font-weight="700">Install</text>
      <text x="80" y="92" text-anchor="middle" fill="#8d8d8d" font-size="12">binary or cargo</text>
    </g>
    <g transform="translate(310 128)">
      <rect width="160" height="104" rx="18" fill="#121212" stroke="#00ff80" stroke-opacity=".45"/>
      <circle cx="80" cy="36" r="15" fill="#00ff80" opacity=".2"/><text x="80" y="42" text-anchor="middle" fill="#00ff80" font-weight="700">2</text>
      <text x="80" y="72" text-anchor="middle" font-weight="700">Wizard</text>
      <text x="80" y="92" text-anchor="middle" fill="#8d8d8d" font-size="12">plain-language setup</text>
    </g>
    <g transform="translate(530 128)">
      <rect width="160" height="104" rx="18" fill="#121212" stroke="#ff2a6d" stroke-opacity=".45"/>
      <circle cx="80" cy="36" r="15" fill="#ff2a6d" opacity=".2"/><text x="80" y="42" text-anchor="middle" fill="#ff2a6d" font-weight="700">3</text>
      <text x="80" y="72" text-anchor="middle" font-weight="700">Memory</text>
      <text x="80" y="92" text-anchor="middle" fill="#8d8d8d" font-size="12">approved facts only</text>
    </g>
    <g transform="translate(750 128)">
      <rect width="160" height="104" rx="18" fill="#121212" stroke="#ff2a6d" stroke-opacity=".45"/>
      <circle cx="80" cy="36" r="15" fill="#ff2a6d" opacity=".2"/><text x="80" y="42" text-anchor="middle" fill="#ff2a6d" font-weight="700">4</text>
      <text x="80" y="72" text-anchor="middle" font-weight="700">Everywhere</text>
      <text x="80" y="92" text-anchor="middle" fill="#8d8d8d" font-size="12">GUI, CLI, phone, docs</text>
    </g>
    <g transform="translate(970 128)">
      <rect width="160" height="104" rx="18" fill="#121212" stroke="#05d5ff" stroke-opacity=".45"/>
      <circle cx="80" cy="36" r="15" fill="#05d5ff" opacity=".2"/><text x="80" y="42" text-anchor="middle" fill="#05d5ff" font-weight="700">5</text>
      <text x="80" y="72" text-anchor="middle" font-weight="700">Act</text>
      <text x="80" y="92" text-anchor="middle" fill="#8d8d8d" font-size="12">with consent gates</text>
    </g>
    <g transform="translate(1190 128)">
      <rect width="160" height="104" rx="18" fill="#121212" stroke="#05d5ff" stroke-opacity=".45"/>
      <circle cx="80" cy="36" r="15" fill="#05d5ff" opacity=".2"/><text x="80" y="42" text-anchor="middle" fill="#05d5ff" font-weight="700">6</text>
      <text x="80" y="72" text-anchor="middle" font-weight="700">Verify</text>
      <text x="80" y="92" text-anchor="middle" fill="#8d8d8d" font-size="12">audit, improve, repeat</text>
    </g>
  </g>
  <text x="700" y="315" text-anchor="middle" fill="#5c5c5c" class="mono" font-size="11" letter-spacing="3">NO YAML REQUIRED FOR THE HAPPY PATH - FULL CONTROL WHEN YOU WANT IT</text>
</svg>
