<svg width="1400" height="380" viewBox="0 0 1400 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH first-run journey</title>
  <desc id="desc">A coherent six-step NEOTH journey from install to verification.</desc>
  <defs>
    <linearGradient id="rail" x1="120" y1="200" x2="1280" y2="200">
      <stop offset="0" stop-color="#00ff80"/>
      <stop offset=".5" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#05d5ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect width="1400" height="380" rx="34" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="378" rx="33" stroke="white" stroke-opacity=".08"/>
  <text x="70" y="62" fill="white" class="sans" font-size="26" font-weight="700">One setup. One buddy. Every surface.</text>
  <text x="70" y="94" fill="#8b8b8b" class="sans" font-size="15">Normal users start in the wizard. Operators keep every lever reachable.</text>

  <path id="journey" d="M138 204 H1262" stroke="url(#rail)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M138 204 H1262" stroke="white" stroke-opacity=".2" stroke-width="2" stroke-dasharray="10 16">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="4s" repeatCount="indefinite"/>
  </path>

  <g class="sans">
    <g transform="translate(86 138)">
      <rect width="172" height="132" rx="22" fill="#121212" stroke="#00ff80" stroke-opacity=".38"/>
      <circle cx="86" cy="40" r="17" fill="#00ff80" fill-opacity=".14" stroke="#00ff80" stroke-opacity=".55"/><text x="86" y="46" text-anchor="middle" fill="#00ff80" font-size="15" font-weight="700">1</text>
      <text x="86" y="80" text-anchor="middle" fill="white" font-size="17" font-weight="700">Install</text>
      <text x="86" y="104" text-anchor="middle" fill="#8d8d8d" font-size="12">binary, cargo, source</text>
    </g>
    <g transform="translate(310 138)">
      <rect width="172" height="132" rx="22" fill="#121212" stroke="#00ff80" stroke-opacity=".38"/>
      <circle cx="86" cy="40" r="17" fill="#00ff80" fill-opacity=".14" stroke="#00ff80" stroke-opacity=".55"/><text x="86" y="46" text-anchor="middle" fill="#00ff80" font-size="15" font-weight="700">2</text>
      <text x="86" y="80" text-anchor="middle" fill="white" font-size="17" font-weight="700">Wizard</text>
      <text x="86" y="104" text-anchor="middle" fill="#8d8d8d" font-size="12">plain-language setup</text>
    </g>
    <g transform="translate(534 138)">
      <rect width="172" height="132" rx="22" fill="#121212" stroke="#ff2a6d" stroke-opacity=".38"/>
      <circle cx="86" cy="40" r="17" fill="#ff2a6d" fill-opacity=".14" stroke="#ff2a6d" stroke-opacity=".55"/><text x="86" y="46" text-anchor="middle" fill="#ff2a6d" font-size="15" font-weight="700">3</text>
      <text x="86" y="80" text-anchor="middle" fill="white" font-size="17" font-weight="700">Memory</text>
      <text x="86" y="104" text-anchor="middle" fill="#8d8d8d" font-size="12">evidence + approval</text>
    </g>
    <g transform="translate(758 138)">
      <rect width="172" height="132" rx="22" fill="#121212" stroke="#ff2a6d" stroke-opacity=".38"/>
      <circle cx="86" cy="40" r="17" fill="#ff2a6d" fill-opacity=".14" stroke="#ff2a6d" stroke-opacity=".55"/><text x="86" y="46" text-anchor="middle" fill="#ff2a6d" font-size="15" font-weight="700">4</text>
      <text x="86" y="80" text-anchor="middle" fill="white" font-size="17" font-weight="700">Surfaces</text>
      <text x="86" y="104" text-anchor="middle" fill="#8d8d8d" font-size="12">GUI, CLI, phone, docs</text>
    </g>
    <g transform="translate(982 138)">
      <rect width="172" height="132" rx="22" fill="#121212" stroke="#05d5ff" stroke-opacity=".38"/>
      <circle cx="86" cy="40" r="17" fill="#05d5ff" fill-opacity=".14" stroke="#05d5ff" stroke-opacity=".55"/><text x="86" y="46" text-anchor="middle" fill="#05d5ff" font-size="15" font-weight="700">5</text>
      <text x="86" y="80" text-anchor="middle" fill="white" font-size="17" font-weight="700">Act</text>
      <text x="86" y="104" text-anchor="middle" fill="#8d8d8d" font-size="12">gated automation</text>
    </g>
    <g transform="translate(1206 138)">
      <rect width="108" height="132" rx="22" fill="#121212" stroke="#05d5ff" stroke-opacity=".38"/>
      <circle cx="54" cy="40" r="17" fill="#05d5ff" fill-opacity=".14" stroke="#05d5ff" stroke-opacity=".55"/><text x="54" y="46" text-anchor="middle" fill="#05d5ff" font-size="15" font-weight="700">6</text>
      <text x="54" y="80" text-anchor="middle" fill="white" font-size="17" font-weight="700">Verify</text>
      <text x="54" y="104" text-anchor="middle" fill="#8d8d8d" font-size="12">audit</text>
    </g>
  </g>
  <text x="700" y="330" text-anchor="middle" fill="#5f5f5f" class="mono" font-size="11" letter-spacing="3">NO YAML REQUIRED FOR THE HAPPY PATH - FULL CONTROL WHEN YOU WANT IT</text>
</svg>
