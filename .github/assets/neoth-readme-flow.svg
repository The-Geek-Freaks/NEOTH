<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH first-run journey</title>
  <desc id="desc">A coherent NEOTH journey from first hello to trusted action and audit.</desc>
  <defs>
    <linearGradient id="rail" x1="120" y1="218" x2="1280" y2="218">
      <stop offset="0" stop-color="#00ff80"/>
      <stop offset=".48" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#05d5ff"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="44%" r="80%">
      <stop offset="0" stop-color="#171717"/>
      <stop offset=".58" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:"SF Pro Display",Inter,"Helvetica Neue",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>

  <rect width="1400" height="420" rx="40" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="418" rx="39" stroke="white" stroke-opacity=".08"/>

  <text x="700" y="66" text-anchor="middle" fill="white" class="sans" font-size="34" font-weight="200" letter-spacing="5">FIRST HELLO TO TRUSTED ACTION</text>
  <text x="700" y="101" text-anchor="middle" fill="#8d8d8d" class="sans" font-size="15">DAUs get a guided buddy. Pros keep the controls. Both share one memory.</text>

  <path id="journey" d="M116 224 H1284" stroke="url(#rail)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M116 224 H1284" stroke="white" stroke-opacity=".18" stroke-width="2" stroke-dasharray="10 18">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="4.6s" repeatCount="indefinite"/>
  </path>

  <circle r="4" fill="#00ff80" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite">
      <mpath href="#journey"/>
    </animateMotion>
    <animate attributeName="opacity" values=".22;1;.22" dur="2.1s" repeatCount="indefinite"/>
  </circle>

  <g class="sans">
    <g transform="translate(90 148)">
      <rect width="170" height="150" rx="20" fill="#111" stroke="#00ff80" stroke-opacity=".42"/>
      <text x="85" y="38" text-anchor="middle" fill="#00ff80" font-size="11" letter-spacing="4">01</text>
      <text x="85" y="73" text-anchor="middle" fill="white" font-size="21" font-weight="300">Install</text>
      <text x="85" y="101" text-anchor="middle" fill="#8c8c8c" font-size="12">single binary</text>
      <text x="85" y="122" text-anchor="middle" fill="#606060" font-size="11">cargo or app</text>
    </g>
    <g transform="translate(310 148)">
      <rect width="170" height="150" rx="20" fill="#111" stroke="#00ff80" stroke-opacity=".42"/>
      <text x="85" y="38" text-anchor="middle" fill="#00ff80" font-size="11" letter-spacing="4">02</text>
      <text x="85" y="73" text-anchor="middle" fill="white" font-size="21" font-weight="300">Wizard</text>
      <text x="85" y="101" text-anchor="middle" fill="#8c8c8c" font-size="12">human questions</text>
      <text x="85" y="122" text-anchor="middle" fill="#606060" font-size="11">no YAML path</text>
    </g>
    <g transform="translate(530 148)">
      <rect width="170" height="150" rx="20" fill="#111" stroke="#ff2a6d" stroke-opacity=".42"/>
      <text x="85" y="38" text-anchor="middle" fill="#ff2a6d" font-size="11" letter-spacing="4">03</text>
      <text x="85" y="73" text-anchor="middle" fill="white" font-size="21" font-weight="300">Memory</text>
      <text x="85" y="101" text-anchor="middle" fill="#8c8c8c" font-size="12">permissioned</text>
      <text x="85" y="122" text-anchor="middle" fill="#606060" font-size="11">evidence-backed</text>
    </g>
    <g transform="translate(750 148)">
      <rect width="170" height="150" rx="20" fill="#111" stroke="#ff2a6d" stroke-opacity=".42"/>
      <text x="85" y="38" text-anchor="middle" fill="#ff2a6d" font-size="11" letter-spacing="4">04</text>
      <text x="85" y="73" text-anchor="middle" fill="white" font-size="21" font-weight="300">Everywhere</text>
      <text x="85" y="101" text-anchor="middle" fill="#8c8c8c" font-size="12">CLI, GUI, phone</text>
      <text x="85" y="122" text-anchor="middle" fill="#606060" font-size="11">Obsidian + mesh</text>
    </g>
    <g transform="translate(970 148)">
      <rect width="170" height="150" rx="20" fill="#111" stroke="#05d5ff" stroke-opacity=".42"/>
      <text x="85" y="38" text-anchor="middle" fill="#05d5ff" font-size="11" letter-spacing="4">05</text>
      <text x="85" y="73" text-anchor="middle" fill="white" font-size="21" font-weight="300">Act</text>
      <text x="85" y="101" text-anchor="middle" fill="#8c8c8c" font-size="12">gated automation</text>
      <text x="85" y="122" text-anchor="middle" fill="#606060" font-size="11">plugins + tools</text>
    </g>
    <g transform="translate(1190 148)">
      <rect width="170" height="150" rx="20" fill="#111" stroke="#05d5ff" stroke-opacity=".42"/>
      <text x="85" y="38" text-anchor="middle" fill="#05d5ff" font-size="11" letter-spacing="4">06</text>
      <text x="85" y="73" text-anchor="middle" fill="white" font-size="21" font-weight="300">Verify</text>
      <text x="85" y="101" text-anchor="middle" fill="#8c8c8c" font-size="12">audit + redact</text>
      <text x="85" y="122" text-anchor="middle" fill="#606060" font-size="11">WAL proof</text>
    </g>
  </g>

  <text x="700" y="357" text-anchor="middle" fill="#666" class="mono" font-size="10" letter-spacing="4">ONE BUDDY. ONE MEMORY. FULL CONTROL WHEN YOU WANT IT.</text>
</svg>
