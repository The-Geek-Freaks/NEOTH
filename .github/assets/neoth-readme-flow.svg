<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" preserveAspectRatio="xMidYMid meet" role="img" aria-label="NEOTH flow from first run to loyal buddy">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="78%">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="wire" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#00ff80" stop-opacity=".15"/>
      <stop offset="50%" stop-color="#00ff80" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#05d5ff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }
      .title { font-size: 26px; font-weight: 300; letter-spacing: 6px; fill: #fff; }
      .label { font-size: 13px; letter-spacing: 2px; }
      .small { font-size: 11px; letter-spacing: 1px; fill: #d8d8d8; opacity: .78; }
    </style>
  </defs>

  <rect width="1280" height="360" rx="34" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="358" rx="34" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <text x="640" y="54" class="sans title" text-anchor="middle">FIRST RUN TO LOYAL BUDDY</text>
  <text x="640" y="82" class="mono" font-size="10" letter-spacing="3" fill="#00ff80" text-anchor="middle" opacity=".78">WIZARD / MEMORY / SURFACES / AUDIT</text>

  <path d="M170,190 C320,112 430,112 505,190 C580,268 700,268 775,190 C850,112 970,112 1110,190" fill="none" stroke="url(#wire)" stroke-width="2" filter="url(#glow)"/>

  <g class="mono" text-anchor="middle">
    <g>
      <circle cx="170" cy="190" r="56" fill="#00ff80" opacity=".08" stroke="#00ff80" stroke-opacity=".42"/>
      <text x="170" y="181" class="label" fill="#00ff80">01 WIZARD</text>
      <text x="170" y="207" class="small">plain questions</text>
      <text x="170" y="229" class="small">no YAML needed</text>
    </g>
    <g>
      <circle cx="505" cy="190" r="56" fill="#05d5ff" opacity=".08" stroke="#05d5ff" stroke-opacity=".42"/>
      <text x="505" y="181" class="label" fill="#05d5ff">02 MEMORY</text>
      <text x="505" y="207" class="small">evidence + recall</text>
      <text x="505" y="229" class="small">redact anytime</text>
    </g>
    <g>
      <circle cx="775" cy="190" r="56" fill="#ff2a6d" opacity=".08" stroke="#ff2a6d" stroke-opacity=".42"/>
      <text x="775" y="181" class="label" fill="#ff2a6d">03 EVERYWHERE</text>
      <text x="775" y="207" class="small">CLI, GUI, chat</text>
      <text x="775" y="229" class="small">same buddy</text>
    </g>
    <g>
      <circle cx="1110" cy="190" r="56" fill="#fff" opacity=".055" stroke="#fff" stroke-opacity=".22"/>
      <text x="1110" y="181" class="label" fill="#fff">04 AUDIT</text>
      <text x="1110" y="207" class="small">what it knows</text>
      <text x="1110" y="229" class="small">where it went</text>
    </g>
  </g>

  <g class="mono">
    <rect x="70" y="284" width="525" height="42" rx="13" fill="#00ff80" opacity=".07" stroke="#00ff80" stroke-opacity=".22"/>
    <text x="96" y="310" fill="#00ff80" font-size="12" letter-spacing="1.4">NORMAL USER PATH</text>
    <text x="260" y="310" fill="#eee" font-size="12" opacity=".82">install -> gui -> connect a chat -> talk normally</text>

    <rect x="685" y="284" width="525" height="42" rx="13" fill="#05d5ff" opacity=".07" stroke="#05d5ff" stroke-opacity=".22"/>
    <text x="711" y="310" fill="#05d5ff" font-size="12" letter-spacing="1.4">PRO PATH</text>
    <text x="812" y="310" fill="#eee" font-size="12" opacity=".82">cli -> recall -> code dispatch -> audit -> cluster</text>
  </g>
</svg>
