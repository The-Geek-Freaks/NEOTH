<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH private mesh</title>
  <desc id="desc">NEOTH running across private devices using LAN, Tailscale, Hysteria and Keet with consent-gated pairing.</desc>
  <defs>
    <linearGradient id="mesh" x1="100" y1="210" x2="1300" y2="210">
      <stop offset="0" stop-color="#00ff80"/>
      <stop offset=".5" stop-color="#05d5ff"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .node{fill:#121212;stroke:white;stroke-opacity:.1}
    </style>
  </defs>
  <rect width="1400" height="420" rx="34" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="418" rx="33" stroke="white" stroke-opacity=".08"/>
  <text x="70" y="60" fill="white" class="sans" font-size="25" font-weight="700">Private mesh, not platform gravity</text>
  <text x="70" y="92" fill="#8d8d8d" class="sans" font-size="15">Laptop, workstation, phone channels and home server can cooperate without turning your memory into somebody else's cloud.</text>

  <path d="M190 230 C355 85 530 330 700 210 S1045 85 1210 230" stroke="url(#mesh)" stroke-width="3" filter="url(#glow)"/>
  <path d="M190 230 C350 340 525 100 700 210 S1050 340 1210 230" stroke="url(#mesh)" stroke-width="1.5" opacity=".35"/>

  <g class="sans" font-size="14">
    <g transform="translate(92 164)"><rect class="node" width="190" height="110" rx="20" stroke="#00ff80" stroke-opacity=".38"/><text x="95" y="44" text-anchor="middle" fill="white" font-weight="700">Laptop</text><text x="95" y="70" text-anchor="middle" fill="#8d8d8d">GUI + coding</text></g>
    <g transform="translate(342 98)"><rect class="node" width="190" height="110" rx="20" stroke="#00ff80" stroke-opacity=".38"/><text x="95" y="44" text-anchor="middle" fill="white" font-weight="700">Workstation</text><text x="95" y="70" text-anchor="middle" fill="#8d8d8d">GPU models</text></g>
    <g transform="translate(605 155)"><rect width="190" height="120" rx="60" fill="#0b0b0b" stroke="#05d5ff" stroke-opacity=".55" filter="url(#glow)"/><text x="95" y="55" text-anchor="middle" fill="white" font-weight="700">NEOTH Core</text><text x="95" y="82" text-anchor="middle" fill="#8d8d8d">policy + WAL</text></g>
    <g transform="translate(868 98)"><rect class="node" width="190" height="110" rx="20" stroke="#05d5ff" stroke-opacity=".38"/><text x="95" y="44" text-anchor="middle" fill="white" font-weight="700">Home Server</text><text x="95" y="70" text-anchor="middle" fill="#8d8d8d">Paperless + n8n</text></g>
    <g transform="translate(1118 164)"><rect class="node" width="190" height="110" rx="20" stroke="#ff2a6d" stroke-opacity=".38"/><text x="95" y="44" text-anchor="middle" fill="white" font-weight="700">Phone Channels</text><text x="95" y="70" text-anchor="middle" fill="#8d8d8d">WhatsApp, Telegram, Keet</text></g>
  </g>

  <g class="mono" font-size="12" letter-spacing="2">
    <rect x="294" y="300" width="172" height="36" rx="10" fill="#111" stroke="#00ff80" stroke-opacity=".35"/><text x="380" y="323" text-anchor="middle" fill="#00ff80">LAN / MDNS</text>
    <rect x="491" y="300" width="172" height="36" rx="10" fill="#111" stroke="#05d5ff" stroke-opacity=".35"/><text x="577" y="323" text-anchor="middle" fill="#05d5ff">TAILSCALE</text>
    <rect x="688" y="300" width="172" height="36" rx="10" fill="#111" stroke="#05d5ff" stroke-opacity=".35"/><text x="774" y="323" text-anchor="middle" fill="#05d5ff">HYSTERIA</text>
    <rect x="885" y="300" width="172" height="36" rx="10" fill="#111" stroke="#ff2a6d" stroke-opacity=".35"/><text x="971" y="323" text-anchor="middle" fill="#ff2a6d">KEET</text>
  </g>
  <text x="700" y="374" text-anchor="middle" fill="#666" class="sans" font-size="13">Every peer is consent-gated. Keys prove identity; the operator still approves membership and capabilities.</text>
</svg>
