<svg width="1400" height="480" viewBox="0 0 1400 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NEOTH private mesh</title>
  <desc id="desc">Private mesh topology with consent gates around NEOTH policy and WAL authority.</desc>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:"SF Pro Display",Inter,"Helvetica Neue",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .title{font-weight:200;letter-spacing:.02em}
      .node{fill:#121212;stroke:white;stroke-opacity:.1}
    </style>
  </defs>
  <rect width="1400" height="480" rx="40" fill="#0d0d0d"/>
  <rect x="1" y="1" width="1398" height="478" rx="39" stroke="white" stroke-opacity=".08"/>
  <text x="72" y="62" fill="white" class="sans title" font-size="30">Private mesh without giving up ownership.</text>
  <text x="72" y="92" fill="#9a9a9a" class="sans" font-size="15">Keys identify peers. The operator still approves membership and capability scope.</text>

  <rect x="120" y="126" width="1160" height="270" rx="40" fill="#ffffff" fill-opacity=".015" stroke="#05d5ff" stroke-opacity=".14" stroke-dasharray="8 12"/>
  <text x="700" y="152" text-anchor="middle" fill="#05d5ff" class="mono" font-size="11" letter-spacing="3">TRUST BOUNDARY</text>

  <g stroke-width="1.6" stroke-opacity=".34">
    <path d="M700 250 L294 198" stroke="#00ff80"/>
    <path d="M700 250 L294 322" stroke="#00ff80"/>
    <path d="M700 250 L530 164" stroke="#05d5ff"/>
    <path d="M700 250 L870 164" stroke="#05d5ff"/>
    <path d="M700 250 L1106 198" stroke="#ff2a6d"/>
    <path d="M700 250 L1106 322" stroke="#ff2a6d"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="700" cy="250" r="88" fill="#101010" stroke="#00ff80" stroke-opacity=".45"/>
    <text x="700" y="240" text-anchor="middle" fill="white" class="sans" font-size="29" font-weight="200" letter-spacing="9">NEOTH</text>
    <text x="700" y="270" text-anchor="middle" fill="#9a9a9a" class="mono" font-size="10" letter-spacing="3">POLICY + WAL</text>
  </g>

  <g class="sans" font-size="14">
    <g transform="translate(172 166)"><rect class="node" width="244" height="64" rx="16" stroke="#00ff80" stroke-opacity=".36"/><text x="122" y="28" text-anchor="middle" fill="white" font-weight="600">Laptop</text><text x="122" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">GUI + coding</text></g>
    <g transform="translate(172 290)"><rect class="node" width="244" height="64" rx="16" stroke="#00ff80" stroke-opacity=".36"/><text x="122" y="28" text-anchor="middle" fill="white" font-weight="600">Workstation</text><text x="122" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">GPU + local models</text></g>
    <g transform="translate(444 132)"><rect class="node" width="172" height="64" rx="16" stroke="#05d5ff" stroke-opacity=".36"/><text x="86" y="28" text-anchor="middle" fill="white" font-weight="600">Tailscale</text><text x="86" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">private mesh</text></g>
    <g transform="translate(784 132)"><rect class="node" width="172" height="64" rx="16" stroke="#05d5ff" stroke-opacity=".36"/><text x="86" y="28" text-anchor="middle" fill="white" font-weight="600">Hysteria</text><text x="86" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">restricted nets</text></g>
    <g transform="translate(984 166)"><rect class="node" width="244" height="64" rx="16" stroke="#ff2a6d" stroke-opacity=".36"/><text x="122" y="28" text-anchor="middle" fill="white" font-weight="600">Phone Channels</text><text x="122" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">WhatsApp, Telegram, Keet</text></g>
    <g transform="translate(984 290)"><rect class="node" width="244" height="64" rx="16" stroke="#ff2a6d" stroke-opacity=".36"/><text x="122" y="28" text-anchor="middle" fill="white" font-weight="600">Home Server</text><text x="122" y="48" text-anchor="middle" fill="#8d8d8d" font-size="12">n8n, Paperless, vault</text></g>
  </g>

  <g class="mono" font-size="10" letter-spacing="2">
    <circle cx="430" cy="198" r="12" fill="#101010" stroke="#05d5ff" stroke-opacity=".55"/><text x="430" y="202" text-anchor="middle" fill="#05d5ff">OK</text>
    <circle cx="430" cy="322" r="12" fill="#101010" stroke="#05d5ff" stroke-opacity=".55"/><text x="430" y="326" text-anchor="middle" fill="#05d5ff">OK</text>
    <circle cx="970" cy="198" r="12" fill="#101010" stroke="#05d5ff" stroke-opacity=".55"/><text x="970" y="202" text-anchor="middle" fill="#05d5ff">OK</text>
    <circle cx="970" cy="322" r="12" fill="#101010" stroke="#05d5ff" stroke-opacity=".55"/><text x="970" y="326" text-anchor="middle" fill="#05d5ff">OK</text>
  </g>
</svg>
